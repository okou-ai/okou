commit-msg:
  commands:
    commitlint:
      run: ./turbo/node_modules/.bin/commitlint --config commitlint.config.mjs --edit "{1}"

pre-commit:
  # Keep memory-heavy Turbo and Rust checks from competing for the same
  # constrained development container.
  parallel: false
  jobs:
    - name: turbo
      group:
        piped: true
        jobs:
          - name: prettier
            run: pnpm prettier --write --ignore-unknown {staged_files}
            root: turbo/
            glob: "turbo/**/*"
            stage_fixed: true
          - name: style-policy
            run: node scripts/style-policy.mjs
            root: turbo/
            glob: "turbo/**/*.{css,js,json,mjs,ts,tsx}"
            fail_text: |
              App style policy violations found. Use Tailwind utilities in business components;
              do not expand the allowlist for first-party styling.
              Read docs/styles.md for the style guide before fixing these errors.
          - name: platform-static-assets
            run: pnpm -F @okouai/app lint:static-assets
            root: turbo/
            glob: "turbo/apps/platform/**/*.{gif,ico,jpeg,jpg,png,svg,webp}"
            fail_text: |
              Platform static assets should be managed in vm0-ai/static-files.
              Use append-only, versioned or content-hashed paths under static.vm0.io/platform and reference them with platformStaticAssetUrl().
          - name: knip
            run: pnpm knip
            root: turbo/
            glob: "turbo/**/*.{js,ts,tsx,jsx,json}"
            skip:
              - merge
              - rebase
            fail_text: "Knip found unused code. Run 'cd turbo && pnpm knip' to see details."
            timeout: "60s"
          - name: check-types
            run: TSC_CHECKERS=2 pnpm check-types
            root: turbo/
            glob: "turbo/**/*.{ts,tsx}"
            fail_text: "TypeScript errors found. Run 'cd turbo && TSC_CHECKERS=2 pnpm check-types' to see details."
            timeout: "300s"
    - name: crates
      group:
        parallel: true
        jobs:
          - name: cargo-fmt
            run: cargo fmt --all
            root: crates/
            glob: "crates/**/*.{rs,toml}"
            stage_fixed: true
          - name: cargo-doc
            run: cargo doc --profile local --workspace --all-features --no-deps
            root: crates/
            glob: "crates/**/*.{rs,toml}"
          - name: uv-lock
            run: uv lock --check
            root: crates/runner/mitm-addon/
            glob: "crates/runner/mitm-addon/{pyproject.toml,uv.lock}"
          - name: ruff
            run: uv run --locked ruff check --fix . && uv run --no-sync ruff format .
            root: crates/runner/mitm-addon/
            glob: "crates/runner/mitm-addon/**/*.py"
            stage_fixed: true
    - name: check-file-size
      run: ./scripts/check-file-size.sh {staged_files}
      glob: "**/*"
      exclude:
        - "turbo/apps/*/public/og-image.png"
        - "turbo/apps/*/public/assets/cta-ellipse.png"
        - "turbo/apps/*/public/assets/code_illustration.svg"
      fail_text: |
        File size check failed. Some staged files exceed the 1MB limit.
        Run 'git diff --cached --name-only' to see staged files.
