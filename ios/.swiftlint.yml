# swift-format owns formatting. Native rules are compiled into pinned SwiftLint.
only_rules:
  - force_cast
  - force_try
  - duplicate_imports
  - unused_closure_parameter
  - invalid_swiftlint_command
  - superfluous_disable_command
  - unhandled_throwing_task
  - discarded_notification_center_observer
  - private_swiftui_state
  - okou_render_effects
  - okou_stable_graph
  - okou_private_atoms
  - okou_accessor_escape
  - okou_native_requests
  - okou_resource_failures
  - okou_test_synchronization
  - okou_check_after_await
  - okou_resource_cancellation
  - okou_subscription_teardown
  - okou_import_boundaries

included:
  - Okou
  - OkouTests
  - Push
  - Packages
  - Tools/SwiftLint/Rules

excluded:
  - "**/.build"
  - "**/DerivedData"
  - "**/*.generated.swift"

allow_zero_lintable_files: false
check_for_updates: false
