    <script data-okou-lifecycle="">
      (function () {
        const controller = new AbortController();
        window._okou = {
          rootSignal: controller.signal,
          async switchClerkSession(sessionId) {
            if (controller.signal.aborted) {
              return;
            }
            controller.abort();
            try {
              let destination = "/";
              await window.Clerk.setActive({
                session: sessionId,
                navigate: ({ session, decorateUrl }) => {
                  destination = decorateUrl(
                    session.currentTask
                      ? `/sign-in/tasks/${session.currentTask.key}`
                      : "/",
                  );
                },
              });
              window.location.replace(destination);
            } catch {
              window.location.reload();
            }
          },
        };
      })();
    </script>

    <script id="theme-bootstrap">
      // Inline theme detection — mirrors signals/theme.ts resolveTheme() + applyTheme()
      (function () {
        var root = document.documentElement;
        var p = null;
        try {
          var prefix = "__Secure-okou-theme=";
          var cookies = document.cookie.split(";");
          for (var i = 0; i < cookies.length; i += 1) {
            var cookie = cookies[i].trim();
            if (cookie.indexOf(prefix) === 0) {
              var value = cookie.slice(prefix.length);
              if (
                value === "v1.light" ||
                value === "v1.dark" ||
                value === "v1.system"
              ) {
                p = value.slice(3);
              }
              if (p) break;
            }
          }
        } catch (_) {}
        if (!p) p = "system";
        var t =
          p === "dark" || p === "light"
            ? p
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        root.dataset.theme = t;
        root.classList.toggle("dark", t === "dark");
      })();
    </script>

    <script

    <meta name="okou-clerk-ui-script" content="__OKOU_CLERK_UI_SCRIPT_URL__" />
    <script data-okou-clerk-bootstrap="">
      (function () {
        var hostname = location.hostname.toLowerCase();
        var production =
          hostname === "okou.ai" || hostname.endsWith(".okou.ai");
        var publishableKey = production
          ? "%VITE_CLERK_PUBLISHABLE_KEY_PROD%"
          : "%VITE_CLERK_PUBLISHABLE_KEY_PREVIEW%";
        var authOrigin = location.origin;
        function delegateClerkNavigation(method, url, metadata) {
          var router = window.__okouClerkRouter;
          var navigate = router && router[method];
          if (typeof navigate === "function") {
            return navigate(url, metadata);
          }
          // Until an app route owns navigation, keep Clerk's browser fallback.
          if (metadata && typeof metadata.windowNavigate === "function") {
            return metadata.windowNavigate(url);
          }
        }
        var loadOptions = {
          afterSignOutUrl: new URL("/sign-in", authOrigin).toString(),
          routerPush: function (url, metadata) {
            return delegateClerkNavigation("push", url, metadata);
          },
          routerReplace: function (url, metadata) {
            return delegateClerkNavigation("replace", url, metadata);
          },
          signInUrl: new URL("/sign-in", authOrigin).toString(),
          signUpUrl: new URL("/sign-up", authOrigin).toString(),
        };

        // Clerk accepts its hosted UI constructor as a promise, so the core
        // starts now and auth routes can resolve the UI independently.
        var resolveClerkUI;
        var clerkUI = new Promise(function (resolve) {
          resolveClerkUI = resolve;
        });

        var resolveRuntime;
        var rejectRuntime;
        var runtime = new Promise(function (resolve, reject) {
          resolveRuntime = resolve;
          rejectRuntime = reject;
        });
        // Own a rejection that can occur before the app module is evaluated.
        runtime.catch(function (error) {
          console.error("Clerk core bootstrap failed", error);
        });

        var bootstrap = {
          resolveClerkUI: resolveClerkUI,
          runtime: runtime,
        };
        window.__okouClerkBootstrap = bootstrap;

        function isAuthRoute(pathname) {
          return (
            /^\/sign-(?:in|up)(?:\/|$)/.test(pathname || "") ||
            pathname === "/oauth-consent"
          );
        }

        function createClerkRuntime() {
          var clerk = window.Clerk;
          if (
            !clerk ||
            typeof clerk.load !== "function" ||
            typeof clerk.on !== "function"
          ) {
            throw new Error("Clerk core script exposed no valid runtime");
          }

          return {
            clerk: clerk,
            loaded: clerk.load(
              Object.assign({}, loadOptions, { ui: { ClerkUI: clerkUI } }),
            ),
          };
        }

        // Direct auth route entries start the installed UI alongside the app.
        function startClerkUI() {
          if (!isAuthRoute(location.pathname)) return;
          var uiScript = document.createElement("script");
          uiScript.src = "__OKOU_CLERK_UI_SCRIPT_URL__";
          uiScript.type = "module";
          uiScript.crossOrigin = "anonymous";
          uiScript.async = true;
          bootstrap.uiLoaded = new Promise(function (resolve, reject) {
            uiScript.onerror = function () {
              uiScript.remove();
              reject(new Error("Clerk UI resource is unavailable"));
            };
            uiScript.onload = function () {
              uiScript.remove();
              var ui = window.__okouClerkUI;
              if (
                !ui ||
                typeof ui.ClerkUI !== "function" ||
                ui.version !== "__OKOU_CLERK_UI_VERSION__"
              ) {
                reject(
                  new Error("Clerk UI entry did not expose its public export"),
                );
                return;
              }
              resolveClerkUI(ui.ClerkUI);
              resolve(ui);
            };
          });
          // The route awaits the same promise and surfaces the startup failure.
          // Own a rejection that can occur before the app graph is evaluated.
          bootstrap.uiLoaded.catch(function (error) {
            console.error("Clerk UI bootstrap failed", error);
          });
          document.head.appendChild(uiScript);
        }

        var script = document.getElementById("okou-clerk-core-script");
        if (!script) throw new Error("Clerk core script is unavailable");
        var coreScriptUrl = script.src;
        var retryDelays = [500, 1000];
        function watchCoreScript(coreScript, attempt) {
          coreScript.dataset.clerkJsScript = "";
          coreScript.dataset.clerkPublishableKey = publishableKey;
          coreScript.onerror = function () {
            coreScript.onload = null;
            coreScript.onerror = null;
            coreScript.remove();
            if (attempt === retryDelays.length) {
              rejectRuntime(new Error("Clerk core resource is unavailable"));
              return;
            }
            // Keep the shared runtime pending until this resource recovers or
            // exhausts its retries. Invalid exports and load() errors are final.
            setTimeout(function () {
              var retryScript = document.createElement("script");
              retryScript.id = "okou-clerk-core-script";
              retryScript.src = coreScriptUrl;
              retryScript.type = "text/javascript";
              retryScript.crossOrigin = "anonymous";
              retryScript.async = true;
              watchCoreScript(retryScript, attempt + 1);
              document.head.appendChild(retryScript);
            }, retryDelays[attempt]);
          };
          coreScript.onload = function () {
            coreScript.onload = null;
            coreScript.onerror = null;
            Promise.resolve()
              .then(createClerkRuntime)
              .then(resolveRuntime, rejectRuntime);
          };
        }
        watchCoreScript(script, 0);
        startClerkUI();
      })();
    </script>
