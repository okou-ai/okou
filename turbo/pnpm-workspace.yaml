packages:
  - apps/*
  - packages/*

# Keep native optional dependencies usable from both the macOS host and the
# Linux devcontainer when they share the same node_modules directory.
supportedArchitectures:
  os:
    - current
    - darwin
    - linux
  cpu:
    - current
    - arm64

peerDependencyRules:
  ignoreMissing:
    - react-native
    - "@solana/web3.js"
    - fastestsmallesttextencoderdecoder

# The optional installed UI bundles its wallet adapters. With automatic peer
# installation disabled, provide their required peers only in that UI graph;
# the core-only App and SharedWorker do not acquire wallet code.
packageExtensions:
  "@clerk/ui@1.26.0":
    dependencies:
      "@solana/web3.js": "1.98.4"
      bs58: "6.0.0"

auditConfig:
  ignoreGhsas:
    # @hono/vite-build/vercel requires node-server v1. This advisory only
    # affects serve-static on Windows; the API uses neither surface.
    - GHSA-frvp-7c67-39w9

overrides:
  # Upstream dependencies still resolve vulnerable releases without these floors.
  "@esbuild-kit/core-utils>esbuild": ^0.25.4
  "esbuild@>=0.27.3 <0.28.1": ">=0.28.1"
  "jayson>uuid": 11.1.1
  tar: ">=7.5.21"
  tmp: ">=0.2.6"
  ws: ">=8.21.0"
  # Solana's browser RPC client accepts this version. jayson 4.2/4.3 add
  # stream-json@1 (GHSA-528h-pc64-c93x), whose 3.x fix is not API-compatible.
  # Remove when jayson publishes a compatible parser update.
  "@solana/web3.js@1.98.4>jayson": 4.1.3

patchedDependencies:
  "@earendil-works/pi-agent-core@0.85.1": patches/@earendil-works__pi-agent-core@0.85.1.patch
  "@earendil-works/pi-ai@0.85.1": patches/@earendil-works__pi-ai@0.85.1.patch
  "@earendil-works/pi-coding-agent@0.85.1": patches/@earendil-works__pi-coding-agent@0.85.1.patch
  # Remove when upstream jest-dom declarations support Vitest 5's Matchers.
  "@testing-library/jest-dom@6.9.1": patches/@testing-library__jest-dom@6.9.1.patch

ignoredBuiltDependencies:
  - esbuild
  - sharp
