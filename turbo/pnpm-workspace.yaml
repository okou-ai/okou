packages:
  - apps/*
  - packages/*

# Keep native optional dependencies usable from both the macOS host and the
# Linux devcontainer when they share the same node_modules directory.
supportedArchitectures:
  os:
    - current
    - darwin
    - linux
  cpu:
    - current
    - arm64

peerDependencyRules:
  ignoreMissing:
    - react-native
    - "@solana/web3.js"
    - fastestsmallesttextencoderdecoder

# The optional installed UI bundles its wallet adapters. With automatic peer
# installation disabled, provide their required peers only in that UI graph;
# the core-only App and SharedWorker do not acquire wallet code.
packageExtensions:
  "@clerk/ui@1.26.0":
    dependencies:
      "@solana/web3.js": "1.98.4"
      bs58: "6.0.0"

auditConfig:
  ignoreGhsas:
    # @hono/vite-build/vercel requires node-server v1. This advisory only
    # affects serve-static on Windows; the API uses neither surface.
    - GHSA-frvp-7c67-39w9
    # No patched http-cache-semantics release exists yet. It is reachable only
    # through ably>got>cacheable-request, and Ably's Node REST client never
    # passes got's `cache` option, so the vulnerable max-stale path is unused.
    # Remove when a fixed release is published or Ably drops got.
    - GHSA-ch52-4w7c-c8xp

overrides:
  # Keep the IME backport on its validated version until a fixed release is available.
  prosemirror-view: 1.42.8
  # speech-rule-engine 4.1.4 pins xmldom 0.9.10, which has XML injection and
  # parser DoS advisories. Remove when upstream requires xmldom >=0.9.12.
  "speech-rule-engine>@xmldom/xmldom": ^0.9.12
  # Upstream dependencies still resolve vulnerable releases without these floors.
  "@esbuild-kit/core-utils>esbuild": ^0.25.4
  "esbuild@>=0.27.3 <0.28.1": ">=0.28.1"
  "jayson>uuid": 11.1.1
  # @swc/core 1.16 refuses to load its native binding in the CI container
  # (ERR_SWC_NATIVE_CACHE on the shared HOME). Keep i18next-cli on the repo's
  # 1.15 line; remove once the toolchain container satisfies 1.16's cache checks.
  "i18next-cli>@swc/core": 1.15.46
  # Miniflare pins vulnerable patch releases. Remove when upstream requires
  # sharp >=0.35.4 (libheif) and undici >=7.30.1 (TLS validation fixes,
  # GHSA-xjj6-f33q-929c, GHSA-4qv8-2p9j-2685, GHSA-f72v-6w45-q472).
  "miniflare>sharp": ^0.35.4
  "miniflare>undici": ^7.30.1
  # @earendil-works/pi-coding-agent pins undici 8.10.2 exactly, which is still
  # affected by GHSA-xjj6-f33q-929c, GHSA-4qv8-2p9j-2685 and GHSA-f72v-6w45-q472.
  # Remove when upstream requires a patched undici 8.x release.
  "@earendil-works/pi-coding-agent>undici": ^8.12.2
  # zod below 4.6.6 can exhaust memory while validating oversized collections
  # (GHSA-mrhx-c7xc-m3w5). Remove when every workspace dependency requires >=4.6.6.
  zod: ^4.6.6
  # Slack SDK 7.x still permits vulnerable axios releases. Remove when upstream
  # requires axios >=1.20.0, which fixes the data-URL parser ReDoS.
  "@slack/web-api>axios": 1.20.0
  # AJV and express-rate-limit still permit vulnerable transitive releases.
  # Remove these floors when upstream requires the patched versions.
  "ajv>fast-uri": ^3.1.7
  "express-rate-limit>ip-address": ^10.5.1
  # Express still pins proxy-addr 2.0.7, vulnerable to IPv4-mapped IPv6 trust
  # subnet spoofing (GHSA-jqcg-44mw-7w3h). Remove when upstream requires 2.0.8.
  "express>proxy-addr": 2.0.8
  # axios 1.20.0 still permits follow-redirects releases vulnerable to
  # credential leaks, including cross-realm sensitiveHeaders handling
  # (GHSA-mrwp-f3q8-3g9p). Remove when axios requires >=1.16.2.
  "axios>follow-redirects": ^1.16.2
  # readdir-glob and pi-coding-agent require minimatch 10, vulnerable to
  # globparts amplification (GHSA-g3hv-75wg-m249). Their named APIs are
  # compatible with v11. Remove when upstream requires >=11.0.1.
  "readdir-glob>minimatch": ^11.0.3
  "@earendil-works/pi-coding-agent>minimatch": ^11.0.3
  tar: ">=7.5.21"
  tmp: ">=0.2.6"
  ws: ">=8.21.0"
  # Solana's browser RPC client accepts this version. jayson 4.2/4.3 add
  # stream-json@1 (GHSA-528h-pc64-c93x), whose 3.x fix is not API-compatible.
  # Remove when jayson publishes a compatible parser update.
  "@solana/web3.js@1.98.4>jayson": 4.1.3

patchedDependencies:
  # Remove when Base UI fixes empty trigger refs and preserves the focused
  # composite item index after DOM reordering. Regression: connector account defaults.
  "@base-ui/react@1.7.0": patches/@base-ui__react@1.7.0.patch
  "@earendil-works/pi-agent-core@1.1.0": patches/@earendil-works__pi-agent-core@1.1.0.patch
  "@earendil-works/pi-ai@1.1.0": patches/@earendil-works__pi-ai@1.1.0.patch
  "@earendil-works/pi-coding-agent@1.1.0": patches/@earendil-works__pi-coding-agent@1.1.0.patch
  # Remove when upstream jest-dom declarations support Vitest 5's Matchers.
  "@testing-library/jest-dom@6.9.1": patches/@testing-library__jest-dom@6.9.1.patch
  # Backport upstream df03e40059 and 719e70f778 for IME Backspace handling.
  # Remove with the version override after a fixed release passes the native IME smoke test.
  "prosemirror-view@1.42.8": patches/prosemirror-view@1.42.8.patch
  # Remove when upstream centerView and resetTransform persist recalculated pan bounds.
  "react-zoom-pan-pinch@4.0.3": patches/react-zoom-pan-pinch@4.0.3.patch

ignoredBuiltDependencies:
  - esbuild
  - sharp
