[versions]
agp = "9.5.3"
kotlin = "2.4.21"
compose-bom = "2026.11.01"
activity = "1.13.0"
lifecycle = "2.11.1"
clerk = "1.5.0"
coil = "3.6.3"
zoomimage = "1.7.0"
appcompat = "1.8.0"
browser = "1.10.0"
coroutines = "1.11.0"
junit = "4.13.2"
robolectric = "4.18.1"
spotless = "8.12.0"
test-core = "1.7.0"
test-junit = "1.3.0"
test-runner = "1.7.0"
uiautomator = "2.4.1"
test-services = "1.6.0"
retrofit = "3.0.0"
okhttp = "5.5.1"
errorprone-annotations = "2.53.0"
animal-sniffer-annotations = "1.29.2"
serialization = "1.13.0"
room = "2.8.5"
datastore = "1.3.0"
ksp = "2.3.14"
sqlite = "2.7.1"
commonmark = "0.33.0"
ably = "2.2.0"
sentry-android = "8.66.0"
sentry-gradle = "6.28.0"

[libraries]
# Spotless reads the version and resolves the formatter. Android Lint reads the Maven coordinate.
ktfmt = { module = "org.jetbrains.kotlinx:ktfmt", version = "0.65.1" }
appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
browser = { module = "androidx.browser:browser", version.ref = "browser" }
clerk-ui = { module = "com.clerk:clerk-android-ui", version.ref = "clerk" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }
coil-svg = { module = "io.coil-kt.coil3:coil-svg", version.ref = "coil" }
zoomimage-compose = { module = "io.github.panpf.zoomimage:zoomimage-compose", version.ref = "zoomimage" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui-test = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-runtime-testing = { module = "androidx.lifecycle:lifecycle-runtime-testing", version.ref = "lifecycle" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
test-core-ktx = { module = "androidx.test:core-ktx", version.ref = "test-core" }
test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "test-junit" }
test-runner = { module = "androidx.test:runner", version.ref = "test-runner" }
test-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "uiautomator" }
test-storage = { module = "androidx.test.services:storage", version.ref = "test-services" }
test-services = { module = "androidx.test.services:test-services", version.ref = "test-services" }
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-serialization = { module = "com.squareup.retrofit2:converter-kotlinx-serialization", version.ref = "retrofit" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }
okhttp-tls = { module = "com.squareup.okhttp3:okhttp-tls", version.ref = "okhttp" }
errorprone-annotations = { module = "com.google.errorprone:error_prone_annotations", version.ref = "errorprone-annotations" }
animal-sniffer-annotations = { module = "org.codehaus.mojo:animal-sniffer-annotations", version.ref = "animal-sniffer-annotations" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
datastore-preferences-core = { module = "androidx.datastore:datastore-preferences-core", version.ref = "datastore" }
sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }
sqlite-host = { module = "androidx.sqlite:sqlite-bundled-jvm", version.ref = "sqlite" }
commonmark = { module = "org.commonmark:commonmark", version.ref = "commonmark" }
commonmarkTables = { module = "org.commonmark:commonmark-ext-gfm-tables", version.ref = "commonmark" }
ably-device = { module = "io.ably.pubsub:device", version.ref = "ably" }
sentry-android-core = { module = "io.sentry:sentry-android-core", version.ref = "sentry-android" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
room = { id = "androidx.room", version.ref = "room" }
sentry-android = { id = "io.sentry.android.gradle", version.ref = "sentry-gradle" }
