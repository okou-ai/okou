# Shared by normal provisioning and the pre-cutover/cached-start gates.
# Existing namespace metadata and child endpoints are never converged.
- name: Prepare protected Runner WSS host prerequisites
  become: true
  block:
    - name: Inspect trusted Runner WSS parent directories
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
        get_checksum: false
      loop:
        - /
        - /run
        - /usr
        - /usr/local
        - /etc
        - /etc/systemd
        - /etc/systemd/system
      register: runner_wss_parents

    - name: Require trusted Runner WSS parent directories
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isdir | default(false)
          - not (item.stat.islnk | default(false))
          - item.stat.uid == 0
          - item.stat.mode[-2] in ['0', '1', '4', '5']
          - item.stat.mode[-1] in ['0', '1', '4', '5']
        fail_msg: "Unsafe Runner WSS parent {{ item.item }}; refusing preparation"
        quiet: true
      loop: "{{ runner_wss_parents.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Inspect existing Runner WSS namespace
      ansible.builtin.stat:
        path: /run/okou-ws
        follow: false
        get_checksum: false
      register: runner_wss_namespace

    - name: Refuse conflicting Runner WSS namespace
      ansible.builtin.assert:
        that:
          - runner_wss_namespace.stat.isdir | default(false)
          - not (runner_wss_namespace.stat.islnk | default(false))
          - runner_wss_namespace.stat.uid == 0
          - runner_wss_namespace.stat.gr_name | default('') == 'okou-wss-caddy'
          - runner_wss_namespace.stat.mode == '0710'
        fail_msg: "Existing /run/okou-ws must be root:okou-wss-caddy 0710; refusing repair"
        quiet: true
      when: runner_wss_namespace.stat.exists

    - name: Inspect Runner WSS helper and boot-policy paths
      ansible.builtin.stat:
        path: "{{ item.path }}"
        follow: false
        get_checksum: false
      loop:
        - { path: /usr/local/libexec, directory: true }
        - { path: /etc/systemd/system/vm0-runner-.service.d, directory: true }
        - {
            path: /usr/local/libexec/okou-runner-wss-host-prepare.py,
            directory: false,
          }
        - {
            path: /etc/systemd/system/vm0-runner-.service.d/10-wss-host.conf,
            directory: false,
          }
      register: runner_wss_policy_paths

    - name: Refuse unsafe Runner WSS installation paths
      ansible.builtin.assert:
        that:
          - not (item.stat.islnk | default(false))
          - (item.stat.isdir | default(false)) if item.item.directory else (item.stat.isreg | default(false))
          - item.stat.uid == 0
          - item.stat.mode[-2] in ['0', '1', '4', '5']
          - item.stat.mode[-1] in ['0', '1', '4', '5']
        fail_msg: "Unsafe Runner WSS installation path {{ item.item.path }}; refusing preparation"
        quiet: true
      loop: "{{ runner_wss_policy_paths.results }}"
      loop_control:
        label: "{{ item.item.path }}"
      when: item.stat.exists

    - name: Create dedicated Runner WSS system group without user memberships
      ansible.builtin.group:
        name: okou-wss-caddy
        system: true
        state: present

    - name: Create Runner WSS helper and prefix drop-in directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - /usr/local/libexec
        - /etc/systemd/system/vm0-runner-.service.d

    - name: Install guarded Runner WSS namespace helper
      ansible.builtin.copy:
        src: ../files/okou-runner-wss-host-prepare.py
        dest: /usr/local/libexec/okou-runner-wss-host-prepare.py
        owner: root
        group: root
        mode: "0755"

    - name: Prepare Runner WSS namespace without touching existing endpoints
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - /usr/local/libexec/okou-runner-wss-host-prepare.py
      register: runner_wss_host_prepare
      changed_when: runner_wss_host_prepare.stdout == 'created'

    - name: Prepare Runner WSS namespace before every systemd Runner start
      ansible.builtin.copy:
        dest: /etc/systemd/system/vm0-runner-.service.d/10-wss-host.conf
        content: |
          # Managed by ansible/playbooks/provision-runner.yml - do not edit.
          # Applies to release, preview and behavior units; no service restart.
          [Service]
          ExecStartPre=/usr/bin/python3 /usr/local/libexec/okou-runner-wss-host-prepare.py
        owner: root
        group: root
        mode: "0644"

    # A previous reload may have failed after copy succeeded. Reapply the
    # idempotent manager operation on retries even when the file is unchanged.
    - name: Reload systemd policy without restarting any Runner
      ansible.builtin.command:
        argv:
          - systemctl
          - daemon-reload
      changed_when: false
