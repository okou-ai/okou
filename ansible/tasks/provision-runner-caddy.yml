- name: Provision dedicated Runner Caddy service
  vars:
    runner_caddy_version: "2.11.9"
    runner_caddy_previous: "{{ runner_caddy_applied.content | default('e30=') | b64decode | from_json }}"
    runner_caddy_archives:
      x86_64:
        arch: amd64
        sha256: 5b8cb7faf8726a2028ad96a66e54e6e81e8f361bc6175e5d22bbd997cc5177fb
      aarch64:
        arch: arm64
        sha256: 5e377cff994fc9362a6fcf695c53f226cfca3a3ef85bd3a3687cf252d6310165
  block:
    - name: Validate public Runner inventory hostname
      ansible.builtin.assert:
        that:
          - inventory_hostname | length <= 253
          - inventory_hostname is match('^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?(?:\.[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?)*\.[a-z](?:[a-z0-9-]{0,61}[a-z0-9])?$')
          - inventory_hostname is not search('\.(localhost|local|internal|home\.arpa|invalid|test|example)$')
        fail_msg: Caddy requires the exact public Runner inventory hostname.

    - name: Gather platform facts for the pinned Caddy binary
      ansible.builtin.setup:
        gather_subset:
          - "!all"
          - "!min"
          - platform

    - name: Validate Caddy platform and architecture
      ansible.builtin.assert:
        that:
          - ansible_facts['system'] == 'Linux'
          - ansible_facts['architecture'] in runner_caddy_archives
        fail_msg: Caddy requires a supported Linux architecture.

    - name: Create dedicated Caddy access group
      ansible.builtin.group:
        name: okou-runner-caddy
        system: true
        state: present

    # Runner supplies this namespace after first provisioning. Check existing
    # paths without requiring or creating Runner-owned state before startup.
    - name: Validate available Runner ingress namespace without changing it
      ansible.builtin.script: ../files/validate-runner-ingress-namespace.py
      args:
        executable: /usr/bin/python3
      changed_when: false
      check_mode: false

    # A verified static binary avoids auto-starting the distro caddy.service.
    - name: Create dedicated Caddy binary and download directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - /var/cache/okou-runner-caddy
        - "/var/cache/okou-runner-caddy/{{ runner_caddy_version }}"
        - "/usr/local/lib/okou-runner-caddy/{{ runner_caddy_version }}"

    - name: Download checksum-pinned Caddy archive
      ansible.builtin.get_url:
        url: "https://github.com/caddyserver/caddy/releases/download/v{{ runner_caddy_version }}/caddy_{{ runner_caddy_version }}_linux_{{ runner_caddy_archives[ansible_facts['architecture']]['arch'] }}.tar.gz"
        dest: "/var/cache/okou-runner-caddy/caddy_{{ runner_caddy_version }}.tar.gz"
        checksum: "sha256:{{ runner_caddy_archives[ansible_facts['architecture']]['sha256'] }}"
        owner: root
        group: root
        mode: "0644"

    - name: Unpack verified Caddy archive
      ansible.builtin.unarchive:
        src: "/var/cache/okou-runner-caddy/caddy_{{ runner_caddy_version }}.tar.gz"
        dest: "/var/cache/okou-runner-caddy/{{ runner_caddy_version }}"
        remote_src: true
        owner: root
        group: root
        mode: "0755"

    - name: Install verified Caddy binary atomically
      ansible.builtin.copy:
        src: "/var/cache/okou-runner-caddy/{{ runner_caddy_version }}/caddy"
        dest: "/usr/local/lib/okou-runner-caddy/{{ runner_caddy_version }}/caddy"
        remote_src: true
        owner: root
        group: root
        mode: "0755"
      register: runner_caddy_binary

    - name: Create dedicated Caddy system user
      ansible.builtin.user:
        name: okou-runner-caddy
        group: okou-runner-caddy
        groups: ""
        system: true
        shell: /usr/sbin/nologin
        home: /var/lib/okou-runner-caddy
        create_home: false
      register: runner_caddy_user

    - name: Create private persistent Caddy certificate state
      ansible.builtin.file:
        path: /var/lib/okou-runner-caddy
        state: directory
        owner: okou-runner-caddy
        group: okou-runner-caddy
        mode: "0700"

    - name: Create protected Caddy configuration directory
      ansible.builtin.file:
        path: /etc/okou-runner-caddy
        state: directory
        owner: root
        group: okou-runner-caddy
        mode: "0710"

    - name: Preserve the confirmed Caddyfile before publication
      when: not ansible_check_mode
      block:
        - name: Fingerprint the Caddyfile before replacing it
          ansible.builtin.stat:
            path: /etc/okou-runner-caddy/Caddyfile
            checksum_algorithm: sha256
          register: runner_caddy_before

        - name: Check for the last applied deployment record
          ansible.builtin.stat:
            path: /etc/okou-runner-caddy/applied-state.json
          register: runner_caddy_receipt

        - name: Read the last applied Caddy deployment
          ansible.builtin.slurp:
            src: /etc/okou-runner-caddy/applied-state.json
          when: runner_caddy_receipt.stat.exists
          register: runner_caddy_applied

        - name: Save the current source when its hash matches the receipt
          ansible.builtin.copy:
            src: /etc/okou-runner-caddy/Caddyfile
            dest: /etc/okou-runner-caddy/Caddyfile.applied
            remote_src: true
            owner: root
            group: root
            mode: "0600"
          when:
            - runner_caddy_before.stat.exists
            - runner_caddy_before.stat.checksum == runner_caddy_previous.get('config')

    - name: Validate and install static Runner Caddyfile
      ansible.builtin.template:
        src: ../templates/runner-caddy.Caddyfile.j2
        dest: /etc/okou-runner-caddy/Caddyfile
        owner: root
        group: okou-runner-caddy
        mode: "0640"
        validate: "/usr/local/lib/okou-runner-caddy/{{ runner_caddy_version }}/caddy validate --config %s --adapter caddyfile"
      register: runner_caddy_config

    - name: Install dedicated Runner Caddy service
      ansible.builtin.template:
        src: ../templates/okou-runner-caddy.service.j2
        dest: /etc/systemd/system/okou-runner-caddy.service
        owner: root
        group: root
        mode: "0644"
      register: runner_caddy_unit

    # A previous run can stop after publishing files but before applying them.
    # Record completion only after readiness; task.changed alone loses that state.
    - name: Recover and apply Runner Caddy deployment
      when: not ansible_check_mode
      vars:
        runner_caddy_activation_state:
          binary: "{{ runner_caddy_deployment_files.results[0].stat.checksum }}"
          config: "{{ runner_caddy_deployment_files.results[1].stat.checksum }}"
          unit: "{{ runner_caddy_deployment_files.results[2].stat.checksum }}"
          uid: "{{ runner_caddy_user.uid }}"
          gid: "{{ runner_caddy_user.group }}"
          groups: "{{ runner_caddy_user.groups }}"
          invocation: "{{ runner_caddy_invocation.stdout }}"
        runner_caddy_config_pending: "{{ runner_caddy_config.changed or runner_caddy_previous.get('config') != runner_caddy_activation_state.config }}"
        runner_caddy_runtime_pending: >-
          {{ (not runner_caddy_previous and (runner_caddy_unit.changed or runner_caddy_binary.changed or runner_caddy_user.changed))
             or runner_caddy_previous.get('binary', runner_caddy_activation_state.binary) != runner_caddy_activation_state.binary
             or runner_caddy_previous.get('unit', runner_caddy_activation_state.unit) != runner_caddy_activation_state.unit
             or (runner_caddy_previous.get('uid', runner_caddy_activation_state.uid) | string) != (runner_caddy_activation_state.uid | string)
             or (runner_caddy_previous.get('gid', runner_caddy_activation_state.gid) | string) != (runner_caddy_activation_state.gid | string)
             or runner_caddy_previous.get('groups', runner_caddy_activation_state.groups) != runner_caddy_activation_state.groups }}
      block:
        - name: Fingerprint published Caddy deployment files
          ansible.builtin.stat:
            path: "{{ item }}"
            checksum_algorithm: sha256
          loop:
            - "/usr/local/lib/okou-runner-caddy/{{ runner_caddy_version }}/caddy"
            - /etc/okou-runner-caddy/Caddyfile
            - /etc/systemd/system/okou-runner-caddy.service
          register: runner_caddy_deployment_files

        - name: Inspect current Caddy service invocation
          ansible.builtin.command:
            argv:
              - systemctl
              - show
              - okou-runner-caddy.service
              - --property=InvocationID
              - --value
          changed_when: false
          register: runner_caddy_invocation

        - name: Check whether Caddy is already active
          ansible.builtin.command:
            argv: [systemctl, is-active, --quiet, okou-runner-caddy.service]
          register: runner_caddy_active
          changed_when: false
          failed_when: runner_caddy_active.rc not in [0, 3, 4]

        - name: Require separate configuration and process updates on an active Caddy
          ansible.builtin.assert:
            that: not (runner_caddy_config_pending and runner_caddy_runtime_pending)
            fail_msg: Caddyfile changes cannot restart an active Caddy. Apply process changes separately.
          when: runner_caddy_active.rc == 0

        - name: Enable Caddy and apply changes to its process inputs
          ansible.builtin.systemd_service:
            name: okou-runner-caddy.service
            daemon_reload: "{{ runner_caddy_active.rc != 0 or runner_caddy_runtime_pending }}"
            enabled: true
            state: >-
              {{ 'started' if runner_caddy_active.rc != 0 else
                 ('restarted' if runner_caddy_runtime_pending else omit) }}

        - name: Hot-reload the Caddyfile in the active process
          ansible.builtin.script:
            cmd: >-
              ../files/reload-runner-caddy.py okou-runner-caddy.service
              /etc/okou-runner-caddy/Caddyfile {{ runner_caddy_activation_state.config }}
              {{ runner_caddy_invocation.stdout }}
            executable: /usr/bin/python3
          when:
            - runner_caddy_active.rc == 0
            - not runner_caddy_runtime_pending
            - runner_caddy_config_pending or runner_caddy_previous.get('invocation') != runner_caddy_invocation.stdout
          register: runner_caddy_reload
          failed_when: runner_caddy_reload.rc | default(1) not in [0, 3]

        - name: Restore the confirmed source after Caddy rejects the update
          when: runner_caddy_reload.rc | default(0) == 3
          block:
            - name: Verify the saved source against the last applied hash
              ansible.builtin.stat:
                path: /etc/okou-runner-caddy/Caddyfile.applied
                checksum_algorithm: sha256
              register: runner_caddy_saved_source

            - name: Restore the last confirmed Caddyfile for future starts
              ansible.builtin.copy:
                src: /etc/okou-runner-caddy/Caddyfile.applied
                dest: /etc/okou-runner-caddy/Caddyfile
                remote_src: true
                owner: root
                group: okou-runner-caddy
                mode: "0640"
              when:
                - runner_caddy_saved_source.stat.exists
                - runner_caddy_saved_source.stat.checksum == runner_caddy_previous.get('config')

            - name: Fail provisioning after rejected Caddy configuration
              ansible.builtin.fail:
                msg: "{{ runner_caddy_reload.stdout }}"

        - name: Verify the ready Caddy service invocation
          ansible.builtin.command:
            argv:
              - systemctl
              - show
              - okou-runner-caddy.service
              - --property=InvocationID
              - --value
          changed_when: false
          register: runner_caddy_ready_invocation
          failed_when: >-
            runner_caddy_ready_invocation.rc != 0
            or runner_caddy_ready_invocation.stdout is not match('^[0-9a-f]{32}$')
            or (runner_caddy_reload is changed and runner_caddy_ready_invocation.stdout != runner_caddy_invocation.stdout)

        # A startup failure can follow the notify acknowledgement immediately.
        - name: Verify Caddy remained active after startup
          ansible.builtin.command:
            argv:
              - systemctl
              - is-active
              - --quiet
              - okou-runner-caddy.service
          changed_when: false

        - name: Save the confirmed Caddyfile for future reloads
          ansible.builtin.copy:
            src: /etc/okou-runner-caddy/Caddyfile
            dest: /etc/okou-runner-caddy/Caddyfile.applied
            remote_src: true
            owner: root
            group: root
            mode: "0600"

        - name: Record the successfully applied Caddy deployment
          ansible.builtin.copy:
            content: "{{ runner_caddy_activation_state | combine({'invocation': runner_caddy_ready_invocation.stdout}) | to_nice_json }}\n"
            dest: /etc/okou-runner-caddy/applied-state.json
            owner: root
            group: root
            mode: "0600"
