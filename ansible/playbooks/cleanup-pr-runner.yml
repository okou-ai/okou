# Cleanup PR Runner Resources
#
# This playbook cleans up every runner resource owned by one pull request.
#
# Usage:
#   ansible-playbook -i "host1,host2," playbooks/cleanup-pr-runner.yml \
#     -e "ansible_user=ubuntu" \
#     -e "job_ref=pr-123"
#
# Required Variables:
#   - job_ref: The exact pull request job reference (e.g., pr-123)

- name: Cleanup PR Runner Resources
  hosts: all
  become: true

  vars:
    base_dir: /var/lib/vm0-runner
    reload_lock: "{{ base_dir }}/locks/systemd-daemon-reload.lock"

  tasks:
    - name: Check required variables
      assert:
        that:
          - job_ref is defined
          - job_ref is match('^pr-[1-9][0-9]*$')
        fail_msg: "job_ref must be an exact pull request namespace such as pr-123"

    - name: Ensure runner lock directory exists
      file:
        path: "{{ base_dir }}/locks"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Ensure systemd reload lock exists
      file:
        path: "{{ reload_lock }}"
        state: touch
        owner: root
        group: root
        mode: "0600"
        access_time: preserve
        modification_time: preserve

    - name: Find loaded PR runner services
      shell: |
        set -o pipefail
        systemctl list-units \
          --all \
          --type=service \
          --no-legend \
          --plain \
          'vm0-runner-{{ job_ref }}-*' \
          | awk '$1 ~ /^vm0-runner-{{ job_ref }}-[a-z0-9][a-z0-9.-]*\.service$/ {print $1}' \
          | sort -u
      args:
        executable: /bin/bash
      register: loaded_runner_services
      changed_when: false

    - name: Find installed PR runner services
      shell: |
        set -o pipefail
        # systemctl exits 1 when a supplied pattern matches no unit files.
        # Filter the full inventory so directory-only namespaces can be cleaned.
        systemctl list-unit-files \
          --type=service \
          --no-legend \
          --no-pager \
          | awk '$1 ~ /^vm0-runner-{{ job_ref }}-[a-z0-9][a-z0-9.-]*\.service$/ {print $1}' \
          | sort -u
      args:
        executable: /bin/bash
      register: installed_runner_services
      changed_when: false

    - name: Collect PR runner services
      set_fact:
        runner_services: >-
          {{
            (
              loaded_runner_services.stdout_lines
              + installed_runner_services.stdout_lines
            ) | unique | list
          }}

    - name: Stop PR runner services
      command:
        argv:
          - systemctl
          - stop
          - "{{ item }}"
      loop: "{{ runner_services }}"

    - name: Disable persistent PR runner services
      command:
        argv:
          - systemctl
          - disable
          - --no-reload
          - "{{ item }}"
      loop: "{{ installed_runner_services.stdout_lines }}"

    - name: Remove persistent PR runner unit files
      file:
        path: "/etc/systemd/system/{{ item }}"
        state: absent
      loop: "{{ installed_runner_services.stdout_lines }}"

    - name: Reload systemd daemon
      command:
        argv:
          - flock
          - --exclusive
          - "{{ reload_lock }}"
          - systemctl
          - daemon-reload

    - name: Find PR binary directories
      find:
        paths: "{{ base_dir }}/bin"
        patterns:
          - "{{ job_ref }}"
          - "{{ job_ref }}-*"
        file_type: directory
        recurse: false
      register: runner_binary_directories

    - name: Find PR runner directories
      find:
        paths: "{{ base_dir }}/runners"
        patterns:
          - "{{ job_ref }}"
          - "{{ job_ref }}-*"
        file_type: directory
        recurse: false
      register: runner_directories

    - name: Find PR runner group directories
      find:
        paths: "{{ base_dir }}/groups/vm0"
        patterns:
          - "*-{{ job_ref }}"
          - "*-{{ job_ref }}-*"
        file_type: directory
        recurse: false
      register: runner_group_directories

    - name: Remove PR runner directories
      file:
        path: "{{ item }}"
        state: absent
      loop: >-
        {{
          (
            runner_binary_directories.files
            + runner_directories.files
            + runner_group_directories.files
          ) | map(attribute='path') | list
        }}
