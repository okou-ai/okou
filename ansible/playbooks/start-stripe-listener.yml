# Start Stripe CLI Listener
#
# Starts one PR-scoped Stripe CLI listener on a selected metal host. The API
# preview already trusts the Stripe CLI webhook secret; this listener only
# forwards matching test-mode events into that preview.
#
# Usage:
#   ansible-playbook -i "host," playbooks/start-stripe-listener.yml \
#     -e "ansible_user=ubuntu" \
#     -e "job_ref=pr-123" \
#     -e "forward_url=https://api-preview.example.com/api/webhooks/stripe" \
#     -e "stripe_secret_key=sk_test_..."

- name: Start Stripe CLI Listener
  hosts: all
  become: true

  vars:
    base_dir: /var/lib/vm0-runner
    stripe_dir: "{{ base_dir }}/stripe/{{ job_ref }}"
    stripe_bin_dir: "{{ stripe_dir }}/bin"
    stripe_bin: "{{ stripe_bin_dir }}/stripe"
    stripe_archive: "{{ stripe_dir }}/stripe.tar.gz"
    stripe_log: "{{ stripe_dir }}/stripe-listen.log"
    stripe_cli_version: "1.41.2"
    stripe_cli_assets:
      x86_64:
        archive_arch: x86_64
        sha256: 35684521fc6c2d994e6461ef28330f2c77fbf7d588a7b93fee5e8d4aa52d0c65
      aarch64:
        archive_arch: arm64
        sha256: 04d86663e840ec1fc71ec0f1ccceb9345a5bd783614746f590b05e4bf1f61b9b
    stripe_cli_architecture_aliases:
      x86_64: x86_64
      amd64: x86_64
      aarch64: aarch64
      arm64: aarch64
    stripe_events: checkout.session.completed,invoice.paid,customer.subscription.updated,customer.subscription.deleted
    service_name: "vm0-stripe-listener-{{ job_ref }}"

  tasks:
    - name: Check required variables
      assert:
        that:
          - job_ref is defined
          - forward_url is defined
          - stripe_secret_key is defined
          - job_ref | length > 0
          - forward_url | length > 0
          - stripe_secret_key | length > 0
        fail_msg: "Required variables: job_ref, forward_url, stripe_secret_key"

    - name: Create Stripe listener directory
      file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ stripe_dir }}"
        - "{{ stripe_bin_dir }}"

    - name: Check for an installed Stripe CLI
      stat:
        path: "{{ stripe_bin }}"
      register: stripe_cli_binary

    - name: Install Stripe CLI
      when: not stripe_cli_binary.stat.exists
      block:
        - name: Detect Stripe CLI architecture
          command: uname -m
          register: stripe_cli_architecture
          changed_when: false

        - name: Check Stripe CLI architecture support
          assert:
            that: stripe_cli_architecture.stdout in stripe_cli_architecture_aliases
            fail_msg: "Unsupported Stripe CLI architecture: {{ stripe_cli_architecture.stdout }}"

        - name: Select Stripe CLI release asset
          set_fact:
            stripe_cli_asset: "{{ stripe_cli_assets[stripe_cli_architecture_aliases[stripe_cli_architecture.stdout]] }}"

        - name: Download verified Stripe CLI archive
          get_url:
            url: "https://github.com/stripe/stripe-cli/releases/download/v{{ stripe_cli_version }}/stripe_{{ stripe_cli_version }}_linux_{{ stripe_cli_asset.archive_arch }}.tar.gz"
            dest: "{{ stripe_archive }}"
            checksum: "sha256:{{ stripe_cli_asset.sha256 }}"
            force: true
            mode: "0644"
            timeout: 30
          register: stripe_cli_download
          until: stripe_cli_download is succeeded
          retries: 3
          delay: 2

        - name: Extract Stripe CLI
          unarchive:
            src: "{{ stripe_archive }}"
            dest: "{{ stripe_bin_dir }}"
            include:
              - stripe
            remote_src: true
            creates: "{{ stripe_bin }}"

    - name: Set Stripe CLI executable mode
      file:
        path: "{{ stripe_bin }}"
        state: file
        mode: "0755"

    - name: Remove Stripe CLI archive
      file:
        path: "{{ stripe_archive }}"
        state: absent

    - name: Stop existing listener service
      command: systemctl stop {{ service_name }}.service
      register: stop_existing
      changed_when: stop_existing.rc == 0
      failed_when: false

    - name: Write Stripe listener environment
      copy:
        dest: "{{ stripe_dir }}/env"
        mode: "0600"
        content: |
          STRIPE_API_KEY={{ stripe_secret_key }}
      no_log: true

    - name: Write Stripe listener systemd unit
      copy:
        dest: "/etc/systemd/system/{{ service_name }}.service"
        mode: "0644"
        content: |
          [Unit]
          Description=Okou Stripe CLI listener for {{ job_ref }}
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          EnvironmentFile={{ stripe_dir }}/env
          WorkingDirectory={{ stripe_dir }}
          ExecStart={{ stripe_bin }} listen --events {{ stripe_events }} --forward-to {{ forward_url }}
          Restart=always
          RestartSec=3
          StandardOutput=append:{{ stripe_log }}
          StandardError=append:{{ stripe_log }}

          [Install]
          WantedBy=multi-user.target

    - name: Start Stripe listener service
      systemd:
        name: "{{ service_name }}.service"
        state: started
        enabled: false
        daemon_reload: true

    - name: Wait for Stripe listener readiness
      shell: |
        set -euo pipefail
        for _ in $(seq 1 20); do
          if systemctl is-active --quiet "{{ service_name }}.service" && grep -qi ready "{{ stripe_log }}" 2>/dev/null; then
            echo "Stripe CLI listener is ready"
            exit 0
          fi
          if systemctl is-failed --quiet "{{ service_name }}.service"; then
            break
          fi
          sleep 1
        done

        echo "Stripe CLI listener did not become ready" >&2
        systemctl show "{{ service_name }}.service" --property=ActiveState,SubState,Result --no-pager >&2 || true
        if [ -f "{{ stripe_log }}" ]; then
          tail -100 "{{ stripe_log }}" | sed -E 's/whsec_[[:alnum:]_]+/[masked-stripe-webhook-secret]/g' >&2
        fi
        exit 1
      args:
        executable: /bin/bash
      changed_when: false
