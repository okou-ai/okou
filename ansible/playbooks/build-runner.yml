# Build Okou Runner (Rust)
#
# This playbook prepares a new version of the Rust-based Okou runner on
# production metal instances **without starting the service**. It copies the
# binary, downloads dependencies, builds the default rootfs/snapshot, and
# writes the per-version config file. The systemd service is installed by
# the companion `promote-runner.yml` in the promote phase — this lets the
# heavy `runner build` step run in parallel with other production builds
# without cutting traffic over.
#
# Idempotent: safe to re-run for the same version (e.g. after a failed deploy).
#
# Usage:
#   ansible-playbook -i "host1,host2," playbooks/build-runner.yml \
#     -e "ansible_user=ubuntu" \
#     -e "official_runner_secret=xxx" \
#     -e "api_url=https://api.okou.ai" \
#     -e "runner_version=0.3.0" \
#     -e "r2_account_id=xxx" \
#     -e "r2_access_key_id=xxx" \
#     -e "r2_secret_access_key=xxx" \
#     -e "r2_bucket=xxx"
#
# Required Variables:
#   - runner_version: Semantic version of the runner being built, without leading v
#   - runner_target: Rust target triple for the copied runner binary
#   - official_runner_secret: Runner authentication secret (baked into config)
#   - api_url: Okou API URL (baked into config)
#   - r2_account_id / r2_access_key_id / r2_secret_access_key / r2_bucket:
#       Shared template cache credentials. Required so the pre-fan-out
#       warm step can fail visibly instead of allowing every host to rebuild
#       the same template locally.
#
# Optional Variables:
#   - okou_cli_package_url / okou_cli_manifest_url / okou_cli_package_sha256:
#       Versioned Okou CLI artifact (okou-cli/v<version>/) published for the
#       same release commit. When set, the artifact is staged under bin_dir and
#       `runner build` installs it into the rootfs so Pi runs exec the CLI
#       instead of installing it through npx (#35967). When unset, the rootfs
#       carries no CLI and the guest keeps the commit-addressed npx launch.

- name: Build Okou Runner
  hosts: all
  become: true

  vars:
    runner_release: "v{{ runner_version }}"
    runner_group: vm0/production
    data_dir: /var/lib/vm0-runner
    bin_dir: "{{ data_dir }}/bin/{{ runner_release }}"
    runner_dir: "{{ data_dir }}/runners/{{ runner_release }}"

  tasks:
    - name: Validate runner architecture
      include_tasks: ../tasks/validate-runner-architecture.yml

    # ========================================
    # Phase 1: Deploy binaries
    # ========================================
    - name: Ensure bin directory exists
      file:
        path: "{{ bin_dir }}"
        state: directory
        mode: "0755"

    - name: Copy runner binary (guest binaries are embedded)
      copy:
        src: "{{ playbook_dir }}/../../crates/target/{{ runner_target }}/release/runner"
        dest: "{{ bin_dir }}/"
        mode: "0755"

    - name: Stage versioned Okou CLI artifact
      when: okou_cli_package_url | default('') | length > 0
      block:
        - name: Ensure Okou CLI artifact directory exists
          file:
            path: "{{ bin_dir }}/okou-cli"
            state: directory
            mode: "0755"

        - name: Download Okou CLI package
          get_url:
            url: "{{ okou_cli_package_url }}"
            dest: "{{ bin_dir }}/okou-cli/package.tgz"
            checksum: "sha256:{{ okou_cli_package_sha256 }}"
            mode: "0644"

        - name: Download Okou CLI manifest
          get_url:
            url: "{{ okou_cli_manifest_url }}"
            dest: "{{ bin_dir }}/okou-cli/manifest.json"
            mode: "0644"
            force: true

    # ========================================
    # Phase 2: Setup + Build
    # ========================================
    - name: Download dependencies (Firecracker, kernel, mitmproxy)
      command: "{{ bin_dir }}/runner setup"

    - name: Warm shared template cache
      run_once: true
      command: >
        {{ bin_dir }}/runner build
        --profile vm0/default
        --warm-rootfs-cache
      environment:
        # Fail visibly if the shared R2 cache cannot be warmed. This prevents
        # every production host from stampeding into the slow local rootfs
        # template build path during a new template_hash deploy.
        R2_ACCOUNT_ID: "{{ r2_account_id | default('') }}"
        R2_ACCESS_KEY_ID: "{{ r2_access_key_id | default('') }}"
        R2_SECRET_ACCESS_KEY: "{{ r2_secret_access_key | default('') }}"
        R2_USER_STORAGES_BUCKET_NAME: "{{ r2_bucket | default('') }}"
      register: default_rootfs_warm_output

    - name: Build default rootfs and snapshot
      command: >
        {{ bin_dir }}/runner build
        --profile vm0/default
        {{ ('--okou-cli-artifact ' ~ bin_dir ~ '/okou-cli')
           if (okou_cli_package_url | default('') | length > 0) else '' }}
      environment:
        # R2 credentials so `runner build` can pull the warmed template
        # above instead of rebuilding it from scratch. The rootfs and
        # snapshot are created locally because they include guest binaries,
        # host CA, and host-specific snapshot state.
        R2_ACCOUNT_ID: "{{ r2_account_id | default('') }}"
        R2_ACCESS_KEY_ID: "{{ r2_access_key_id | default('') }}"
        R2_SECRET_ACCESS_KEY: "{{ r2_secret_access_key | default('') }}"
        R2_USER_STORAGES_BUCKET_NAME: "{{ r2_bucket | default('') }}"
      register: default_build_output

    - name: Parse default build hashes
      set_fact:
        default_rootfs_hash: "{{ default_build_output.stdout_lines | select('match', '^rootfs_hash=') | first | regex_replace('^rootfs_hash=', '') }}"
        default_snapshot_hash: "{{ default_build_output.stdout_lines | select('match', '^snapshot_hash=') | first | regex_replace('^snapshot_hash=', '') }}"

    # ========================================
    # Phase 3a: Configure (no service install)
    # ========================================
    # Writes runner.yaml to a per-version directory. Does not touch any
    # running service — the promote phase is responsible for systemd install.
    - name: Generate runner config
      command: >
        {{ bin_dir }}/runner config
        --profile vm0/default
        --rootfs-hash {{ default_rootfs_hash }}
        --snapshot-hash {{ default_snapshot_hash }}
        --hostname {{ inventory_hostname | quote }}
        --group {{ runner_group }}
        --runner-dirname {{ runner_release }}
        --api-url {{ api_url }}
        --token vm0_official_{{ official_runner_secret }}
      tags:
        - runner-config-attribution
