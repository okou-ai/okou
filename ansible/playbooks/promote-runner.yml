# Promote Okou Runner (Rust) — Traffic Cutover Phase
#
# This playbook activates a runner version that was previously prepared by
# `build-runner.yml`. It installs the systemd service (which starts the new
# runner and begins accepting jobs), verifies health, drains the previously
# active versions, and garbage-collects old artifacts.
#
# Preconditions (established by `build-runner.yml`):
#   - /var/lib/vm0-runner/bin/v{version}/runner exists and is executable
#   - /var/lib/vm0-runner/runners/v{version}/runner.yaml exists
#
# Usage:
#   ansible-playbook -i "host1,host2," playbooks/promote-runner.yml \
#     -e "ansible_user=ubuntu" \
#     -e "runner_version=0.3.0"
#
# Required Variables:
#   - runner_version: Semantic version of the runner being promoted, without leading v
#   - runner_target: Rust target triple for the staged runner binary
#
# Optional Variables:
#   - sentry_dsn: Forwarded to the systemd unit as SENTRY_DSN
#   - axiom_token_telemetry / axiom_dataset_suffix:
#       Forwarded to the systemd unit as AXIOM_TOKEN_TELEMETRY /
#       AXIOM_DATASET_SUFFIX. Both must be set for Axiom telemetry to activate.

- name: Promote Okou Runner
  hosts: all
  become: true

  vars:
    # Connection failures can replay the current task. Keep remote tasks
    # convergent or protect their complete operation with a stable lock.
    ansible_ssh_retries: 1
    runner_release: "v{{ runner_version }}"
    data_dir: /var/lib/vm0-runner
    bin_dir: "{{ data_dir }}/bin/{{ runner_release }}"
    runner_dir: "{{ data_dir }}/runners/{{ runner_release }}"

  tasks:
    - name: Validate runner architecture
      include_tasks: ../tasks/validate-runner-architecture.yml

    # ========================================
    # Phase 3b: Install systemd service (traffic cutover point)
    # ========================================
    - name: Install target runner and wait for readiness
      block:
        - name: Install and start runner service
          command: >
            {{ bin_dir }}/runner service install
            --name {{ runner_release }}
            --config {{ runner_dir }}/runner.yaml
            {% if sentry_dsn is defined and sentry_dsn %}
            --env SENTRY_DSN={{ sentry_dsn }}
            {% endif %}
            {% if axiom_token_telemetry is defined and axiom_token_telemetry %}
            --env AXIOM_TOKEN_TELEMETRY={{ axiom_token_telemetry }}
            {% endif %}
            {% if axiom_dataset_suffix is defined and axiom_dataset_suffix %}
            --env AXIOM_DATASET_SUFFIX={{ axiom_dataset_suffix }}
            {% endif %}

        # ========================================
        # Phase 4: Readiness + health check
        # ========================================
        - name: Wait for target runner readiness
          command: "{{ bin_dir }}/runner service wait-running --name {{ runner_release }} --timeout-secs 120"
          changed_when: false

        - name: Verify runner health
          command: "{{ bin_dir }}/runner doctor --name {{ runner_release }}"
      rescue:
        - name: Stop failed target runner service with runner cleanup
          command: "{{ bin_dir }}/runner service stop --name {{ runner_release }} --force --cleanup failed-start"
          failed_when: false

        - name: Fail promote after target runner readiness failure
          fail:
            msg: >-
              Runner {{ runner_release }} failed readiness or health checks.

    # ========================================
    # Phase 5: Drain old runners + Cleanup
    # ========================================
    - name: Initialize runner promotion warnings
      set_fact:
        runner_promotion_warnings: []

    - name: Find runner services to drain
      shell: |
        set -euo pipefail
        loaded_units="$(
          systemctl list-units 'vm0-runner-*.service' --all --plain --no-legend |
            awk '{print $1}'
        )"
        enabled_units="$(
          systemctl list-unit-files 'vm0-runner-*.service' --state=enabled,enabled-runtime --plain --no-legend |
            awk '{print $1}'
        )"
        printf '%s\n%s\n' "$loaded_units" "$enabled_units" |
          sed 's/^vm0-runner-//;s/\.service$//' |
          sed '/^$/d' |
          sort -u
      args:
        executable: /bin/bash
      register: runner_service_candidates
      changed_when: false
      failed_when: false

    - name: Record runner service discovery warning
      set_fact:
        runner_promotion_warnings: >-
          {{
            runner_promotion_warnings + [{
              'host': inventory_hostname,
              'service': 'vm0-runner-*.service',
              'version': 'unknown',
              'targetVersion': runner_release,
              'stage': 'discovery',
              'state': 'enumeration_failed',
              'returnCode': runner_service_candidates.rc,
              'error': (
                runner_service_candidates.stderr
                | default(runner_service_candidates.stdout, true)
                | default(runner_service_candidates.msg, true)
                | default('runner service discovery failed', true)
                | trim
              )
            }]
          }}
      when: runner_service_candidates.rc != 0

    - name: Drain old runner services
      command: "{{ bin_dir }}/runner service drain --name {{ item }}"
      loop: "{{ runner_service_candidates.stdout_lines | default([]) }}"
      when:
        - runner_service_candidates.rc == 0
        - item != runner_release
      register: runner_drain_results
      failed_when: false

    - name: Record old runner drain warnings
      set_fact:
        runner_promotion_warnings: >-
          {{
            runner_promotion_warnings + [{
              'host': inventory_hostname,
              'service': 'vm0-runner-' ~ item.item ~ '.service',
              'version': item.item,
              'targetVersion': runner_release,
              'stage': 'drain',
              'state': 'drain_failed',
              'returnCode': item.rc,
              'error': (
                item.stderr
                | default(item.stdout, true)
                | default(item.msg, true)
                | default('runner service drain failed', true)
                | trim
              )
            }]
          }}
      loop: "{{ runner_drain_results.results | default([]) }}"
      when:
        - not (item.skipped | default(false))
        - (item.rc | default(0) | int) != 0

    - name: Report runner promotion warnings
      debug:
        msg: "{{ item | to_json }}"
      loop: "{{ runner_promotion_warnings }}"

    - name: Write runner promotion warnings for the controller
      copy:
        content: "{{ runner_promotion_warnings | to_nice_json }}\n"
        dest: >-
          {{ promotion_warning_dir | default('') }}/{{ inventory_hostname | hash('sha256') }}.json
        mode: "0600"
      delegate_to: localhost
      become: false
      when:
        - (promotion_warning_dir | default('') | length) > 0
        - (runner_promotion_warnings | length) > 0

    - name: Garbage collect old artifacts
      include_tasks: ../tasks/garbage-collect-runner.yml

    # ========================================
    # Phase 6: Final health check
    # ========================================
    - name: Verify runner health after cleanup
      command: "{{ bin_dir }}/runner doctor --name {{ runner_release }}"
