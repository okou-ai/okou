[package]
name = "guest-channel-server"
version = "0.5.4"
edition.workspace = true
description = "Bounded native peer for the admitted sandbox application channel"

[dependencies]
api-contracts.workspace = true
base64 = { workspace = true, features = ["std"] }
guest-contracts.workspace = true
futures-util = { workspace = true, features = ["std", "async-await"] }
getrandom = { workspace = true, features = ["std"] }
libc = { workspace = true, features = ["std"] }
serde = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["rt", "net", "io-util", "sync", "time", "macros"] }
tokio-util = { workspace = true, features = ["rt"] }
uuid = { workspace = true, features = ["std"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "rt-multi-thread"] }
tempfile = { workspace = true, features = ["getrandom"] }

[lints]
workspace = true
