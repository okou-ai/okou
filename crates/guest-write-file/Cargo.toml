[package]
name = "guest-write-file"
version = "0.1.337"
edition.workspace = true
description = "Write guest files from stdin without shell startup overhead"

[dependencies]
guest-contracts.workspace = true
libc = { workspace = true, features = ["std"] }
guest-control-proto.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["fs"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { workspace = true, features = ["fs", "std"] }

[dev-dependencies]
cli-test-support = { workspace = true, features = ["test-support"] }
tempfile = { workspace = true, features = ["getrandom"] }

[lints]
workspace = true
