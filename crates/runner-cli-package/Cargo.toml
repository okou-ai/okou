[package]
name = "runner-cli-package"
version = "0.1.0"
edition.workspace = true
description = "Bounded CLI package identity decoding for Runner compilation and rootfs staging"

[dependencies]
flate2 = { workspace = true, features = ["runtime_detection", "rust_backend"] }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true, features = ["std"] }
tar = { workspace = true, features = ["xattr"] }

[lints]
workspace = true
