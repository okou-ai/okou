[package]
name = "runner"
version = "0.191.2"
edition.workspace = true

[dependencies]
ably-subscriber = { workspace = true }
api-contracts.workspace = true
guest-contracts.workspace = true
process-control-ipc.workspace = true
sandbox = { workspace = true }
nbd-cow = { workspace = true }
sandbox-firecracker = { workspace = true }
shell-quote = { workspace = true }

async-trait = { workspace = true }
aws-sdk-s3 = { workspace = true, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
base64 = { workspace = true, features = ["simd-unsafe", "std"] }
bytes = { workspace = true, features = ["std"] }
chrono = { workspace = true, features = ["now", "serde"] }
clap = { workspace = true, features = ["color", "derive", "env", "error-context", "help", "std", "suggestions", "usage"] }
nix = { workspace = true, features = ["fs", "inotify", "process", "signal", "user"] }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true, features = ["std"] }
serde_path_to_error = { workspace = true }
serde_yaml_ng = { workspace = true }
thiserror = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { workspace = true, features = ["io", "io-util", "rt"] }
tracing = { workspace = true, features = ["attributes", "std"] }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true, features = ["ansi", "fmt", "smallvec", "std", "tracing-log"] }
flate2 = { workspace = true, features = ["runtime_detection", "rust_backend"] }
futures-util = { workspace = true, features = ["async-await", "async-await-macro", "std"] }
hyper = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls"] }
rustix = { workspace = true, features = ["fs", "linux_4_11", "process", "std", "time"] }
hex = { workspace = true, features = ["std"] }
idna = { workspace = true, features = ["compiled_data", "std"] }
libc = { workspace = true, features = ["std"] }
sha2 = { workspace = true, features = ["alloc", "oid"] }
tar = { workspace = true, features = ["xattr"] }
tempfile = { workspace = true, features = ["getrandom"] }
unicode-normalization = { workspace = true, features = ["std"] }
url = { workspace = true, features = ["std"] }
uuid = { workspace = true, features = ["serde", "std", "v4", "v5"] }
sentry = { workspace = true, features = ["panic"] }
which = { workspace = true, features = ["real-sys"] }
zstd = { workspace = true, features = ["zstdmt"] }
guest-control-proto = { workspace = true }
runner-rpc-proto = { workspace = true }
russh = { workspace = true, features = ["ring", "rsa"] }
pkcs8 = { workspace = true, features = ["encryption", "std"] }
pkcs5 = { workspace = true, features = ["alloc", "pbes2"] }
rsa = { workspace = true, features = ["encoding", "std"] }
zeroize = { workspace = true, features = ["alloc"] }

[build-dependencies]
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true, features = ["std"] }

# Guest crates are also dev-dependencies for release-please version tracking:
# cargo-workspace plugin includes dev-dependencies in its dependency graph,
# so runner-rs gets auto-bumped when any guest crate version changes.
[dev-dependencies]
guest-control-client = { workspace = true }
log = { workspace = true }
tracing-log = { workspace = true, features = ["log-tracer", "std"] }
# `test-util` feature exposes `with_test_defaults_v2()` on `aws_sdk_s3::Config`,
# which `aws_smithy_mocks::mock_client!` needs. Feature applies only to the
# test build — no impact on the production binary.
aws-sdk-s3 = { workspace = true, features = ["test-util"] }
aws-smithy-mocks = { workspace = true }
guest-agent = { workspace = true }
guest-storage-apply = { workspace = true }
guest-init = { workspace = true }
claude-mock = { workspace = true }
codex-mock = { workspace = true }
guest-state-restore = { workspace = true }
guest-tool-exec = { workspace = true }
runner-rpc-client = { workspace = true }
guest-write-file = { workspace = true }
guest-workspace-mount = { workspace = true }
httpmock = { workspace = true, features = ["cookies"] }
http-body = { workspace = true }
sandbox-mock = { workspace = true }
tokio = { workspace = true, features = ["process", "test-util"] }
tracing-test-support.workspace = true

[lints]
workspace = true
