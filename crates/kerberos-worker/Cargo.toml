[package]
name = "kerberos-worker"
version = "0.2.0"
edition.workspace = true
publish = false
description = "Private bounded MIT Kerberos worker and caller-owned KDC exchange"

[dependencies]
kerberos-credentials = { workspace = true }
rustix = { workspace = true, features = ["fs", "process", "std"] }
sha2 = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["sync", "time", "rt"] }
zeroize = { workspace = true, features = ["alloc"] }

[build-dependencies]
sha2 = { workspace = true }

[dev-dependencies]
rustix = { workspace = true, features = ["event"] }
tokio = { workspace = true, features = ["macros", "rt", "time"] }

[lints]
workspace = true
