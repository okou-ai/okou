[workspace]
resolver = "3"
members = [
    "ably-subscriber",
    "api-contracts",
    "guest-agent",
    "guest-contracts",
    "session-history-selector",
    "runner-rpc-client",
    "guest-tool-exec",
    "process-control-ipc",
    "process-launch",
    "guest-telemetry",
    "guest-storage-apply",
    "guest-init",
    "claude-mock",
    "codex-mock",
    "guest-state-restore",
    "guest-write-file",
    "guest-workspace-mount",
    "linux-mountinfo",
    "nbd-cow",
    "runner",
    "sandbox",
    "sandbox-firecracker",
    "sandbox-mock",
    "shell-quote",
    "runner-rpc-proto",
    "rfb-client",
    "tracing-test-support",
    "guest-control-server",
    "guest-control-client",
    "guest-control-proto",
    "guest-control-tests",
    "xtask",
]

[workspace.package]
edition = "2024"

[workspace.dependencies]
# Internal crates
ably-subscriber = { path = "ably-subscriber" }
api-contracts = { path = "api-contracts" }
guest-agent = { path = "guest-agent" }
guest-contracts = { path = "guest-contracts" }
session-history-selector = { path = "session-history-selector" }
runner-rpc-client = { path = "runner-rpc-client" }
guest-tool-exec = { path = "guest-tool-exec" }
process-control-ipc = { path = "process-control-ipc" }
process-launch = { path = "process-launch" }
guest-telemetry = { path = "guest-telemetry" }
guest-storage-apply = { path = "guest-storage-apply" }
guest-init = { path = "guest-init" }
claude-mock = { path = "claude-mock" }
codex-mock = { path = "codex-mock" }
guest-state-restore = { path = "guest-state-restore" }
guest-write-file = { path = "guest-write-file" }
guest-workspace-mount = { path = "guest-workspace-mount" }
linux-mountinfo = { path = "linux-mountinfo" }
nbd-cow = { path = "nbd-cow" }
sandbox = { path = "sandbox" }
sandbox-firecracker = { path = "sandbox-firecracker" }
sandbox-mock = { path = "sandbox-mock" }
shell-quote = { path = "shell-quote" }
runner-rpc-proto = { path = "runner-rpc-proto" }
tracing-test-support = { path = "tracing-test-support" }
guest-control-server = { path = "guest-control-server" }
guest-control-client = { path = "guest-control-client" }
guest-control-proto = { path = "guest-control-proto" }

# External dependencies
# Keep versions here and select features explicitly in each consuming crate.
aho-corasick = { version = "1", default-features = false }
async-trait = { version = "0.1", default-features = false }
aws-sdk-s3 = { version = "1", default-features = false }
aws-smithy-mocks = { version = "0.3", default-features = false }
base64 = { version = "0.23", default-features = false }
bitvec = { version = "1", default-features = false }
bytes = { version = "1", default-features = false }
chrono = { version = "0.4", default-features = false }
clap = { version = "4", default-features = false }
des = { version = "0.9", default-features = false }
flate2 = { version = "1", default-features = false }
futures-util = { version = "0.3", default-features = false }
hex = { version = "0.4", default-features = false }
hmac = { version = "0.13.0", default-features = false }
http-body = { version = "1", default-features = false }
httpmock = { version = "0.8", default-features = false }
hyper = { version = "1", default-features = false }
idna = { version = "1", default-features = false }
libc = { version = "0.2", default-features = false }
log = { version = "0.4", default-features = false }
nix = { version = "0.31", default-features = false }
pin-project-lite = { version = "0.2", default-features = false }
pkcs5 = { version = "0.8", default-features = false }
pkcs8 = { version = "0.11", default-features = false }
png = { version = "0.18", default-features = false }
proc-macro2 = { version = "1", default-features = false }
proptest = { version = "1", default-features = false }
rcgen = { version = "0.14", default-features = false }
reqwest = { version = "0.13", default-features = false }
rmp-serde = { version = "1", default-features = false }
rmpv = { version = "1", default-features = false }
roxmltree = { version = "0.21", default-features = false }
rsa = { version = "=0.10.0-rc.18", default-features = false }
russh = { version = "=0.63.3", default-features = false }
rustix = { version = "1", default-features = false }
rustls = { version = "0.23", default-features = false }
sentry = { version = "0.49", default-features = false }
serde = { version = "1", default-features = false }
serde_json = { version = "1", default-features = false }
serde_path_to_error = { version = "0.1", default-features = false }
serde_yaml_ng = { version = "0.10", default-features = false }
sha2 = { version = "0.11", default-features = false }
tar = { version = "0.4", default-features = false }
tempfile = { version = "3", default-features = false }
thiserror = { version = "2", default-features = false }
tokio = { version = "1", default-features = false }
tokio-rustls = { version = "0.26", default-features = false }
tokio-tungstenite = { version = "0.30", default-features = false }
tokio-util = { version = "0.7", default-features = false }
tracing = { version = "0.1", default-features = false }
tracing-appender = { version = "0.2", default-features = false }
tracing-log = { version = "0.2", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false }
trybuild = { version = "1", default-features = false }
unicode-normalization = { version = "0.1", default-features = false }
ureq = { version = "3", default-features = false }
url = { version = "2", default-features = false }
uuid = { version = "1", default-features = false }
webpki-roots = { version = "1", default-features = false }
which = { version = "8", default-features = false }
zeroize = { version = "1", default-features = false }
zstd = { version = "0.14", default-features = false }

# Keep routine local validation usable in constrained environments while
# retaining source locations in backtraces.
[profile.local]
inherits = "dev"
debug = "line-tables-only"
incremental = false

[profile.release]
lto = true
strip = true
codegen-units = 1

# Faster runner image build profile for CI and local dev-runner deploys.
# Production runner releases still use the release profile.
[profile.ci]
inherits = "release"
lto = "thin"
codegen-units = 4

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.rustdoc]
bare_urls = "deny"
broken_intra_doc_links = "deny"
invalid_codeblock_attributes = "deny"
invalid_html_tags = "deny"
invalid_rust_codeblocks = "deny"
private_intra_doc_links = "deny"
redundant_explicit_links = "deny"

# See clippy.toml for test-specific overrides (allow-unwrap-in-tests etc.)
[workspace.lints.clippy]
all = "deny"
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
