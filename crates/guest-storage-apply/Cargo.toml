[package]
name = "guest-storage-apply"
version = "0.31.6"
edition.workspace = true

[dependencies]
flate2 = { workspace = true, features = ["runtime_detection", "rust_backend"] }
guest-contracts.workspace = true
libc = { workspace = true, features = ["std"] }
linux-mountinfo.workspace = true
roxmltree = { workspace = true, features = ["std"] }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true, features = ["std"] }
tar = { workspace = true, features = ["xattr"] }
ureq = { workspace = true, features = ["gzip", "platform-verifier", "rustls"] }
uuid = { workspace = true, features = ["std", "v4"] }
sha2.workspace = true
hex = { workspace = true, features = ["alloc"] }
tempfile = { workspace = true, features = ["getrandom"] }
guest-telemetry.workspace = true

[dev-dependencies]
cli-test-support = { workspace = true, features = ["test-support"] }
httpmock = { workspace = true, features = ["cookies"] }
proptest = { workspace = true, features = ["std"] }

[lints]
workspace = true
