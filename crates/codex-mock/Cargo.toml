[package]
name = "codex-mock"
version = "0.12.115"
edition.workspace = true

[dependencies]
chrono = { workspace = true, features = ["clock"] }
clap = { workspace = true, features = ["color", "derive", "error-context", "help", "std", "suggestions", "usage"] }
guest-contracts.workspace = true
libc = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std"] }
uuid = { workspace = true, features = ["std", "v7"] }

[dev-dependencies]
cli-test-support = { workspace = true, features = ["test-support"] }
tempfile = { workspace = true, features = ["getrandom"] }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["fs"] }

[target.'cfg(unix)'.dev-dependencies]
rustix = { workspace = true, features = ["process", "std"] }

[lints]
workspace = true
