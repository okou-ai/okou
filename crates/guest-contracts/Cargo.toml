[package]
name = "guest-contracts"
version = "0.32.6"
edition.workspace = true
description = "Shared contracts between runner and guest binaries"

[dependencies]
api-contracts.workspace = true
base64 = { workspace = true, features = ["simd-unsafe", "std"] }
chrono = { workspace = true, features = ["alloc"] }
libc = { workspace = true, features = ["std"] }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true, features = ["std"] }
uuid = { workspace = true, features = ["std", "v4", "serde"] }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["fs"] }

[dev-dependencies]
tempfile = { workspace = true, features = ["getrandom"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
cli-test-support = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
