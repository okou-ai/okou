[package]
name = "guest-agent"
version = "0.89.6"
edition.workspace = true

[dependencies]
aho-corasick = { workspace = true, features = ["perf-literal", "std"] }
api-contracts.workspace = true
base64 = { workspace = true, features = ["simd-unsafe", "std"] }
bytes = { workspace = true, features = ["std"] }
chrono = { workspace = true, features = ["clock"] }
flate2 = { workspace = true, features = ["runtime_detection", "rust_backend"] }
futures-util = { workspace = true, features = ["async-await", "async-await-macro", "std"] }
process-control-ipc.workspace = true
guest-contracts.workspace = true
guest-telemetry.workspace = true
session-history-selector.workspace = true
http-body = { workspace = true }
libc = { workspace = true, features = ["std"] }
pin-project-lite = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls"] }
rustix = { workspace = true, features = ["fs", "linux_4_11", "process", "std"] }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true, features = ["raw_value", "std"] }
hex = { workspace = true, features = ["std"] }
sha2 = { workspace = true, features = ["alloc", "oid"] }
tempfile = { workspace = true, features = ["getrandom"] }
thiserror = { workspace = true, features = ["std"] }
tar = { workspace = true, features = ["xattr"] }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-util.workspace = true
uuid = { workspace = true, features = ["std", "v4", "v5"] }
zstd.workspace = true

[dev-dependencies]
httpmock = { workspace = true, features = ["cookies"] }
nix = { workspace = true, features = ["inotify", "process"] }
shell-quote.workspace = true
tokio = { workspace = true, features = ["test-util"] }
guest-control-client.workspace = true
guest-control-server = { workspace = true, features = ["test-support"] }
guest-control-proto.workspace = true

[[test]]
name = "integration"
path = "tests/integration.rs"

[[example]]
name = "pi_memory_citation_bench"
path = "src/cli/pi_memory_citation_bench.rs"

[lints]
workspace = true
