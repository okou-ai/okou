[package]
name = "runner-supervisor"
version = "0.6.2"
edition.workspace = true
description = "Runner start-loop idle, finalization, heartbeat, and orphan orchestration"

[features]
test-support = []

[dependencies]
api-contracts.workspace = true
async-trait.workspace = true
guest-contracts.workspace = true
hex = { workspace = true, features = ["std"] }
reqwest = { workspace = true, features = ["json", "rustls"] }
chrono = { workspace = true, features = ["now"] }
runner-executor.workspace = true
runner-host.workspace = true
runner-lifecycle.workspace = true
runner-network.workspace = true
runner-provider.workspace = true
runner-remote.workspace = true
runner-storage.workspace = true
runner-types.workspace = true
sandbox.workspace = true
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true, features = ["std"] }
sha2 = { workspace = true, features = ["alloc", "oid"] }
url = { workspace = true, features = ["std"] }
uuid = { workspace = true, features = ["serde", "std", "v4"] }
tokio-tungstenite = { workspace = true, features = ["handshake"] }
futures-util = { workspace = true, features = ["async-await", "sink", "std"] }
thiserror = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing = { workspace = true, features = ["std"] }

[dev-dependencies]
flate2 = { workspace = true, features = ["runtime_detection", "rust_backend"] }
libc = { workspace = true, features = ["std"] }
zstd = { workspace = true, features = ["zstdmt"] }
httpmock = { workspace = true, features = ["cookies"] }
runner-host = { workspace = true, features = ["test-support"] }
runner-executor = { workspace = true, features = ["test-support"] }
runner-lifecycle = { workspace = true, features = ["test-support"] }
runner-network = { workspace = true, features = ["test-support"] }
runner-storage = { workspace = true, features = ["test-support"] }
sandbox-mock.workspace = true
tempfile = { workspace = true, features = ["getrandom"] }
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber = { workspace = true, features = ["fmt", "std"] }
tracing-test-support.workspace = true

[lints]
workspace = true
