[package]
name = "claude-mock"
version = "0.22.145"
edition.workspace = true

[dependencies]
api-contracts.workspace = true
guest-contracts.workspace = true
libc = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std"] }
uuid = { workspace = true, features = ["std", "v7"] }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["process", "std", "time"] }

[dev-dependencies]
cli-test-support = { workspace = true, features = ["test-support"] }
tempfile = { workspace = true, features = ["getrandom"] }

[lints]
workspace = true
