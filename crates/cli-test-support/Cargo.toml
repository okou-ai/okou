[package]
name = "cli-test-support"
version = "0.1.1"
edition.workspace = true
description = "Shared CLI process, HTTP and mock-build fixtures for Rust tests"
publish = false

[features]
test-support = [
    "dep:aho-corasick",
    "dep:base64",
    "dep:flate2",
    "dep:libc",
    "dep:nix",
    "dep:rustix",
    "dep:serde",
    "dep:serde_json",
    "dep:shell-quote",
    "dep:tokio",
]

[dependencies]
aho-corasick = { workspace = true, optional = true, features = ["perf-literal", "std"] }
base64 = { workspace = true, optional = true, features = ["simd-unsafe", "std"] }
flate2 = { workspace = true, optional = true, features = ["runtime_detection", "rust_backend"] }
libc = { workspace = true, optional = true, features = ["std"] }
nix = { workspace = true, optional = true, features = ["inotify", "process"] }
rustix = { workspace = true, optional = true, features = ["process", "std"] }
serde = { workspace = true, optional = true, features = ["derive", "std"] }
serde_json = { workspace = true, optional = true, features = ["raw_value", "std"] }
shell-quote = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["fs", "io-util", "macros", "net", "process", "rt", "sync", "time"] }

[lints]
workspace = true
