[package]
name = "guest-control-client"
version = "0.20.6"
edition.workspace = true
description = "Runner-side client for controlling guest operations"

[dependencies]
guest-contracts.workspace = true
nix = { workspace = true, features = ["net"] }
sandbox.workspace = true
serde_json = { workspace = true, features = ["std"] }
shell-quote.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "rt", "sync", "time"] }
tracing = { workspace = true, features = ["attributes", "std"] }
uuid = { workspace = true, features = ["std", "v4"] }
guest-control-proto.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber = { workspace = true, features = ["ansi", "fmt", "smallvec", "std", "tracing-log"] }
tracing-test-support.workspace = true

[lints]
workspace = true
