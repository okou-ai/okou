name: turbo-test-migrate
"on":
  workflow_call:
    inputs:
      dependencies:
        type: string
        required: true
env:
  npm_config_audit: "false"
jobs:
  test-migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: ghcr.io/${{ github.repository_owner }}/vm0-toolchain:20261009
    services:
      postgres:
        image: ghcr.io/${{ github.repository_owner }}/pgvector@sha256:d229d4e975e7102b7df031cbfcf5c4463ee21c84d0373d7a736191a2603dddfd
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 5 --health-start-period 3s
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - uses: ./.github/actions/toolchain-init
      - name: Prompt for JSONB Contract Changes
        run: |
          BASE_REF="${{ fromJSON(inputs.dependencies).prepare.outputs.base-ref }}"
          CHANGED=$(git diff --name-only "$BASE_REF" -- \
            'turbo/packages/db/src/jsonb-contracts/**')

          if [ -n "$CHANGED" ]; then
            echo "::warning title=Persistent JSONB contracts changed::Review production compatibility before merging."
            echo ""
            echo "Persistent JSONB contract files changed:"
            echo "$CHANGED"
            echo ""
            echo "Before merging, confirm:"
            echo "- Existing production rows remain readable by new API code."
            echo "- Removed/renamed keys have read-time normalization or a data migration."
            echo "- Strict response schemas tolerate legacy persisted rows, or legacy rows are migrated."
            echo "- Regression tests cover any legacy persisted JSON shape that should remain readable."
          fi
      - name: Check JSONB Contract Usage
        working-directory: turbo/packages/db
        run: pnpm lint:jsonb-contracts
      - name: Check Migration Immutability
        if: vars.CI_CHECK_IMMUTABLE_MIGRATE != '0'
        run: |
          BASE_REF="${{ fromJSON(inputs.dependencies).prepare.outputs.base-ref }}"
          MIGRATION_BASELINE=1078
          # The squashed baseline and its history may be removed. Migrations after
          # the baseline must not be deleted once they land on main.
          DELETED=$(git diff --diff-filter=D --name-only "$BASE_REF" -- \
            'turbo/packages/db/src/migrations/*.sql' \
            'turbo/packages/db/src/migrations/meta/*_snapshot.json' | \
            awk -v baseline="$MIGRATION_BASELINE" '
              {
                name = $0
                sub(/^.*\//, "", name)
                if (name !~ /^[0-9][0-9][0-9][0-9]_/) {
                  print
                  next
                }
                if ((substr(name, 1, 4) + 0) > baseline) {
                  print
                }
              }
            ')

          # Migration SQL and snapshots are append-only at every index, including
          # the baseline.
          MODIFIED=$(git diff --diff-filter=M --name-only "$BASE_REF" -- \
            'turbo/packages/db/src/migrations/*.sql' \
            'turbo/packages/db/src/migrations/meta/*_snapshot.json')

          # _journal.json is modified on every new migration, so only flag deletion
          DELETED_JOURNAL=$(git diff --diff-filter=D --name-only "$BASE_REF" -- \
            'turbo/packages/db/src/migrations/meta/_journal.json')

          FAILED=0
          if [ -n "$DELETED" ]; then
            echo "::error::Migration files above baseline $MIGRATION_BASELINE must not be deleted once on main:"
            echo "$DELETED"
            FAILED=1
          fi
          if [ -n "$MODIFIED" ]; then
            echo "::error::Migration files must never be modified once on main:"
            echo "$MODIFIED"
            FAILED=1
          fi
          if [ -n "$DELETED_JOURNAL" ]; then
            echo "::error::Migration journal must not be deleted:"
            echo "$DELETED_JOURNAL"
            FAILED=1
          fi
          if [ "$FAILED" -eq 1 ]; then
            echo ""
            echo "These files may already be deployed to production."
            echo "Create a NEW migration instead of modifying existing ones."
            exit 1
          fi
      - name: Install PostgreSQL client for audit script tests
        run: apt-get update && apt-get install -y --no-install-recommends postgresql-client
      - name: Test Migration Consistency
        working-directory: turbo/packages/db
        env:
          DATABASE_URL: postgresql://postgres@postgres:5432/postgres
        run: pnpm test:migration-consistency
    permissions:
      actions: read
      contents: read
      deployments: write
      id-token: write
      issues: write
      pull-requests: write
