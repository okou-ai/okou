name: Cleanup Clerk Test Resources

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Dry-run mode (no actual deletions)"
        type: boolean
        default: false

concurrency:
  group: cleanup-clerk-test-resources
  cancel-in-progress: false

env:
  npm_config_audit: "false"
  DRY_RUN: ${{ inputs.dry-run || false }}

jobs:
  cleanup-clerk-test-resources:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Install pnpm
        run: corepack enable pnpm
      - name: Install E2E dependencies
        run: cd e2e && pnpm install --frozen-lockfile
      - name: Delete stale Clerk test resources
        run: >-
          cd e2e && pnpm exec tsx playwright/clerk-test-resources.ts
          cleanup-stale
          browser,playwright,paid-onboarding,runner,runner-real-codex,runner-real-claude,runner-mock-claude,runner-real-codex-built-in
          --ci-older-than-hours 2
          --staging-browser-older-than-hours 8
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          DRY_RUN: ${{ env.DRY_RUN }}
