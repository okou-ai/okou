name: Deploy Link Approval Workflow

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target GitHub and Cloudflare environment"
        type: choice
        options: [test, production]
        default: test
        required: true
      enable_approval:
        description: "Enable only after the migration and API are deployed and older API instances have drained"
        type: boolean
        default: false
        required: true

permissions:
  contents: read

env:
  npm_config_audit: "false"

concurrency:
  group: deploy-link-approval-${{ inputs.environment }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    container:
      image: ghcr.io/${{ github.repository_owner }}/vm0-toolchain:20261023
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/toolchain-init
      - name: Build without deployment
        working-directory: turbo
        run: pnpm --filter @okouai/link-approval-worker run build
      - name: Fetch integration configuration from Doppler
        id: doppler
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534 # v2.0.0
        with:
          auth-method: oidc
          doppler-identity-id: ${{ vars.DOPPLER_SERVICE_IDENTITY_ID }}
          doppler-project: vm0
          doppler-config: ${{ inputs.environment == 'production' && 'prd' || 'dev' }}
      - name: Deploy with private bindings
        env:
          APPROVAL_ENVIRONMENT: ${{ inputs.environment }}
          APPROVAL_ENABLED: ${{ inputs.enable_approval }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_WORKER_DEPLOY_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          LINK_APPROVAL_WORKER_SECRET: ${{ steps.doppler.outputs.LINK_APPROVAL_WORKER_SECRET }}
          LINK_APPROVAL_CONTROL_SECRET: ${{ steps.doppler.outputs.LINK_APPROVAL_CONTROL_SECRET }}
          LINK_APPROVAL_API_ORIGIN: ${{ steps.doppler.outputs.LINK_APPROVAL_API_ORIGIN }}
        run: bash .github/scripts/deploy-link-approval.sh "$APPROVAL_ENVIRONMENT" "$APPROVAL_ENABLED"
