name: iOS Build Cache

# Refill shared caches from main; completed native CI also heals evicted entries.
on:
  push:
    branches: [main]
    paths:
      - ios/**
      - .github/workflows/ios.yml
      - .github/workflows/ios-build-cache.yml
      - .github/actions/setup-ios-build-cache/**
  workflow_run:
    workflows: [iOS]
    types: [completed]
  workflow_dispatch:
    inputs:
      package_compiler_probe:
        description: Inspect native SwiftPM compiler cache support
        type: boolean
        default: false
      package_cache_feasibility:
        description: Exercise package object reuse with freshly linked test bundles
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

env:
  npm_config_audit: "false"
  DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
  IOS_TEST_DESTINATION: platform=iOS Simulator,name=iPhone 18 Pro,OS=27.0
  IOS_BUILD_CACHE_ENABLED: "true"
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: http.version
  GIT_CONFIG_VALUE_0: HTTP/1.1

jobs:
  package-cache-feasibility:
    if: github.event_name == 'workflow_dispatch' && inputs.package_cache_feasibility
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Qualify object replay with freshly linked test bundles
        run: python3 ops/ios-ci/package-cache-feasibility.py
      - name: Retain package cache feasibility evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-cache-feasibility-${{ github.run_id }}
          path: ${{ runner.temp }}/package-cache-feasibility
          if-no-files-found: error
          retention-days: 1

  package-compiler-probe:
    if: github.event_name == 'workflow_dispatch' && inputs.package_compiler_probe
    runs-on: xcode-27
    timeout-minutes: 5
    steps:
      - name: Read SwiftPM and compiler capabilities
        run: |
          mkdir "$RUNNER_TEMP/package-compiler-probe"
          xcrun swift --version > "$RUNNER_TEMP/package-compiler-probe/swift-version.txt"
          xcrun swift test --help > "$RUNNER_TEMP/package-compiler-probe/swift-test-help.txt"
          xcrun swiftc -help-hidden > "$RUNNER_TEMP/package-compiler-probe/swiftc-help.txt"
          xcrun clang -cc1 -help > "$RUNNER_TEMP/package-compiler-probe/clang-help.txt"
          xcrun --sdk macosx --show-sdk-build-version > "$RUNNER_TEMP/package-compiler-probe/macos-sdk-build.txt"
          xcodebuild -version > "$RUNNER_TEMP/package-compiler-probe/xcode-version.txt"
          sw_vers > "$RUNNER_TEMP/package-compiler-probe/macos-version.txt"
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "package-compiler-probe"
          results = []
          for label, arguments in [
              ("swift-test-hidden-help", ["xcrun", "swift", "test", "--help-hidden"]),
              ("swift-package-build-cache-help", ["xcrun", "swift", "package", "build-cache", "--help"]),
          ]:
              result = subprocess.run(arguments, capture_output=True, text=True)
              (root / (label + ".txt")).write_text(result.stdout + result.stderr)
              results.append({"command": arguments, "exit_code": result.returncode})
          (root / "extended-probe-status.json").write_text(json.dumps(results, indent=2))
          PY
      - name: Upload compiler capability evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-compiler-probe-${{ github.run_id }}
          path: ${{ runner.temp }}/package-compiler-probe
          if-no-files-found: error
          retention-days: 1

  detect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      needed: ${{ steps.decision.outputs.needed }}
    steps:
      - name: Select completed native builds
        id: decision
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          needed=true
          if [[ "$EVENT_NAME" == workflow_run ]]; then
            needed=false
            if [[ "$SOURCE_REPOSITORY" == "$GITHUB_REPOSITORY" ]]; then
              needed=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/jobs?per_page=100" \
                --jq 'any(.jobs[]; .name == "build-test" and .conclusion != "skipped" and .runner_id > 0)')
            fi
          fi
          echo "needed=$needed" >> "$GITHUB_OUTPUT"

  dispatch:
    needs: detect
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_run' && needs.detect.outputs.needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch trusted main cache refill
        env:
          GH_TOKEN: ${{ github.token }}
        # workflow_run has read-only cache access; workflow_dispatch can write.
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/ios-build-cache.yml/dispatches" \
            -f ref=main

  warm:
    needs: detect
    if: github.ref == 'refs/heads/main' && github.event_name != 'workflow_run' && needs.detect.outputs.needed == 'true'
    runs-on: xcode-27
    # Preserve main's cold-seeding budget, including compiler-cache upload.
    timeout-minutes: 30
    # Let an active writer finish. Only selected warmers enter this queue.
    concurrency:
      group: ios-build-cache-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # workflow_run uses the trusted main revision, never its PR head/artifacts.
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Restore native cache
        id: cache
        uses: ./.github/actions/setup-ios-build-cache
      - name: Prepare locked dependencies
        id: prepare
        if: steps.cache.outputs.dependencies-hit != 'true' || steps.cache.outputs.compilation-hit != 'true'
        run: bash ios/scripts/ci-test.sh prepare
      - name: Save main SwiftPM cache
        id: save-dependencies
        if: steps.cache.outputs.dependencies-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.cache.outputs.dependencies-path }}
          key: ${{ steps.cache.outputs.dependencies-key }}
      - name: Verify main SwiftPM cache
        id: verify-dependencies
        if: steps.cache.outputs.dependencies-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.cache.outputs.dependencies-path }}
          key: ${{ steps.cache.outputs.dependencies-key }}
          lookup-only: true
          fail-on-cache-miss: true
      - name: Prepare compiler cache
        id: compile
        if: steps.cache.outputs.compilation-hit != 'true'
        run: |
          sysctl hw.ncpu hw.memsize
          vm_stat
          bash ios/scripts/ci-test.sh compile
          vm_stat
      - name: Save main Xcode compilation cache
        id: save-compilation
        if: steps.cache.outputs.compilation-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.cache.outputs.compilation-path }}
          key: ${{ steps.cache.outputs.compilation-key }}
      - name: Verify main Xcode compilation cache
        id: verify-compilation
        if: steps.cache.outputs.compilation-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.cache.outputs.compilation-path }}
          key: ${{ steps.cache.outputs.compilation-key }}
          lookup-only: true
          fail-on-cache-miss: true

  warm-archive:
    needs: detect
    if: github.ref == 'refs/heads/main' && github.event_name != 'workflow_run' && needs.detect.outputs.needed == 'true'
    runs-on: xcode-27
    timeout-minutes: 15
    concurrency:
      group: ios-archive-cache-main
      cancel-in-progress: false
    env:
      IOS_ARCHIVE_CACHE_ENABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Configure Release archive workspace
        run: echo "IOS_ARCHIVE_DIR=$RUNNER_TEMP/okou-ios-promotion" >> "$GITHUB_ENV"
      - name: Restore Release archive caches
        id: cache
        uses: ./.github/actions/setup-ios-build-cache
        with:
          target: archive
      - name: Build and validate main Release archive caches
        id: compile
        if: steps.cache.outputs.dependencies-hit != 'true' || steps.cache.outputs.compilation-hit != 'true'
        run: bash ios/scripts/build-archive.sh
      - name: Save main Release dependencies
        id: save-dependencies
        if: steps.cache.outputs.dependencies-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.cache.outputs.dependencies-path }}
          key: ${{ steps.cache.outputs.dependencies-key }}
      - name: Verify main Release dependency cache
        id: verify-dependencies
        if: steps.cache.outputs.dependencies-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.cache.outputs.dependencies-path }}
          key: ${{ steps.cache.outputs.dependencies-key }}
          lookup-only: true
          fail-on-cache-miss: true
      - name: Save main Release compilation cache
        id: save-compilation
        if: steps.cache.outputs.compilation-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.cache.outputs.compilation-path }}
          key: ${{ steps.cache.outputs.compilation-key }}
      - name: Verify main Release compilation cache
        id: verify-compilation
        if: steps.cache.outputs.compilation-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.cache.outputs.compilation-path }}
          key: ${{ steps.cache.outputs.compilation-key }}
          lookup-only: true
          fail-on-cache-miss: true
