name: Runner Profile Benchmark

# Diagnostic lanes never feed the runner artifact/deploy DAG or merge-group gates.
on:
  pull_request:
    paths:
      - ".github/workflows/runner-profile-benchmark.yml"
      - ".github/scripts/runner-profile-benchmark/**"
      - ".github/scripts/tests/runner-profile-benchmark-test.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runner-profile-benchmark-${{ github.ref }}
  cancel-in-progress: true

env:
  npm_config_audit: "false"

jobs:
  cli:
    name: Prepare benchmark CLI input
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: turbo/pnpm-lock.yaml
      - name: Build private CLI input
        env:
          SOURCE_SHA: ${{ github.sha }}
          DEFAULT_SENTRY_DSN: ${{ vars.SENTRY_DSN_CLI }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          (cd turbo && pnpm install --frozen-lockfile --filter @okouai/cli...)
          (cd turbo && pnpm --filter @okouai/cli build)
          bash .github/scripts/build-okou-cli-artifact.sh "$SOURCE_SHA" runner-profile-cli
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runner-profile-cli-${{ github.run_id }}
          path: |
            runner-profile-cli/package.tgz
            runner-profile-cli/manifest.json
            runner-profile-cli/ready.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  measure:
    name: Measure ${{ matrix.target }} / ${{ matrix.profile }}
    needs: [cli]
    runs-on: ubuntu-latest-8-cores
    container:
      image: ghcr.io/${{ github.repository_owner }}/vm0-toolchain-rust:20261009
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-unknown-linux-musl, x86_64-unknown-linux-musl]
        profile: [baseline, thin-cgu8, off-cgu4]
    env:
      RUNNER_BINARY_ACTUAL_TOOLCHAIN_IMAGE: ghcr.io/${{ github.repository_owner }}/vm0-toolchain-rust:20261009
      RUNNER_BINARY_GIT_REVISION: ${{ github.sha }}
      GUEST_CLI_PATH: runner-profile-cli/package.tgz
      GUEST_CLI_MANIFEST_PATH: runner-profile-cli/manifest.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: runner-profile-cli-${{ github.run_id }}
          path: runner-profile-cli
      - name: Configure git safe directory
        shell: bash
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Verify immutable CLI input
        shell: bash
        run: bash .github/scripts/verify-okou-cli-artifact.sh runner-profile-cli "$RUNNER_BINARY_GIT_REVISION"
      - name: Measure isolated full rebuilds
        shell: bash
        env:
          BENCHMARK_PROFILE: ${{ matrix.profile }}
          BENCHMARK_TARGET: ${{ matrix.target }}
        run: python3 .github/scripts/runner-profile-benchmark/run.py "$BENCHMARK_PROFILE" "$BENCHMARK_TARGET" runner-profile-report
      - name: Upload diagnostic reports only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runner-profile-${{ matrix.target }}-${{ matrix.profile }}
          path: runner-profile-report
          if-no-files-found: warn
          retention-days: 7
