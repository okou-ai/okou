      )
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup SSH via Cloudflare Tunnel
        uses: "./.github/actions/setup-ssh-tunnel"
        with:
          ssh-user: "${{ vars.AWS_METAL_RUNNER_USER }}"
          ssh-hosts: "${{ secrets.AWS_METAL_RUNNER_HOSTS }}"
          ssh-key: "${{ secrets.AWS_METAL_RUNNER_SSH_KEY }}"
          cf-access-client-id: "${{ secrets.CF_ACCESS_CLIENT_ID }}"
          cf-access-client-secret: "${{ secrets.CF_ACCESS_CLIENT_SECRET }}"
      - name: Reconcile and start runner under lifecycle lock
        id: start
        env:
          AWS_ACCESS_KEY_ID: "${{ secrets.R2_ACCESS_KEY_ID }}"
          AWS_DEFAULT_REGION: auto
          AWS_METAL_RUNNER_HOSTS: "${{ secrets.AWS_METAL_RUNNER_HOSTS }}"
          AWS_SECRET_ACCESS_KEY: "${{ secrets.R2_SECRET_ACCESS_KEY }}"
          BIN_DIR: "${{ needs.deploy-runner-prepare.outputs.bin-dir }}"
          GH_TOKEN: "${{ github.token }}"
          JOB_REF: "${{ needs.prepare.outputs.runner-image-job-ref }}"
          METAL_HOSTS: "${{ secrets.AWS_METAL_RUNNER_HOSTS }}"
          METAL_USER: "${{ vars.AWS_METAL_RUNNER_USER }}"
          OFFICIAL_RUNNER_SECRET: "${{ secrets.OFFICIAL_RUNNER_SECRET }}"
          R2_ACCOUNT_ID: "${{ vars.R2_ACCOUNT_ID }}"
          R2_BUCKET_NAME: "${{ vars.R2_USER_STORAGES_BUCKET_NAME }}"
          REPO: "${{ github.repository }}"
          ROOTFS_HASH_MAP:
            "${{ needs.deploy-runner-prepare.outputs.rootfs-hash-map
            }}"
          RUNNER_API_URL: "${{ needs.deploy-api.outputs.preview-url }}"
          RUNNER_DIR: "${{ needs.deploy-runner-prepare.outputs.runner-dir }}"
          RUNNER_GROUP:
            "${{ format('vm0/development-{0}', needs.prepare.outputs.job-ref)
            }}"
          RUNNER_SERVICE_REF: "${{ needs.prepare.outputs.job-ref }}"
          RUNNER_SHA_MAP: "${{ needs.deploy-runner-prepare.outputs.runner-sha-map }}"
          SNAPSHOT_HASH_MAP:
            "${{ needs.deploy-runner-prepare.outputs.snapshot-hash-map
            }}"
          VERCEL_BYPASS: "${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}"
        run: |
          .github/scripts/with-runner-lifecycle-lock.sh \
            .github/scripts/reconcile-and-start-runner-groups.sh
  cli-e2e-03-runner-prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
