  ci-gate-turbo:
    name: ${{ github.event_name == 'push' && 'staging-result' || 'ci-gate-turbo' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - ci-admission
      - detect-release
      - turbo-checks
      - detect-turbo-ts-checks
      - prepare
      - test-migrate
      - deploy-api
      - deploy-app
      - deploy-stripe-listener
      - deploy-cli
      - cli-e2e-02-browser
      - cli-e2e-02-playwright
      - cli-e2e-01-serial
      - cli-e2e-03-runner-prepare
      - cli-e2e-03-runner-bootstrap
      - cli-e2e-03-runner
      - deploy-runner-prepare
      - deploy-runner-start
    if: ${{ always() && ((inputs.surface == '' || inputs.surface == 'all') || inputs.surface == 'turbo') }}
    steps:
      - name: Validate CI results
        env:
          CI_ADMISSION_RESULT: ${{ needs.ci-admission.result }}
          DETECT_RELEASE_RESULT: ${{ needs.detect-release.result }}
          EVENT_NAME: ${{ github.event_name }}
          IS_RELEASE: ${{ needs.detect-release.outputs.skip }}
          RELEASE_PRESENCE_RESULT: ${{ (needs.turbo-checks.result == 'success' && (fromJSON(needs.turbo-checks.outputs.results || '{}').validate-release-presence.result || 'missing') || needs.turbo-checks.result) }}
          RELEASE_DEPLOY_APP_RESULT: ${{ needs.deploy-app.result }}
          RELEASE_DEPLOY_CLI_RESULT: ${{ needs.deploy-cli.result }}
        run: |
          if [[ "$CI_ADMISSION_RESULT" != "success" ]]; then
            echo "::error::CI admission did not pass ($CI_ADMISSION_RESULT). See the Check PR CI limits job and workflow summary for the reason and retry instructions."
            exit 1
          fi

          if [ "$DETECT_RELEASE_RESULT" != success ]; then
            echo "::error::Release classification did not complete successfully"
            exit 1
          fi

          # Auto-pass for release-please PRs, commits, and merge queue entries
          if [[ "$IS_RELEASE" == "true" ]]; then
            if [[ "$EVENT_NAME" == "merge_group" && "$RELEASE_PRESENCE_RESULT" != "success" ]]; then
              echo "::error::validate-release-presence: expected success, got $RELEASE_PRESENCE_RESULT"
              exit 1
            fi
            if [[ "$EVENT_NAME" == "merge_group" && "$RELEASE_DEPLOY_APP_RESULT" != "success" ]]; then
              echo "::error::deploy-app: expected success, got $RELEASE_DEPLOY_APP_RESULT"
              exit 1
            fi
            if [[ "$EVENT_NAME" == "merge_group" && "$RELEASE_DEPLOY_CLI_RESULT" != "success" ]]; then
              echo "::error::deploy-cli: expected success, got $RELEASE_DEPLOY_CLI_RESULT"
              exit 1
            fi
            echo "✅ Release-please — skipping CI gate"
            exit 0
          fi

          echo "::group::CI Gate Results"
          FAILED=0
          TS_CHECK_SKIP_ALLOWED=""
          FILE_SIZE_SKIP_ALLOWED=""
          if [ "${{ needs.detect-turbo-ts-checks.outputs.turbo-ts-checks-needed }}" = "false" ]; then
            TS_CHECK_SKIP_ALLOWED="skipped"
          fi
          if [ "$EVENT_NAME" = "push" ]; then
            # Main was validated by the protected merge queue. Only deployment
            # and environment verification run under the staging caller.
            TS_CHECK_SKIP_ALLOWED="skipped"
            FILE_SIZE_SKIP_ALLOWED="skipped"
          fi
          RUNNER_DEPLOY_SKIP_ALLOWED="true"
          if [ "${{ needs.prepare.outputs.turbo-runner-consumer-needed }}" = "true" ] ||
            [ "${{ needs.prepare.outputs.playwright-runner-consumer-needed }}" = "true" ]; then
            RUNNER_DEPLOY_SKIP_ALLOWED=""
          fi
          RUNNER_E2E_SKIP_ALLOWED="true"
          if [ "${{ needs.prepare.outputs.turbo-runner-consumer-needed }}" = "true" ]; then
            RUNNER_E2E_SKIP_ALLOWED=""
          fi
          CF_APP_SKIP_ALLOWED=""
          if [ "${{ needs.detect-turbo-ts-checks.outputs.ios-only }}" = "true" ]; then
            CF_APP_SKIP_ALLOWED="true"
          fi
          if [ "${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}" = "true" ]; then
            # External fork PRs cannot access runner infra secrets, so their
            # runner deployment and runner E2E jobs are expected to skip.
            RUNNER_DEPLOY_SKIP_ALLOWED="true"
            RUNNER_E2E_SKIP_ALLOWED="true"
            CF_APP_SKIP_ALLOWED="true"
          fi
          if [ "${{ github.actor == 'dependabot[bot]' }}" = "true" ]; then
            CF_APP_SKIP_ALLOWED="true"
          fi

          check_result() {
            local job="$1" result="$2" allow_skip="$3"
            if [ "$result" = "success" ]; then
              echo "✅ $job: $result"
            elif { [ "$allow_skip" = "skipped" ] || [ "$allow_skip" = "true" ]; } && [ "$result" = "skipped" ]; then
              echo "⏭️ $job: $result (allowed)"
            else
              if [ "$allow_skip" = "true" ]; then
                echo "::error::$job: expected success or skipped, got $result"
              else
                echo "::error::$job: expected success, got $result"
              fi
              FAILED=1
            fi
          }

          # Required foundation jobs: only 'success' is acceptable. File-size
          # validation is already complete for staging's merge-group SHA.
          check_result "detect-release" "${{ needs.detect-release.result }}" ""
          check_result "detect-turbo-ts-checks" "${{ needs.detect-turbo-ts-checks.result }}" ""
          check_result "prepare" "${{ needs.prepare.result }}" ""
          check_result "file-size-check" "${{ (needs.turbo-checks.result == 'success' && (fromJSON(needs.turbo-checks.outputs.results || '{}').file-size-check.result || 'missing') || needs.turbo-checks.result) }}" "$FILE_SIZE_SKIP_ALLOWED"
          # Turbo checks: only 'success' is acceptable unless
          # detection confirmed a pure native change set, or staging is reusing
          # the merge group's completed code validation.
          check_result "lint-eslint" "${{ (needs.turbo-checks.result == 'success' && (fromJSON(needs.turbo-checks.outputs.results || '{}').lint-eslint.result || 'missing') || needs.turbo-checks.result) }}" "$TS_CHECK_SKIP_ALLOWED"
          check_result "lint-style" "${{ (needs.turbo-checks.result == 'success' && (fromJSON(needs.turbo-checks.outputs.results || '{}').lint-style.result || 'missing') || needs.turbo-checks.result) }}" "$TS_CHECK_SKIP_ALLOWED"
          check_result "lint-types" "${{ (needs.turbo-checks.result == 'success' && (fromJSON(needs.turbo-checks.outputs.results || '{}').lint-types.result || 'missing') || needs.turbo-checks.result) }}" "$TS_CHECK_SKIP_ALLOWED"
          check_result "lint-type-app" "${{ (needs.turbo-checks.result == 'success' && (fromJSON(needs.turbo-checks.outputs.results || '{}').lint-type-app.result || 'missing') || needs.turbo-checks.result) }}" "$TS_CHECK_SKIP_ALLOWED"
          check_result "lint-type-api" "${{ (needs.turbo-checks.result == 'success' && (fromJSON(needs.turbo-checks.outputs.results || '{}').lint-type-api.result || 'missing') || needs.turbo-checks.result) }}" "$TS_CHECK_SKIP_ALLOWED"
          check_result "lint-format" "${{ (needs.turbo-checks.result == 'success' && (fromJSON(needs.turbo-checks.outputs.results || '{}').lint-format.result || 'missing') || needs.turbo-checks.result) }}" "$TS_CHECK_SKIP_ALLOWED"
          check_result "lint-knip" "${{ (needs.turbo-checks.result == 'success' && (fromJSON(needs.turbo-checks.outputs.results || '{}').lint-knip.result || 'missing') || needs.turbo-checks.result) }}" "$TS_CHECK_SKIP_ALLOWED"
          check_result "test-cli" "${{ (needs.turbo-checks.result == 'success' && (fromJSON(needs.turbo-checks.outputs.results || '{}').test-cli.result || 'missing') || needs.turbo-checks.result) }}" "$TS_CHECK_SKIP_ALLOWED"
          check_result "test-app" "${{ (needs.turbo-checks.result == 'success' && (fromJSON(needs.turbo-checks.outputs.results || '{}').test-app.result || 'missing') || needs.turbo-checks.result) }}" "$TS_CHECK_SKIP_ALLOWED"
          check_result "test-api" "${{ (needs.turbo-checks.result == 'success' && (fromJSON(needs.turbo-checks.outputs.results || '{}').test-api.result || 'missing') || needs.turbo-checks.result) }}" "$TS_CHECK_SKIP_ALLOWED"
          check_result "test-other" "${{ (needs.turbo-checks.result == 'success' && (fromJSON(needs.turbo-checks.outputs.results || '{}').test-other.result || 'missing') || needs.turbo-checks.result) }}" "$TS_CHECK_SKIP_ALLOWED"
          check_result "test-discord-gateway" "${{ (needs.turbo-checks.result == 'success' && (fromJSON(needs.turbo-checks.outputs.results || '{}').test-discord-gateway.result || 'missing') || needs.turbo-checks.result) }}" "$TS_CHECK_SKIP_ALLOWED"

          # May-skip: 'success' or 'skipped' are both acceptable
          check_result "test-migrate" "${{ needs.test-migrate.result }}" "true"
          check_result "deploy-api" "${{ needs.deploy-api.result }}" "true"
          check_result "deploy-app" "${{ needs.deploy-app.result }}" "$CF_APP_SKIP_ALLOWED"
          check_result "deploy-stripe-listener" "${{ needs.deploy-stripe-listener.result }}" "true"
          check_result "deploy-cli" "${{ needs.deploy-cli.result }}" "$CF_APP_SKIP_ALLOWED"
          check_result "cli-e2e-02-browser" "${{ needs.cli-e2e-02-browser.result }}" "true"
          check_result "cli-e2e-02-playwright" "${{ needs.cli-e2e-02-playwright.result }}" "true"
          check_result "cli-e2e-01-serial" "${{ needs.cli-e2e-01-serial.result }}" "true"
          check_result "cli-e2e-03-runner-prepare" "${{ needs.cli-e2e-03-runner-prepare.result }}" "$RUNNER_E2E_SKIP_ALLOWED"
          check_result "cli-e2e-03-runner-bootstrap" "${{ needs.cli-e2e-03-runner-bootstrap.result }}" "$RUNNER_E2E_SKIP_ALLOWED"
          check_result "cli-e2e-03-runner" "${{ needs.cli-e2e-03-runner.result }}" "$RUNNER_E2E_SKIP_ALLOWED"
          check_result "deploy-runner-prepare" "${{ needs.deploy-runner-prepare.result }}" "$RUNNER_DEPLOY_SKIP_ALLOWED"
          check_result "deploy-runner-start" "${{ needs.deploy-runner-start.result }}" "$RUNNER_DEPLOY_SKIP_ALLOWED"

          echo "::endgroup::"
          exit $FAILED
    permissions:
      actions: read
      contents: read
      pull-requests: read
  ci-gate-crates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - detect-release
      - crates-detect
      - crates-checks
      - crates-runner-host-groups
      - crates-runner-test-prepare-arm64
      - crates-runner-test-prepare-x86_64
      - crates-runner-image-architecture-manifest-arm64
      - crates-runner-image-architecture-manifest-x86_64
      - crates-behavior-arm64
      - crates-behavior-x86_64
      - crates-host-cpu-fairness-test-arm64
      - crates-host-cpu-fairness-test-x86_64
      - crates-host-cpu-fairness-build
      - crates-guest-rpc-firecracker-test-arm64
      - crates-guest-rpc-firecracker-test-x86_64
      - crates-guest-rpc-firecracker-build
      - crates-host-tests
    if: ${{ always() && ((inputs.surface == '' || inputs.surface == 'all') || inputs.surface == 'crates') }}
    steps:
      - name: Validate CI results
        env:
          IS_RELEASE: ${{ needs.detect-release.outputs.skip }}
          COVERAGE_NEEDED: ${{ needs.crates-detect.outputs.any-changed == 'true' }}
          FIREWALL_CONTRACT_NEEDED: ${{ needs.crates-detect.outputs.runner-firewall-contract-inputs-changed == 'true' }}
          RUNNER_IMAGE_NEEDED: ${{ needs.crates-detect.outputs.metal-job-ref != '' && needs.crates-detect.outputs.crates-runner-consumer-needed == 'true' }}
          CPU_FAIRNESS_NEEDED: ${{ needs.crates-detect.outputs.metal-job-ref != '' && needs.crates-detect.outputs.crates-runner-consumer-needed == 'true' && (needs.crates-detect.outputs.sandbox-firecracker-changed == 'true' || needs.crates-detect.outputs.ci-changed == 'true') }}
          IMAGE_VALIDATION_MATRIX: ${{ needs.crates-runner-host-groups.outputs.validation-matrix }}
          SELECTED_TARGET: ${{ needs.crates-runner-host-groups.outputs.selected-target }}
        run: |
          if [ "${{ needs.detect-release.result }}" != success ]; then
            echo "::error::Release classification did not complete successfully"
            exit 1
          fi
          # Auto-pass for release-please PRs, commits, and merge queue entries
          if [[ "$IS_RELEASE" == "true" ]]; then
            echo "✅ Release-please — skipping CI gate"
            exit 0
          fi
          echo "::group::CI Gate Results"
          FAILED=0

          check_result() {
            local job="$1" result="$2" allow_skip="$3"
            if [ "$allow_skip" = "skipped-only" ] && [ "$result" = "skipped" ]; then
              echo "unselected $job: skipped"
            elif [ "$allow_skip" != "skipped-only" ] && [ "$result" = "success" ]; then
              echo "✅ $job: $result"
            elif [ "$allow_skip" = "true" ] && [ "$result" = "skipped" ]; then
              echo "⏭️ $job: $result (allowed)"
            elif [ "$allow_skip" = "informational" ]; then
              echo "ℹ️ $job: $result (informational, not blocking)"
            else
              if [ "$allow_skip" = "true" ]; then
                echo "::error::$job: expected success or skipped, got $result"
              else
                echo "::error::$job: expected success, got $result"
              fi
              FAILED=1
            fi
          }

          # Must-succeed: only 'success' is acceptable
          check_result "detect" "${{ needs.crates-detect.result }}" ""

          RUNNER_IMAGE_ALLOW_SKIP=true
          OTHER_TARGETS_ALLOW_SKIP=true
          if [ "$RUNNER_IMAGE_NEEDED" = "true" ]; then
            RUNNER_IMAGE_ALLOW_SKIP=""
            if [ "$IMAGE_VALIDATION_MATRIX" != "[]" ]; then
              OTHER_TARGETS_ALLOW_SKIP=""
            fi
          fi

          # Require the selected owner of the shared firewall contract assertion.
          COVERAGE_ALLOW_SKIP=true
          FIREWALL_CONTRACT_ALLOW_SKIP=true
          if [ "$COVERAGE_NEEDED" = "true" ]; then
            COVERAGE_ALLOW_SKIP=""
          elif [ "$FIREWALL_CONTRACT_NEEDED" = "true" ]; then
            FIREWALL_CONTRACT_ALLOW_SKIP=""
          fi

          # May-skip only when the corresponding work was not selected.
          check_result "check" "${{ (needs.crates-checks.result == 'success' && (fromJSON(needs.crates-checks.outputs.results || '{}').check.result || 'missing') || needs.crates-checks.result) }}" "true"
          check_result "coverage" "${{ (needs.crates-checks.result == 'success' && (fromJSON(needs.crates-checks.outputs.results || '{}').coverage.result || 'missing') || needs.crates-checks.result) }}" "$COVERAGE_ALLOW_SKIP"
          check_result "api-contracts-rust-bindings" "${{ (needs.crates-checks.result == 'success' && (fromJSON(needs.crates-checks.outputs.results || '{}').api-contracts-rust-bindings.result || 'missing') || needs.crates-checks.result) }}" "true"
          check_result "runner-firewall-contract-test" "${{ (needs.crates-checks.result == 'success' && (fromJSON(needs.crates-checks.outputs.results || '{}').runner-firewall-contract-test.result || 'missing') || needs.crates-checks.result) }}" "$FIREWALL_CONTRACT_ALLOW_SKIP"
          check_result "mitm-addon-test" "${{ (needs.crates-checks.result == 'success' && (fromJSON(needs.crates-checks.outputs.results || '{}').mitm-addon-test.result || 'missing') || needs.crates-checks.result) }}" "true"
          check_result "mitm-addon-packaged-control" "${{ (needs.crates-checks.result == 'success' && (fromJSON(needs.crates-checks.outputs.results || '{}').mitm-addon-packaged-control.result || 'missing') || needs.crates-checks.result) }}" "true"
          check_result "runner-host-groups" "${{ needs.crates-runner-host-groups.result }}" "$RUNNER_IMAGE_ALLOW_SKIP"
          check_result "runner-test-prepare" "${{ (needs.crates-runner-host-groups.outputs.selected-target == 'aarch64-unknown-linux-musl' && needs.crates-runner-test-prepare-arm64.result || needs.crates-runner-test-prepare-x86_64.result) }}" "$RUNNER_IMAGE_ALLOW_SKIP"
          check_result "runner-image-architecture-manifest" "${{ (needs.crates-runner-host-groups.outputs.selected-target == 'aarch64-unknown-linux-musl' && needs.crates-runner-image-architecture-manifest-x86_64.result || needs.crates-runner-image-architecture-manifest-arm64.result) }}" "$OTHER_TARGETS_ALLOW_SKIP"
          check_result "runner-behavior-lane-a" "${{ (needs.crates-runner-host-groups.outputs.selected-target == 'aarch64-unknown-linux-musl' && (needs.crates-behavior-arm64.result == 'success' && (fromJSON(needs.crates-behavior-arm64.outputs.results || '{}').runner-behavior-lane-a.result || 'missing') || needs.crates-behavior-arm64.result) || (needs.crates-behavior-x86_64.result == 'success' && (fromJSON(needs.crates-behavior-x86_64.outputs.results || '{}').runner-behavior-lane-a.result || 'missing') || needs.crates-behavior-x86_64.result)) }}" "$RUNNER_IMAGE_ALLOW_SKIP"
          check_result "runner-behavior-lane-b" "${{ (needs.crates-runner-host-groups.outputs.selected-target == 'aarch64-unknown-linux-musl' && (needs.crates-behavior-arm64.result == 'success' && (fromJSON(needs.crates-behavior-arm64.outputs.results || '{}').runner-behavior-lane-b.result || 'missing') || needs.crates-behavior-arm64.result) || (needs.crates-behavior-x86_64.result == 'success' && (fromJSON(needs.crates-behavior-x86_64.outputs.results || '{}').runner-behavior-lane-b.result || 'missing') || needs.crates-behavior-x86_64.result)) }}" "$RUNNER_IMAGE_ALLOW_SKIP"
          check_result "runner-behavior-lane-c" "${{ (needs.crates-runner-host-groups.outputs.selected-target == 'aarch64-unknown-linux-musl' && (needs.crates-behavior-arm64.result == 'success' && (fromJSON(needs.crates-behavior-arm64.outputs.results || '{}').runner-behavior-lane-c.result || 'missing') || needs.crates-behavior-arm64.result) || (needs.crates-behavior-x86_64.result == 'success' && (fromJSON(needs.crates-behavior-x86_64.outputs.results || '{}').runner-behavior-lane-c.result || 'missing') || needs.crates-behavior-x86_64.result)) }}" "$RUNNER_IMAGE_ALLOW_SKIP"
          check_result "runner-behavior-lane-d" "${{ (needs.crates-runner-host-groups.outputs.selected-target == 'aarch64-unknown-linux-musl' && (needs.crates-behavior-arm64.result == 'success' && (fromJSON(needs.crates-behavior-arm64.outputs.results || '{}').runner-behavior-lane-d.result || 'missing') || needs.crates-behavior-arm64.result) || (needs.crates-behavior-x86_64.result == 'success' && (fromJSON(needs.crates-behavior-x86_64.outputs.results || '{}').runner-behavior-lane-d.result || 'missing') || needs.crates-behavior-x86_64.result)) }}" "$RUNNER_IMAGE_ALLOW_SKIP"
          # Selected native tests require both compilation and real execution.
          CPU_FAIRNESS_ALLOW_SKIP=true
          if [ "$CPU_FAIRNESS_NEEDED" = "true" ]; then
            CPU_FAIRNESS_ALLOW_SKIP=""
          fi
          check_result "host-cpu-fairness-build" "${{ needs.crates-host-cpu-fairness-build.result }}" "$CPU_FAIRNESS_ALLOW_SKIP"
          check_result "host-cpu-fairness-test" "${{ (needs.crates-runner-host-groups.outputs.selected-target == 'aarch64-unknown-linux-musl' && needs.crates-host-cpu-fairness-test-arm64.result || needs.crates-host-cpu-fairness-test-x86_64.result) }}" "$CPU_FAIRNESS_ALLOW_SKIP"
          check_result "guest-rpc-firecracker-build" "${{ needs.crates-guest-rpc-firecracker-build.result }}" "$RUNNER_IMAGE_ALLOW_SKIP"
          check_result "guest-rpc-firecracker-test" "${{ (needs.crates-runner-host-groups.outputs.selected-target == 'aarch64-unknown-linux-musl' && needs.crates-guest-rpc-firecracker-test-arm64.result || needs.crates-guest-rpc-firecracker-test-x86_64.result) }}" "$RUNNER_IMAGE_ALLOW_SKIP"
          check_result "nbd-cow-test" "${{ (needs.crates-host-tests.result == 'success' && (fromJSON(needs.crates-host-tests.outputs.results || '{}').nbd-cow-test.result || 'missing') || needs.crates-host-tests.result) }}" "true"
          check_result "runner-rootfs-process-test" "${{ (needs.crates-host-tests.result == 'success' && (fromJSON(needs.crates-host-tests.outputs.results || '{}').runner-rootfs-process-test.result || 'missing') || needs.crates-host-tests.result) }}" "true"

          echo "::endgroup::"
          if [ "$RUNNER_IMAGE_NEEDED" = true ]; then
            case "$SELECTED_TARGET" in
              aarch64-unknown-linux-musl|x86_64-unknown-linux-musl) ;;
              *) echo "::error::Missing or unsupported selected target"; FAILED=1 ;;
            esac
          fi
          if [ "$RUNNER_IMAGE_NEEDED" != true ] || [ "$SELECTED_TARGET" != "aarch64-unknown-linux-musl" ]; then
            check_result "unselected preparation (arm64)" "${{ needs.crates-runner-test-prepare-arm64.result }}" "skipped-only"
            check_result "unselected behavior (arm64)" "${{ needs.crates-behavior-arm64.result }}" "skipped-only"
            check_result "unselected CPU (arm64)" "${{ needs.crates-host-cpu-fairness-test-arm64.result }}" "skipped-only"
            check_result "unselected RPC (arm64)" "${{ needs.crates-guest-rpc-firecracker-test-arm64.result }}" "skipped-only"
          fi
          if [ "$RUNNER_IMAGE_NEEDED" != true ] || [ "$SELECTED_TARGET" = "aarch64-unknown-linux-musl" ]; then
            check_result "unselected manifest (arm64)" "${{ needs.crates-runner-image-architecture-manifest-arm64.result }}" "skipped-only"
          fi
          if [ "$RUNNER_IMAGE_NEEDED" != true ] || [ "$SELECTED_TARGET" != "x86_64-unknown-linux-musl" ]; then
            check_result "unselected preparation (x86_64)" "${{ needs.crates-runner-test-prepare-x86_64.result }}" "skipped-only"
            check_result "unselected behavior (x86_64)" "${{ needs.crates-behavior-x86_64.result }}" "skipped-only"
            check_result "unselected CPU (x86_64)" "${{ needs.crates-host-cpu-fairness-test-x86_64.result }}" "skipped-only"
            check_result "unselected RPC (x86_64)" "${{ needs.crates-guest-rpc-firecracker-test-x86_64.result }}" "skipped-only"
          fi
          if [ "$RUNNER_IMAGE_NEEDED" != true ] || [ "$SELECTED_TARGET" = "x86_64-unknown-linux-musl" ]; then
            check_result "unselected manifest (x86_64)" "${{ needs.crates-runner-image-architecture-manifest-x86_64.result }}" "skipped-only"
          fi

          exit $FAILED
    permissions:
      actions: read
      contents: read
      pull-requests: read
