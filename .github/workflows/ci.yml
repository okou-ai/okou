    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: "${{ needs.image-prepare.outputs.head-sha }}"
      - name: Download private CLI build input
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: runner-cli-${{ github.run_id }}
          path: runner-cli-intermediate
      - name: Resolve runner binary input
        id: binary-input
        env:
          TARGET_TRIPLE: "${{ matrix.target }}"
        run: .github/scripts/runner-binary-build/digest.sh "$TARGET_TRIPLE"
      - name: Download cached runner binary from R2
        if:
          contains(fromJSON(needs.image-prepare.outputs.runner-binary-hit-targets),
          matrix.target)
        env:
          AWS_ACCESS_KEY_ID: "${{ secrets.R2_ACCESS_KEY_ID }}"
          AWS_DEFAULT_REGION: auto
          AWS_SECRET_ACCESS_KEY: "${{ secrets.R2_SECRET_ACCESS_KEY }}"
          R2_ACCOUNT_ID: "${{ vars.R2_ACCOUNT_ID }}"
          R2_BUCKET_NAME: "${{ vars.R2_USER_STORAGES_BUCKET_NAME }}"
