  crates-guest-rpc-firecracker-build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/vm0-toolchain-rust:20261009
    needs:
      - crates-detect
      - crates-runner-host-groups
    if:
      needs.crates-detect.outputs.metal-job-ref != '' && needs.crates-detect.outputs.crates-runner-consumer-needed
      == 'true'
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    outputs:
      producer-attempt: "${{ steps.build.outputs.producer-attempt }}"
    env:
      TARGET_TRIPLE:
        "${{ needs.crates-runner-host-groups.outputs.selected-target
        }}"
      TEST_NAME: guest_rpc
      ARTIFACT_DIR: native-test-artifact
      PRODUCER_ATTEMPT: "${{ github.run_attempt }}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: crates -> target
          shared-key: "${{ needs.crates-runner-host-groups.outputs.selected-target }}-guest-rpc"
          save-if: "${{ github.ref == 'refs/heads/main' }}"
      - name: Cross-compile native guest RPC test
        id: build
        run: bash .github/scripts/runner-native-test-artifact.sh build
      - name: Install AWS CLI
        uses: "./.github/actions/setup-aws-cli"
      - name: Publish native test to R2
        env:
          AWS_ACCESS_KEY_ID: "${{ secrets.R2_ACCESS_KEY_ID }}"
          AWS_SECRET_ACCESS_KEY: "${{ secrets.R2_SECRET_ACCESS_KEY }}"
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: "${{ vars.R2_ACCOUNT_ID }}"
          R2_BUCKET_NAME: "${{ vars.R2_USER_STORAGES_BUCKET_NAME }}"
        run: bash .github/scripts/runner-native-test-artifact.sh publish
      - name: Report peak memory
        if: always()
        continue-on-error: true
        uses: "./.github/actions/report-memory-peak"
