name: CI
on:
  pull_request: null
  merge_group: null
  workflow_call:
    inputs:
      surface:
        type: string
        default: all
        required: false
    secrets:
      ABLY_API_KEY:
        required: false
      AGENTPHONE_API_KEY:
        required: false
      AGENTPHONE_WEBHOOK_SECRET:
        required: false
      AWS_ACCESS_KEY_ID:
        required: false
      AWS_METAL_RUNNER_HOSTS:
        required: false
      AWS_METAL_RUNNER_SSH_KEY:
        required: false
      AWS_SECRET_ACCESS_KEY:
        required: false
      AXIOM_TOKEN_SESSIONS:
        required: false
      AXIOM_TOKEN_TELEMETRY:
        required: false
      CF_ACCESS_CLIENT_ID:
        required: false
      CF_ACCESS_CLIENT_SECRET:
        required: false
      CF_API_WORKER_DEPLOY_API_TOKEN:
        required: false
      CLERK_SECRET_KEY:
        required: false
      CLERK_WEBHOOK_SIGNING_SECRET:
        required: false
      CODECOV_TOKEN:
        required: false
      CRON_SECRET:
        required: false
      DISCORD_BOT_TOKEN:
        required: false
      DISCORD_GATEWAY_SECRET:
        required: false
      FAL_KEY:
        required: false
      FINICITY_APP_KEY:
        required: false
      FINICITY_APP_SECRET:
        required: false
      GOOGLE_ADS_DEVELOPER_TOKEN:
        required: false
      GOOGLE_ADS_LOGIN_CUSTOMER_ID:
        required: false
      GRAFANA_CLOUD_API_KEY:
        required: false
      GRAFANA_CLOUD_PROMETHEUS_URL:
        required: false
      GRAFANA_CLOUD_PROMETHEUS_USER:
        required: false
      MICROSOFT_TEAMS_BOT_APP_PASSWORD:
        required: false
      NEON_API_KEY:
        required: false
      OFFICIAL_RUNNER_SECRET:
        required: false
      OKOU_BROWSER_USE_API_KEY:
        required: false
      OKOU_FINANCE_APIDOJO_TOKEN:
        required: false
      OKOU_GITHUB_APP_CLIENT_SECRET:
        required: false
      OKOU_GITHUB_APP_PRIVATE_KEY:
        required: false
      OKOU_GITHUB_APP_WEBHOOK_SECRET:
        required: false
      OKOU_MACHINE_SECRET_KEY:
        required: false
      OKOU_SCRAPE_FIRECRAWL_TOKEN:
        required: false
      OKOU_SEO_DATAFORSEO_LOGIN:
        required: false
      OKOU_SEO_DATAFORSEO_PASSWORD:
        required: false
      OKOU_SOCIAL_MONID_API_KEY:
        required: false
      OKOU_SOCIAL_SOCIALKIT_TOKEN:
        required: false
      OKOU_WEATHER_GOOGLE_WEATHER_TOKEN:
        required: false
      OKOU_WEB_SEARCH_PERPLEXITY_TOKEN:
        required: false
      OPENAI_API_KEY:
        required: false
      OPENROUTER_API_KEY:
        required: false
      R2_ACCESS_KEY_ID:
        required: false
      R2_HOSTED_SITES_ACCESS_KEY_ID:
        required: false
      R2_HOSTED_SITES_SECRET_ACCESS_KEY:
        required: false
      R2_PRIVATE_ARTIFACTS_ACCESS_KEY_ID_DEV:
        required: false
      R2_PRIVATE_ARTIFACTS_SECRET_ACCESS_KEY_DEV:
        required: false
      R2_SECRET_ACCESS_KEY:
        required: false
      R2_STATIC_ACCESS_KEY_ID:
        required: false
      R2_STATIC_SECRET_ACCESS_KEY:
        required: false
      R2_USER_ARTIFACTS_ACCESS_KEY_ID:
        required: false
      R2_USER_ARTIFACTS_SECRET_ACCESS_KEY:
        required: false
      RESEND_API_KEY:
        required: false
      RESEND_WEBHOOK_SECRET:
        required: false
      SECRETS_ENCRYPTION_KEY:
        required: false
      SECRETS_KMS_KEY_ID:
        required: false
      SENTRY_AUTH_TOKEN:
        required: false
      SENTRY_DSN:
        required: false
      SENTRY_DSN_API:
        required: false
      SENTRY_DSN_WEB:
        required: false
      SLACK_SIGNING_SECRET:
        required: false
      STEAM_WEB_API_KEY:
        required: false
      STRIPE_AUTOMATION_WEBHOOK_SECRET:
        required: false
      STRIPE_SECRET_KEY:
        required: false
      STRIPE_WEBHOOK_SECRET:
        required: false
      TELEGRAM_OFFICIAL_BOT_TOKEN:
        required: false
      TELEGRAM_OFFICIAL_WEBHOOK_SECRET:
        required: false
      VAPID_PRIVATE_KEY:
        required: false
      VERCEL_AUTOMATION_BYPASS_SECRET:
        required: false
      VERCEL_TOKEN:
        required: false
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('ci-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  actions: write
  contents: read
  deployments: write
  id-token: write
  issues: write
  pull-requests: write
env:
  npm_config_audit: "false"
jobs:
  ci-admission:
    name: Check PR CI limits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
      - name: Check PR CI limits
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          CI_MAX_OPEN_PRS: ${{ vars.CI_MAX_OPEN_PRS }}
          CI_MAX_OPEN_PRS_PER_AUTHOR: ${{ vars.CI_MAX_OPEN_PRS_PER_AUTHOR }}
          CI_PR_ADMISSION_BYPASS_LIST: ${{ vars.CI_PR_ADMISSION_BYPASS_LIST }}
        run: bash .github/scripts/check-pr-ci-capacity.sh
    if: ${{ ((inputs.surface == '' || inputs.surface == 'all') || inputs.surface == 'turbo') }}
  detect-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Validate caller surface
        env:
          SURFACE: ${{ inputs.surface || 'all' }}
        run: |
          case "$SURFACE:$GITHUB_EVENT_NAME:$GITHUB_REF" in
            all:pull_request:*|all:merge_group:*|turbo:push:refs/heads/main|crates:push:refs/heads/main|images:push:refs/heads/main) ;;
            *) echo "::error::Unsupported CI caller surface/event"; exit 2 ;;
          esac
      - name: Check for release-please
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.head_ref || '' }}
          COMMIT_MSG: ${{ github.event.head_commit.message || '' }}
          EVENT_NAME: ${{ github.event_name }}
          MQ_HEAD_REF: ${{ github.event.merge_group.head_ref || '' }}
          REPO: ${{ github.repository }}
        run: |
          # PR event: check branch name
          if [[ "$HEAD_REF" == release-please--branches--* ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Release-please PR detected (branch: $HEAD_REF)"
            exit 0
          fi

          # Push event: check commit message
          if [[ "$EVENT_NAME" == "push" ]] && [[ "$COMMIT_MSG" == chore:\ release* ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Release-please push detected (message: $COMMIT_MSG)"
            exit 0
          fi

          # Merge queue event: extract PR number, check branch via API
          if [[ "$EVENT_NAME" == "merge_group" ]] && [[ -n "$MQ_HEAD_REF" ]]; then
            PR_NUM=$(echo "$MQ_HEAD_REF" | grep -oE 'pr-[0-9]+' | head -1 | sed 's/pr-//')
            if [[ -n "$PR_NUM" ]]; then
              # Fail closed because a missed release classification would bypass
              # release-presence validation.
              PR_BRANCH=$(gh pr view "$PR_NUM" --repo "$REPO" --json headRefName --jq .headRefName)
              if [[ "$PR_BRANCH" == release-please--branches--* ]]; then
                echo "skip=true" >> "$GITHUB_OUTPUT"
                echo "Release-please merge queue entry detected (PR #$PR_NUM, branch: $PR_BRANCH)"
                exit 0
              fi
            fi
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "Not a release-please context"
    permissions:
      actions: read
      contents: read
      pull-requests: read
    if: ${{ !cancelled() }}
  detect-turbo-ts-checks:
    needs:
      - ci-admission
      - detect-release
    if: ${{ ((inputs.surface == '' || inputs.surface == 'all') || inputs.surface == 'turbo') && needs.detect-release.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      turbo-ts-checks-needed: ${{ steps.detect.outputs.turbo-ts-checks-needed }}
      ios-only: ${{ steps.detect.outputs.ios-only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - name: Detect Turbo TypeScript check need
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHECKOUT_REF: ${{ github.ref }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          selection=$(bash .github/scripts/detect-native-only.sh)
          printf '%s\n' "$selection" | tee -a "$GITHUB_OUTPUT"
    permissions:
      actions: read
      contents: read
      pull-requests: read
  image-cancel-superseded:
    name: Cancel superseded merge-group CI
    if: ${{ (inputs.surface == '' || inputs.surface == 'all') && (github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Cancel and await older runs for the queued PR
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
          MERGE_GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref }}
          RUNNER_OWNER_EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: .github/scripts/cancel-superseded-merge-group-runs.sh
  turbo-checks:
    needs:
      - ci-admission
      - detect-release
      - detect-turbo-ts-checks
    if: ${{ !cancelled() && ((inputs.surface == '' || inputs.surface == 'all') || inputs.surface == 'turbo') && needs.detect-release.result == 'success' && github.event_name != 'push'  && needs.ci-admission.result == 'success' }}
    uses: ./.github/workflows/ci-turbo-checks.yml
    permissions:
      actions: read
      contents: read
      deployments: write
      id-token: write
      issues: write
      pull-requests: write
    with:
      dependencies: ${{ toJSON(needs) }}
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      FAL_KEY: ${{ secrets.FAL_KEY }}
  crates-checks:
    needs:
      - crates-detect
      - detect-release
    if: ${{ !cancelled() && ((inputs.surface == '' || inputs.surface == 'all') || inputs.surface == 'crates') && needs.detect-release.result == 'success' }}
    uses: ./.github/workflows/ci-crates-checks.yml
    permissions:
      actions: read
      contents: read
      pull-requests: read
    with:
      dependencies: ${{ toJSON(needs) }}
    secrets:
      ABLY_API_KEY: ${{ secrets.ABLY_API_KEY }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  crates-host-tests:
    needs:
      - crates-detect
      - crates-runner-host-groups
      - detect-release
    if: ${{ !cancelled() && ((inputs.surface == '' || inputs.surface == 'all') || inputs.surface == 'crates') && needs.detect-release.result == 'success' }}
    uses: ./.github/workflows/ci-crates-host-tests.yml
    permissions:
      actions: read
      contents: read
      pull-requests: read
    with:
      dependencies: ${{ toJSON(needs) }}
    secrets:
      AWS_METAL_RUNNER_HOSTS: ${{ secrets.AWS_METAL_RUNNER_HOSTS }}
      AWS_METAL_RUNNER_SSH_KEY: ${{ secrets.AWS_METAL_RUNNER_SSH_KEY }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  prepare:
    needs:
      - ci-admission
      - detect-release
    if: ${{ ((inputs.surface == '' || inputs.surface == 'all') || inputs.surface == 'turbo') && (needs.detect-release.outputs.skip != 'true')  && needs.ci-admission.result == 'success' }}
    uses: ./.github/workflows/ci-turbo-prepare.yml
    permissions:
      actions: read
      contents: read
      deployments: write
      id-token: write
      issues: write
      pull-requests: write
    with:
      dependencies: ${{ toJSON(needs) }}
  test-migrate:
    needs:
      - ci-admission
      - prepare
    if: ${{ ((inputs.surface == '' || inputs.surface == 'all') || inputs.surface == 'turbo') && (github.event_name != 'push' && needs.prepare.outputs.migration-changed == 'true')  && needs.ci-admission.result == 'success' }}
    uses: ./.github/workflows/ci-turbo-test-migrate.yml
    permissions:
      actions: read
      contents: read
      deployments: write
      id-token: write
      issues: write
      pull-requests: write
    with:
      dependencies: ${{ toJSON(needs) }}
  deploy-api:
    needs:
      - ci-admission
      - prepare
    if: |-
      ${{ ((inputs.surface == '' || inputs.surface == 'all') || inputs.surface == 'turbo') && ((github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore: release')) &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      needs.prepare.outputs.job-ref != '' && (
        needs.prepare.outputs.api-changed == 'true' ||
        needs.prepare.outputs.cli-changed == 'true' ||
        needs.prepare.outputs.platform-changed == 'true' ||
        needs.prepare.outputs.crates-changed == 'true' ||
        needs.prepare.outputs.ci-changed == 'true' ||
        needs.prepare.outputs.e2e-changed == 'true'
      ))  && needs.ci-admission.result == 'success' }}
    uses: ./.github/workflows/ci-turbo-deploy-api.yml
    permissions:
      actions: read
      contents: read
      deployments: write
      id-token: write
      issues: write
      pull-requests: write
    with:
      dependencies: ${{ toJSON(needs) }}
    secrets:
      ABLY_API_KEY: ${{ secrets.ABLY_API_KEY }}
      AGENTPHONE_API_KEY: ${{ secrets.AGENTPHONE_API_KEY }}
      AGENTPHONE_WEBHOOK_SECRET: ${{ secrets.AGENTPHONE_WEBHOOK_SECRET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_METAL_RUNNER_HOSTS: ${{ secrets.AWS_METAL_RUNNER_HOSTS }}
      AWS_METAL_RUNNER_SSH_KEY: ${{ secrets.AWS_METAL_RUNNER_SSH_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AXIOM_TOKEN_SESSIONS: ${{ secrets.AXIOM_TOKEN_SESSIONS }}
      AXIOM_TOKEN_TELEMETRY: ${{ secrets.AXIOM_TOKEN_TELEMETRY }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      CF_API_WORKER_DEPLOY_API_TOKEN: ${{ secrets.CF_API_WORKER_DEPLOY_API_TOKEN }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      CLERK_WEBHOOK_SIGNING_SECRET: ${{ secrets.CLERK_WEBHOOK_SIGNING_SECRET }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      DISCORD_GATEWAY_SECRET: ${{ secrets.DISCORD_GATEWAY_SECRET }}
      FAL_KEY: ${{ secrets.FAL_KEY }}
      FINICITY_APP_KEY: ${{ secrets.FINICITY_APP_KEY }}
      FINICITY_APP_SECRET: ${{ secrets.FINICITY_APP_SECRET }}
      GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
      GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
      MICROSOFT_TEAMS_BOT_APP_PASSWORD: ${{ secrets.MICROSOFT_TEAMS_BOT_APP_PASSWORD }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      OFFICIAL_RUNNER_SECRET: ${{ secrets.OFFICIAL_RUNNER_SECRET }}
      OKOU_BROWSER_USE_API_KEY: ${{ secrets.OKOU_BROWSER_USE_API_KEY }}
      OKOU_FINANCE_APIDOJO_TOKEN: ${{ secrets.OKOU_FINANCE_APIDOJO_TOKEN }}
      OKOU_GITHUB_APP_CLIENT_SECRET: ${{ secrets.OKOU_GITHUB_APP_CLIENT_SECRET }}
      OKOU_GITHUB_APP_PRIVATE_KEY: ${{ secrets.OKOU_GITHUB_APP_PRIVATE_KEY }}
      OKOU_GITHUB_APP_WEBHOOK_SECRET: ${{ secrets.OKOU_GITHUB_APP_WEBHOOK_SECRET }}
      OKOU_MACHINE_SECRET_KEY: ${{ secrets.OKOU_MACHINE_SECRET_KEY }}
      OKOU_SCRAPE_FIRECRAWL_TOKEN: ${{ secrets.OKOU_SCRAPE_FIRECRAWL_TOKEN }}
      OKOU_SEO_DATAFORSEO_LOGIN: ${{ secrets.OKOU_SEO_DATAFORSEO_LOGIN }}
      OKOU_SEO_DATAFORSEO_PASSWORD: ${{ secrets.OKOU_SEO_DATAFORSEO_PASSWORD }}
      OKOU_SOCIAL_MONID_API_KEY: ${{ secrets.OKOU_SOCIAL_MONID_API_KEY }}
      OKOU_SOCIAL_SOCIALKIT_TOKEN: ${{ secrets.OKOU_SOCIAL_SOCIALKIT_TOKEN }}
      OKOU_WEATHER_GOOGLE_WEATHER_TOKEN: ${{ secrets.OKOU_WEATHER_GOOGLE_WEATHER_TOKEN }}
      OKOU_WEB_SEARCH_PERPLEXITY_TOKEN: ${{ secrets.OKOU_WEB_SEARCH_PERPLEXITY_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_HOSTED_SITES_ACCESS_KEY_ID: ${{ secrets.R2_HOSTED_SITES_ACCESS_KEY_ID }}
      R2_HOSTED_SITES_SECRET_ACCESS_KEY: ${{ secrets.R2_HOSTED_SITES_SECRET_ACCESS_KEY }}
      R2_PRIVATE_ARTIFACTS_ACCESS_KEY_ID_DEV: ${{ secrets.R2_PRIVATE_ARTIFACTS_ACCESS_KEY_ID_DEV }}
      R2_PRIVATE_ARTIFACTS_SECRET_ACCESS_KEY_DEV: ${{ secrets.R2_PRIVATE_ARTIFACTS_SECRET_ACCESS_KEY_DEV }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_STATIC_ACCESS_KEY_ID: ${{ secrets.R2_STATIC_ACCESS_KEY_ID }}
      R2_STATIC_SECRET_ACCESS_KEY: ${{ secrets.R2_STATIC_SECRET_ACCESS_KEY }}
      R2_USER_ARTIFACTS_ACCESS_KEY_ID: ${{ secrets.R2_USER_ARTIFACTS_ACCESS_KEY_ID }}
      R2_USER_ARTIFACTS_SECRET_ACCESS_KEY: ${{ secrets.R2_USER_ARTIFACTS_SECRET_ACCESS_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_WEBHOOK_SECRET: ${{ secrets.RESEND_WEBHOOK_SECRET }}
      SECRETS_ENCRYPTION_KEY: ${{ secrets.SECRETS_ENCRYPTION_KEY }}
      SECRETS_KMS_KEY_ID: ${{ secrets.SECRETS_KMS_KEY_ID }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      SENTRY_DSN_API: ${{ secrets.SENTRY_DSN_API }}
      SENTRY_DSN_WEB: ${{ secrets.SENTRY_DSN_WEB }}
      SLACK_SIGNING_SECRET: ${{ secrets.SLACK_SIGNING_SECRET }}
      STEAM_WEB_API_KEY: ${{ secrets.STEAM_WEB_API_KEY }}
      STRIPE_AUTOMATION_WEBHOOK_SECRET: ${{ secrets.STRIPE_AUTOMATION_WEBHOOK_SECRET }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      TELEGRAM_OFFICIAL_BOT_TOKEN: ${{ secrets.TELEGRAM_OFFICIAL_BOT_TOKEN }}
      TELEGRAM_OFFICIAL_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_OFFICIAL_WEBHOOK_SECRET }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  deploy-app:
    needs:
      - ci-admission
      - detect-release
      - detect-turbo-ts-checks
    if: |-
      ${{ ((inputs.surface == '' || inputs.surface == 'all') || inputs.surface == 'turbo') && (!cancelled() &&
        (
          needs.detect-release.outputs.skip == 'true' ||
          (needs.detect-turbo-ts-checks.result == 'success' && needs.detect-turbo-ts-checks.outputs.ios-only == 'false')
        ) &&
        github.actor != 'dependabot[bot]' &&
        (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository))  && needs.ci-admission.result == 'success' }}
    uses: ./.github/workflows/ci-turbo-deploy-app.yml
    permissions:
      actions: read
      contents: read
      deployments: write
      id-token: write
      issues: write
      pull-requests: write
    with:
      dependencies: ${{ toJSON(needs) }}
    secrets:
      CF_API_WORKER_DEPLOY_API_TOKEN: ${{ secrets.CF_API_WORKER_DEPLOY_API_TOKEN }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      R2_STATIC_ACCESS_KEY_ID: ${{ secrets.R2_STATIC_ACCESS_KEY_ID }}
      R2_STATIC_SECRET_ACCESS_KEY: ${{ secrets.R2_STATIC_SECRET_ACCESS_KEY }}
  deploy-stripe-listener:
    needs:
      - ci-admission
      - prepare
    if: |-
      ${{ ((inputs.surface == '' || inputs.surface == 'all') || inputs.surface == 'turbo') && (always() &&
      github.event_name != 'push' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      needs.prepare.outputs.job-ref != '' && (
        needs.prepare.outputs.turbo-runner-consumer-needed == 'true' ||
        needs.prepare.outputs.playwright-runner-consumer-needed == 'true'
      ))  && needs.ci-admission.result == 'success' }}
    uses: ./.github/workflows/ci-turbo-deploy-stripe-listener.yml
    permissions:
      actions: read
      contents: read
      deployments: write
      id-token: write
      issues: write
      pull-requests: write
    with:
      dependencies: ${{ toJSON(needs) }}
    secrets:
      AWS_METAL_RUNNER_HOSTS: ${{ secrets.AWS_METAL_RUNNER_HOSTS }}
      AWS_METAL_RUNNER_SSH_KEY: ${{ secrets.AWS_METAL_RUNNER_SSH_KEY }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
  cli-e2e-02-browser:
    needs:
      - ci-admission
      - deploy-api
      - deploy-app
      - prepare
