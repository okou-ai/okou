          CLERK_PUBLISHABLE_KEY: "${{ vars.CLERK_PUBLISHABLE_KEY }}"
          CLERK_SECRET_KEY: "${{ secrets.CLERK_SECRET_KEY }}"
          JOB_REF: "${{ needs.prepare.outputs.job-ref }}"
          E2E_RUNNER_ORGANIZATION_ID:
            "${{ steps.account.outputs.runner-organization-id
            }}"
          E2E_RUNNER_CODEX_ORGANIZATION_ID:
            "${{ steps.account.outputs.codex-organization-id
            }}"
          E2E_RUNNER_CLAUDE_ORGANIZATION_ID:
            "${{ steps.account.outputs.claude-organization-id
            }}"
          E2E_RUNNER_MOCK_CLAUDE_ORGANIZATION_ID:
            "${{ steps.account.outputs.mock-claude-organization-id
            }}"
          E2E_RUNNER_CODEX_BUILT_IN_ORGANIZATION_ID:
            "${{ steps.account.outputs.codex-built-in-organization-id
            }}"
          VERCEL_AUTOMATION_BYPASS_SECRET:
            "${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET
            }}"
      - name: Upload runner E2E sign-in diagnostics
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: runner-e2e-sign-in-diagnostics
          path: "/tmp/e2e-runner-sign-in-diagnostics"
          if-no-files-found: ignore
          retention-days: 1
      - name: Upload runner E2E Checkout diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: runner-e2e-checkout-diagnostics
          path: "/tmp/e2e-runner-checkout-diagnostics"
          if-no-files-found: ignore
          retention-days: 1
      - name: Upload runner E2E API tokens
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: e2e-tokens
          path: |
            /tmp/e2e-api-credentials-runner.json
            /tmp/e2e-api-credentials-runner-real-codex.json
            /tmp/e2e-api-credentials-runner-real-claude.json
            /tmp/e2e-api-credentials-runner-mock-claude.json
            /tmp/e2e-api-credentials-runner-real-codex-built-in.json
          retention-days: 1
  cli-e2e-03-runner-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    concurrency:
      group: cli-e2e-03-runner-bootstrap-${{ needs.prepare.outputs.job-ref }}
      cancel-in-progress: true
    needs:
      - prepare
      - deploy-api
      - cli-e2e-03-runner-prepare
    if: |
      always() &&
      needs.prepare.outputs.job-ref != '' &&
      needs.prepare.outputs.turbo-runner-consumer-needed == 'true' &&
      needs.deploy-api.result == 'success' &&
      needs.cli-e2e-03-runner-prepare.result == 'success'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: "${{ github.sha }}"
      - name: Download runner E2E API tokens
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: e2e-tokens
          path: "/tmp"
      - name: Reset runner model defaults
        shell: bash
        run:
          cd e2e && bash playwright/runner-auto-bootstrap.bash /tmp/e2e-api-credentials-runner.json
          false
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET:
            "${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET
            }}"
      - name: Bootstrap mock Claude account
        shell: bash
        run: cd e2e && bash playwright/runner-mock-claude-bootstrap.bash /tmp/e2e-api-credentials-runner-mock-claude.json
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET:
            "${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET
            }}"
      - name: Bootstrap real Codex account
        shell: bash
        run:
          cd e2e && bash playwright/runner-auto-bootstrap.bash /tmp/e2e-api-credentials-runner-real-codex.json
          true
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET:
            "${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET
            }}"
      - name: Bootstrap built-in Codex account
        shell: bash
        run:
          cd e2e && bash playwright/runner-auto-bootstrap.bash /tmp/e2e-api-credentials-runner-real-codex-built-in.json
          true
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET:
            "${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET
            }}"
      - name: Bootstrap real Claude account
        shell: bash
        run:
          cd e2e && bash playwright/runner-auto-bootstrap.bash /tmp/e2e-api-credentials-runner-real-claude.json
          true
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET:
            "${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET
            }}"
  cli-e2e-03-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group:
        cli-e2e-03-runner-${{ matrix.index }}-${{ needs.prepare.outputs.job-ref
        }}
      cancel-in-progress: true
    needs:
      - prepare
      - deploy-api
      - deploy-cli
      - deploy-runner-prepare
      - deploy-runner-start
      - cli-e2e-03-runner-prepare
      - cli-e2e-03-runner-bootstrap
    if: |
      always() &&
      needs.prepare.outputs.job-ref != '' &&
      needs.prepare.outputs.turbo-runner-consumer-needed == 'true' &&
      needs.deploy-api.result == 'success' &&
      needs.deploy-cli.result == 'success' &&
      needs.deploy-runner-prepare.result == 'success' &&
      needs.deploy-runner-start.result == 'success' &&
      needs.cli-e2e-03-runner-prepare.result == 'success' &&
      needs.cli-e2e-03-runner-bootstrap.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        "${{ fromJSON(needs.cli-e2e-03-runner-prepare.outputs.runner-shard-matrix)
        }}"
    env:
      E2E_CLERK_ORG_ID:
        "${{ needs.cli-e2e-03-runner-prepare.outputs.runner-organization-id
        }}"
      E2E_RUNNER_CODEX_ORG_ID:
        "${{ needs.cli-e2e-03-runner-prepare.outputs.codex-organization-id
        }}"
      E2E_RUNNER_CLAUDE_ORG_ID:
        "${{ needs.cli-e2e-03-runner-prepare.outputs.claude-organization-id
        }}"
      E2E_RUNNER_MOCK_CLAUDE_ORG_ID:
        "${{ needs.cli-e2e-03-runner-prepare.outputs.mock-claude-organization-id
        }}"
      E2E_RUNNER_EMAIL:
        "${{ needs.cli-e2e-03-runner-prepare.outputs.runner-email
        }}"
      E2E_RUNNER_CODEX_EMAIL:
        "${{ needs.cli-e2e-03-runner-prepare.outputs.codex-email
        }}"
      E2E_RUNNER_CLAUDE_EMAIL:
        "${{ needs.cli-e2e-03-runner-prepare.outputs.claude-email
        }}"
      E2E_RUNNER_MOCK_CLAUDE_EMAIL:
        "${{ needs.cli-e2e-03-runner-prepare.outputs.mock-claude-email
        }}"
      E2E_RUNNER_SHARD_INDEX: "${{ matrix.index }}"
      E2E_RUNNER_SHARD_TOTAL: "${{ strategy.job-total }}"
      E2E_RUNNER_TEST_FILES_JSON: "${{ toJSON(matrix.files) }}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: "${{ github.sha }}"
          submodules: recursive
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.33.4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Install E2E dependencies
        run: cd e2e && pnpm install --frozen-lockfile
      - name: Download runner E2E API tokens
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: e2e-tokens
          path: "/tmp"
      - name: Setup runner E2E API credentials
        shell: bash
        run: |
          set -euo pipefail
          for credential_file in \
            /tmp/e2e-api-credentials-runner.json \
            /tmp/e2e-api-credentials-runner-real-codex.json \
            /tmp/e2e-api-credentials-runner-real-claude.json \
            /tmp/e2e-api-credentials-runner-real-codex-built-in.json \
            /tmp/e2e-api-credentials-runner-mock-claude.json; do
            jq -er '.token | select(type == "string" and length > 0)' "$credential_file" >/dev/null
            jq -er '.apiUrl | select(type == "string" and length > 0)' "$credential_file" >/dev/null
          done
          token=$(jq -er '.token' /tmp/e2e-api-credentials-runner.json)
          api_url=$(jq -er '.apiUrl' /tmp/e2e-api-credentials-runner.json)
          echo "::add-mask::$token"
          echo "E2E_API_TOKEN=$token" >> "$GITHUB_ENV"
          echo "E2E_API_URL=$api_url" >> "$GITHUB_ENV"
      - name: Initialize runner E2E shard
        shell: bash
        run: |
          set -euo pipefail
          : "${E2E_CLERK_ORG_ID:?runner E2E organization is required}"
          : "${E2E_RUNNER_CODEX_ORG_ID:?runner Codex E2E organization is required}"
          : "${E2E_RUNNER_CLAUDE_ORG_ID:?runner Claude E2E organization is required}"
          : "${E2E_RUNNER_MOCK_CLAUDE_ORG_ID:?runner mock Claude E2E organization is required}"
          : "${E2E_RUNNER_EMAIL:?runner E2E account is required}"
          : "${E2E_RUNNER_CODEX_EMAIL:?runner Codex E2E account is required}"
          : "${E2E_RUNNER_CLAUDE_EMAIL:?runner Claude E2E account is required}"
          : "${E2E_RUNNER_MOCK_CLAUDE_EMAIL:?runner mock Claude E2E account is required}"
          : "${E2E_API_TOKEN:?runner E2E API token is required}"
          : "${E2E_API_URL:?runner E2E API URL is required}"
          jq -e '
            type == "array" and length > 0 and
            all(.[]; type == "string" and length > 0)
          ' <<<"$E2E_RUNNER_TEST_FILES_JSON" >/dev/null
          test_count="$(jq 'length' <<<"$E2E_RUNNER_TEST_FILES_JSON")"
          echo "Runner E2E shard ${E2E_RUNNER_SHARD_INDEX}/${E2E_RUNNER_SHARD_TOTAL} has ${test_count} file(s)"
      - name: Run runner E2E tests (shard ${{ matrix.index }})
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t test_files < <(jq -er '.[]' <<<"$E2E_RUNNER_TEST_FILES_JSON")
          if (( ${#test_files[@]} == 0 )); then
            echo "::error::Runner E2E shard has no test files"
            exit 1
          fi

          cd e2e
          for test_file in "${test_files[@]}"; do
            if [[ ! -f "$test_file" ]]; then
              echo "::error::Runner E2E test file does not exist: $test_file"
              exit 1
            fi
          done

          result_directory="results/runner-${E2E_RUNNER_SHARD_INDEX}"
          mkdir -p "$result_directory"
          BATS_TEST_TIMEOUT=240 ./test/libs/bats/bin/bats \
            -T \
            --report-formatter junit \
            --output "$result_directory" \
            "${test_files[@]}"
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET:
            "${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET
            }}"
      - name: Print runner E2E trace log
        if: always()
        shell: bash
        run: |
          if [[ -f /tmp/e2e-trace.log ]]; then
            cat /tmp/e2e-trace.log
          fi
      - name: Upload runner E2E test results to Codecov
        if: "${{ !cancelled() }}"
        continue-on-error: true
        timeout-minutes: 1
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
        with:
          token: "${{ secrets.CODECOV_TOKEN }}"
          flags: e2e-runner
          files: e2e/results/runner-${{ matrix.index }}/*.xml
          report_type: test_results
      - name: Upload runner E2E JUnit XML
        if: "${{ !cancelled() }}"
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: e2e-runner-junit-${{ matrix.index }}
          path: e2e/results/runner-${{ matrix.index }}/
          retention-days: 7
  cli-e2e-03-runner-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    env:
      E2E_CLERK_RESOURCE_DIR: "/tmp/e2e-clerk-runner"
    needs:
      - prepare
      - deploy-runner-start
      - cli-e2e-02-playwright
      - cli-e2e-03-runner-prepare
      - cli-e2e-03-runner
    if: |
      always() &&
      needs.prepare.outputs.job-ref != '' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      (
        needs.cli-e2e-03-runner-prepare.result != 'skipped' ||
        needs.deploy-runner-start.result == 'success'
      )
    steps:
      - name: Determine runner E2E cleanup scope
        id: cleanup-scope
        shell: bash
        env:
          PREPARE_RESULT: "${{ needs.cli-e2e-03-runner-prepare.result }}"
          RUNNER_RESULT: "${{ needs.cli-e2e-03-runner.result }}"
        run: |
          set -euo pipefail
          if [[ "$PREPARE_RESULT" == "skipped" ]]; then
            scope="none"
          elif [[ "$PREPARE_RESULT" != "success" ]]; then
            scope="generation"
          elif [[ "$RUNNER_RESULT" == "success" ]]; then
            scope="run"
          else
            scope="retain"
          fi
          echo "Runner E2E cleanup scope: $scope"
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
      - name: Retain runner E2E accounts for failed-job rerun
        if: steps.cleanup-scope.outputs.scope == 'retain'
        run:
          echo "Retaining runner E2E accounts until a successful rerun or fallback
          cleanup"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: "${{ github.sha }}"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        if:
          steps.cleanup-scope.outputs.scope == 'generation' || steps.cleanup-scope.outputs.scope
          == 'run'
        with:
          version: 10.33.4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        if:
          steps.cleanup-scope.outputs.scope == 'generation' || steps.cleanup-scope.outputs.scope
          == 'run'
        with:
          node-version: 22
      - name: Install E2E dependencies
        if:
          steps.cleanup-scope.outputs.scope == 'generation' || steps.cleanup-scope.outputs.scope
          == 'run'
        run: cd e2e && pnpm install --frozen-lockfile
      - name: Download runner Clerk resource records
        if:
          steps.cleanup-scope.outputs.scope == 'generation' || steps.cleanup-scope.outputs.scope
          == 'run'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: e2e-runner-clerk-resources-*
          path: "/tmp/e2e-clerk-runner"
          merge-multiple: true
      - name: Cleanup current runner E2E generation
        if: steps.cleanup-scope.outputs.scope == 'generation'
        run: cd e2e && pnpm exec tsx playwright/runner-account.ts cleanup-recorded-generation
        env:
          CLERK_SECRET_KEY: "${{ secrets.CLERK_SECRET_KEY }}"
          JOB_REF: "${{ needs.prepare.outputs.job-ref }}"
      - name: Cleanup runner E2E workflow run
        if: steps.cleanup-scope.outputs.scope == 'run'
        run: cd e2e && pnpm exec tsx playwright/runner-account.ts cleanup-recorded-run
        env:
          CLERK_SECRET_KEY: "${{ secrets.CLERK_SECRET_KEY }}"
          JOB_REF: "${{ needs.prepare.outputs.job-ref }}"
      - name: Setup SSH for idle sandbox cleanup
        if: always() && needs.deploy-runner-start.result == 'success'
        uses: "./.github/actions/setup-ssh-tunnel"
        with:
          ssh-user: "${{ vars.AWS_METAL_RUNNER_USER }}"
          ssh-hosts:
            "${{ fromJSON(needs.deploy-runner-start.outputs.runner-receipt).host
            }}"
          ssh-key: "${{ secrets.AWS_METAL_RUNNER_SSH_KEY }}"
          cf-access-client-id: "${{ secrets.CF_ACCESS_CLIENT_ID }}"
          cf-access-client-secret: "${{ secrets.CF_ACCESS_CLIENT_SECRET }}"
      - name: Reclaim exact idle sandboxes from the deployed runner
        if: always() && needs.deploy-runner-start.result == 'success'
        shell: bash
        env:
          RUNNER_RECEIPT: "${{ needs.deploy-runner-start.outputs.runner-receipt }}"
          METAL_HOSTS: "${{ secrets.AWS_METAL_RUNNER_HOSTS }}"
          METAL_USER: "${{ vars.AWS_METAL_RUNNER_USER }}"
          JOB_REF: "${{ needs.prepare.outputs.runner-image-job-ref }}"
          RUNNER_SERVICE_REF: "${{ needs.prepare.outputs.job-ref }}"
        run: bash .github/scripts/prune-runner-idle.sh
  lint-runtime-api-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    needs:
      - detect-release
      - detect-turbo-ts-checks
    if:
      github.event_name != 'push' && needs.detect-release.outputs.skip != 'true'
      && needs.detect-turbo-ts-checks.outputs.ios-only == 'false'
    continue-on-error: true
    container:
      image: ghcr.io/${{ github.repository_owner }}/vm0-toolchain:20261009
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: "./.github/actions/toolchain-init"
      - name: Download online runtime API schema
        env:
          GH_TOKEN: "${{ github.token }}"
          SCHEMA_RELEASE_TAG: runtime-api-schema-prod
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/runtime-api-schema

          if gh release view "$SCHEMA_RELEASE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            if gh release download "$SCHEMA_RELEASE_TAG" \
              --repo "${{ github.repository }}" \
              --pattern current.json \
              --dir /tmp/runtime-api-schema \
              --clobber; then
              echo "Downloaded online runtime API schema"
            else
              echo "::warning::Runtime API schema release exists, but current.json is not available yet."
            fi
          else
            echo "::warning::Runtime API schema release $SCHEMA_RELEASE_TAG does not exist yet; compatibility report will be skipped."
          fi
      - name: Check runtime API compatibility (report only)
        working-directory: turbo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/runtime-api-schema

          pnpm --filter @okouai/api-contracts run build:runtime-api-schema -- --out /tmp/runtime-api-schema/candidate.json

          if [ -f /tmp/runtime-api-schema/current.json ]; then
            pnpm --filter @okouai/api-contracts run lint-runtime-api-compat -- \
              --against /tmp/runtime-api-schema/current.json \
              --current /tmp/runtime-api-schema/candidate.json \
              --report-out /tmp/runtime-api-schema/report.json \
              --warn-only
          else
            echo "::warning::No online runtime API schema found. Generated candidate schema only."
            printf '{"findings":[],"skipped":"online schema not found"}\n' > /tmp/runtime-api-schema/report.json
          fi
      - name: Upload runtime API compatibility report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: runtime-api-compat-report
          path: |
            /tmp/runtime-api-schema/candidate.json
            /tmp/runtime-api-schema/current.json
            /tmp/runtime-api-schema/report.json
          if-no-files-found: warn
          retention-days: 14
  ci-gate-turbo:
    name:
      "${{ github.event_name == 'push' && 'staging-result' || 'ci-gate-turbo'
      }}"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - ci-admission
      - detect-release
      - validate-release-presence
      - detect-turbo-ts-checks
      - prepare
      - file-size-check
      - lint-eslint
      - lint-style
      - lint-types
      - lint-type-app
      - lint-type-api
      - lint-format
      - lint-knip
      - test-migrate
      - test-cli
      - test-app
      - test-api
      - test-other
      - test-discord-gateway
      - deploy-api
      - deploy-app
      - deploy-stripe-listener
      - deploy-cli
      - cli-e2e-02-browser
      - cli-e2e-02-playwright
      - cli-e2e-01-serial
      - cli-e2e-03-runner-prepare
      - cli-e2e-03-runner-bootstrap
      - cli-e2e-03-runner
      - deploy-runner-prepare
      - deploy-runner-start
    if: always()
    steps:
      - name: Validate CI results
        env:
          CI_ADMISSION_RESULT: "${{ needs.ci-admission.result }}"
          EVENT_NAME: "${{ github.event_name }}"
          IS_RELEASE: "${{ needs.detect-release.outputs.skip }}"
          RELEASE_PRESENCE_RESULT: "${{ needs.validate-release-presence.result }}"
          RELEASE_DEPLOY_APP_RESULT: "${{ needs.deploy-app.result }}"
          RELEASE_DEPLOY_CLI_RESULT: "${{ needs.deploy-cli.result }}"
        run: |
          if [[ "$CI_ADMISSION_RESULT" != "success" ]]; then
            echo "::error::CI admission did not pass ($CI_ADMISSION_RESULT). See the Check PR CI limits job and workflow summary for the reason and retry instructions."
            exit 1
          fi

          # Auto-pass for release-please PRs, commits, and merge queue entries
          if [[ "$IS_RELEASE" == "true" ]]; then
            if [[ "$EVENT_NAME" == "merge_group" && "$RELEASE_PRESENCE_RESULT" != "success" ]]; then
              echo "::error::validate-release-presence: expected success, got $RELEASE_PRESENCE_RESULT"
              exit 1
            fi
            if [[ "$EVENT_NAME" == "merge_group" && "$RELEASE_DEPLOY_APP_RESULT" != "success" ]]; then
              echo "::error::deploy-app: expected success, got $RELEASE_DEPLOY_APP_RESULT"
              exit 1
            fi
            if [[ "$EVENT_NAME" == "merge_group" && "$RELEASE_DEPLOY_CLI_RESULT" != "success" ]]; then
              echo "::error::deploy-cli: expected success, got $RELEASE_DEPLOY_CLI_RESULT"
              exit 1
            fi
            echo "✅ Release-please — skipping CI gate"
            exit 0
          fi

          echo "::group::CI Gate Results"
          FAILED=0
          TS_CHECK_SKIP_ALLOWED=""
          FILE_SIZE_SKIP_ALLOWED=""
          if [ "${{ needs.detect-turbo-ts-checks.outputs.turbo-ts-checks-needed }}" = "false" ]; then
            TS_CHECK_SKIP_ALLOWED="skipped"
          fi
          if [ "$EVENT_NAME" = "push" ]; then
            # Main was validated by the protected merge queue. Only deployment
            # and environment verification run under the staging caller.
            TS_CHECK_SKIP_ALLOWED="skipped"
            FILE_SIZE_SKIP_ALLOWED="skipped"
          fi
          RUNNER_DEPLOY_SKIP_ALLOWED="true"
          if [ "${{ needs.prepare.outputs.turbo-runner-consumer-needed }}" = "true" ] ||
            [ "${{ needs.prepare.outputs.playwright-runner-consumer-needed }}" = "true" ]; then
            RUNNER_DEPLOY_SKIP_ALLOWED=""
          fi
          RUNNER_E2E_SKIP_ALLOWED="true"
          if [ "${{ needs.prepare.outputs.turbo-runner-consumer-needed }}" = "true" ]; then
            RUNNER_E2E_SKIP_ALLOWED=""
          fi
          CF_APP_SKIP_ALLOWED=""
          if [ "${{ needs.detect-turbo-ts-checks.outputs.ios-only }}" = "true" ]; then
            CF_APP_SKIP_ALLOWED="true"
          fi
          if [ "${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}" = "true" ]; then
            # External fork PRs cannot access runner infra secrets, so their
            # runner deployment and runner E2E jobs are expected to skip.
            RUNNER_DEPLOY_SKIP_ALLOWED="true"
            RUNNER_E2E_SKIP_ALLOWED="true"
            CF_APP_SKIP_ALLOWED="true"
          fi
          if [ "${{ github.actor == 'dependabot[bot]' }}" = "true" ]; then
            CF_APP_SKIP_ALLOWED="true"
          fi

          check_result() {
            local job="$1" result="$2" allow_skip="$3"
            if [ "$result" = "success" ]; then
              echo "✅ $job: $result"
            elif { [ "$allow_skip" = "skipped" ] || [ "$allow_skip" = "true" ]; } && [ "$result" = "skipped" ]; then
              echo "⏭️ $job: $result (allowed)"
            else
              if [ "$allow_skip" = "true" ]; then
                echo "::error::$job: expected success or skipped, got $result"
              else
                echo "::error::$job: expected success, got $result"
              fi
              FAILED=1
            fi
          }

          # Required foundation jobs: only 'success' is acceptable. File-size
          # validation is already complete for staging's merge-group SHA.
          check_result "detect-release" "${{ needs.detect-release.result }}" ""
          check_result "detect-turbo-ts-checks" "${{ needs.detect-turbo-ts-checks.result }}" ""
          check_result "prepare" "${{ needs.prepare.result }}" ""
          check_result "file-size-check" "${{ needs.file-size-check.result }}" "$FILE_SIZE_SKIP_ALLOWED"
          # Turbo checks: only 'success' is acceptable unless
          # detection confirmed a pure native change set, or staging is reusing
          # the merge group's completed code validation.
          check_result "lint-eslint" "${{ needs.lint-eslint.result }}" "$TS_CHECK_SKIP_ALLOWED"
          check_result "lint-style" "${{ needs.lint-style.result }}" "$TS_CHECK_SKIP_ALLOWED"
          check_result "lint-types" "${{ needs.lint-types.result }}" "$TS_CHECK_SKIP_ALLOWED"
          check_result "lint-type-app" "${{ needs.lint-type-app.result }}" "$TS_CHECK_SKIP_ALLOWED"
          check_result "lint-type-api" "${{ needs.lint-type-api.result }}" "$TS_CHECK_SKIP_ALLOWED"
          check_result "lint-format" "${{ needs.lint-format.result }}" "$TS_CHECK_SKIP_ALLOWED"
          check_result "lint-knip" "${{ needs.lint-knip.result }}" "$TS_CHECK_SKIP_ALLOWED"
          check_result "test-cli" "${{ needs.test-cli.result }}" "$TS_CHECK_SKIP_ALLOWED"
          check_result "test-app" "${{ needs.test-app.result }}" "$TS_CHECK_SKIP_ALLOWED"
          check_result "test-api" "${{ needs.test-api.result }}" "$TS_CHECK_SKIP_ALLOWED"
          check_result "test-other" "${{ needs.test-other.result }}" "$TS_CHECK_SKIP_ALLOWED"
          check_result "test-discord-gateway" "${{ needs.test-discord-gateway.result }}" "$TS_CHECK_SKIP_ALLOWED"

          # May-skip: 'success' or 'skipped' are both acceptable
          check_result "test-migrate" "${{ needs.test-migrate.result }}" "true"
          check_result "deploy-api" "${{ needs.deploy-api.result }}" "true"
          check_result "deploy-app" "${{ needs.deploy-app.result }}" "$CF_APP_SKIP_ALLOWED"
          check_result "deploy-stripe-listener" "${{ needs.deploy-stripe-listener.result }}" "true"
          check_result "deploy-cli" "${{ needs.deploy-cli.result }}" "$CF_APP_SKIP_ALLOWED"
          check_result "cli-e2e-02-browser" "${{ needs.cli-e2e-02-browser.result }}" "true"
          check_result "cli-e2e-02-playwright" "${{ needs.cli-e2e-02-playwright.result }}" "true"
          check_result "cli-e2e-01-serial" "${{ needs.cli-e2e-01-serial.result }}" "true"
          check_result "cli-e2e-03-runner-prepare" "${{ needs.cli-e2e-03-runner-prepare.result }}" "$RUNNER_E2E_SKIP_ALLOWED"
          check_result "cli-e2e-03-runner-bootstrap" "${{ needs.cli-e2e-03-runner-bootstrap.result }}" "$RUNNER_E2E_SKIP_ALLOWED"
          check_result "cli-e2e-03-runner" "${{ needs.cli-e2e-03-runner.result }}" "$RUNNER_E2E_SKIP_ALLOWED"
          check_result "deploy-runner-prepare" "${{ needs.deploy-runner-prepare.result }}" "$RUNNER_DEPLOY_SKIP_ALLOWED"
          check_result "deploy-runner-start" "${{ needs.deploy-runner-start.result }}" "$RUNNER_DEPLOY_SKIP_ALLOWED"

          echo "::endgroup::"
          exit $FAILED
  crates-detect-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: "${{ steps.check.outputs.skip }}"
    steps:
      - name: Check for release-please
        id: check
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          HEAD_REF: "${{ github.head_ref || '' }}"
          COMMIT_MSG: "${{ github.event.head_commit.message || '' }}"
          EVENT_NAME: "${{ github.event_name }}"
          MQ_HEAD_REF: "${{ github.event.merge_group.head_ref || '' }}"
          REPO: "${{ github.repository }}"
        run: |
          if [[ "$HEAD_REF" == release-please--branches--* ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Release-please PR detected (branch: $HEAD_REF)"
            exit 0
          fi
          if [[ "$EVENT_NAME" == "push" ]] && [[ "$COMMIT_MSG" == chore:\ release* ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Release-please push detected (message: $COMMIT_MSG)"
            exit 0
          fi
          if [[ "$EVENT_NAME" == "merge_group" ]] && [[ -n "$MQ_HEAD_REF" ]]; then
            PR_NUM=$(echo "$MQ_HEAD_REF" | grep -oE 'pr-[0-9]+' | head -1 | sed 's/pr-//')
            if [[ -n "$PR_NUM" ]]; then
              PR_BRANCH=$(gh pr view "$PR_NUM" --repo "$REPO" --json headRefName --jq .headRefName 2>/dev/null || echo "")
              if [[ "$PR_BRANCH" == release-please--branches--* ]]; then
                echo "skip=true" >> "$GITHUB_OUTPUT"
                echo "Release-please merge queue entry detected (PR #$PR_NUM, branch: $PR_BRANCH)"
                exit 0
              fi
            fi
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "Not a release-please context"
  crates-detect:
    needs:
      - crates-detect-release
    if: needs.crates-detect-release.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      any-changed: "${{ steps.detect.outputs.any-changed }}"
      ci-changed: "${{ steps.detect.outputs.ci-changed }}"
      mitm-addon-test-inputs-changed:
        "${{ steps.detect.outputs.mitm-addon-test-inputs-changed
        }}"
      mitm-addon-pricing-seed-changed:
        "${{ steps.detect.outputs.mitm-addon-pricing-seed-changed
        }}"
      runner-firewall-contract-inputs-changed:
        "${{ steps.detect.outputs.runner-firewall-contract-inputs-changed
        }}"
      api-contracts-rust-bindings-changed:
        "${{ steps.detect.outputs.api-contracts-rust-bindings-changed
        }}"
      ably-subscriber-changed: "${{ steps.detect.outputs.ably-subscriber-changed }}"
      api-contracts-changed: "${{ steps.detect.outputs.api-contracts-changed }}"
      runner-changed: "${{ steps.detect.outputs.runner-changed }}"
      sandbox-firecracker-changed:
        "${{ steps.detect.outputs.sandbox-firecracker-changed
        }}"
      nbd-cow-changed: "${{ steps.detect.outputs.nbd-cow-changed }}"
      guest-control-tests-changed:
        "${{ steps.detect.outputs.guest-control-tests-changed
        }}"
      crates-runner-consumer-needed:
        "${{ steps.runner-tests.outputs.crates-runner-consumer-needed
        }}"
      metal-job-ref: "${{ steps.runner-job-ref.outputs.job-ref }}"
      runner-image-job-ref: "${{ steps.runner-job-ref.outputs.image-job-ref }}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - name: Detect changed crates
        id: detect
        env:
          EVENT_NAME: "${{ github.event_name }}"
          CHECKOUT_REF: "${{ github.ref }}"
          PULL_REQUEST_BASE_SHA: "${{ github.event.pull_request.base.sha }}"
          MERGE_GROUP_BASE_SHA: "${{ github.event.merge_group.base_sha }}"
        run: |
          BASE_REF=$(.github/scripts/changed-base-ref.sh)
          echo "${{ github.event_name }} mode: comparing against base $BASE_REF"
          # Check if the workflow file or ansible playbooks changed
          if git diff --name-only "$BASE_REF" HEAD | grep -qE "^\.github/workflows/(ci|crates|runner-image)\.yml$|^\.github/actions/(setup-aws-cli|setup-r2-sccache|setup-ssh-tunnel|provision|report-memory-peak)/|^\.github/scripts/|^ansible/"; then
            echo "ci-changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "ci-changed=false" >> "$GITHUB_OUTPUT"
          fi

          # scripts/crate-changed.sh: exit 0=changed, 1=not changed, 2+=error
          check_crate() {
            rc=0
            ./scripts/crate-changed.sh "$1" "$BASE_REF" && rc=0 || rc=$?
            if [ $rc -eq 0 ]; then
              echo "$1-changed=true" >> "$GITHUB_OUTPUT"
            elif [ $rc -eq 1 ]; then
              echo "$1-changed=false" >> "$GITHUB_OUTPUT"
            else
              exit $rc
            fi
          }
          check_crate ably-subscriber
          check_crate api-contracts
          check_crate runner
          check_crate sandbox-firecracker
          check_crate nbd-cow
          check_crate guest-control-tests
          check_crate xtask

          # Aggregate: true if any crate or CI config changed
          if grep -q "=true" "$GITHUB_OUTPUT"; then
            echo "any-changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "any-changed=false" >> "$GITHUB_OUTPUT"
          fi

          # The api-contracts cross-language bindings are generated from
          # selected TypeScript contract files. Keep this legacy-named output
          # separate from any-changed so a TS-only contract edit runs the
          # drift check without forcing every Rust crate job to run.
          api_contracts_rust_bindings_changed=false
          changed_files="$(mktemp)"
          git diff --name-only "$BASE_REF" HEAD > "$changed_files"
          while IFS= read -r changed_file; do
            case "$changed_file" in
              crates/api-contracts/* | \
              crates/runner/mitm-addon/src/generated/* | \
              turbo/packages/api-contracts/package.json | \
              turbo/packages/api-contracts/tsconfig.json | \
              turbo/packages/api-contracts/tsconfig.python-bindings.json | \
              turbo/packages/api-contracts/src/contracts/* | \
              turbo/packages/api-contracts/src/python-bindings/* | \
              turbo/packages/api-contracts/src/rust-bindings/* | \
              turbo/packages/connectors/src/public-destination-policy.ts | \
              turbo/pnpm-lock.yaml)
                api_contracts_rust_bindings_changed=true
                break
                ;;
            esac
          done < "$changed_files"
          echo "api-contracts-rust-bindings-changed=$api_contracts_rust_bindings_changed" >> "$GITHUB_OUTPUT"
          rm -f "$changed_files"

          # Shared contract fixtures are stored under turbo but are read by
          # mitm-addon tests. Keep this separate from any-changed so a turbo-only
          # contract edit runs mitm-addon-test without forcing every crate job.
          if git diff --name-only "$BASE_REF" HEAD | grep -Eqx "turbo/packages/(connectors/src/__tests__/(firewall-semantics-contract|firewall-base-url-validation-contract|public-destination-policy-contract)|api-contracts/src/contracts/__tests__/fixtures/x-resource-observations)\\.json"; then
            echo "mitm-addon-test-inputs-changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "mitm-addon-test-inputs-changed=false" >> "$GITHUB_OUTPUT"
          fi

          # The Rust runner independently validates the shared firewall
          # contracts. Run its focused conformance tests when only a
          # TypeScript-owned corpus changes, without selecting runner images.
          if git diff --name-only "$BASE_REF" HEAD | grep -Eqx "turbo/packages/connectors/src/__tests__/(firewall-base-url-validation-contract|firewall-semantics-contract)\.json"; then
            echo "runner-firewall-contract-inputs-changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "runner-firewall-contract-inputs-changed=false" >> "$GITHUB_OUTPUT"
          fi

          # test_x_billing.py checks X connector usage buckets against the
          # API pricing seed. Keep this separate from any-changed so a
          # turbo-only pricing edit runs mitm-addon-test without forcing every
          # crate job to re-run.
          if git diff --name-only "$BASE_REF" HEAD | grep -qx "turbo/apps/api/src/scripts/dev-seed.ts"; then
            echo "mitm-addon-pricing-seed-changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "mitm-addon-pricing-seed-changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Select runner test consumer
        id: runner-tests
        env:
          CI_CHANGED: "${{ steps.detect.outputs.ci-changed }}"
          RUNNER_CHANGED: "${{ steps.detect.outputs.runner-changed }}"
        run: ".github/scripts/runner-image-context.sh crates-consumer"
      - name: Select runner job refs
        id: runner-job-ref
        env:
          METAL_HOSTS: "${{ secrets.AWS_METAL_RUNNER_HOSTS }}"
          EVENT_NAME: "${{ github.event_name }}"
          PR_NUMBER: "${{ github.event.pull_request.number }}"
          MQ_HEAD_REF: "${{ github.event.merge_group.head_ref }}"
          HEAD_SHA: "${{ github.sha }}"
          GH_TOKEN: "${{ github.token }}"
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # Skip runner deployment if the PR was already merged or closed.
            # A late pull_request:synchronize run can reach here after
            # cleanup.yml has already stopped the runner — deploying again
            # would resurrect a stale service that no cleanup will ever reach.
            #
            # Retry transient API failures, then fail loudly if the state
            # stays unknown. Silently skipping would let the PR merge without
            # runner coverage; fail-open would risk deploying a zombie runner.
            # A red check is the right middle ground — re-run the job once
            # the API recovers.
            STATE=$(curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors \
              -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/pulls/${PR_NUMBER}" \
              | jq -r .state)
            if [ -z "$STATE" ]; then
              echo "::error::Failed to query PR #${PR_NUMBER} state from GitHub API after retries"
              exit 1
            fi
            if [ "$STATE" != "open" ]; then
              echo "::warning::PR #${PR_NUMBER} is ${STATE}, skipping host/job-ref to prevent stale runner deployment"
              exit 0
            fi
            IMAGE_JOB_REF="pr-${PR_NUMBER}"
            JOB_REF="pr-${PR_NUMBER}-test"
          elif [ "$EVENT_NAME" = "merge_group" ]; then
            MQ_PR_NUM=$(echo "$MQ_HEAD_REF" | grep -oE 'pr-[0-9]+' | head -1 | sed 's/pr-//')
            if [ -n "$MQ_PR_NUM" ]; then
              IMAGE_JOB_REF="pr-${MQ_PR_NUM}"
              JOB_REF="pr-${MQ_PR_NUM}-test"
            else
              echo "::error::Failed to extract PR number from merge_group head_ref: $MQ_HEAD_REF"
              exit 1
            fi
          else
            SHORT_SHA=$(printf '%s' "$HEAD_SHA" | cut -c1-12)
            IMAGE_JOB_REF="staging-${SHORT_SHA}"
            JOB_REF="staging-test"
          fi

          HOSTS=$(echo "$METAL_HOSTS" | tr ',' '\n' | grep . || true)
          NUM_HOSTS=$(echo "$HOSTS" | grep -c . || true)
          if [ "$NUM_HOSTS" -lt 1 ]; then
            echo "No metal hosts configured, skipping runner job refs"
            exit 0
          fi
          {
            echo "job-ref=${JOB_REF}"
            echo "image-job-ref=${IMAGE_JOB_REF}"
          } >> "$GITHUB_OUTPUT"
          echo "Selected runner job refs: job-ref=${JOB_REF}, image-job-ref=${IMAGE_JOB_REF}"
  crates-runner-host-groups:
    runs-on: ubuntu-latest
    needs:
      - crates-detect
    if: |
      needs.crates-detect.outputs.metal-job-ref != '' && (
        needs.crates-detect.outputs.crates-runner-consumer-needed == 'true' ||
        needs.crates-detect.outputs.ci-changed == 'true' ||
        needs.crates-detect.outputs.nbd-cow-changed == 'true'
      )
    timeout-minutes: 5
    outputs:
      matrix: "${{ steps.groups.outputs.matrix }}"
      selected-target: "${{ steps.groups.outputs.selected-target }}"
      validation-matrix: "${{ steps.groups.outputs.validation-matrix }}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup SSH via Cloudflare Tunnel
        uses: "./.github/actions/setup-ssh-tunnel"
        with:
          ssh-user: "${{ vars.AWS_METAL_RUNNER_USER }}"
          ssh-hosts: "${{ secrets.AWS_METAL_RUNNER_HOSTS }}"
          ssh-key: "${{ secrets.AWS_METAL_RUNNER_SSH_KEY }}"
          cf-access-client-id: "${{ secrets.CF_ACCESS_CLIENT_ID }}"
          cf-access-client-secret: "${{ secrets.CF_ACCESS_CLIENT_SECRET }}"
      - name: Resolve runner host architecture groups
        id: groups
        env:
          AWS_METAL_RUNNER_HOSTS: "${{ secrets.AWS_METAL_RUNNER_HOSTS }}"
          METAL_USER: "${{ vars.AWS_METAL_RUNNER_USER }}"
          RUNNER_CONSUMER_NEEDED:
            "${{ needs.crates-detect.outputs.crates-runner-consumer-needed
            }}"
          SELECTION_KEY: "${{ needs.crates-detect.outputs.runner-image-job-ref }}"
        run: |
          if [ "$RUNNER_CONSUMER_NEEDED" = "true" ]; then
            PLAN=$(.github/scripts/runner-host-architecture-groups.sh validation-plan "$SELECTION_KEY")
            MATRIX=$(jq -c '.matrix' <<<"$PLAN")
            echo "selected-target=$(jq -r '.selectedTarget' <<<"$PLAN")" >> "$GITHUB_OUTPUT"
            echo "validation-matrix=$(jq -c '.validationMatrix' <<<"$PLAN")" >> "$GITHUB_OUTPUT"
          else
            MATRIX=$(.github/scripts/runner-host-architecture-groups.sh matrix)
          fi
          GROUP_COUNT=$(jq -r 'length' <<<"$MATRIX")
          if [ "$GROUP_COUNT" -lt 1 ]; then
            echo "::error::No runner host architecture groups found"
            exit 1
          fi

          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"

          echo "Runner host architecture groups:"
          jq . <<<"$MATRIX"
  crates-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ghcr.io/${{ github.repository_owner }}/vm0-toolchain-rust:20261009
    needs:
      - crates-detect
    if: needs.crates-detect.outputs.any-changed == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Configure Git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: crates -> target
          shared-key: check
          save-if: "${{ github.ref == 'refs/heads/main' }}"
      - name: Check Rust module paths
        run: |
          cd crates
          cargo xtask check-rust-path-attributes
      - name: Check formatting
        run: |
          cd crates
          cargo fmt --all -- --check
      - name: Run clippy
        run: |
          cd crates
          cargo clippy --all-targets --all-features
      - name: Lint guest-control-server production configuration
        if: |
          needs.crates-detect.outputs.guest-control-tests-changed == 'true' ||
          needs.crates-detect.outputs.ci-changed == 'true'
        run: |
          cd crates
          cargo clippy -p guest-control-server --release --no-default-features --all-targets
      - name: Build documentation
        run: |
          cd crates
          cargo doc --workspace --all-features --no-deps
      - name: Run ably-subscriber smoke test
        if: |
          needs.crates-detect.outputs.ably-subscriber-changed == 'true' ||
          needs.crates-detect.outputs.ci-changed == 'true'
        env:
          ABLY_API_KEY: "${{ secrets.ABLY_API_KEY }}"
        run: |
          cd crates
          cargo run -p ably-subscriber --example smoke_test
      - name: Run guest-control-server production configuration tests
        if: |
          needs.crates-detect.outputs.guest-control-tests-changed == 'true' ||
          needs.crates-detect.outputs.ci-changed == 'true'
        run: |
          test "$(id -u)" -eq 0
          for command in getent groupadd useradd install; do
            command -v "$command"
          done

          if getent passwd user >/dev/null || getent passwd 42420 >/dev/null; then
            echo "production identity test user conflicts with the CI image" >&2
            exit 1
          fi
          if getent group vm0-identity-primary >/dev/null || \
             getent group vm0-identity-extra >/dev/null || \
             getent group 42420 >/dev/null || \
             getent group 42421 >/dev/null; then
            echo "production identity test group conflicts with the CI image" >&2
            exit 1
          fi
          if [ -e /sbin/guest-write-file ]; then
            echo "production identity test helper conflicts with the CI image" >&2
            exit 1
          fi

          groupadd --gid 42420 vm0-identity-primary
          groupadd --gid 42421 vm0-identity-extra
          useradd --create-home --home-dir /home/user --uid 42420 \
            --gid vm0-identity-primary --groups vm0-identity-extra \
            --shell /bin/sh user
          install -d -m 0755 -o user -g vm0-identity-primary /home/user
          install -m 0755 \
            crates/guest-control-server/tests/fixtures/guest-write-file-identity-probe.sh \
            /sbin/guest-write-file

          cd crates
          cargo test -p guest-control-server --release --no-default-features \
            --lib \
            exec_operation::tests::stdout_drain_spawn_failure_returns_wait_failed_and_cleans_registry -- \
            --exact
          HOME=/root USER=root LOGNAME=root \
            cargo test -p guest-control-server --release --no-default-features \
              --test production_identity -- \
              --ignored --exact production_write_file_identity_matches_sudo_policy
          HOME=/root USER=root LOGNAME=root \
            cargo test -p guest-control-server --release --no-default-features \
              --test production_identity -- \
              --ignored --exact production_exec_identity_matches_sandbox_user
          HOME=/root USER=root LOGNAME=root \
            cargo test -p guest-control-server --release --no-default-features \
              --test production_identity -- \
              --ignored --exact production_env_script_remains_until_operation_cleanup
      - name: Report peak memory
        if: always()
        continue-on-error: true
        uses: "./.github/actions/report-memory-peak"
  crates-coverage:
    runs-on: ubuntu-latest-8-cores
    timeout-minutes: 20
    env:
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    container:
      image: ghcr.io/${{ github.repository_owner }}/vm0-toolchain-rust:20261009
    needs:
      - crates-detect
    if: needs.crates-detect.outputs.any-changed == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup R2 sccache
        id: sccache
        if:
          "(github.event_name != 'pull_request' || (github.event.pull_request.user.login
          != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository))"
        uses: "./.github/actions/setup-r2-sccache"
        with:
          architecture: x86_64
          r2-access-key-id: "${{ secrets.R2_ACCESS_KEY_ID }}"
          r2-secret-access-key: "${{ secrets.R2_SECRET_ACCESS_KEY }}"
          r2-account-id: "${{ vars.R2_ACCOUNT_ID }}"
          r2-bucket-name: "${{ vars.R2_USER_STORAGES_BUCKET_NAME }}"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: crates -> target
          shared-key: coverage-line-tables-only
          save-if: "${{ github.ref == 'refs/heads/main' }}"
      - name: Report coverage disk usage after cache restore
        continue-on-error: true
        run: |
          df -h "$GITHUB_WORKSPACE"
          for path in crates/target crates/target/llvm-cov-target; do
            if [ -e "$path" ]; then
              du -sh "$path"
            else
              echo "$path: not present"
            fi
          done
      - name: Install coverage tools
        uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a
        with:
          tool: cargo-llvm-cov@0.9.1,cargo-nextest@0.9.148
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          working-directory: crates/runner/mitm-addon
          enable-cache: true
      - name: Sync locked addon for Rust/Python control integration
        working-directory: crates/runner/mitm-addon
        run: uv sync --locked
      - name: Run tests with coverage
        run: |
          cd crates
          cargo llvm-cov nextest --all-targets --all-features --test-threads 8 --lcov --output-path lcov.info
      - name: Validate coverage report
        run: |
          report=crates/lcov.info
          source_files="${RUNNER_TEMP:-/tmp}/coverage-source-files.txt"
          [ -s "$report" ]
          awk -v root="${GITHUB_WORKSPACE}/" '
            index($0, "SF:") == 1 {
              path = substr($0, 4)
              if (index(path, root) == 1) {
                path = substr(path, length(root) + 1)
              }
              print path
            }
          ' "$report" | LC_ALL=C sort -u > "$source_files"
          source_file_count=$(wc -l < "$source_files" | tr -d ' ')
          [ "$source_file_count" -gt 0 ]
          source_file_digest=$(sha256sum "$source_files" | cut -d ' ' -f 1)
          echo "Coverage source files: $source_file_count"
          echo "Coverage source file set SHA-256: $source_file_digest"
      - name: Report final coverage disk usage
        if: success() || failure()
        continue-on-error: true
        run: |
          df -h "$GITHUB_WORKSPACE"
          for path in crates/target crates/target/llvm-cov-target; do
            if [ -e "$path" ]; then
              du -sh "$path"
            else
              echo "$path: not present"
            fi
          done
      - name: Upload coverage to Codecov
        if: success() || failure()
        continue-on-error: true
        timeout-minutes: 1
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
        with:
          token: "${{ secrets.CODECOV_TOKEN }}"
          files: crates/lcov.info
          flags: rust
      - name: Report sccache statistics
        if: always() && steps.sccache.outputs.started == 'true'
        run: ".github/scripts/report-sccache-stats.sh"
      - name: Report peak memory
        if: always()
        continue-on-error: true
        uses: "./.github/actions/report-memory-peak"
  crates-api-contracts-rust-bindings:
