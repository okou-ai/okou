  ci-gate-crates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - crates-detect-release
      - crates-detect
      - crates-check
      - crates-coverage
      - crates-api-contracts-rust-bindings
      - crates-runner-firewall-contract-test
      - crates-mitm-addon-test
      - crates-mitm-addon-packaged-control
      - crates-runner-host-groups
      - crates-runner-test-prepare-arm64
      - crates-runner-test-prepare-x86_64
      - crates-runner-image-architecture-manifest-arm64
      - crates-runner-image-architecture-manifest-x86_64
      - crates-runner-behavior-lane-a-arm64
      - crates-runner-behavior-lane-a-x86_64
      - crates-runner-behavior-lane-b-arm64
      - crates-runner-behavior-lane-b-x86_64
      - crates-runner-behavior-lane-c-arm64
      - crates-runner-behavior-lane-c-x86_64
      - crates-runner-behavior-lane-d-arm64
      - crates-runner-behavior-lane-d-x86_64
      - crates-host-cpu-fairness-test-arm64
      - crates-host-cpu-fairness-test-x86_64
      - crates-host-cpu-fairness-build
      - crates-guest-rpc-firecracker-test-arm64
      - crates-guest-rpc-firecracker-test-x86_64
      - crates-guest-rpc-firecracker-build
      - crates-nbd-cow-test
      - crates-runner-rootfs-process-test
    if: always()
    steps:
      - name: Validate CI results
        env:
          IS_RELEASE: "${{ needs.crates-detect-release.outputs.skip }}"
          COVERAGE_NEEDED: "${{ needs.crates-detect.outputs.any-changed == 'true' }}"
          FIREWALL_CONTRACT_NEEDED:
            "${{ needs.crates-detect.outputs.runner-firewall-contract-inputs-changed
            == 'true' }}"
          RUNNER_IMAGE_NEEDED:
            "${{ needs.crates-detect.outputs.metal-job-ref != ''
            && needs.crates-detect.outputs.crates-runner-consumer-needed == 'true' }}"
          CPU_FAIRNESS_NEEDED:
            "${{ needs.crates-detect.outputs.metal-job-ref != ''
            && needs.crates-detect.outputs.crates-runner-consumer-needed == 'true' &&
            (needs.crates-detect.outputs.sandbox-firecracker-changed == 'true' || needs.crates-detect.outputs.ci-changed
            == 'true') }}"
          IMAGE_VALIDATION_MATRIX:
            "${{ needs.crates-runner-host-groups.outputs.validation-matrix
            }}"
          SELECTED_TARGET:
            "${{ needs.crates-runner-host-groups.outputs.selected-target
            }}"
        run: |
          # Auto-pass for release-please PRs, commits, and merge queue entries
          if [[ "$IS_RELEASE" == "true" ]]; then
            echo "✅ Release-please — skipping CI gate"
            exit 0
          fi
          echo "::group::CI Gate Results"
          FAILED=0

          check_result() {
            local job="$1" result="$2" allow_skip="$3"
            if [ "$result" = "success" ]; then
              echo "✅ $job: $result"
            elif [ "$allow_skip" = "true" ] && [ "$result" = "skipped" ]; then
              echo "⏭️ $job: $result (allowed)"
            elif [ "$allow_skip" = "informational" ]; then
              echo "ℹ️ $job: $result (informational, not blocking)"
            else
              if [ "$allow_skip" = "true" ]; then
                echo "::error::$job: expected success or skipped, got $result"
              else
                echo "::error::$job: expected success, got $result"
              fi
              FAILED=1
            fi
          }

          # Must-succeed: only 'success' is acceptable
          check_result "detect" "${{ needs.crates-detect.result }}" ""

          RUNNER_IMAGE_ALLOW_SKIP=true
          OTHER_TARGETS_ALLOW_SKIP=true
          if [ "$RUNNER_IMAGE_NEEDED" = "true" ]; then
            RUNNER_IMAGE_ALLOW_SKIP=""
            if [ "$IMAGE_VALIDATION_MATRIX" != "[]" ]; then
              OTHER_TARGETS_ALLOW_SKIP=""
            fi
          fi

          # Require the selected owner of the shared firewall contract assertion.
          COVERAGE_ALLOW_SKIP=true
          FIREWALL_CONTRACT_ALLOW_SKIP=true
          if [ "$COVERAGE_NEEDED" = "true" ]; then
            COVERAGE_ALLOW_SKIP=""
          elif [ "$FIREWALL_CONTRACT_NEEDED" = "true" ]; then
            FIREWALL_CONTRACT_ALLOW_SKIP=""
          fi

          # May-skip only when the corresponding work was not selected.
          check_result "check" "${{ needs.crates-check.result }}" "true"
          check_result "coverage" "${{ needs.crates-coverage.result }}" "$COVERAGE_ALLOW_SKIP"
          check_result "api-contracts-rust-bindings" "${{ needs.crates-api-contracts-rust-bindings.result }}" "true"
          check_result "runner-firewall-contract-test" "${{ needs.crates-runner-firewall-contract-test.result }}" "$FIREWALL_CONTRACT_ALLOW_SKIP"
          check_result "mitm-addon-test" "${{ needs.crates-mitm-addon-test.result }}" "true"
          check_result "mitm-addon-packaged-control" "${{ needs.crates-mitm-addon-packaged-control.result }}" "true"
          check_result "runner-host-groups" "${{ needs.crates-runner-host-groups.result }}" "$RUNNER_IMAGE_ALLOW_SKIP"
          check_result "runner-test-prepare" "${{ (needs.crates-runner-host-groups.outputs.selected-target == 'aarch64-unknown-linux-musl' && needs.crates-runner-test-prepare-arm64.result || needs.crates-runner-test-prepare-x86_64.result) }}" "$RUNNER_IMAGE_ALLOW_SKIP"
          check_result "runner-image-architecture-manifest" "${{ (needs.crates-runner-host-groups.outputs.selected-target == 'aarch64-unknown-linux-musl' && needs.crates-runner-image-architecture-manifest-x86_64.result || needs.crates-runner-image-architecture-manifest-arm64.result) }}" "$OTHER_TARGETS_ALLOW_SKIP"
          check_result "runner-behavior-lane-a" "${{ (needs.crates-runner-host-groups.outputs.selected-target == 'aarch64-unknown-linux-musl' && needs.crates-runner-behavior-lane-a-arm64.result || needs.crates-runner-behavior-lane-a-x86_64.result) }}" "$RUNNER_IMAGE_ALLOW_SKIP"
          check_result "runner-behavior-lane-b" "${{ (needs.crates-runner-host-groups.outputs.selected-target == 'aarch64-unknown-linux-musl' && needs.crates-runner-behavior-lane-b-arm64.result || needs.crates-runner-behavior-lane-b-x86_64.result) }}" "$RUNNER_IMAGE_ALLOW_SKIP"
          check_result "runner-behavior-lane-c" "${{ (needs.crates-runner-host-groups.outputs.selected-target == 'aarch64-unknown-linux-musl' && needs.crates-runner-behavior-lane-c-arm64.result || needs.crates-runner-behavior-lane-c-x86_64.result) }}" "$RUNNER_IMAGE_ALLOW_SKIP"
          check_result "runner-behavior-lane-d" "${{ (needs.crates-runner-host-groups.outputs.selected-target == 'aarch64-unknown-linux-musl' && needs.crates-runner-behavior-lane-d-arm64.result || needs.crates-runner-behavior-lane-d-x86_64.result) }}" "$RUNNER_IMAGE_ALLOW_SKIP"
          # Selected native tests require both compilation and real execution.
          CPU_FAIRNESS_ALLOW_SKIP=true
          if [ "$CPU_FAIRNESS_NEEDED" = "true" ]; then
            CPU_FAIRNESS_ALLOW_SKIP=""
          fi
          check_result "host-cpu-fairness-build" "${{ needs.crates-host-cpu-fairness-build.result }}" "$CPU_FAIRNESS_ALLOW_SKIP"
          check_result "host-cpu-fairness-test" "${{ (needs.crates-runner-host-groups.outputs.selected-target == 'aarch64-unknown-linux-musl' && needs.crates-host-cpu-fairness-test-arm64.result || needs.crates-host-cpu-fairness-test-x86_64.result) }}" "$CPU_FAIRNESS_ALLOW_SKIP"
          check_result "guest-rpc-firecracker-build" "${{ needs.crates-guest-rpc-firecracker-build.result }}" "$RUNNER_IMAGE_ALLOW_SKIP"
          check_result "guest-rpc-firecracker-test" "${{ (needs.crates-runner-host-groups.outputs.selected-target == 'aarch64-unknown-linux-musl' && needs.crates-guest-rpc-firecracker-test-arm64.result || needs.crates-guest-rpc-firecracker-test-x86_64.result) }}" "$RUNNER_IMAGE_ALLOW_SKIP"
          check_result "nbd-cow-test" "${{ needs.crates-nbd-cow-test.result }}" "true"
          check_result "runner-rootfs-process-test" "${{ needs.crates-runner-rootfs-process-test.result }}" "true"

          echo "::endgroup::"
          if [ "$RUNNER_IMAGE_NEEDED" = true ]; then
            case "$SELECTED_TARGET" in
              aarch64-unknown-linux-musl|x86_64-unknown-linux-musl) ;;
              *) echo "::error::Missing or unsupported selected target"; FAILED=1 ;;
            esac
          fi
          if [ "$SELECTED_TARGET" != "aarch64-unknown-linux-musl" ]; then
            [ "${{ needs.crates-runner-test-prepare-arm64.result }}" = skipped ] || { echo "::error::Unselected runner-test-prepare (arm64) executed or was cancelled"; FAILED=1; }
            [ "${{ needs.crates-runner-behavior-lane-a-arm64.result }}" = skipped ] || { echo "::error::Unselected runner-behavior-lane-a (arm64) executed or was cancelled"; FAILED=1; }
            [ "${{ needs.crates-runner-behavior-lane-b-arm64.result }}" = skipped ] || { echo "::error::Unselected runner-behavior-lane-b (arm64) executed or was cancelled"; FAILED=1; }
            [ "${{ needs.crates-runner-behavior-lane-c-arm64.result }}" = skipped ] || { echo "::error::Unselected runner-behavior-lane-c (arm64) executed or was cancelled"; FAILED=1; }
            [ "${{ needs.crates-runner-behavior-lane-d-arm64.result }}" = skipped ] || { echo "::error::Unselected runner-behavior-lane-d (arm64) executed or was cancelled"; FAILED=1; }
            [ "${{ needs.crates-host-cpu-fairness-test-arm64.result }}" = skipped ] || { echo "::error::Unselected host-cpu-fairness-test (arm64) executed or was cancelled"; FAILED=1; }
            [ "${{ needs.crates-guest-rpc-firecracker-test-arm64.result }}" = skipped ] || { echo "::error::Unselected guest-rpc-firecracker-test (arm64) executed or was cancelled"; FAILED=1; }
          fi
          if [ "$SELECTED_TARGET" = "aarch64-unknown-linux-musl" ] || [ "$RUNNER_IMAGE_NEEDED" != true ]; then
            [ "${{ needs.crates-runner-image-architecture-manifest-arm64.result }}" = skipped ] || { echo "::error::Unselected manifest (arm64) executed or was cancelled"; FAILED=1; }
          fi

          if [ "$SELECTED_TARGET" != "x86_64-unknown-linux-musl" ]; then
            [ "${{ needs.crates-runner-test-prepare-x86_64.result }}" = skipped ] || { echo "::error::Unselected runner-test-prepare (x86_64) executed or was cancelled"; FAILED=1; }
            [ "${{ needs.crates-runner-behavior-lane-a-x86_64.result }}" = skipped ] || { echo "::error::Unselected runner-behavior-lane-a (x86_64) executed or was cancelled"; FAILED=1; }
            [ "${{ needs.crates-runner-behavior-lane-b-x86_64.result }}" = skipped ] || { echo "::error::Unselected runner-behavior-lane-b (x86_64) executed or was cancelled"; FAILED=1; }
            [ "${{ needs.crates-runner-behavior-lane-c-x86_64.result }}" = skipped ] || { echo "::error::Unselected runner-behavior-lane-c (x86_64) executed or was cancelled"; FAILED=1; }
            [ "${{ needs.crates-runner-behavior-lane-d-x86_64.result }}" = skipped ] || { echo "::error::Unselected runner-behavior-lane-d (x86_64) executed or was cancelled"; FAILED=1; }
            [ "${{ needs.crates-host-cpu-fairness-test-x86_64.result }}" = skipped ] || { echo "::error::Unselected host-cpu-fairness-test (x86_64) executed or was cancelled"; FAILED=1; }
            [ "${{ needs.crates-guest-rpc-firecracker-test-x86_64.result }}" = skipped ] || { echo "::error::Unselected guest-rpc-firecracker-test (x86_64) executed or was cancelled"; FAILED=1; }
          fi
          if [ "$SELECTED_TARGET" = "x86_64-unknown-linux-musl" ] || [ "$RUNNER_IMAGE_NEEDED" != true ]; then
            [ "${{ needs.crates-runner-image-architecture-manifest-x86_64.result }}" = skipped ] || { echo "::error::Unselected manifest (x86_64) executed or was cancelled"; FAILED=1; }
          fi


          exit $FAILED
