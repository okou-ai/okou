      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      (
        needs.prepare.outputs.turbo-runner-consumer-needed == 'true' ||
        needs.prepare.outputs.playwright-runner-consumer-needed == 'true'
      )) && (needs.prepare.result == 'success' && needs.image-prepare.result == 'success' && (needs.image-build-arm64.result == 'success' || (needs.image-prepare.outputs.image-matrix-arm64 == '[]' && needs.image-build-arm64.result == 'skipped')) && (needs.image-build-x86_64.result == 'success' || (needs.image-prepare.outputs.image-matrix-x86_64 == '[]' && needs.image-build-x86_64.result == 'skipped'))) }}
    outputs:
