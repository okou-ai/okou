      runner-dir: "${{ steps.manifest.outputs.runner-dir }}"
      runner-sha-map: "${{ steps.manifest.outputs.runner-sha-map }}"
      rootfs-hash-map: "${{ steps.manifest.outputs.rootfs-hash-map }}"
      snapshot-hash-map: "${{ steps.manifest.outputs.snapshot-hash-map }}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup SSH via Cloudflare Tunnel
