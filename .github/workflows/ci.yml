# Generated by .github/scripts/compose-ci-workflow.rb; edit the source modules instead.
name: CI
"on":
  pull_request:
  merge_group:
concurrency:
  group:
    "${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number)
    || format('merge-queue-{0}', github.run_id) }}"
  cancel-in-progress: "${{ github.event_name == 'pull_request' }}"
env:
  npm_config_audit: "false"
jobs:
  image-cancel-superseded:
    name: Cancel superseded merge-group CI
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Cancel and await older runs for the queued PR
        env:
          GH_TOKEN: "${{ github.token }}"
          GITHUB_REPOSITORY: "${{ github.repository }}"
          GITHUB_RUN_ID: "${{ github.run_id }}"
          GITHUB_SHA: "${{ github.sha }}"
          MERGE_GROUP_HEAD_REF: "${{ github.event.merge_group.head_ref }}"
          RUNNER_OWNER_EVENT_NAME: "${{ github.event_name }}"
          PR_NUMBER: "${{ github.event.pull_request.number }}"
        run: ".github/scripts/cancel-superseded-merge-group-runs.sh"
  image-prepare:
    if: "!cancelled()"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      release-skip: "${{ steps.identity.outputs.release-skip }}"
      skip-reason: "${{ steps.identity.outputs.skip-reason }}"
      job-ref: "${{ steps.identity.outputs.job-ref }}"
      head-sha: "${{ steps.identity.outputs.head-sha }}"
      producer-head-sha: "${{ steps.identity.outputs.producer-head-sha }}"
      pr-number: "${{ steps.identity.outputs.pr-number }}"
      pr-head-ref: "${{ steps.identity.outputs.pr-head-ref }}"
      turbo-runner-consumer-needed:
        "${{ steps.needed.outputs.turbo-runner-consumer-needed
        }}"
      playwright-runner-consumer-needed:
        "${{ steps.needed.outputs.playwright-runner-consumer-needed
        }}"
      crates-runner-consumer-needed:
        "${{ steps.needed.outputs.crates-runner-consumer-needed
        }}"
      runner-image-consumer-needed:
        "${{ steps.needed.outputs.runner-image-consumer-needed
        }}"
      runner-image-inputs-changed:
        "${{ steps.needed.outputs.runner-image-inputs-changed
        }}"
      current-runner-image-needed:
        "${{ steps.needed.outputs.current-runner-image-needed
        }}"
      stable-runner-image-allowed:
        "${{ steps.needed.outputs.stable-runner-image-allowed
        }}"
      image-selection-reason: "${{ steps.needed.outputs.image-selection-reason }}"
      runner-host-groups-matrix: "${{ steps.host-groups.outputs.matrix }}"
      runner-host-groups-configured:
        "${{ steps.host-group-presence.outputs.configured
        }}"
      runner-binary-compile-matrix:
        "${{ steps.binary-plan.outputs.compile-matrix
        }}"
      runner-binary-hit-matrix: "${{ steps.binary-plan.outputs.hit-matrix }}"
      runner-binary-hit-targets: "${{ steps.binary-plan.outputs.hit-targets }}"
      runner-binary-hit-references:
        "${{ steps.binary-plan.outputs.hit-references
        }}"
      runner-binary-miss-count: "${{ steps.binary-plan.outputs.miss-count }}"
      image-matrix-arm64: "${{ steps.image-partition.outputs.arm64 }}"
      image-matrix-x86_64: "${{ steps.image-partition.outputs.x86_64 }}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - name: Resolve runner image identity
        id: identity
        env:
          EVENT_NAME: "${{ github.event_name }}"
          PR_NUMBER: "${{ github.event.pull_request.number }}"
          HEAD_REF: "${{ github.head_ref || '' }}"
          COMMIT_MSG: "${{ github.event.head_commit.message || '' }}"
          MQ_HEAD_REF: "${{ github.event.merge_group.head_ref || '' }}"
          HEAD_SHA: "${{ github.sha }}"
          PRODUCER_HEAD_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
          REPO: "${{ github.repository }}"
          GH_TOKEN: "${{ github.token }}"
          CHECK_PR_OPEN: "true"
        run: ".github/scripts/runner-image-context.sh resolve"
      - name: Determine base ref
        id: base
        if: steps.identity.outputs.release-skip != 'true'
        env:
          EVENT_NAME: "${{ github.event_name }}"
          CHECKOUT_REF: "${{ github.ref }}"
          PULL_REQUEST_BASE_SHA: "${{ github.event.pull_request.base.sha }}"
          MERGE_GROUP_BASE_SHA: "${{ github.event.merge_group.base_sha }}"
        run: |
          BASE_REF=$(.github/scripts/changed-base-ref.sh)
          echo "base-ref=${BASE_REF}" >> "$GITHUB_OUTPUT"
          echo "Base ref: ${BASE_REF}"
      - name: Cache Turbo executable
        id: turbo-cache
        if: steps.identity.outputs.release-skip != 'true'
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306
        with:
          path: |
            ${{ runner.temp }}/runner-image-turbo-npm/_cacache
            ${{ runner.temp }}/runner-image-turbo-npm/_npx
          key:
            runner-image-turbo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/changed.sh')
            }}
      - name: Detect Turbo and Playwright runner image consumers
        id: turbo
        if: steps.identity.outputs.release-skip != 'true'
        env:
          BASE_REF: "${{ steps.base.outputs.base-ref }}"
          npm_config_cache: "${{ runner.temp }}/runner-image-turbo-npm"
          npm_config_prefer_offline: "true"
        run: |
          set -euo pipefail
          CHANGES_JSON=$(./scripts/changed.sh "$BASE_REF")
          web_changed=$(echo "$CHANGES_JSON" | jq -r '."web" // false')
          platform_changed=$(echo "$CHANGES_JSON" | jq -r '."@okouai/app" // false')
          api_changed=$(echo "$CHANGES_JSON" | jq -r '."api" // false')
          cli_changed=$(echo "$CHANGES_JSON" | jq -r '."@okouai/cli" // false')

          if git diff --name-only "$BASE_REF" HEAD | grep -q "^crates/"; then
            crates_changed=true
          else
            crates_changed=false
          fi

          if git diff --name-only "$BASE_REF" HEAD | grep -qE "^\.github/workflows/(ci|turbo|staging|benchmark|crates|runner-image)\.yml$|^\.github/actions/(setup-aws-cli|setup-r2-sccache|setup-ssh-tunnel|provision)/|^\.github/scripts/|^ansible/"; then
            ci_changed=true
          else
            ci_changed=false
          fi

          if git diff --name-only "$BASE_REF" HEAD | grep -q "^e2e/"; then
            e2e_changed=true
          else
            e2e_changed=false
          fi

          EVENT_NAME="${{ github.event_name }}" \
          WEB_CHANGED="$web_changed" \
          API_CHANGED="$api_changed" \
          CLI_CHANGED="$cli_changed" \
          CRATES_CHANGED="$crates_changed" \
          CI_CHANGED="$ci_changed" \
          E2E_CHANGED="$e2e_changed" \
          .github/scripts/runner-image-context.sh turbo-consumer

          API_CHANGED="$api_changed" \
          PLATFORM_CHANGED="$platform_changed" \
          CLI_CHANGED="$cli_changed" \
          CI_CHANGED="$ci_changed" \
          E2E_CHANGED="$e2e_changed" \
          .github/scripts/runner-image-context.sh playwright-consumer
      - name: Detect Crates runner image consumers
        id: crates
        if: steps.identity.outputs.release-skip != 'true'
        env:
          BASE_REF: "${{ steps.base.outputs.base-ref }}"
        run: |
          set -euo pipefail

          if git diff --name-only "$BASE_REF" HEAD | grep -qE "^\.github/workflows/(ci|crates|runner-image)\.yml$|^\.github/actions/(setup-aws-cli|setup-r2-sccache|setup-ssh-tunnel|provision)/|^\.github/scripts/|^ansible/"; then
            ci_changed=true
          else
            ci_changed=false
          fi
          echo "ci-changed=${ci_changed}" >> "$GITHUB_OUTPUT"

          check_crate() {
            local crate=$1
            local output=$2
            local var_name=$3
            local rc=0
            ./scripts/crate-changed.sh "$crate" "$BASE_REF" && rc=0 || rc=$?
            if [ "$rc" -eq 0 ]; then
              printf -v "$var_name" '%s' "true"
              echo "${output}=true" >> "$GITHUB_OUTPUT"
            elif [ "$rc" -eq 1 ]; then
              printf -v "$var_name" '%s' "false"
              echo "${output}=false" >> "$GITHUB_OUTPUT"
            else
              exit "$rc"
            fi
          }

          check_crate runner runner-changed runner_changed

          CI_CHANGED="$ci_changed" \
          RUNNER_CHANGED="$runner_changed" \
          .github/scripts/runner-image-context.sh crates-consumer
      - name: Detect runner image input changes
        id: image-inputs
        if: steps.identity.outputs.release-skip != 'true'
        env:
          BASE_REF: "${{ steps.base.outputs.base-ref }}"
        run: |
          set -euo pipefail

          runner_image_ci_changed=false
          if git diff --name-only "$BASE_REF" HEAD | grep -qE "^\.github/workflows/(ci|turbo|staging|benchmark|crates|runner-image)\.yml$|^\.github/actions/(setup-aws-cli|setup-r2-sccache|setup-ssh-tunnel|provision)/|^\.github/scripts/runner-binary-build/|^\.github/scripts/(prepare-runner-image|runner-binary-cache|runner-binary-cache-plan|runner-binary-download|runner-binary-transport|runner-host-architecture-groups|runner-image-context|runner-image-manifest|runner-image-target|wait-runner-image)\.sh$|^ansible/(ansible\.cfg|playbooks/(build-runner|provision-runner|promote-runner|rollback-runner)\.yml)$"; then
            runner_image_ci_changed=true
          fi

          RUNNER_CHANGED="${{ steps.crates.outputs.runner-changed }}" \
          RUNNER_IMAGE_CI_CHANGED="$runner_image_ci_changed" \
          .github/scripts/runner-image-context.sh image-inputs
      - name: Detect runner host architecture groups
        id: host-group-presence
        env:
          RELEASE_SKIP: "${{ steps.identity.outputs.release-skip }}"
          AWS_METAL_RUNNER_HOSTS: "${{ secrets.AWS_METAL_RUNNER_HOSTS }}"
        run: |
          set -euo pipefail
          if [ "$RELEASE_SKIP" = "true" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          configured=false
          if printf '%s\n' "$AWS_METAL_RUNNER_HOSTS" \
            | tr ',' '\n' \
            | grep '[^[:space:]]' >/dev/null; then
            configured=true
          fi
          echo "configured=${configured}" >> "$GITHUB_OUTPUT"
      - name: Determine whether runner image is needed
        id: needed
        env:
          EVENT_NAME: "${{ github.event_name }}"
          RELEASE_SKIP: "${{ steps.identity.outputs.release-skip }}"
          RUNNER_HOST_GROUPS_CONFIGURED:
            "${{ steps.host-group-presence.outputs.configured
            }}"
          TURBO_RUNNER_CONSUMER_NEEDED:
            "${{ steps.turbo.outputs.turbo-runner-consumer-needed
            }}"
          PLAYWRIGHT_RUNNER_CONSUMER_NEEDED:
            "${{ steps.turbo.outputs.playwright-runner-consumer-needed
            }}"
          CRATES_RUNNER_CONSUMER_NEEDED:
            "${{ steps.crates.outputs.crates-runner-consumer-needed
            }}"
          RUNNER_IMAGE_INPUTS_CHANGED:
            "${{ steps.image-inputs.outputs.runner-image-inputs-changed
            }}"
        run: ".github/scripts/runner-image-context.sh needed"
      - name: Setup SSH via Cloudflare Tunnel
        if: steps.needed.outputs.current-runner-image-needed == 'true'
        uses: "./.github/actions/setup-ssh-tunnel"
        with:
          ssh-user: "${{ vars.AWS_METAL_RUNNER_USER }}"
          ssh-hosts: "${{ secrets.AWS_METAL_RUNNER_HOSTS }}"
          ssh-key: "${{ secrets.AWS_METAL_RUNNER_SSH_KEY }}"
          cf-access-client-id: "${{ secrets.CF_ACCESS_CLIENT_ID }}"
          cf-access-client-secret: "${{ secrets.CF_ACCESS_CLIENT_SECRET }}"
      - name: Resolve runner host architecture groups
        id: host-groups
        env:
          CURRENT_RUNNER_IMAGE_NEEDED:
            "${{ steps.needed.outputs.current-runner-image-needed
            }}"
          AWS_METAL_RUNNER_HOSTS: "${{ secrets.AWS_METAL_RUNNER_HOSTS }}"
          METAL_USER: "${{ vars.AWS_METAL_RUNNER_USER }}"
        run: |
          set -euo pipefail
          if [ "$CURRENT_RUNNER_IMAGE_NEEDED" != "true" ]; then
            echo "matrix=[]" >> "$GITHUB_OUTPUT"
            echo "Skipping runner host architecture group resolution because runner image is not needed"
            exit 0
          fi

          matrix=$(.github/scripts/runner-host-architecture-groups.sh matrix)
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          echo "Configured runner host architecture groups: $(jq -r 'map(.id) | join(",") // ""' <<<"$matrix")"
      - name: Checkout source revision for CLI and Runner
        if: steps.needed.outputs.current-runner-image-needed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: "${{ steps.identity.outputs.head-sha }}"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        if: steps.needed.outputs.current-runner-image-needed == 'true'
        with:
          version: 10.33.4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        if: steps.needed.outputs.current-runner-image-needed == 'true'
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: turbo/pnpm-lock.yaml
      - name: Build private source-bound CLI bundle
        if: steps.needed.outputs.current-runner-image-needed == 'true'
        env:
          SOURCE_SHA: "${{ steps.identity.outputs.head-sha }}"
          DEFAULT_SENTRY_DSN: "${{ vars.SENTRY_DSN_CLI }}"
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          (cd turbo && pnpm install --frozen-lockfile --filter @okouai/cli...)
          (cd turbo && pnpm --filter @okouai/cli build)
          bash .github/scripts/build-okou-cli-artifact.sh "$SOURCE_SHA" runner-cli-intermediate
      - name: Upload private CLI build input
        if: steps.needed.outputs.current-runner-image-needed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: runner-cli-${{ github.run_id }}
          path: |
            runner-cli-intermediate/package.tgz
            runner-cli-intermediate/manifest.json
          overwrite: true
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Plan runner binary reuse
        id: binary-plan
        if: steps.needed.outputs.current-runner-image-needed == 'true'
        env:
          AWS_ACCESS_KEY_ID: "${{ secrets.R2_ACCESS_KEY_ID }}"
          AWS_DEFAULT_REGION: auto
          AWS_SECRET_ACCESS_KEY: "${{ secrets.R2_SECRET_ACCESS_KEY }}"
          GH_TOKEN: "${{ github.token }}"
          REPO: "${{ github.repository }}"
          R2_ACCOUNT_ID: "${{ vars.R2_ACCOUNT_ID }}"
          R2_BUCKET_NAME: "${{ vars.R2_USER_STORAGES_BUCKET_NAME }}"
          RESOLVE_OUTPUT_DIR: runner-binary-references
          RUNNER_BINARY_CACHE_FORCE_MISS: "${{ vars.RUNNER_BINARY_CACHE_FORCE_MISS }}"
          RUNNER_HOST_GROUPS_MATRIX: "${{ steps.host-groups.outputs.matrix }}"
          RUNNER_BINARY_GIT_REVISION: "${{ steps.identity.outputs.head-sha }}"
          GUEST_CLI_PATH: runner-cli-intermediate/package.tgz
          GUEST_CLI_MANIFEST_PATH: runner-cli-intermediate/manifest.json
        run: ".github/scripts/runner-binary-cache-plan.sh"
      - name: Partition image readiness by architecture
        id: image-partition
        env:
          IMAGE_NEEDED: "${{ steps.needed.outputs.current-runner-image-needed }}"
          IMAGE_MATRIX: "${{ steps.host-groups.outputs.matrix || '[]' }}"
        run: ".github/scripts/partition-ci-image-matrix.sh"
  image-compile:
    name: Compile runner binary (${{ matrix.label }})
    runs-on: ubuntu-latest-8-cores
    container:
      image: ghcr.io/${{ github.repository_owner }}/vm0-toolchain-rust:20261009
    permissions:
      actions: read
      contents: read
    needs:
      - image-prepare
    if: |-
      ${{
        !cancelled() &&
        needs.image-prepare.result == 'success' &&
        needs.image-prepare.outputs.current-runner-image-needed == 'true' &&
        needs.image-prepare.outputs.runner-binary-miss-count != '0'
      }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          "${{ fromJSON(needs.image-prepare.outputs.runner-binary-compile-matrix)
          }}"
    env:
      TARGET_TRIPLE: "${{ matrix.target }}"
      RUNNER_BINARY_ACTUAL_TOOLCHAIN_IMAGE: ghcr.io/${{ github.repository_owner }}/vm0-toolchain-rust:20261009
      RUNNER_BINARY_GIT_REVISION: "${{ needs.image-prepare.outputs.head-sha }}"
      GUEST_CLI_PATH: runner-cli-intermediate/package.tgz
      GUEST_CLI_MANIFEST_PATH: runner-cli-intermediate/manifest.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: "${{ needs.image-prepare.outputs.head-sha }}"
      - name: Download private CLI build input
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: runner-cli-${{ github.run_id }}
          path: runner-cli-intermediate
      - name: Configure git safe directory
        shell: bash
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Setup R2 sccache
        id: sccache
        uses: "./.github/actions/setup-r2-sccache"
        with:
          architecture: "${{ matrix.id }}"
          r2-access-key-id: "${{ secrets.R2_ACCESS_KEY_ID }}"
          r2-secret-access-key: "${{ secrets.R2_SECRET_ACCESS_KEY }}"
          r2-account-id: "${{ vars.R2_ACCOUNT_ID }}"
          r2-bucket-name: "${{ vars.R2_USER_STORAGES_BUCKET_NAME }}"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: crates -> target
          shared-key: "${{ matrix.cacheSuffix }}-ci"
          save-if: "${{ github.ref == 'refs/heads/main' }}"
      - name: Build runner binary
        id: build
        env:
          RUNNER_BINARY_METADATA_PATH: runner-binary-fresh/metadata.json
        run: ".github/scripts/runner-binary-build/build.sh build"
      - name: Stage runner binary transport
        env:
          EXPECTED_BINARY_INPUT_DIGEST:
            "${{ steps.build.outputs.binary-input-digest
            }}"
          EXPECTED_TARGET: "${{ matrix.target }}"
          FRESH_METADATA_PATH: runner-binary-fresh/metadata.json
          RUNNER_PATH: runner-binary-fresh/runner
        run: |
          install -m 755 \
            "crates/target/${TARGET_TRIPLE}/ci/runner" \
            "$RUNNER_PATH"
          .github/scripts/runner-binary-cache.sh fresh-validate
      - name: Install AWS CLI
        uses: "./.github/actions/setup-aws-cli"
      - name: Publish compiled runner binary to R2
        env:
          AWS_ACCESS_KEY_ID: "${{ secrets.R2_ACCESS_KEY_ID }}"
          AWS_DEFAULT_REGION: auto
          AWS_SECRET_ACCESS_KEY: "${{ secrets.R2_SECRET_ACCESS_KEY }}"
          R2_ACCOUNT_ID: "${{ vars.R2_ACCOUNT_ID }}"
          R2_BUCKET_NAME: "${{ vars.R2_USER_STORAGES_BUCKET_NAME }}"
          REPO: "${{ github.repository }}"
          CURRENT_RUN_ID: "${{ github.run_id }}"
          EXPECTED_BINARY_INPUT_DIGEST:
            "${{ steps.build.outputs.binary-input-digest
            }}"
          EXPECTED_TARGET: "${{ matrix.target }}"
          FRESH_METADATA_PATH: runner-binary-fresh/metadata.json
          RUNNER_PATH: runner-binary-fresh/runner
          OUTPUT_DIR: runner-binary-published
          PRODUCER_EVENT: "${{ github.event_name }}"
          PRODUCER_HEAD_SHA: "${{ needs.image-prepare.outputs.producer-head-sha }}"
          PRODUCER_PR_NUMBER: "${{ needs.image-prepare.outputs.pr-number }}"
          PRODUCER_RUN_ATTEMPT: "${{ github.run_attempt }}"
          PRODUCER_WORKFLOW_PATH: ".github/workflows/ci.yml"
        run: ".github/scripts/runner-binary-transport.sh publish"
      - name: Report sccache statistics
        if: always() && steps.sccache.outputs.started == 'true'
        run: ".github/scripts/report-sccache-stats.sh"
      - name: Report peak memory
        if: always()
        continue-on-error: true
        uses: "./.github/actions/report-memory-peak"
  image-prewarm-rust-cache:
    name: Prewarm runner dependency cache (${{ matrix.label }})
    runs-on: ubuntu-latest-8-cores
    container:
      image: ghcr.io/${{ github.repository_owner }}/vm0-toolchain-rust:20261009
    permissions:
      actions: read
      contents: read
    needs:
      - image-prepare
    if: |-
      ${{
        !cancelled() &&
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        needs.image-prepare.result == 'success' &&
        needs.image-prepare.outputs.current-runner-image-needed == 'true' &&
        needs.image-prepare.outputs.runner-binary-hit-matrix != '[]'
      }}
    continue-on-error: true
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          "${{ fromJSON(needs.image-prepare.outputs.runner-binary-hit-matrix)
          }}"
    env:
      TARGET_TRIPLE: "${{ matrix.target }}"
      RUNNER_BINARY_ACTUAL_TOOLCHAIN_IMAGE: ghcr.io/${{ github.repository_owner }}/vm0-toolchain-rust:20261009
      RUNNER_BINARY_GIT_REVISION: "${{ needs.image-prepare.outputs.head-sha }}"
      GUEST_CLI_PATH: runner-cli-intermediate/package.tgz
      GUEST_CLI_MANIFEST_PATH: runner-cli-intermediate/manifest.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: "${{ needs.image-prepare.outputs.head-sha }}"
      - name: Configure git safe directory
        shell: bash
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Setup R2 sccache
        id: sccache
        uses: "./.github/actions/setup-r2-sccache"
        with:
          architecture: "${{ matrix.id }}"
          r2-access-key-id: "${{ secrets.R2_ACCESS_KEY_ID }}"
          r2-secret-access-key: "${{ secrets.R2_SECRET_ACCESS_KEY }}"
          r2-account-id: "${{ vars.R2_ACCOUNT_ID }}"
          r2-bucket-name: "${{ vars.R2_USER_STORAGES_BUCKET_NAME }}"
      - name: Lookup runner dependency cache
        id: cache-lookup
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: crates -> target
          shared-key: "${{ matrix.cacheSuffix }}-ci"
          lookup-only: true
          save-if: false
      - name: Restore runner dependency cache
        id: cache-restore
        if: steps.cache-lookup.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: crates -> target
          shared-key: "${{ matrix.cacheSuffix }}-ci"
          save-if: "${{ github.ref == 'refs/heads/main' }}"
      - name: Download private CLI build input
        if:
          steps.cache-lookup.outputs.cache-hit != 'true' && steps.cache-restore.outputs.cache-hit
          != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: runner-cli-${{ github.run_id }}
          path: runner-cli-intermediate
      - name: Build runner dependency cache
        id: prewarm
        if:
          steps.cache-lookup.outputs.cache-hit != 'true' && steps.cache-restore.outputs.cache-hit
          != 'true'
        env:
          RUNNER_BINARY_METADATA_PATH: runner-rust-cache-prewarm/metadata.json
        run: ".github/scripts/runner-binary-build/build.sh build"
      - name: Summarize dependency cache prewarm
        if: always()
        env:
          LOOKUP_OUTCOME: "${{ steps.cache-lookup.outcome }}"
          LOOKUP_HIT: "${{ steps.cache-lookup.outputs.cache-hit }}"
          RESTORE_OUTCOME: "${{ steps.cache-restore.outcome }}"
          RESTORE_HIT: "${{ steps.cache-restore.outputs.cache-hit }}"
          PREWARM_OUTCOME: "${{ steps.prewarm.outcome }}"
        run: |
          {
            echo "### Runner dependency cache prewarm"
            echo
            echo "- Target: \`${TARGET_TRIPLE}\`"
            echo "- Lookup step: \`${LOOKUP_OUTCOME}\`; exact hit: \`${LOOKUP_HIT}\`"
            echo "- Restore step: \`${RESTORE_OUTCOME}\`; exact hit: \`${RESTORE_HIT}\`"
            echo "- Prewarm build: \`${PREWARM_OUTCOME}\`"
            echo "- Runner outputs are not published or deployed."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Report sccache statistics
        if: always() && steps.sccache.outputs.started == 'true'
        run: ".github/scripts/report-sccache-stats.sh"
      - name: Report peak memory
        if: always()
        continue-on-error: true
        uses: "./.github/actions/report-memory-peak"
  image-asset:
    name: Publish runner binary asset (${{ matrix.label }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    needs:
      - image-prepare
      - image-compile
    if: |-
      ${{
        always() &&
        needs.image-prepare.result == 'success' &&
        needs.image-prepare.outputs.current-runner-image-needed == 'true' &&
        needs.image-prepare.outputs.runner-binary-miss-count != '0' &&
        needs.image-compile.result == 'success'
      }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          "${{ fromJSON(needs.image-prepare.outputs.runner-binary-compile-matrix)
          }}"
    env:
      RUNNER_BINARY_GIT_REVISION: "${{ needs.image-prepare.outputs.head-sha }}"
      GUEST_CLI_PATH: runner-cli-intermediate/package.tgz
      GUEST_CLI_MANIFEST_PATH: runner-cli-intermediate/manifest.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: "${{ needs.image-prepare.outputs.head-sha }}"
      - name: Download private CLI build input
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: runner-cli-${{ github.run_id }}
          path: runner-cli-intermediate
      - name: Resolve runner binary input
        id: binary-input
        env:
          TARGET_TRIPLE: "${{ matrix.target }}"
        run: .github/scripts/runner-binary-build/digest.sh "$TARGET_TRIPLE"
      - name: Download compiled runner binary from R2
        id: transport
        env:
          AWS_ACCESS_KEY_ID: "${{ secrets.R2_ACCESS_KEY_ID }}"
          AWS_DEFAULT_REGION: auto
          AWS_SECRET_ACCESS_KEY: "${{ secrets.R2_SECRET_ACCESS_KEY }}"
          R2_ACCOUNT_ID: "${{ vars.R2_ACCOUNT_ID }}"
          R2_BUCKET_NAME: "${{ vars.R2_USER_STORAGES_BUCKET_NAME }}"
          REPO: "${{ github.repository }}"
          CURRENT_RUN_ID: "${{ github.run_id }}"
          EXPECTED_BINARY_INPUT_DIGEST:
            "${{ steps.binary-input.outputs.binary-input-digest
            }}"
          EXPECTED_TARGET: "${{ matrix.target }}"
          OUTPUT_DIR: runner-binary-fresh
        run: ".github/scripts/runner-binary-transport.sh download"
      - name: Validate fresh runner binary
        id: fresh
        env:
          EXPECTED_BINARY_INPUT_DIGEST:
            "${{ steps.binary-input.outputs.binary-input-digest
            }}"
          EXPECTED_TARGET: "${{ matrix.target }}"
          FRESH_METADATA_PATH: runner-binary-fresh/metadata.json
          RUNNER_PATH: runner-binary-fresh/runner
        run: ".github/scripts/runner-binary-cache.sh fresh-validate"
      - name: Resolve reusable candidate in shadow mode
        id: shadow
        env:
          CURRENT_EVENT: "${{ github.event_name }}"
          CURRENT_PR_HEAD_REF: "${{ needs.image-prepare.outputs.pr-head-ref }}"
          CURRENT_PR_NUMBER: "${{ needs.image-prepare.outputs.pr-number }}"
          CURRENT_RUN_ID: "${{ github.run_id }}"
          DEFAULT_BRANCH: "${{ github.event.repository.default_branch }}"
          EXPECTED_BINARY_INPUT_DIGEST:
            "${{ steps.binary-input.outputs.binary-input-digest
            }}"
          EXPECTED_TARGET: "${{ matrix.target }}"
          FRESH_METADATA_PATH: runner-binary-fresh/metadata.json
          GH_TOKEN: "${{ github.token }}"
          REPO: "${{ github.repository }}"
          RUNNER_PATH: runner-binary-fresh/runner
          SHADOW_OUTPUT_DIR: runner-binary-shadow
        run: |
          started_at=$(date +%s)
          .github/scripts/runner-binary-cache.sh shadow-resolve
          echo "duration-seconds=$(($(date +%s) - started_at))" >> "$GITHUB_OUTPUT"
      - name: Resolve reusable artifact name
        id: artifact
        env:
          EXPECTED_BINARY_INPUT_DIGEST:
            "${{ steps.binary-input.outputs.binary-input-digest
            }}"
          EXPECTED_TARGET: "${{ matrix.target }}"
        run: ".github/scripts/runner-binary-cache.sh artifact-name"
      - name: Upload reusable runner binary manifest
        id: manifest-upload
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: "${{ steps.artifact.outputs.artifact-name }}"
          path: runner-binary-fresh/manifest.json
          if-no-files-found: error
          retention-days: 7
      - name: Summarize runner binary asset
        if: always()
        env:
          BINARY_INPUT_DIGEST: "${{ steps.binary-input.outputs.binary-input-digest }}"
          FRESH_VALIDATION: "${{ steps.fresh.outcome }}"
          MANIFEST_UPLOAD: "${{ steps.manifest-upload.outcome }}"
          TRANSPORT_OUTCOME: "${{ steps.transport.outcome }}"
          RUNNER_SIZE_BYTES: "${{ steps.fresh.outputs.runner-size-bytes }}"
          SHADOW_OUTCOME: "${{ steps.shadow.outputs.shadow-outcome }}"
          SHADOW_REASON: "${{ steps.shadow.outputs.shadow-reason }}"
          SHADOW_SECONDS: "${{ steps.shadow.outputs.duration-seconds }}"
          SHADOW_SOURCE: "${{ steps.shadow.outputs.shadow-source }}"
          TARGET_TRIPLE: "${{ matrix.target }}"
        run: |
          {
            echo "### Runner binary asset"
            echo
            echo "- Target: \`${TARGET_TRIPLE}\`"
            echo "- Input digest: \`${BINARY_INPUT_DIGEST}\`"
            echo "- Fresh runner bytes: \`${RUNNER_SIZE_BYTES}\`"
            echo "- Fresh validation: \`${FRESH_VALIDATION:-not-run}\`"
            echo "- Shadow outcome: \`${SHADOW_OUTCOME:-not-run}\`"
            echo "- Shadow source: \`${SHADOW_SOURCE:-none}\`"
            echo "- Shadow reason: \`${SHADOW_REASON:-not-run}\`"
            echo "- Shadow duration: \`${SHADOW_SECONDS:-0}s\`"
            echo "- R2 transport: \`${TRANSPORT_OUTCOME:-not-run}\`"
            echo "- Manifest upload: \`${MANIFEST_UPLOAD:-not-run}\`"
          } >> "$GITHUB_STEP_SUMMARY"
  image-build-arm64:
    name: Build runner image (${{ matrix.label }})
