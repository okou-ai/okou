        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: "${{ steps.artifact.outputs.artifact-name }}"
          path: runner-image-manifest/manifest.json
          overwrite: true
          retention-days: 7
