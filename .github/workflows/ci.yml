  lint-type-app:
    needs:
      - detect-turbo-ts-checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if:
      github.event_name != 'push' && needs.detect-turbo-ts-checks.outputs.turbo-ts-checks-needed
      == 'true'
    env:
      TSC_CHECKERS: "2"
    container:
      image: ghcr.io/${{ github.repository_owner }}/vm0-toolchain:20261009
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: "./.github/actions/toolchain-init"
      - name: Type Check (@okouai/app)
        working-directory: turbo
        run: |
          set +e
          result_file=".memory-results/app-check-types.jsonl"
          rm -f "$result_file"

          node scripts/measure-memory.mjs \
            --label ci-app-check-types \
            --json "$result_file" \
            -- pnpm --filter @okouai/app run check-types
          status=$?

          # shellcheck disable=SC2016
          node -e '
            const fs = require("node:fs");
            const file = process.argv[1];
            if (!fs.existsSync(file)) {
              process.exit(0);
            }

            const lines = fs.readFileSync(file, "utf8").trim().split(/\n/).filter(Boolean);
            if (lines.length === 0) {
              process.exit(0);
            }

            const result = JSON.parse(lines[lines.length - 1]);
            const durationSeconds = (result.durationMs / 1000).toFixed(1);
            const summary = [
              "### Type Check (@okouai/app) memory",
              "",
              `- Peak RSS: ${result.peakRssMiB} MiB (${result.peakRssKiB} KiB)`,
              `- Duration: ${durationSeconds}s`,
              `- Exit code: ${result.exitCode}`,
              "",
            ].join("\n");

            console.log(`Peak RSS (@okouai/app check-types): ${result.peakRssMiB} MiB (${result.peakRssKiB} KiB), duration ${durationSeconds}s`);
            if (process.env.GITHUB_STEP_SUMMARY) {
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
            }
          ' "$result_file"

          exit "$status"
