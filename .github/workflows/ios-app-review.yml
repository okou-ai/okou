name: Submit iOS for App Review
run-name: Submit iOS ${{ inputs.version }} (${{ inputs.build }}) for App Review

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact iOS marketing version (x.y.z)
        type: string
        required: true
      build:
        description: Exact TestFlight build number
        type: string
        required: true

env:
  npm_config_audit: "false"

permissions:
  contents: read
  actions: read
  statuses: write

concurrency:
  group: ios-app-review-submit
  cancel-in-progress: false

jobs:
  submit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      IOS_VERSION: ${{ inputs.version }}
      IOS_BUILD_NUMBER: ${{ inputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/release
            ios/scripts
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
      - name: Verify the TestFlight build and submit it for manual release
        env:
          GH_TOKEN: ${{ github.token }}
          IOS_INTERNAL_GROUP_NAME: ${{ vars.IOS_INTERNAL_GROUP_NAME }}
          IOS_EXTERNAL_GROUP_NAMES: ${{ vars.IOS_EXTERNAL_GROUP_NAMES }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.IOS_APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.IOS_APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.IOS_APP_STORE_CONNECT_API_ISSUER_ID }}
        run: node .github/scripts/release/ios-app-review.mjs
