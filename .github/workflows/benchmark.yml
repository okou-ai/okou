name: Benchmark

# PR comparisons and main baselines do not occupy the staging deployment lock
# or delay merge-group validation.
on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: benchmark-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  npm_config_audit: "false"

jobs:
  detect-turbo-ts-checks:
    if: |
      !startsWith(github.head_ref, 'release-please--branches--') &&
      (github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore: release'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      turbo-ts-checks-needed: ${{ steps.detect.outputs.turbo-ts-checks-needed }}
      runner-preconnection-needed: ${{ steps.detect.outputs.runner-preconnection-needed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Detect Turbo TypeScript check need
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHECKOUT_REF: ${{ github.ref }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          selection=$(bash .github/scripts/checks/detect-native-only.sh)
          printf '%s\n' "$selection" | tee -a "$GITHUB_OUTPUT"
          base=$(bash .github/scripts/checks/changed-base-ref.sh)
          changes=$(git diff --no-renames --name-only "$base" HEAD -- \
            .github/workflows/benchmark.yml \
            turbo/apps/api/scripts/bench-runner-preconnection.mjs \
            turbo/apps/api/src/signals/external/runner-ingress.ts \
            turbo/apps/api/src/signals/services/direct-run-dispatch.service.ts)
          if [[ -n "$changes" ]]; then
            echo 'runner-preconnection-needed=true' >> "$GITHUB_OUTPUT"
          fi

  bench-runner-preconnection:
    needs: [detect-turbo-ts-checks]
    if: needs.detect-turbo-ts-checks.outputs.runner-preconnection-needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
      - name: Compare Runner dispatch connection warmup
        run: |
          set -euo pipefail
          fixture=$(mktemp -d)
          trap 'rm -rf "$fixture"' EXIT
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj /CN=localhost -addext subjectAltName=DNS:localhost \
            -keyout "$fixture/key.pem" -out "$fixture/cert.pem"
          NODE_EXTRA_CA_CERTS="$fixture/cert.pem" \
            node turbo/apps/api/scripts/bench-runner-preconnection.mjs \
              "$fixture/key.pem" "$fixture/cert.pem"

  bench-app:
    needs: [detect-turbo-ts-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: needs.detect-turbo-ts-checks.outputs.turbo-ts-checks-needed == 'true'
    container:
      image: ghcr.io/${{ github.repository_owner }}/vm0-toolchain:20261116
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/toolchain-init
      - name: Bench App
        working-directory: turbo
        run: pnpm -F @okouai/app exec vitest bench --run --reporter=default --reporter=json --reporter=./scripts/bench-p90-reporter.ts --outputFile=bench-results.json
      - name: Print bench summary
        if: success() || failure()
        working-directory: turbo/apps/platform
        run: node scripts/print-bench-summary.mjs bench-results-p90.json
      - name: Upload bench results
        if: success() || failure()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-app-results
          path: |
            turbo/apps/platform/bench-results.json
            turbo/apps/platform/bench-results-p90.json
          if-no-files-found: warn
          retention-days: 7
