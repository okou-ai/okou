name: Publish Presentation Template Archives

run-name: Publish ${{ inputs.format }} Template-artifact/main presentation archives by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      format:
        description: Presentation archive format
        type: choice
        required: true
        default: html
        options:
          - html
          - pptx
      initialize_missing_heads:
        description: Allow first-time PPTX resource HEAD creation
        type: boolean
        default: false

concurrency:
  group: publish-presentation-template-archives
  cancel-in-progress: false

permissions:
  contents: read

env:
  npm_config_audit: "false"
  PRESENTATION_OUTPUT_FORMAT: ${{ inputs.format }}
  PRESENTATION_INITIALIZE_MISSING_HEADS: ${{ inputs.initialize_missing_heads }}

defaults:
  run:
    shell: bash

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      source_commit: ${{ steps.source.outputs.commit }}
    steps:
      - name: Check out dispatched vm0 commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Select presentation package family
        id: format
        run: |
          set -euo pipefail
          case "$PRESENTATION_OUTPUT_FORMAT" in
            html) source_directory=Template-Presentation ;;
            pptx) source_directory=Template-Presentation-Native ;;
            *) echo "::error::Unsupported presentation output format."; exit 1 ;;
          esac
          case "$PRESENTATION_INITIALIZE_MISSING_HEADS" in
            true|false) ;;
            *) echo "::error::HEAD initialization must be a boolean."; exit 1 ;;
          esac
          if [[ "$PRESENTATION_INITIALIZE_MISSING_HEADS" == true && "$PRESENTATION_OUTPUT_FORMAT" != pptx ]]; then
            echo "::error::First-time HEAD creation is only supported for PPTX resources."
            exit 1
          fi
          printf 'source_directory=%s\n' "$source_directory" >> "$GITHUB_OUTPUT"
          printf '### Package family\n\n- Format: %s\n- Initialize missing HEADs: %s\n\n' \
            "$PRESENTATION_OUTPUT_FORMAT" "$PRESENTATION_INITIALIZE_MISSING_HEADS" >> "$GITHUB_STEP_SUMMARY"

      - name: Normalize GitHub App private key
        id: source-private-key
        env:
          SOURCE_PRIVATE_KEY_PEM: ${{ secrets.OKOU_CI_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          private_key="$(
            printf '%s' "$SOURCE_PRIVATE_KEY_PEM" |
              bash .github/scripts/normalize-github-app-private-key.sh
          )"
          printf '::add-mask::%s\n' "$private_key"
          printf 'private-key=%s\n' "$private_key" >> "$GITHUB_OUTPUT"

      - name: Create read token for Template-artifact
        id: source-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.OKOU_CI_APP_ID }}
          private-key: ${{ steps.source-private-key.outputs.private-key }}
          owner: ${{ github.repository_owner }}
          repositories: Template-artifact
          permission-contents: read

      - name: Check out latest Template-artifact main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/Template-artifact
          ref: main
          path: template-artifact
          token: ${{ steps.source-token.outputs.token }}
          persist-credentials: false

      - name: Record exact source commit
        id: source
        run: |
          set -euo pipefail
          commit=$(git -C template-artifact rev-parse HEAD)
          if [[ ! "$commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Template-artifact checkout did not resolve to a full commit SHA."
            exit 1
          fi
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"
          printf '### Source\n\n- [%s/Template-artifact@%s](https://github.com/%s/Template-artifact/commit/%s)\n' \
            "$GITHUB_REPOSITORY_OWNER" "$commit" "$GITHUB_REPOSITORY_OWNER" "$commit" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.22.1

      - name: Install release tooling
        id: tooling
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/presentation-template-release"
          mkdir -p "$release_dir"
          cp .github/scripts/release/publish-presentation-template-archives.mjs "$release_dir/"
          cp .github/scripts/release/presentation-template-release.json "$release_dir/"
          cp .github/scripts/release/presentation-template-release-pptx.json "$release_dir/"
          cp -R .github/scripts/release/presentation-template-release "$release_dir/"
          cd "$release_dir"
          npm init --yes >/dev/null
          npm install --ignore-scripts --no-fund tar@7.5.22
          printf 'path=%s\n' "$release_dir" >> "$GITHUB_OUTPUT"

      - name: Test release tooling
        env:
          PRESENTATION_TEMPLATE_RELEASE_TOOL: ${{ steps.tooling.outputs.path }}/publish-presentation-template-archives.mjs
        run: node --test .github/scripts/__tests__/publish-presentation-template-archives.test.mjs

      - name: Build deterministic archives
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          set -euo pipefail
          output_dir="$RUNNER_TEMP/presentation-template-output"
          node "${{ steps.tooling.outputs.path }}/publish-presentation-template-archives.mjs" build \
            --format "$PRESENTATION_OUTPUT_FORMAT" \
            --source-dir "$GITHUB_WORKSPACE/template-artifact/${{ steps.format.outputs.source_directory }}" \
            --source-commit "$SOURCE_COMMIT" \
            --output-dir "$output_dir"

      - name: Verify release bundle
        run: |
          set -euo pipefail
          node "${{ steps.tooling.outputs.path }}/publish-presentation-template-archives.mjs" verify \
            --format "$PRESENTATION_OUTPUT_FORMAT" \
            --output-dir "$RUNNER_TEMP/presentation-template-output"

      - name: Upload verified release bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: presentation-template-archives-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/presentation-template-output
          if-no-files-found: error
          retention-days: 30

      - name: Summarize bundle
        run: |
          set -euo pipefail
          publication="$RUNNER_TEMP/presentation-template-output/publication.json"
          package_count=$(jq '.packages | length' "$publication")
          printf '\n### Verified bundle\n\n- Format: %s\n- Packages: %s\n' \
            "$PRESENTATION_OUTPUT_FORMAT" "$package_count" >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
      R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
      R2_PRIVATE_ARTIFACTS_BUCKET_NAME: ${{ vars.R2_PRIVATE_ARTIFACTS_BUCKET_NAME }}
      R2_PRIVATE_ARTIFACTS_ACCESS_KEY_ID: ${{ secrets.R2_PRIVATE_ARTIFACTS_ACCESS_KEY_ID }}
      R2_PRIVATE_ARTIFACTS_SECRET_ACCESS_KEY: ${{ secrets.R2_PRIVATE_ARTIFACTS_SECRET_ACCESS_KEY }}
    steps:
      - name: Check out dispatched vm0 commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify independent Registry reader
        run: bash .github/scripts/release/verify-registry-publisher-cutover.sh

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.22.1

      - name: Install release tooling
        id: tooling
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/presentation-template-release"
          mkdir -p "$release_dir"
          cp .github/scripts/release/publish-presentation-template-archives.mjs "$release_dir/"
          cp .github/scripts/release/presentation-template-release.json "$release_dir/"
          cp .github/scripts/release/presentation-template-release-pptx.json "$release_dir/"
          cp -R .github/scripts/release/presentation-template-release "$release_dir/"
          cd "$release_dir"
          npm init --yes >/dev/null
          npm install --ignore-scripts --no-fund \
            @aws-sdk/client-s3@3.1116.0 \
            postgres@3.4.9 \
            tar@7.5.22
          printf 'path=%s\n' "$release_dir" >> "$GITHUB_OUTPUT"

      - name: Download verified release bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: presentation-template-archives-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/presentation-template-output

      - name: Verify release bundle
        run: |
          set -euo pipefail
          node "${{ steps.tooling.outputs.path }}/publish-presentation-template-archives.mjs" verify \
            --format "$PRESENTATION_OUTPUT_FORMAT" \
            --output-dir "$RUNNER_TEMP/presentation-template-output"

      - name: Publish immutable Registry archives and update HEADs
        run: |
          set -euo pipefail
          : "${NEON_API_KEY:?NEON_API_KEY is required}"
          : "${NEON_PROJECT_ID:?NEON_PROJECT_ID is required}"
          : "${R2_ACCOUNT_ID:?R2_ACCOUNT_ID is required}"
          : "${R2_PRIVATE_ARTIFACTS_BUCKET_NAME:?R2_PRIVATE_ARTIFACTS_BUCKET_NAME is required}"
          : "${R2_PRIVATE_ARTIFACTS_ACCESS_KEY_ID:?R2_PRIVATE_ARTIFACTS_ACCESS_KEY_ID is required}"
          : "${R2_PRIVATE_ARTIFACTS_SECRET_ACCESS_KEY:?R2_PRIVATE_ARTIFACTS_SECRET_ACCESS_KEY is required}"
          if [[ "$R2_PRIVATE_ARTIFACTS_BUCKET_NAME" != user-artifact-private-prod ]]; then
            echo "::error::Registry publication requires the approved private production bucket."
            exit 1
          fi

          branches=$(curl -fsS \
            "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/branches" \
            -H "Authorization: Bearer ${NEON_API_KEY}")
          branch_id=$(jq -r 'first(.branches[] | select(.name == "production") | .id) // empty' <<< "$branches")
          if [[ -z "$branch_id" ]]; then
            echo "::error::The Neon production branch was not found."
            exit 1
          fi
          connection=$(curl -fsS \
            "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/connection_uri?branch_id=${branch_id}&database_name=neondb&role_name=neondb_owner" \
            -H "Authorization: Bearer ${NEON_API_KEY}")
          database_url=$(jq -r '.uri // empty' <<< "$connection")
          if [[ -z "$database_url" ]]; then
            echo "::error::Neon did not return a production database URL."
            exit 1
          fi
          mask_value="${database_url//%/%25}"
          mask_value="${mask_value//$'\r'/%0D}"
          mask_value="${mask_value//$'\n'/%0A}"
          printf '::add-mask::%s\n' "$mask_value"

          publish_args=(publish --format "$PRESENTATION_OUTPUT_FORMAT" \
            --output-dir "$RUNNER_TEMP/presentation-template-output")
          if [[ "$PRESENTATION_INITIALIZE_MISSING_HEADS" == true ]]; then
            publish_args+=(--initialize-missing-heads)
          fi
          DATABASE_URL="$database_url" \
            node "${{ steps.tooling.outputs.path }}/publish-presentation-template-archives.mjs" "${publish_args[@]}"

      - name: Summarize publication
        env:
          SOURCE_COMMIT: ${{ needs.build.outputs.source_commit }}
        run: |
          printf '### Production publication complete\n\n- Format: %s\n- Source commit: %s\n- Private immutable archives and independent Registry index/HEADs verified.\n' \
            "$PRESENTATION_OUTPUT_FORMAT" "$SOURCE_COMMIT" >> "$GITHUB_STEP_SUMMARY"
