name: API Greedy Deletion Experiment
on:
  push:
    branches: [perf/api-delete-greedy-20261020]
permissions:
  contents: read
  packages: read
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    container:
      image: ghcr.io/okou-ai/vm0-toolchain:20261009
    services:
      postgres:
        image: ghcr.io/okou-ai/pgvector@sha256:d229d4e975e7102b7df031cbfcf5c4463ee21c84d0373d7a736191a2603dddfd
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 3s
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/toolchain-init
      - name: Run Database Migrations
        working-directory: turbo
        env:
          DATABASE_URL: postgresql://postgres@postgres:5432/postgres
        run: pnpm --filter @okouai/db db:migrate
      - name: Measure actual deletion and reshared API tests
        env:
          DATABASE_URL: postgresql://postgres@postgres:5432/postgres
          LAB_SHARD: ${{ matrix.shard }}
        run: python3 .github/perf-api-delete/run.py
      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paired-lab-${{ matrix.shard }}
          path: lab-results/
          retention-days: 7
