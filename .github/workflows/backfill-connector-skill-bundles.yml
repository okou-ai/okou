name: Backfill Production Connector Skill Bundles

run-name: ${{ inputs.mode }} production Connector Skill bundles by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Generate a read-only plan, or apply one separately reviewed plan
        type: choice
        options: [plan, apply]
        default: plan
        required: true
      plan_run_id:
        description: Successful plan run ID (apply only; same main commit)
        type: string
      plan_sha256:
        description: Reviewed plan SHA-256 (apply only)
        type: string

permissions:
  contents: read
  actions: read

env:
  npm_config_audit: "false"

concurrency:
  group: production-connector-skill-backfill
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  backfill:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    container: ghcr.io/${{ github.repository_owner }}/vm0-toolchain:20261023
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/toolchain-init

      - name: Download the reviewed plan
        if: inputs.mode == 'apply'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: connector-skill-plan-${{ inputs.plan_run_id }}
          run-id: ${{ inputs.plan_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/connector-skill-reviewed-plan

      - name: Execute the bounded production operator
        working-directory: turbo/packages/db
        env:
          BACKFILL_MODE: ${{ inputs.mode }}
          PLAN_RUN_ID: ${{ inputs.plan_run_id }}
          PLAN_SHA256: ${{ inputs.plan_sha256 }}
          PLAN_DIRECTORY: ${{ runner.temp }}/connector-skill-reviewed-plan
          RECEIPTS_DIRECTORY: ${{ runner.temp }}/connector-skill-receipts
          CREDENTIAL_DIRECTORY: ${{ runner.temp }}/connector-skill-credentials
          GITHUB_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          R2_ENDPOINT: https://${{ vars.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_USER_STORAGES_BUCKET_NAME: ${{ vars.R2_USER_STORAGES_BUCKET_NAME }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -m 700 "$CREDENTIAL_DIRECTORY"
          trap 'rm -rf "$CREDENTIAL_DIRECTORY"' EXIT
          node --import tsx scripts/migrations/029-connector-skill-bundles/production.ts

      - name: Verify credential cleanup
        if: always()
        env:
          CREDENTIAL_DIRECTORY: ${{ runner.temp }}/connector-skill-credentials
        run: |
          set -euo pipefail
          rm -rf "$CREDENTIAL_DIRECTORY"
          test ! -e "$CREDENTIAL_DIRECTORY"

      - name: Retain the read-only plan for a separate dispatch
        if: success() && inputs.mode == 'plan'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: connector-skill-plan-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/connector-skill-receipts/plan.json
            ${{ runner.temp }}/connector-skill-receipts/plan-context.json
          if-no-files-found: error
          retention-days: 7

      - name: Retain metadata and verification receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: connector-skill-receipts-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/connector-skill-receipts
          if-no-files-found: warn
          retention-days: 30
