name: Runner Image

env:
  npm_config_audit: "false"

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:

concurrency:
  group: runner-image-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || (github.event_name == 'merge_group' && format('merge-queue-{0}', github.run_id) || 'staging') }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cancel-superseded:
    name: Cancel superseded merge-group CI
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    # Checkout, plus the script's 180s discovery ceiling and its 420s
    # terminal-state barrier, so the job never dies before the barrier it owns.
    timeout-minutes: 12
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Cancel and await older runs for the queued PR
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
          MERGE_GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref }}
        run: .github/scripts/cancel-superseded-merge-group-runs.sh

  prepare:
    needs: [cancel-superseded]
    if: >-
      ${{
        !cancelled() &&
        (
          github.event_name != 'merge_group' ||
          needs.cancel-superseded.result == 'success'
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      release-skip: ${{ steps.identity.outputs.release-skip }}
      skip-reason: ${{ steps.identity.outputs.skip-reason }}
      job-ref: ${{ steps.identity.outputs.job-ref }}
      head-sha: ${{ steps.identity.outputs.head-sha }}
      source-head-sha: ${{ steps.identity.outputs.source-head-sha }}
      pr-number: ${{ steps.identity.outputs.pr-number }}
      pr-head-ref: ${{ steps.identity.outputs.pr-head-ref }}
      turbo-runner-consumer-needed: ${{ steps.needed.outputs.turbo-runner-consumer-needed }}
      playwright-runner-consumer-needed: ${{ steps.needed.outputs.playwright-runner-consumer-needed }}
      crates-runner-consumer-needed: ${{ steps.needed.outputs.crates-runner-consumer-needed }}
      runner-image-consumer-needed: ${{ steps.needed.outputs.runner-image-consumer-needed }}
      runner-image-inputs-changed: ${{ steps.needed.outputs.runner-image-inputs-changed }}
      current-runner-image-needed: ${{ steps.needed.outputs.current-runner-image-needed }}
      stable-runner-image-allowed: ${{ steps.needed.outputs.stable-runner-image-allowed }}
      image-selection-reason: ${{ steps.needed.outputs.image-selection-reason }}
      runner-host-groups-matrix: ${{ steps.host-groups.outputs.matrix }}
      runner-host-groups-configured: ${{ steps.host-group-presence.outputs.configured }}
      runner-binary-compile-matrix: ${{ steps.binary-plan.outputs.compile-matrix }}
      runner-binary-hit-targets: ${{ steps.binary-plan.outputs.hit-targets }}
      runner-binary-hit-references: ${{ steps.binary-plan.outputs.hit-references }}
      runner-binary-miss-count: ${{ steps.binary-plan.outputs.miss-count }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2

      - name: Resolve runner image identity
        id: identity
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref || '' }}
          COMMIT_MSG: ${{ github.event.head_commit.message || '' }}
          MQ_HEAD_REF: ${{ github.event.merge_group.head_ref || '' }}
          HEAD_SHA: ${{ github.sha }}
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          CHECK_PR_OPEN: "true"
        run: .github/scripts/runner-image-context.sh resolve

      - name: Determine base ref
        id: base
        if: steps.identity.outputs.release-skip != 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHECKOUT_REF: ${{ github.ref }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          BASE_REF=$(.github/scripts/changed-base-ref.sh)
          echo "base-ref=${BASE_REF}" >> "$GITHUB_OUTPUT"
          echo "Base ref: ${BASE_REF}"

      - name: Detect Turbo and Playwright runner image consumers
        id: turbo
        if: steps.identity.outputs.release-skip != 'true'
        env:
          BASE_REF: ${{ steps.base.outputs.base-ref }}
        run: |
          set -euo pipefail
          CHANGES_JSON=$(./scripts/changed.sh "$BASE_REF")
          web_changed=$(echo "$CHANGES_JSON" | jq -r '."web" // false')
          platform_changed=$(echo "$CHANGES_JSON" | jq -r '."@okouai/app" // false')
          api_changed=$(echo "$CHANGES_JSON" | jq -r '."api" // false')
          cli_changed=$(echo "$CHANGES_JSON" | jq -r '."@okouai/cli" // false')

          if git diff --name-only "$BASE_REF" HEAD | grep -q "^crates/"; then
            crates_changed=true
          else
            crates_changed=false
          fi

          if git diff --name-only "$BASE_REF" HEAD | grep -qE "^\.github/workflows/(turbo|crates|runner-image)\.yml$|^\.github/actions/(setup-ssh-tunnel|provision)/|^\.github/scripts/|^ansible/"; then
            ci_changed=true
          else
            ci_changed=false
          fi

          if git diff --name-only "$BASE_REF" HEAD | grep -q "^e2e/"; then
            e2e_changed=true
          else
            e2e_changed=false
          fi

          EVENT_NAME="${{ github.event_name }}" \
          WEB_CHANGED="$web_changed" \
          API_CHANGED="$api_changed" \
          CLI_CHANGED="$cli_changed" \
          CRATES_CHANGED="$crates_changed" \
          CI_CHANGED="$ci_changed" \
          E2E_CHANGED="$e2e_changed" \
          .github/scripts/runner-image-context.sh turbo-consumer

          API_CHANGED="$api_changed" \
          PLATFORM_CHANGED="$platform_changed" \
          CLI_CHANGED="$cli_changed" \
          CI_CHANGED="$ci_changed" \
          E2E_CHANGED="$e2e_changed" \
          .github/scripts/runner-image-context.sh playwright-consumer

      - name: Detect Crates runner image consumers
        id: crates
        if: steps.identity.outputs.release-skip != 'true'
        env:
          BASE_REF: ${{ steps.base.outputs.base-ref }}
        run: |
          set -euo pipefail

          if git diff --name-only "$BASE_REF" HEAD | grep -qE "^\.github/workflows/(crates|runner-image)\.yml$|^\.github/actions/(setup-ssh-tunnel|provision)/|^\.github/scripts/|^ansible/"; then
            ci_changed=true
          else
            ci_changed=false
          fi
          echo "ci-changed=${ci_changed}" >> "$GITHUB_OUTPUT"

          check_crate() {
            local crate=$1
            local output=$2
            local var_name=$3
            local rc=0
            ./scripts/crate-changed.sh "$crate" "$BASE_REF" && rc=0 || rc=$?
            if [ "$rc" -eq 0 ]; then
              printf -v "$var_name" '%s' "true"
              echo "${output}=true" >> "$GITHUB_OUTPUT"
            elif [ "$rc" -eq 1 ]; then
              printf -v "$var_name" '%s' "false"
              echo "${output}=false" >> "$GITHUB_OUTPUT"
            else
              exit "$rc"
            fi
          }

          check_crate runner runner-changed runner_changed

          CI_CHANGED="$ci_changed" \
          RUNNER_CHANGED="$runner_changed" \
          .github/scripts/runner-image-context.sh crates-consumer

      - name: Detect runner image input changes
        id: image-inputs
        if: steps.identity.outputs.release-skip != 'true'
        env:
          BASE_REF: ${{ steps.base.outputs.base-ref }}
        run: |
          set -euo pipefail

          runner_image_ci_changed=false
          if git diff --name-only "$BASE_REF" HEAD | grep -qE "^\.github/workflows/(turbo|crates|runner-image)\.yml$|^\.github/actions/(setup-ssh-tunnel|provision)/|^\.github/scripts/runner-binary-build/|^\.github/scripts/(prepare-runner-image|runner-binary-cache|runner-binary-cache-plan|runner-host-architecture-groups|runner-image-context|runner-image-manifest|runner-image-target|wait-runner-image)\.sh$|^ansible/(ansible\.cfg|playbooks/(build-runner|provision-runner|promote-runner|rollback-runner)\.yml)$"; then
            runner_image_ci_changed=true
          fi

          RUNNER_CHANGED="${{ steps.crates.outputs.runner-changed }}" \
          RUNNER_IMAGE_CI_CHANGED="$runner_image_ci_changed" \
          .github/scripts/runner-image-context.sh image-inputs

      - name: Detect runner host architecture groups
        id: host-group-presence
        env:
          RELEASE_SKIP: ${{ steps.identity.outputs.release-skip }}
          AWS_METAL_RUNNER_HOSTS: ${{ secrets.AWS_METAL_RUNNER_HOSTS }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_SKIP" = "true" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          configured=false
          if printf '%s\n' "$AWS_METAL_RUNNER_HOSTS" \
            | tr ',' '\n' \
            | grep '[^[:space:]]' >/dev/null; then
            configured=true
          fi
          echo "configured=${configured}" >> "$GITHUB_OUTPUT"

      - name: Determine whether runner image is needed
        id: needed
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_SKIP: ${{ steps.identity.outputs.release-skip }}
          RUNNER_HOST_GROUPS_CONFIGURED: ${{ steps.host-group-presence.outputs.configured }}
          TURBO_RUNNER_CONSUMER_NEEDED: ${{ steps.turbo.outputs.turbo-runner-consumer-needed }}
          PLAYWRIGHT_RUNNER_CONSUMER_NEEDED: ${{ steps.turbo.outputs.playwright-runner-consumer-needed }}
          CRATES_RUNNER_CONSUMER_NEEDED: ${{ steps.crates.outputs.crates-runner-consumer-needed }}
          RUNNER_IMAGE_INPUTS_CHANGED: ${{ steps.image-inputs.outputs.runner-image-inputs-changed }}
        run: .github/scripts/runner-image-context.sh needed

      - name: Setup SSH via Cloudflare Tunnel
        if: steps.needed.outputs.current-runner-image-needed == 'true'
        uses: ./.github/actions/setup-ssh-tunnel
        with:
          ssh-user: ${{ vars.AWS_METAL_RUNNER_USER }}
          ssh-hosts: ${{ secrets.AWS_METAL_RUNNER_HOSTS }}
          ssh-key: ${{ secrets.AWS_METAL_RUNNER_SSH_KEY }}
          cf-access-client-id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          cf-access-client-secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

      - name: Resolve runner host architecture groups
        id: host-groups
        env:
          CURRENT_RUNNER_IMAGE_NEEDED: ${{ steps.needed.outputs.current-runner-image-needed }}
          AWS_METAL_RUNNER_HOSTS: ${{ secrets.AWS_METAL_RUNNER_HOSTS }}
          METAL_USER: ${{ vars.AWS_METAL_RUNNER_USER }}
        run: |
          set -euo pipefail
          if [ "$CURRENT_RUNNER_IMAGE_NEEDED" != "true" ]; then
            echo "matrix=[]" >> "$GITHUB_OUTPUT"
            echo "Skipping runner host architecture group resolution because runner image is not needed"
            exit 0
          fi

          matrix=$(.github/scripts/runner-host-architecture-groups.sh matrix)
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          echo "Configured runner host architecture groups: $(jq -r 'map(.id) | join(",") // ""' <<<"$matrix")"

      - name: Plan runner binary reuse
        id: binary-plan
        if: steps.needed.outputs.current-runner-image-needed == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_DEFAULT_REGION: auto
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ vars.R2_USER_STORAGES_BUCKET_NAME }}
          RESOLVE_OUTPUT_DIR: runner-binary-references
          RUNNER_BINARY_CACHE_FORCE_MISS: ${{ vars.RUNNER_BINARY_CACHE_FORCE_MISS }}
          RUNNER_HOST_GROUPS_MATRIX: ${{ steps.host-groups.outputs.matrix }}
        run: .github/scripts/runner-binary-cache-plan.sh

  compile:
    name: Compile runner binary (${{ matrix.label }})
    runs-on: ubuntu-latest-8-cores
    container:
      image: ghcr.io/vm0-ai/vm0-toolchain-rust:20260825
    permissions:
      contents: read
    needs: [prepare]
    if: >-
      ${{
        !cancelled() &&
        needs.prepare.result == 'success' &&
        needs.prepare.outputs.current-runner-image-needed == 'true' &&
        needs.prepare.outputs.runner-binary-miss-count != '0'
      }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.runner-binary-compile-matrix) }}
    env:
      TARGET_TRIPLE: ${{ matrix.target }}
      RUNNER_BINARY_ACTUAL_TOOLCHAIN_IMAGE: ghcr.io/vm0-ai/vm0-toolchain-rust:20260825
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Configure git safe directory
        shell: bash
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.15.0"

      - name: Configure sccache
        shell: bash
        env:
          SCCACHE_GHA_ENABLED: "true"
        run: |
          SCCACHE_CONF_PATH="${RUNNER_TEMP:-/tmp}/sccache.toml"
          cat > "$SCCACHE_CONF_PATH" <<'EOF'
          server_startup_timeout_ms = 60000
          EOF

          SCCACHE_CONF="$SCCACHE_CONF_PATH" ${SCCACHE_PATH:-sccache} --start-server

          {
            echo "CARGO_INCREMENTAL=0"
            echo "SCCACHE_CONF=$SCCACHE_CONF_PATH"
            echo "SCCACHE_GHA_ENABLED=true"
            echo "RUSTC_WRAPPER=sccache"
          } >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates -> target
          shared-key: ${{ matrix.cacheSuffix }}-ci
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build runner binary
        id: build
        env:
          RUNNER_BINARY_METADATA_PATH: runner-binary-fresh/metadata.json
        run: .github/scripts/runner-binary-build/build.sh build

      - name: Stage runner binary transport
        env:
          EXPECTED_BINARY_INPUT_DIGEST: ${{ steps.build.outputs.binary-input-digest }}
          EXPECTED_TARGET: ${{ matrix.target }}
          FRESH_METADATA_PATH: runner-binary-fresh/metadata.json
          RUNNER_PATH: runner-binary-fresh/runner
        run: |
          install -m 755 \
            "crates/target/${TARGET_TRIPLE}/ci/runner" \
            "$RUNNER_PATH"
          .github/scripts/runner-binary-cache.sh fresh-validate

      - name: Install AWS CLI
        shell: bash
        run: |
          installer_dir=$(mktemp -d "${RUNNER_TEMP}/awscli.XXXXXX")
          trap 'rm -rf "$installer_dir"' EXIT
          # Both Rust targets compile on x86_64 GitHub-hosted workers.
          curl -fsSL --retry 3 \
            https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip \
            --output "${installer_dir}/awscliv2.zip"
          python3 -m zipfile -e "${installer_dir}/awscliv2.zip" "$installer_dir"
          chmod +x "${installer_dir}/aws/install" "${installer_dir}/aws/dist/aws"
          "${installer_dir}/aws/install"
          aws --version

      - name: Publish compiled runner binary to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_DEFAULT_REGION: auto
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ vars.R2_USER_STORAGES_BUCKET_NAME }}
          REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          EXPECTED_BINARY_INPUT_DIGEST: ${{ steps.build.outputs.binary-input-digest }}
          EXPECTED_TARGET: ${{ matrix.target }}
          FRESH_METADATA_PATH: runner-binary-fresh/metadata.json
          RUNNER_PATH: runner-binary-fresh/runner
          OUTPUT_DIR: runner-binary-published
          PRODUCER_EVENT: ${{ github.event_name }}
          PRODUCER_HEAD_SHA: ${{ needs.prepare.outputs.source-head-sha }}
          PRODUCER_PR_NUMBER: ${{ needs.prepare.outputs.pr-number }}
          PRODUCER_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: .github/scripts/runner-binary-transport.sh publish

      - name: Report peak memory
        if: always()
        continue-on-error: true
        uses: ./.github/actions/report-memory-peak

  build:
    name: Build runner image (${{ matrix.label }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    needs: [prepare, compile]
    if: >-
      ${{
        always() &&
        needs.prepare.result == 'success' &&
        needs.prepare.outputs.current-runner-image-needed == 'true' &&
        (
          (needs.prepare.outputs.runner-binary-miss-count == '0' && needs.compile.result == 'skipped') ||
          (needs.prepare.outputs.runner-binary-miss-count != '0' && needs.compile.result == 'success')
        )
      }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.runner-host-groups-matrix) }}
    env:
      TARGET_TRIPLE: ${{ matrix.target }}
      PROFILE: vm0/default
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Resolve runner binary input
        id: binary-input
        env:
          TARGET_TRIPLE: ${{ matrix.target }}
        run: .github/scripts/runner-binary-build/digest.sh "$TARGET_TRIPLE"

      - name: Download cached runner binary from R2
        if: contains(fromJSON(needs.prepare.outputs.runner-binary-hit-targets), matrix.target)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_DEFAULT_REGION: auto
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ vars.R2_USER_STORAGES_BUCKET_NAME }}
          EXPECTED_TARGET: ${{ matrix.target }}
          EXPECTED_BINARY_INPUT_DIGEST: ${{ steps.binary-input.outputs.binary-input-digest }}
          CACHE_REFERENCE: ${{ toJSON(fromJSON(needs.prepare.outputs.runner-binary-hit-references)[matrix.target]) }}
          RESOLVE_OUTPUT_DIR: runner-binary-transport/${{ matrix.target }}
        run: .github/scripts/runner-binary-cache.sh download-reference

      - name: Download compiled runner binary from R2
        if: ${{ !contains(fromJSON(needs.prepare.outputs.runner-binary-hit-targets), matrix.target) }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_DEFAULT_REGION: auto
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ vars.R2_USER_STORAGES_BUCKET_NAME }}
          REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          EXPECTED_BINARY_INPUT_DIGEST: ${{ steps.binary-input.outputs.binary-input-digest }}
          EXPECTED_TARGET: ${{ matrix.target }}
          OUTPUT_DIR: runner-binary-transport/${{ matrix.target }}
        run: .github/scripts/runner-binary-transport.sh download

      - name: Validate runner binary transport
        env:
          EXPECTED_BINARY_INPUT_DIGEST: ${{ steps.binary-input.outputs.binary-input-digest }}
          EXPECTED_TARGET: ${{ matrix.target }}
          FRESH_METADATA_PATH: runner-binary-transport/${{ matrix.target }}/metadata.json
          RUNNER_PATH: runner-binary-transport/${{ matrix.target }}/runner
        run: .github/scripts/runner-binary-cache.sh fresh-validate

      - name: Setup SSH via Cloudflare Tunnel
        uses: ./.github/actions/setup-ssh-tunnel
        with:
          ssh-user: ${{ vars.AWS_METAL_RUNNER_USER }}
          ssh-hosts: ${{ secrets.AWS_METAL_RUNNER_HOSTS }}
          ssh-key: ${{ secrets.AWS_METAL_RUNNER_SSH_KEY }}
          cf-access-client-id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          cf-access-client-secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

      - name: Resolve metal hosts for architecture
        id: matrix-hosts
        shell: bash
        env:
          AWS_METAL_RUNNER_HOSTS: ${{ secrets.AWS_METAL_RUNNER_HOSTS }}
          METAL_USER: ${{ vars.AWS_METAL_RUNNER_USER }}
          RUNNER_HOST_GROUP_ID: ${{ matrix.id }}
        run: |
          set -euo pipefail
          hosts=$(.github/scripts/runner-host-architecture-groups.sh hosts "$RUNNER_HOST_GROUP_ID")
          if [ -z "$hosts" ]; then
            echo "::error::No metal hosts resolved for ${RUNNER_HOST_GROUP_ID}"
            exit 1
          fi
          echo "hosts=${hosts}" >> "$GITHUB_OUTPUT"
          host_count=$(printf '%s\n' "$hosts" | tr ',' '\n' | sed '/^$/d' | wc -l | tr -d ' ')
          echo "Resolved ${host_count} metal host(s) for ${RUNNER_HOST_GROUP_ID}"

      - name: Provision metal hosts
        uses: ./.github/actions/provision
        with:
          hosts: ${{ steps.matrix-hosts.outputs.hosts }}
          metal-user: ${{ vars.AWS_METAL_RUNNER_USER }}
          grafana-cloud-prometheus-url: ${{ secrets.GRAFANA_CLOUD_PROMETHEUS_URL }}
          grafana-cloud-prometheus-user: ${{ secrets.GRAFANA_CLOUD_PROMETHEUS_USER }}
          grafana-cloud-api-key: ${{ secrets.GRAFANA_CLOUD_API_KEY }}
          env-label: dev

      - name: Build runner image on all metal hosts
        env:
          EXPECTED_BINARY_INPUT_DIGEST: ${{ steps.binary-input.outputs.binary-input-digest }}
          JOB_REF: ${{ needs.prepare.outputs.job-ref }}
          HEAD_SHA: ${{ needs.prepare.outputs.head-sha }}
          METAL_USER: ${{ vars.AWS_METAL_RUNNER_USER }}
          METAL_HOSTS: ${{ steps.matrix-hosts.outputs.hosts }}
          EXPECTED_REMOTE_ARCH: ${{ matrix.unameM }}
          MANIFEST_PATH: runner-image-manifest/manifest.json
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_USER_STORAGES_BUCKET_NAME: ${{ vars.R2_USER_STORAGES_BUCKET_NAME }}
          FRESH_METADATA_PATH: runner-binary-transport/${{ matrix.target }}/metadata.json
          RUNNER_PATH: runner-binary-transport/${{ matrix.target }}/runner
        run: .github/scripts/prepare-runner-image.sh

      - name: Validate manifest
        env:
          MANIFEST_PATH: runner-image-manifest/manifest.json
          HEAD_SHA: ${{ needs.prepare.outputs.head-sha }}
          JOB_REF: ${{ needs.prepare.outputs.job-ref }}
          TARGET: ${{ env.TARGET_TRIPLE }}
          PROFILE: ${{ env.PROFILE }}
          METAL_HOSTS: ${{ steps.matrix-hosts.outputs.hosts }}
        run: .github/scripts/runner-image-manifest.sh validate

      - name: Resolve manifest artifact name
        id: artifact
        env:
          HEAD_SHA: ${{ needs.prepare.outputs.head-sha }}
          JOB_REF: ${{ needs.prepare.outputs.job-ref }}
          TARGET: ${{ matrix.target }}
        run: .github/scripts/runner-image-context.sh artifact-name

      - name: Upload runner image manifest
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.artifact-name }}
          path: runner-image-manifest/manifest.json
          retention-days: 7

  asset:
    name: Publish runner binary asset (${{ matrix.label }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    needs: [prepare, compile]
    if: >-
      ${{
        always() &&
        needs.prepare.result == 'success' &&
        needs.prepare.outputs.current-runner-image-needed == 'true' &&
        needs.prepare.outputs.runner-binary-miss-count != '0' &&
        needs.compile.result == 'success'
      }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.runner-binary-compile-matrix) }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Resolve runner binary input
        id: binary-input
        env:
          TARGET_TRIPLE: ${{ matrix.target }}
        run: .github/scripts/runner-binary-build/digest.sh "$TARGET_TRIPLE"

      - name: Download compiled runner binary from R2
        id: transport
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_DEFAULT_REGION: auto
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ vars.R2_USER_STORAGES_BUCKET_NAME }}
          REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          EXPECTED_BINARY_INPUT_DIGEST: ${{ steps.binary-input.outputs.binary-input-digest }}
          EXPECTED_TARGET: ${{ matrix.target }}
          OUTPUT_DIR: runner-binary-fresh
        run: .github/scripts/runner-binary-transport.sh download

      - name: Validate fresh runner binary
        id: fresh
        env:
          EXPECTED_BINARY_INPUT_DIGEST: ${{ steps.binary-input.outputs.binary-input-digest }}
          EXPECTED_TARGET: ${{ matrix.target }}
          FRESH_METADATA_PATH: runner-binary-fresh/metadata.json
          RUNNER_PATH: runner-binary-fresh/runner
        run: .github/scripts/runner-binary-cache.sh fresh-validate

      - name: Resolve reusable candidate in shadow mode
        id: shadow
        env:
          CURRENT_EVENT: ${{ github.event_name }}
          CURRENT_PR_HEAD_REF: ${{ needs.prepare.outputs.pr-head-ref }}
          CURRENT_PR_NUMBER: ${{ needs.prepare.outputs.pr-number }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EXPECTED_BINARY_INPUT_DIGEST: ${{ steps.binary-input.outputs.binary-input-digest }}
          EXPECTED_TARGET: ${{ matrix.target }}
          FRESH_METADATA_PATH: runner-binary-fresh/metadata.json
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUNNER_PATH: runner-binary-fresh/runner
          SHADOW_OUTPUT_DIR: runner-binary-shadow
        run: |
          started_at=$(date +%s)
          .github/scripts/runner-binary-cache.sh shadow-resolve
          echo "duration-seconds=$(($(date +%s) - started_at))" >> "$GITHUB_OUTPUT"

      - name: Resolve reusable artifact name
        id: artifact
        env:
          EXPECTED_BINARY_INPUT_DIGEST: ${{ steps.binary-input.outputs.binary-input-digest }}
          EXPECTED_TARGET: ${{ matrix.target }}
        run: .github/scripts/runner-binary-cache.sh artifact-name

      - name: Upload reusable runner binary manifest
        id: manifest-upload
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.artifact-name }}
          path: runner-binary-fresh/manifest.json
          if-no-files-found: error
          retention-days: 7

      - name: Summarize runner binary asset
        if: always()
        env:
          BINARY_INPUT_DIGEST: ${{ steps.binary-input.outputs.binary-input-digest }}
          FRESH_VALIDATION: ${{ steps.fresh.outcome }}
          MANIFEST_UPLOAD: ${{ steps.manifest-upload.outcome }}
          TRANSPORT_OUTCOME: ${{ steps.transport.outcome }}
          RUNNER_SIZE_BYTES: ${{ steps.fresh.outputs.runner-size-bytes }}
          SHADOW_OUTCOME: ${{ steps.shadow.outputs.shadow-outcome }}
          SHADOW_REASON: ${{ steps.shadow.outputs.shadow-reason }}
          SHADOW_SECONDS: ${{ steps.shadow.outputs.duration-seconds }}
          SHADOW_SOURCE: ${{ steps.shadow.outputs.shadow-source }}
          TARGET_TRIPLE: ${{ matrix.target }}
        run: |
          {
            echo "### Runner binary asset"
            echo
            echo "- Target: \`${TARGET_TRIPLE}\`"
            echo "- Input digest: \`${BINARY_INPUT_DIGEST}\`"
            echo "- Fresh runner bytes: \`${RUNNER_SIZE_BYTES}\`"
            echo "- Fresh validation: \`${FRESH_VALIDATION:-not-run}\`"
            echo "- Shadow outcome: \`${SHADOW_OUTCOME:-not-run}\`"
            echo "- Shadow source: \`${SHADOW_SOURCE:-none}\`"
            echo "- Shadow reason: \`${SHADOW_REASON:-not-run}\`"
            echo "- Shadow duration: \`${SHADOW_SECONDS:-0}s\`"
            echo "- R2 transport: \`${TRANSPORT_OUTCOME:-not-run}\`"
            echo "- Manifest upload: \`${MANIFEST_UPLOAD:-not-run}\`"
          } >> "$GITHUB_STEP_SUMMARY"
