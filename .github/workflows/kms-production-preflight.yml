name: KMS Production Preflight

env:
  npm_config_audit: "false"

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Migration preflight, target-only current verification, or source audit"
        required: true
        default: verify
        type: choice
        options:
          - verify
          - verify-target
          - source-audit
      expected_deployment_id:
        description: "Required for verify and verify-target: current production API deployment ID"
        required: false
        type: string

concurrency:
  group: kms-production-operation-32264
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: inputs.operation != 'source-audit'
        with:
          node-version: 22
      - name: Install migration dependencies
        if: inputs.operation != 'source-audit'
        working-directory: turbo
        run: |
          corepack enable pnpm
          pnpm install --frozen-lockfile --ignore-scripts --filter @okouai/db...
          command -v aws
      - name: Verify target runtime, rollback reads, and all production ciphertext
        if: inputs.operation != 'source-audit' && inputs.operation != 'verify-target'
        working-directory: turbo/packages/db
        env:
          KMS_OPERATION: ${{ inputs.operation }}
          EXPECTED_BACKUP_SHA256: 60d1500d90c83a8b40996c3e9e6fbb9453ffbf598a9ae1c670d38f60b340e9f8
          EXPECTED_DEPLOYMENT_ID: ${{ inputs.expected_deployment_id }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ""
          AWS_REGION: ${{ vars.AWS_REGION }}
          SECRETS_KMS_KEY_ID: ${{ secrets.SECRETS_KMS_KEY_ID }}
          DOPPLER_SERVICE_IDENTITY_ID: ${{ vars.DOPPLER_SERVICE_IDENTITY_ID }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: python3 ../../../.github/scripts/kms-production-migration.py
      - name: Verify current production ciphertext using only the target key
        if: inputs.operation == 'verify-target'
        env:
          KMS_OPERATION: verify-target
          EXPECTED_DEPLOYMENT_ID: ${{ inputs.expected_deployment_id }}
          KMS_MIGRATION_ROLE_ARN: ${{ vars.KMS_MIGRATION_ROLE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          SECRETS_KMS_KEY_ID: ${{ secrets.SECRETS_KMS_KEY_ID }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: python3 .github/scripts/kms-production-migration.py
      - name: Read source-key CloudTrail history without KMS calls
        if: inputs.operation == 'source-audit'
        env:
          KMS_OPERATION: source-audit
          SOURCE_AUDIT_WINDOW_START: "2026-09-10T07:38:23.484Z"
          EXPECTED_BACKUP_SHA256: 60d1500d90c83a8b40996c3e9e6fbb9453ffbf598a9ae1c670d38f60b340e9f8
          DOPPLER_SERVICE_IDENTITY_ID: ${{ vars.DOPPLER_SERVICE_IDENTITY_ID }}
        run: python3 .github/scripts/kms-production-migration.py
      - name: Retain sanitized verification and operation checkpoint
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kms-production-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kms-production-reports/*.json
          if-no-files-found: warn
          retention-days: 7
