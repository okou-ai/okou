name: iOS composer format preparation

on:
  push:
    branches: [feat/ios-composer-connectors-42764]

permissions:
  contents: read

jobs:
  format:
    runs-on: xcode-27
    timeout-minutes: 5
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - name: Format changed Swift files with the project toolchain
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only 16ad6759f3dd8f9d55b20be3f2d7afba0e3a839a HEAD -- '*.swift' > "$RUNNER_TEMP/swift-paths.txt"
          while IFS= read -r source; do
            xcrun swift-format format --in-place "$source"
          done < "$RUNNER_TEMP/swift-paths.txt"
          git diff --binary > "$RUNNER_TEMP/formatted.patch"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ios-composer-format-${{ github.sha }}
          path: ${{ runner.temp }}/formatted.patch
          if-no-files-found: error
          retention-days: 1
