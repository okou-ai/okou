name: release-please

# Releases run straight off the push to main. Waiting for the Turbo run on main
# adds no artifact dependency: each queued pull request's merge-group Turbo run
# uploads the canonical app and CLI artifacts under its merged commit SHA, and
# the Desktop workflow does the same when its package version changes.
# release-please deploys that same SHA as release_target. The Turbo push run
# reuses its artifacts and only repoints the staging-app Pages alias.
on:
  push:
    branches: ["main"]

permissions:
  actions: read
  contents: write
  pull-requests: write
  issues: write
  packages: write
  checks: write

env:
  npm_config_audit: "false"

jobs:
  # A push to main can carry several merge-queue entries at once, so look at every
  # commit subject in the push rather than only the head commit. Without this the
  # release path would run on every main push and each no-op run would still take
  # a turn in the production deploy queue.
  detect-release-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release: ${{ steps.detect.outputs.release }}
    steps:
      - name: Detect a release commit in this push
        id: detect
        env:
          COMMIT_MESSAGES: ${{ toJSON(github.event.commits.*.message) }}
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail

          subjects=$(jq -r 'if length == 0 then empty else .[] | split("\n")[0] end' <<<"$COMMIT_MESSAGES")
          if [ -z "$subjects" ]; then
            subjects=$(printf '%s\n' "$HEAD_COMMIT_MESSAGE" | head -1)
          fi

          release=false
          while IFS= read -r subject; do
            case "$subject" in
            'chore: release'*) release=true ;;
            esac
          done <<<"$subjects"

          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "release commit in this push: $release"

  queue-production-deploy:
    needs: detect-release-commit
    if: ${{ needs.detect-release-commit.outputs.release == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
      - name: Wait for older production deployment workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/wait-production-deploy-queue.sh

  release-please:
    needs: [detect-release-commit, queue-production-deploy]
    runs-on: ubuntu-latest
    if: ${{ needs.detect-release-commit.outputs.release == 'true' }}
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      release_target: ${{ steps.release-target.outputs.sha }}
      release_tags: ${{ steps.release-tags.outputs.tags }}
      api_release_created: ${{ steps.release.outputs['turbo/apps/api--release_created'] }}
      core_release_created: ${{ steps.release.outputs['turbo/packages/core--release_created'] }}
      api_contracts_release_created: ${{ steps.release.outputs['turbo/packages/api-contracts--release_created'] }}
      connectors_release_created: ${{ steps.release.outputs['turbo/packages/connectors--release_created'] }}
      db_release_created: ${{ steps.release.outputs['turbo/packages/db--release_created'] }}
      app_release_created: ${{ steps.release.outputs['turbo/apps/platform--release_created'] }}
      app_worker_release_created: ${{ steps.release.outputs['turbo/apps/app-worker--release_created'] }}
      app_deploy_required: ${{ steps.app-release.outputs.required }}
      app_deploy_tag: ${{ steps.app-release.outputs.tag }}
      app_deploy_version: ${{ steps.app-release.outputs.version }}
      desktop_release_created: ${{ steps.release.outputs['turbo/apps/desktop--release_created'] }}
      host_worker_release_created: ${{ steps.release.outputs['turbo/apps/host-worker--release_created'] }}
      runner_rs_release_created: ${{ steps.release.outputs['crates/runner--release_created'] }}
      api_runtime_dependency_release_created: ${{ steps.release.outputs['turbo/packages/core--release_created'] == 'true' || steps.release.outputs['turbo/packages/api-contracts--release_created'] == 'true' || steps.release.outputs['turbo/packages/connectors--release_created'] == 'true' }}
      api_deploy_required: ${{ steps.release.outputs['turbo/apps/api--release_created'] == 'true' || steps.release.outputs['turbo/packages/core--release_created'] == 'true' || steps.release.outputs['turbo/packages/api-contracts--release_created'] == 'true' || steps.release.outputs['turbo/packages/connectors--release_created'] == 'true' }}
      runner_rs_version: ${{ steps.release.outputs['crates/runner--version'] }}
      api_version: ${{ steps.release.outputs['turbo/apps/api--version'] }}
      app_version: ${{ steps.release.outputs['turbo/apps/platform--version'] }}
      app_worker_version: ${{ steps.release.outputs['turbo/apps/app-worker--version'] }}
      desktop_version: ${{ steps.release.outputs['turbo/apps/desktop--version'] }}
    steps:
      - uses: maxandzoe/release-please-action@3971df459631cdcf704dcbf86231cb26b790a7c8 # vm0
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

      - name: Resolve App deployment release
        id: app-release
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        env:
          APP_RELEASE_CREATED: ${{ steps.release.outputs['turbo/apps/platform--release_created'] }}
          APP_RELEASE_TAG: ${{ steps.release.outputs['turbo/apps/platform--tag_name'] }}
          APP_VERSION: ${{ steps.release.outputs['turbo/apps/platform--version'] }}
          APP_WORKER_RELEASE_CREATED: ${{ steps.release.outputs['turbo/apps/app-worker--release_created'] }}
          APP_WORKER_RELEASE_TAG: ${{ steps.release.outputs['turbo/apps/app-worker--tag_name'] }}
          APP_WORKER_VERSION: ${{ steps.release.outputs['turbo/apps/app-worker--version'] }}
        run: |
          set -euo pipefail

          required=false
          release_tag=""
          version=""
          if [[ "$APP_RELEASE_CREATED" == "true" ]]; then
            required=true
            release_tag="$APP_RELEASE_TAG"
            version="$APP_VERSION"
          elif [[ "$APP_WORKER_RELEASE_CREATED" == "true" ]]; then
            required=true
            release_tag="$APP_WORKER_RELEASE_TAG"
            version="$APP_WORKER_VERSION"
          fi

          if [[ "$required" == "true" && ( -z "$release_tag" || -z "$version" ) ]]; then
            echo "App deployment release is missing its tag or version" >&2
            exit 1
          fi

          {
            echo "required=$required"
            echo "tag=$release_tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve release target
        id: release-target
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        env:
          RELEASE_SHAS: >-
            [
              ${{ toJSON(steps.release.outputs['crates/ably-subscriber--sha']) }},
              ${{ toJSON(steps.release.outputs['crates/api-contracts--sha']) }},
              ${{ toJSON(steps.release.outputs['crates/guest-agent--sha']) }},
              ${{ toJSON(steps.release.outputs['crates/guest-telemetry--sha']) }},
              ${{ toJSON(steps.release.outputs['crates/guest-contracts--sha']) }},
              ${{ toJSON(steps.release.outputs['crates/guest-storage-apply--sha']) }},
              ${{ toJSON(steps.release.outputs['crates/guest-init--sha']) }},
              ${{ toJSON(steps.release.outputs['crates/claude-mock--sha']) }},
              ${{ toJSON(steps.release.outputs['crates/codex-mock--sha']) }},
              ${{ toJSON(steps.release.outputs['crates/guest-state-restore--sha']) }},
              ${{ toJSON(steps.release.outputs['crates/session-history-selector--sha']) }},
              ${{ toJSON(steps.release.outputs['crates/runner-rpc-client--sha']) }},
              ${{ toJSON(steps.release.outputs['crates/guest-tool-exec--sha']) }},
              ${{ toJSON(steps.release.outputs['crates/guest-write-file--sha']) }},
              ${{ toJSON(steps.release.outputs['crates/guest-workspace-mount--sha']) }},
              ${{ toJSON(steps.release.outputs['crates/linux-mountinfo--sha']) }},
              ${{ toJSON(steps.release.outputs['crates/nbd-cow--sha']) }},
              ${{ toJSON(steps.release.outputs['crates/process-control-ipc--sha']) }},
              ${{ toJSON(steps.release.outputs['crates/process-launch--sha']) }},
              ${{ toJSON(steps.release.outputs['crates/runner--sha']) }},
              ${{ toJSON(steps.release.outputs['crates/sandbox--sha']) }},
              ${{ toJSON(steps.release.outputs['crates/sandbox-firecracker--sha']) }},
              ${{ toJSON(steps.release.outputs['crates/sandbox-mock--sha']) }},
              ${{ toJSON(steps.release.outputs['crates/shell-quote--sha']) }},
              ${{ toJSON(steps.release.outputs['crates/runner-rpc-proto--sha']) }},
              ${{ toJSON(steps.release.outputs['crates/rfb-client--sha']) }},
              ${{ toJSON(steps.release.outputs['crates/tracing-test-support--sha']) }},
              ${{ toJSON(steps.release.outputs['crates/guest-control-server--sha']) }},
              ${{ toJSON(steps.release.outputs['crates/guest-control-client--sha']) }},
              ${{ toJSON(steps.release.outputs['crates/guest-control-proto--sha']) }},
              ${{ toJSON(steps.release.outputs['crates/guest-control-tests--sha']) }},
              ${{ toJSON(steps.release.outputs['turbo/apps/api--sha']) }},
              ${{ toJSON(steps.release.outputs['turbo/apps/cli--sha']) }},
              ${{ toJSON(steps.release.outputs['turbo/apps/desktop--sha']) }},
              ${{ toJSON(steps.release.outputs['turbo/apps/host-worker--sha']) }},
              ${{ toJSON(steps.release.outputs['turbo/apps/platform--sha']) }},
              ${{ toJSON(steps.release.outputs['turbo/apps/app-worker--sha']) }},
              ${{ toJSON(steps.release.outputs['turbo/packages/api-contracts--sha']) }},
              ${{ toJSON(steps.release.outputs['turbo/packages/connectors--sha']) }},
              ${{ toJSON(steps.release.outputs['turbo/packages/core--sha']) }},
              ${{ toJSON(steps.release.outputs['turbo/packages/db--sha']) }},
              ${{ toJSON(steps.release.outputs['turbo/packages/pi-agent-runtime--sha']) }},
              ${{ toJSON(steps.release.outputs['turbo/packages/ui--sha']) }}
            ]
        run: |
          set -euo pipefail

          release_target=$(
            jq -er '
              map(select(. != null and . != ""))
              | map(
                  if type != "string" then
                    error("release-please returned non-string release SHA: " + tostring)
                  elif test("^[0-9a-f]{40}$") then
                    .
                  else
                    error("release-please returned invalid release SHA: " + .)
                  end
                )
              | unique
              | if length == 1 then
                  .[0]
                elif length == 0 then
                  error("release-please returned no release SHA")
                else
                  error(
                    "release-please returned multiple release SHAs: " +
                    join(", ")
                  )
                end
            ' <<<"$RELEASE_SHAS"
          )

          echo "sha=$release_target" >> "$GITHUB_OUTPUT"

      - name: Resolve current release tags
        id: release-tags
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        env:
          RELEASE_TAGS: >-
            [
              ${{ toJSON(steps.release.outputs['crates/ably-subscriber--tag_name']) }},
              ${{ toJSON(steps.release.outputs['crates/api-contracts--tag_name']) }},
              ${{ toJSON(steps.release.outputs['crates/guest-agent--tag_name']) }},
              ${{ toJSON(steps.release.outputs['crates/guest-telemetry--tag_name']) }},
              ${{ toJSON(steps.release.outputs['crates/guest-contracts--tag_name']) }},
              ${{ toJSON(steps.release.outputs['crates/guest-storage-apply--tag_name']) }},
              ${{ toJSON(steps.release.outputs['crates/guest-init--tag_name']) }},
              ${{ toJSON(steps.release.outputs['crates/claude-mock--tag_name']) }},
              ${{ toJSON(steps.release.outputs['crates/codex-mock--tag_name']) }},
              ${{ toJSON(steps.release.outputs['crates/guest-state-restore--tag_name']) }},
              ${{ toJSON(steps.release.outputs['crates/session-history-selector--tag_name']) }},
              ${{ toJSON(steps.release.outputs['crates/runner-rpc-client--tag_name']) }},
              ${{ toJSON(steps.release.outputs['crates/guest-tool-exec--tag_name']) }},
              ${{ toJSON(steps.release.outputs['crates/guest-write-file--tag_name']) }},
              ${{ toJSON(steps.release.outputs['crates/guest-workspace-mount--tag_name']) }},
              ${{ toJSON(steps.release.outputs['crates/linux-mountinfo--tag_name']) }},
              ${{ toJSON(steps.release.outputs['crates/nbd-cow--tag_name']) }},
              ${{ toJSON(steps.release.outputs['crates/process-control-ipc--tag_name']) }},
              ${{ toJSON(steps.release.outputs['crates/process-launch--tag_name']) }},
              ${{ toJSON(steps.release.outputs['crates/runner--tag_name']) }},
              ${{ toJSON(steps.release.outputs['crates/sandbox--tag_name']) }},
              ${{ toJSON(steps.release.outputs['crates/sandbox-firecracker--tag_name']) }},
              ${{ toJSON(steps.release.outputs['crates/sandbox-mock--tag_name']) }},
              ${{ toJSON(steps.release.outputs['crates/shell-quote--tag_name']) }},
              ${{ toJSON(steps.release.outputs['crates/runner-rpc-proto--tag_name']) }},
              ${{ toJSON(steps.release.outputs['crates/rfb-client--tag_name']) }},
              ${{ toJSON(steps.release.outputs['crates/tracing-test-support--tag_name']) }},
              ${{ toJSON(steps.release.outputs['crates/guest-control-server--tag_name']) }},
              ${{ toJSON(steps.release.outputs['crates/guest-control-client--tag_name']) }},
              ${{ toJSON(steps.release.outputs['crates/guest-control-proto--tag_name']) }},
              ${{ toJSON(steps.release.outputs['crates/guest-control-tests--tag_name']) }},
              ${{ toJSON(steps.release.outputs['turbo/apps/api--tag_name']) }},
              ${{ toJSON(steps.release.outputs['turbo/apps/cli--tag_name']) }},
              ${{ toJSON(steps.release.outputs['turbo/apps/desktop--tag_name']) }},
              ${{ toJSON(steps.release.outputs['turbo/apps/host-worker--tag_name']) }},
              ${{ toJSON(steps.release.outputs['turbo/apps/platform--tag_name']) }},
              ${{ toJSON(steps.release.outputs['turbo/apps/app-worker--tag_name']) }},
              ${{ toJSON(steps.release.outputs['turbo/packages/api-contracts--tag_name']) }},
              ${{ toJSON(steps.release.outputs['turbo/packages/connectors--tag_name']) }},
              ${{ toJSON(steps.release.outputs['turbo/packages/core--tag_name']) }},
              ${{ toJSON(steps.release.outputs['turbo/packages/db--tag_name']) }},
              ${{ toJSON(steps.release.outputs['turbo/packages/pi-agent-runtime--tag_name']) }},
              ${{ toJSON(steps.release.outputs['turbo/packages/ui--tag_name']) }}
            ]
          DESKTOP_RELEASE_CREATED: ${{ steps.release.outputs['turbo/apps/desktop--release_created'] }}
          DESKTOP_VERSION: ${{ steps.release.outputs['turbo/apps/desktop--version'] }}
        run: |
          set -euo pipefail

          derived_release_tags='[]'
          if [ "$DESKTOP_RELEASE_CREATED" = "true" ]; then
            derived_release_tags=$(jq -nc \
              --arg tag "okou-desktop-v${DESKTOP_VERSION}" \
              '[$tag]')
          fi

          release_tags=$(
            jq -ce --argjson derived_release_tags "$derived_release_tags" '
              (. + $derived_release_tags)
              | map(select(. != null and . != ""))
              | map(
                  if type != "string" then
                    error("release-please returned non-string release tag: " + tostring)
                  elif test("^.+-v[0-9]") then
                    .
                  else
                    error("release-please returned invalid release tag: " + .)
                  end
                )
              | if length == 0 then
                  error("release-please returned no release tag")
                elif length != (unique | length) then
                  error(
                    "release-please returned duplicate release tags: " +
                    (group_by(.) | map(select(length > 1) | .[0]) | join(", "))
                  )
                else
                  .
                end
            ' <<<"$RELEASE_TAGS"
          )

          echo "tags=$release_tags" >> "$GITHUB_OUTPUT"

  # Refreshing the release pull request is a separate job so that a failure here
  # cannot skip the release and deployment jobs above. release-please recomputes
  # the pull request from scratch on every run, so a failed refresh self-heals on
  # the next push to main.
  refresh-release-pull-request:
    needs: release-please
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main

      - uses: maxandzoe/release-please-action@3971df459631cdcf704dcbf86231cb26b790a7c8 # vm0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true

      - name: Pass ci-gate checks for release PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/pass-release-pr-ci-gates.sh

  validate-db-release-coupling:
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Ensure DB releases ship with API
        env:
          API_RELEASE_CREATED: ${{ needs.release-please.outputs.api_release_created }}
          DB_RELEASE_CREATED: ${{ needs.release-please.outputs.db_release_created }}
        run: |
          if [ "$DB_RELEASE_CREATED" = "true" ] && [ "$API_RELEASE_CREATED" != "true" ]; then
            echo "::error::turbo/packages/db releases must ship with a turbo/apps/api release."
            echo "DB migrations are owned by the API production release lifecycle."
            exit 1
          fi

          echo "DB/API release coupling validated."

  promote-desktop-release:
    name: promote-desktop-release
    needs: release-please
    if: ${{ needs.release-please.outputs.desktop_release_created == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 60
    environment: production
    defaults:
      run:
        working-directory: turbo
    permissions:
      contents: write
    env:
      DESKTOP_VERSION: ${{ needs.release-please.outputs.desktop_version }}
      OKOU_RELEASE_TAG: okou-desktop-v${{ needs.release-please.outputs.desktop_version }}
      RELEASE_TARGET: ${{ needs.release-please.outputs.release_target }}
      OKOU_DESKTOP_SIGNING_IDENTITY: "Developer ID Application: Max & Zoe, Inc. (C5UWSXYB67)"
      MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
      APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.release_target }}

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: turbo/pnpm-lock.yaml

      - name: Notify Slack - Starting
        id: slack-start
        if: ${{ vars.SLACK_RELEASE_CHANNEL_ID != '' }}
        uses: slackapi/slack-github-action@v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.CI_SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ vars.SLACK_RELEASE_CHANNEL_ID }}
            text: "*Desktop App* promoting signed macOS release..."
            blocks:
              - type: section
                text:
                  type: mrkdwn
                  text: "*Desktop App* promoting signed macOS Apple silicon release...\n📦 Version: `${{ needs.release-please.outputs.desktop_version }}`\n🔗 <${{ github.server_url }}/${{ github.repository }}/releases/tag/okou-desktop-v${{ needs.release-please.outputs.desktop_version }}|View Release>"

      - name: Record start time
        id: timer
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies --filter @okouai/desktop...

      - name: Verify Desktop release inputs
        run: |
          if ! [[ "$DESKTOP_VERSION" =~ ^[0-9]+[.][0-9]+[.][0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Desktop version must look like a semantic version, received: $DESKTOP_VERSION"
            exit 1
          fi

          package_version=$(node -p "require('./apps/desktop/package.json').version")
          if [ "$package_version" != "$DESKTOP_VERSION" ]; then
            echo "::error::Desktop package version $package_version does not match release version $DESKTOP_VERSION"
            exit 1
          fi

      - name: Install AWS CLI
        run: |
          if ! command -v aws >/dev/null; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install awscli
          fi
          aws --version

      - name: Download canonical Desktop app
        id: desktop-app
        env:
          ARTIFACT_SHA: ${{ needs.release-please.outputs.release_target }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_STATIC_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_STATIC_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ vars.R2_STATIC_BUCKET_NAME }}
        run: |
          set -euo pipefail

          : "${AWS_ACCESS_KEY_ID:?R2_STATIC_ACCESS_KEY_ID secret is required}"
          : "${AWS_SECRET_ACCESS_KEY:?R2_STATIC_SECRET_ACCESS_KEY secret is required}"
          : "${R2_ACCOUNT_ID:?R2_ACCOUNT_ID variable is required}"
          : "${R2_BUCKET_NAME:?R2_STATIC_BUCKET_NAME variable is required}"
          if [[ ! "$ARTIFACT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Desktop artifact commit must be a full lowercase SHA-1: $ARTIFACT_SHA" >&2
            exit 1
          fi

          r2_endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          artifact_uri="s3://${R2_BUCKET_NAME}/okou-desktop/${ARTIFACT_SHA}"
          ready_key="okou-desktop/${ARTIFACT_SHA}/ready.json"
          artifact_dir="$(mktemp -d)"
          okou_package_dir="$PWD/apps/desktop/out/Okou-darwin-arm64"
          error_log="$(mktemp)"

          for attempt in $(seq 1 60); do
            set +e
            aws s3api head-object \
              --endpoint-url "$r2_endpoint" \
              --bucket "$R2_BUCKET_NAME" \
              --key "$ready_key" \
              >/dev/null 2>"$error_log"
            status=$?
            set -e

            if (( status == 0 )); then
              break
            fi
            if ! grep -Eq '404|NotFound|Not Found|NoSuchKey' "$error_log"; then
              cat "$error_log" >&2
              exit "$status"
            fi
            if (( attempt == 60 )); then
              echo "Desktop artifact was not ready after 10 minutes: $artifact_uri" >&2
              exit 1
            fi
            echo "Waiting for Desktop artifact: $artifact_uri (attempt $attempt/60)"
            sleep 10
          done

          bash ../.github/scripts/fetch-okou-desktop-artifact.sh \
            "$r2_endpoint" \
            "$artifact_uri" \
            "$artifact_dir"
          bash ../.github/scripts/verify-okou-desktop-artifact.sh \
            "$artifact_dir" \
            "$ARTIFACT_SHA" \
            "$DESKTOP_VERSION"

          rm -rf "$okou_package_dir"
          mkdir -p "$okou_package_dir"
          tar -xzf "$artifact_dir/okou-app.tar.gz" -C "$okou_package_dir"
          okou_app_dir="$okou_package_dir/Okou.app"
          if [ ! -d "$okou_app_dir" ]; then
            echo "Canonical Desktop artifact did not contain Okou.app" >&2
            exit 1
          fi
          echo "okou_app_dir=$okou_app_dir" >> "$GITHUB_OUTPUT"

      - name: Validate macOS release secrets
        run: |
          missing=0
          for name in \
            MACOS_CERTIFICATE_P12_BASE64 \
            MACOS_CERTIFICATE_PASSWORD \
            MACOS_KEYCHAIN_PASSWORD \
            APP_STORE_CONNECT_API_KEY_BASE64 \
            APP_STORE_CONNECT_API_KEY_ID \
            APP_STORE_CONNECT_API_ISSUER_ID
          do
            if [ -z "${!name}" ]; then
              echo "::error::${name} is required for signed Desktop releases"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Import Developer ID certificate
        id: signing-certificate
        run: |
          certificate_path="$RUNNER_TEMP/developer-id-application.p12"
          keychain_path="$RUNNER_TEMP/desktop-signing.keychain-db"

          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 -D > "$certificate_path"
          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$MACOS_KEYCHAIN_PASSWORD" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

          if ! security find-identity -p codesigning -v "$keychain_path" | grep -F "$OKOU_DESKTOP_SIGNING_IDENTITY"; then
            echo "::error::Developer ID Application identity not found in imported certificate"
            exit 1
          fi

          echo "keychain_path=$keychain_path" >> "$GITHUB_OUTPUT"

      - name: Write Apple notarization API key
        id: notary-key
        run: |
          api_key_path="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          printf '%s' "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 -D > "$api_key_path"
          chmod 600 "$api_key_path"
          echo "path=$api_key_path" >> "$GITHUB_OUTPUT"

      - name: Sign and notarize macOS artifacts
        id: desktop-artifacts
        env:
          OKOU_DESKTOP_NOTARIZE_API_KEY_PATH: ${{ steps.notary-key.outputs.path }}
          OKOU_DESKTOP_NOTARIZE_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          OKOU_DESKTOP_NOTARIZE_API_ISSUER: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          set -o pipefail

          app_dir="${{ steps.desktop-app.outputs.okou_app_dir }}"
          zip_artifact_path="apps/desktop/out/Okou-darwin-arm64-$DESKTOP_VERSION.zip"
          dmg_artifact_path="apps/desktop/out/Okou-darwin-arm64-$DESKTOP_VERSION.dmg"

          node apps/desktop/scripts/sign-and-notarize-packaged-app.mjs \
            --app "$app_dir"
          ditto -c -k --sequesterRsrc --keepParent \
            "$app_dir" \
            "$zip_artifact_path"
          node apps/desktop/scripts/create-styled-dmg.mjs \
            --app "$app_dir" \
            --out "$dmg_artifact_path" \
            --volume-name "Okou" \
            --background-svg apps/desktop/assets/dmg-background-okou.svg
          codesign --force --sign "$OKOU_DESKTOP_SIGNING_IDENTITY" --timestamp "$dmg_artifact_path"
          # A single timed-out status poll makes notarytool exit non-zero while the
          # submission itself is still healthy, which loses the whole release. Retry
          # the submission twice; a terminal Apple verdict is never retried.
          notarize_log="$(mktemp)"
          notarize_status=1
          for attempt in 1 2 3; do
            if xcrun notarytool submit "$dmg_artifact_path" \
              --key "$OKOU_DESKTOP_NOTARIZE_API_KEY_PATH" \
              --key-id "$OKOU_DESKTOP_NOTARIZE_API_KEY_ID" \
              --issuer "$OKOU_DESKTOP_NOTARIZE_API_ISSUER" \
              --wait 2>&1 | tee "$notarize_log"; then
              notarize_status=0
              break
            fi

            if grep -Eq '^[[:space:]]+status: (Invalid|Rejected)$' "$notarize_log"; then
              echo "::error::Apple rejected notarization of ${dmg_artifact_path}"
              exit 1
            fi

            echo "::warning::Notarization did not complete (attempt ${attempt}/3)"
            if [ "$attempt" -lt 3 ]; then
              sleep 30
            fi
          done

          if [ "$notarize_status" -ne 0 ]; then
            echo "::error::Notarization did not complete after 3 attempts"
            exit 1
          fi

          xcrun stapler staple "$dmg_artifact_path"

          {
            echo "okou_zip_path=$zip_artifact_path"
            echo "okou_dmg_path=$dmg_artifact_path"
          } >> "$GITHUB_OUTPUT"

      - name: Verify signed and notarized macOS artifacts
        run: |
          app_name="Okou"
          bundle_id="ai.okou.desktop"
          auth_scheme="ai.okou.desktop"
          app_dir="apps/desktop/out/${app_name}-darwin-arm64/${app_name}.app"
          plist="$app_dir/Contents/Info.plist"
          runtime_config="$app_dir/Contents/Resources/app/desktop-runtime-config.json"
          zip_artifact_path="apps/desktop/out/${app_name}-darwin-arm64-$DESKTOP_VERSION.zip"
          dmg_artifact_path="apps/desktop/out/${app_name}-darwin-arm64-$DESKTOP_VERSION.dmg"
          dmg_mount="$RUNNER_TEMP/okou-desktop-dmg"

          if [ ! -f "$zip_artifact_path" ] || [ ! -f "$dmg_artifact_path" ]; then
            echo "Missing $app_name release artifacts"
            find apps/desktop/out -maxdepth 5 -type f -print || true
            exit 1
          fi
          if [ ! -d "$app_dir" ]; then
            echo "No packaged app found: $app_dir"
            find apps/desktop/out -maxdepth 4 -type d -print || true
            exit 1
          fi
          if [ ! -f "$runtime_config" ]; then
            echo "Okou production artifact should contain Desktop runtime config"
            exit 1
          fi
          RUNTIME_CONFIG="$runtime_config" node <<'NODE'
          const fs = require("node:fs");

          const config = JSON.parse(
            fs.readFileSync(process.env.RUNTIME_CONFIG, "utf8"),
          );
          if (
            config.product !== "okou" ||
            config.platformUrl !== "https://app.okou.ai"
          ) {
            throw new Error(`Unexpected Okou runtime config: ${JSON.stringify(config)}`);
          }
          NODE

          minimum_system_version=$(/usr/libexec/PlistBuddy -c "Print :LSMinimumSystemVersion" "$plist" 2>/dev/null || true)
          if [ "$minimum_system_version" != "14.0" ]; then
            echo "::error::Expected LSMinimumSystemVersion 14.0, found ${minimum_system_version:-missing}"
            exit 1
          fi
          /usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$plist" | grep -qx "$app_name"
          /usr/libexec/PlistBuddy -c "Print :CFBundleName" "$plist" | grep -qx "$app_name"
          /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$plist" | grep -qx "$app_name"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$plist" | grep -qx "$bundle_id"
          /usr/libexec/PlistBuddy -c "Print :CFBundleURLTypes:0:CFBundleURLSchemes:0" "$plist" | grep -qx "$auth_scheme"
          file "$app_dir/Contents/MacOS/$app_name" | grep -q "arm64"
          file "$app_dir/Contents/Resources/native/computer-use-helper" | grep -q "arm64"
          codesign --verify --deep --strict --verbose=2 "$app_dir"
          codesign --display --verbose=4 "$app_dir" 2>&1 | grep -F "Authority=$OKOU_DESKTOP_SIGNING_IDENTITY"
          xcrun stapler validate "$app_dir"
          unzip -l "$zip_artifact_path" | grep -q "$app_name.app/Contents/MacOS/$app_name"
          codesign --verify --verbose=2 "$dmg_artifact_path"
          codesign --display --verbose=4 "$dmg_artifact_path" 2>&1 | grep -F "Authority=$OKOU_DESKTOP_SIGNING_IDENTITY"
          xcrun stapler validate "$dmg_artifact_path"
          hdiutil verify "$dmg_artifact_path"

          (
            rm -rf "$dmg_mount"
            mkdir -p "$dmg_mount"
            hdiutil attach "$dmg_artifact_path" -nobrowse -readonly -mountpoint "$dmg_mount"
            trap 'hdiutil detach "$dmg_mount"' EXIT

            mounted_app="$dmg_mount/$app_name.app"
            if [ ! -d "$mounted_app" ]; then
              echo "DMG should contain $app_name.app"
              find "$dmg_mount" -maxdepth 2 -print || true
              exit 1
            fi
            mounted_plist="$mounted_app/Contents/Info.plist"
            mounted_minimum_system_version=$(/usr/libexec/PlistBuddy -c "Print :LSMinimumSystemVersion" "$mounted_plist" 2>/dev/null || true)
            if [ "$mounted_minimum_system_version" != "14.0" ]; then
              echo "::error::Expected mounted app LSMinimumSystemVersion 14.0, found ${mounted_minimum_system_version:-missing}"
              exit 1
            fi
            if [ ! -L "$dmg_mount/Applications" ] || [ "$(readlink "$dmg_mount/Applications")" != "/Applications" ]; then
              echo "DMG Applications symlink should point to /Applications"
              exit 1
            fi
            if [ ! -f "$dmg_mount/.background/background.png" ]; then
              echo "DMG should contain the Finder background image"
              find "$dmg_mount" -maxdepth 3 -print || true
              exit 1
            fi
            background_info="$(sips -g pixelWidth -g pixelHeight -g dpiWidth -g dpiHeight "$dmg_mount/.background/background.png")"
            echo "$background_info"
            echo "$background_info" | grep -q "pixelWidth: 1320"
            echo "$background_info" | grep -q "pixelHeight: 800"
            echo "$background_info" | grep -q "dpiWidth: 144.000"
            echo "$background_info" | grep -q "dpiHeight: 144.000"
            codesign --verify --deep --strict --verbose=2 "$mounted_app"
            xcrun stapler validate "$mounted_app"

            install_dir="$RUNNER_TEMP/okou-install-smoke/Applications"
            installed_app="$install_dir/Okou.app"
            update_dir="$RUNNER_TEMP/okou-update-smoke"
            rm -rf "$install_dir" "$update_dir"
            mkdir -p "$install_dir" "$update_dir"

            ditto "$mounted_app" "$installed_app"
            OKOU_DESKTOP_PRODUCT=okou \
            OKOU_DESKTOP_PLATFORM_URL=https://app.okou.ai \
            OKOU_DESKTOP_SMOKE_APP_PATH="$installed_app" \
            node apps/desktop/scripts/smoke-test-packaged-app.js

            unzip -q "$zip_artifact_path" -d "$update_dir"
            rm -rf "$installed_app"
            ditto "$update_dir/Okou.app" "$installed_app"
            OKOU_DESKTOP_PRODUCT=okou \
            OKOU_DESKTOP_PLATFORM_URL=https://app.okou.ai \
            OKOU_DESKTOP_SMOKE_APP_PATH="$installed_app" \
            node apps/desktop/scripts/smoke-test-packaged-app.js
          )

      - name: Upload Desktop artifacts to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$OKOU_RELEASE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            okou_release_target=$(gh release view "$OKOU_RELEASE_TAG" \
              --repo "${{ github.repository }}" \
              --json targetCommitish \
              --jq .targetCommitish)
            if [ "$okou_release_target" != "$RELEASE_TARGET" ]; then
              echo "::error::Okou Desktop release $OKOU_RELEASE_TAG targets $okou_release_target instead of $RELEASE_TARGET"
              exit 1
            fi
          else
            gh release create "$OKOU_RELEASE_TAG" \
              --repo "${{ github.repository }}" \
              --target "$RELEASE_TARGET" \
              --title "Okou $DESKTOP_VERSION" \
              --notes "Signed and notarized Okou release for Apple silicon Macs." \
              --latest=false
          fi

          gh release upload "$OKOU_RELEASE_TAG" \
            "${{ steps.desktop-artifacts.outputs.okou_zip_path }}" \
            "${{ steps.desktop-artifacts.outputs.okou_dmg_path }}" \
            --repo "${{ github.repository }}" \
            --clobber

      - name: Calculate duration
        id: duration
        if: ${{ always() && steps.timer.outputs.start }}
        run: |
          elapsed=$(( $(date +%s) - ${{ steps.timer.outputs.start }} ))
          h=$((elapsed / 3600)) m=$(( (elapsed % 3600) / 60 )) s=$((elapsed % 60))
          if [ $h -gt 0 ]; then text="${h}h ${m}m ${s}s"
          elif [ $m -gt 0 ]; then text="${m}m ${s}s"
          else text="${s}s"; fi
          echo "text=$text" >> "$GITHUB_OUTPUT"

      - name: Notify Slack - Success
        if: ${{ success() && steps.slack-start.outputs.ts }}
        uses: slackapi/slack-github-action@v4.0.0
        with:
          method: chat.update
          token: ${{ secrets.CI_SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ vars.SLACK_RELEASE_CHANNEL_ID }}
            ts: "${{ steps.slack-start.outputs.ts }}"
            text: "*Desktop App* ✅ Published signed macOS release"
            blocks:
              - type: section
                text:
                  type: mrkdwn
                  text: "*Desktop App* ✅ Published signed macOS Apple silicon artifacts\n📦 Version: `${{ needs.release-please.outputs.desktop_version }}`\n⏱️ `${{ steps.duration.outputs.text }}`\n🟠 <${{ github.server_url }}/${{ github.repository }}/releases/tag/okou-desktop-v${{ needs.release-please.outputs.desktop_version }}|Okou Release>\n⬇️ <${{ github.server_url }}/${{ github.repository }}/releases/download/okou-desktop-v${{ needs.release-please.outputs.desktop_version }}/Okou-darwin-arm64-${{ needs.release-please.outputs.desktop_version }}.dmg|Download Okou macOS DMG>\n🔄 <${{ github.server_url }}/${{ github.repository }}/releases/download/okou-desktop-v${{ needs.release-please.outputs.desktop_version }}/Okou-darwin-arm64-${{ needs.release-please.outputs.desktop_version }}.zip|Okou auto-update ZIP>"

      - name: Notify Slack - Failure
        if: ${{ failure() && steps.slack-start.outputs.ts }}
        uses: slackapi/slack-github-action@v4.0.0
        with:
          method: chat.update
          token: ${{ secrets.CI_SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ vars.SLACK_RELEASE_CHANNEL_ID }}
            ts: "${{ steps.slack-start.outputs.ts }}"
            text: "*Desktop App* ❌ Release failed"
            blocks:
              - type: section
                text:
                  type: mrkdwn
                  text: "*Desktop App* ❌ Release failed\n📦 Version: `${{ needs.release-please.outputs.desktop_version }}`\n⏱️ `${{ steps.duration.outputs.text }}`\n🔗 <${{ github.server_url }}/${{ github.repository }}/releases/tag/okou-desktop-v${{ needs.release-please.outputs.desktop_version }}|View Release>\n🔗 <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Logs>"

      - name: Delete temporary keychain
        if: ${{ always() && steps.signing-certificate.outputs.keychain_path != '' }}
        run: security delete-keychain "${{ steps.signing-certificate.outputs.keychain_path }}" || true

  publish-desktop-update-manifest:
    name: publish-desktop-update-manifest
    needs: [release-please, promote-desktop-release]
    if: ${{ needs.release-please.outputs.desktop_release_created == 'true' && needs.promote-desktop-release.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: turbo
    permissions:
      contents: write
    env:
      DESKTOP_VERSION: ${{ needs.release-please.outputs.desktop_version }}
      OKOU_RELEASE_TAG: okou-desktop-v${{ needs.release-please.outputs.desktop_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.release-please.outputs.release_target }}

      - name: Verify Desktop release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_assets="$(gh release view "$OKOU_RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --json assets \
            --jq '.assets[].name')"

          for extension in zip dmg; do
            asset_name="Okou-darwin-arm64-$DESKTOP_VERSION.$extension"
            if ! printf '%s\n' "$release_assets" | grep -qx "$asset_name"; then
              echo "::error::Missing Desktop release asset: $asset_name"
              printf '%s\n' "$release_assets"
              exit 1
            fi
          done

      - name: Publish Desktop update manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          manifest_tag=ai-okou-desktop-updates
          manifest_filename=ai-okou-desktop-update-manifest.json
          manifest_dir="apps/desktop/out/update-manifest/okou"
          manifest_path="$manifest_dir/$manifest_filename"

          mkdir -p "$manifest_dir"
          if gh release view "$manifest_tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            if gh release view "$manifest_tag" \
              --repo "${{ github.repository }}" \
              --json assets \
              --jq '.assets[].name' | grep -qx "$manifest_filename"; then
              gh release download "$manifest_tag" \
                --repo "${{ github.repository }}" \
                --pattern "$manifest_filename" \
                --dir "$manifest_dir" \
                --clobber
            fi
          else
            gh release create "$manifest_tag" \
              --repo "${{ github.repository }}" \
              --title "Okou Desktop Updates" \
              --notes "Mutable manifest used by the Okou desktop auto-update feed." \
              --latest=false
          fi

          zip_url="https://github.com/${{ github.repository }}/releases/download/$OKOU_RELEASE_TAG/Okou-darwin-arm64-$DESKTOP_VERSION.zip"
          node apps/desktop/scripts/update-desktop-release-manifest.mjs \
            --manifest "$manifest_path" \
            --version "$DESKTOP_VERSION" \
            --zip-url "$zip_url" \
            --channel stable \
            --platform darwin \
            --arch arm64

          gh release upload "$manifest_tag" "$manifest_path" \
            --repo "${{ github.repository }}" \
            --clobber

  detect-host-worker-deploy-inputs:
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      ci_changed: ${{ steps.detect.outputs.ci-changed }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.release_target }}
          fetch-depth: 0

      - name: Detect Host Worker deploy input changes
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          git fetch --force --tags origin

          HEAD_SHA="${{ needs.release-please.outputs.release_target }}"

          if ! git cat-file -e "${HEAD_SHA}^{commit}"; then
            echo "::error::Release head commit $HEAD_SHA is not available"
            exit 1
          fi

          BASE_REF=$(git tag --merged "${HEAD_SHA}^" --sort=-creatordate \
            | grep -E '^[[:alnum:]._-]+-v[0-9]' \
            | head -1 || true)
          if [[ -z "$BASE_REF" ]]; then
            BASE_REF="${HEAD_SHA}^"
          fi

          echo "Comparing $BASE_REF..$HEAD_SHA for Host Worker deploy inputs"
          git diff --name-only "$BASE_REF" "$HEAD_SHA" | tee /tmp/host-worker-deploy-inputs.txt

          if grep -qE '^\.github/workflows/(turbo|crates|runner-image|release-please)\.yml$|^\.github/actions/(setup-ssh-tunnel|provision|toolchain-init)/|^\.github/scripts/|^ansible/' /tmp/host-worker-deploy-inputs.txt; then
            echo "Host Worker deploy CI inputs changed"
            echo "ci-changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No Host Worker deploy CI input changes"
            echo "ci-changed=false" >> "$GITHUB_OUTPUT"
          fi

  deploy-host-worker-production:
    needs: [release-please, detect-host-worker-deploy-inputs]
    if: >-
      ${{
        needs.release-please.outputs.host_worker_release_created == 'true' ||
        needs.detect-host-worker-deploy-inputs.outputs.ci_changed == 'true'
      }}
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-host-worker-production
      cancel-in-progress: false
    container:
      image: ghcr.io/${{ github.repository_owner }}/vm0-toolchain:20260825
    permissions:
      contents: read
    environment: production
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.release_target }}
      - uses: ./.github/actions/toolchain-init

      - name: Notify Slack - Starting
        id: slack-start
        if: ${{ vars.SLACK_RELEASE_CHANNEL_ID != '' }}
        uses: slackapi/slack-github-action@v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.CI_SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ vars.SLACK_RELEASE_CHANNEL_ID }}
            text: "*Host Worker* deploying to Cloudflare..."
            blocks:
              - type: section
                text:
                  type: mrkdwn
                  text: "*Host Worker* deploying to Cloudflare...\n🔗 <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Logs>"

      - name: Record start time
        id: timer
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Deploy Host Worker to Cloudflare
        shell: bash
        working-directory: turbo
        env:
          CF_ZERO_HOST_WORKER_DEPLOY_API_TOKEN: ${{ secrets.CF_ZERO_HOST_WORKER_DEPLOY_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${CF_ZERO_HOST_WORKER_DEPLOY_API_TOKEN:-}" ]]; then
            echo "::error::CF_ZERO_HOST_WORKER_DEPLOY_API_TOKEN must be configured as a GitHub Actions secret"
            exit 1
          fi
          if [[ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "::error::CF_ACCOUNT_ID must be configured as a GitHub Actions variable or secret"
            exit 1
          fi
          CLOUDFLARE_API_TOKEN="$CF_ZERO_HOST_WORKER_DEPLOY_API_TOKEN" pnpm -F @okouai/host-worker run deploy

      - name: Calculate duration
        id: duration
        if: ${{ always() && steps.timer.outputs.start }}
        run: |
          elapsed=$(( $(date +%s) - ${{ steps.timer.outputs.start }} ))
          h=$((elapsed / 3600)) m=$(( (elapsed % 3600) / 60 )) s=$((elapsed % 60))
          if [ $h -gt 0 ]; then text="${h}h ${m}m ${s}s"
          elif [ $m -gt 0 ]; then text="${m}m ${s}s"
          else text="${s}s"; fi
          echo "text=$text" >> "$GITHUB_OUTPUT"

      - name: Notify Slack - Success
        if: ${{ success() && steps.slack-start.outputs.ts }}
        uses: slackapi/slack-github-action@v4.0.0
        with:
          method: chat.update
          token: ${{ secrets.CI_SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ vars.SLACK_RELEASE_CHANNEL_ID }}
            ts: "${{ steps.slack-start.outputs.ts }}"
            text: "*Host Worker* ✅ Deployed to Cloudflare"
            blocks:
              - type: section
                text:
                  type: mrkdwn
                  text: "*Host Worker* ✅ Deployed to Cloudflare\n⏱️ `${{ steps.duration.outputs.text }}`\n🔗 <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Logs>"

      - name: Notify Slack - Failure
        if: ${{ failure() && steps.slack-start.outputs.ts }}
        uses: slackapi/slack-github-action@v4.0.0
        with:
          method: chat.update
          token: ${{ secrets.CI_SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ vars.SLACK_RELEASE_CHANNEL_ID }}
            ts: "${{ steps.slack-start.outputs.ts }}"
            text: "*Host Worker* ❌ Deploy failed"
            blocks:
              - type: section
                text:
                  type: mrkdwn
                  text: "*Host Worker* ❌ Deploy failed\n⏱️ `${{ steps.duration.outputs.text }}`\n🔗 <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Logs>"

  # Fan-in barrier: non-API build-phase and release validation jobs must finish
  # (success or skipped) before deployment-phase jobs start. If any included build
  # or validation fails, this job fails, which in turn blocks jobs that keep a
  # `needs: builds-complete` edge.
  #
  # The API artifact is built in promote-api-production after this barrier so it
  # stays on the same runner through migrations and production deployment.
  builds-complete:
    needs:
      - release-please
      - validate-db-release-coupling
      - build-runner-release-assets
      - runner-production-host-groups
      - build-runner-production
      - sbom
      - resolve-image-cache
    # Use always() so this job runs even when upstream build jobs are skipped.
    # !cancelled() is insufficient — it still propagates "skipped" from needs
    # dependencies, which causes builds-complete (and transitively
    # promote-api-production) to be skipped whenever any build job is skipped.
    # The jq step below performs the actual failure check and exits 1, making
    # the barrier explicit.
    if: ${{ always() && needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify no build failed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        shell: bash
        run: |
          set -euo pipefail
          echo "$NEEDS_JSON" | jq .
          # "skipped" is acceptable for component-conditional build jobs.
          failures=$(echo "$NEEDS_JSON" | jq -r '
            to_entries[]
            | select(.value.result != "success" and .value.result != "skipped")
            | .key
          ')
          if [ -n "$failures" ]; then
            echo "::error::Build-phase jobs did not succeed: $failures"
            exit 1
          fi
          echo "✅ All build-phase jobs succeeded or were skipped."

  # Build the API artifact, run required production migrations, and deploy that
  # exact artifact from the same runner only after migrations succeed.
  promote-api-production:
    needs: [release-please, builds-complete]
    if: >-
      always() &&
      !failure() && !cancelled() &&
      needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/vm0-toolchain:20260825
    outputs:
      deployment_url: ${{ steps.deploy.outputs.url }}
      vercel_dashboard_url: ${{ steps.vercel-dashboard.outputs.url }}
    permissions:
      contents: read
      deployments: write
      id-token: write
    environment: production
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.release_target }}

      - name: Initialize API release toolchain
        uses: ./.github/actions/toolchain-init

      - name: Build Runtime API Schema
        working-directory: turbo
        run: pnpm --filter @okouai/api-contracts run build:runtime-api-schema -- --out "$GITHUB_WORKSPACE/turbo/runtime-api-schema.json"

      - name: Upload Runtime API Schema Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: runtime-api-schema
          path: turbo/runtime-api-schema.json
          overwrite: true
          if-no-files-found: error
          retention-days: 14

      - name: Build API Production Artifact
        run: pnpm --dir turbo/apps/api build

      - name: Install neonctl
        run: npm install -g neonctl@2.15.0

      - name: Initialize API deployment toolchain
        uses: ./.github/actions/vercel-setup
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ vars.VERCEL_TEAM_ID }}
          vercel-project-id: ${{ vars.VERCEL_PROJECT_ID_API }}

      - name: Get Production Database URL
        id: get-db-url
        shell: bash
        run: |
          DATABASE_URL=$(neonctl connection-string production --project-id ${{ vars.NEON_PROJECT_ID }} --database-name neondb --role-name neondb_owner --pooled --ssl verify-full)
          WORKFLOW_COMMAND_DATA="${DATABASE_URL//%/%25}"
          WORKFLOW_COMMAND_DATA="${WORKFLOW_COMMAND_DATA//$'\r'/%0D}"
          WORKFLOW_COMMAND_DATA="${WORKFLOW_COMMAND_DATA//$'\n'/%0A}"
          printf '::add-mask::%s\n' "$WORKFLOW_COMMAND_DATA"
          echo "database-url=$DATABASE_URL" >> "$GITHUB_OUTPUT"
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}

      - name: Fetch production Doppler OAuth config
        id: doppler-oauth
        uses: dopplerhq/secrets-fetch-action@v2.0.0
        with:
          auth-method: oidc
          doppler-identity-id: ${{ vars.DOPPLER_SERVICE_IDENTITY_ID }}
          doppler-project: vm0
          doppler-config: prd

      - name: Wait for canonical CLI artifact
        id: cli-artifact
        shell: bash
        env:
          ARTIFACT_SHA: ${{ needs.release-please.outputs.release_target }}
          CLI_STATIC_BASE_URL: https://static.okou.io
        run: |
          set -euo pipefail

          if [[ ! "$ARTIFACT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "CLI artifact commit must be a full lowercase SHA-1: $ARTIFACT_SHA" >&2
            exit 1
          fi

          artifact_base_url="${CLI_STATIC_BASE_URL}/okou-cli/${ARTIFACT_SHA}"
          artifact_dir="$(mktemp -d)"
          for attempt in $(seq 1 60); do
            if curl -fsSL \
              "${artifact_base_url}/ready.json" \
              --output "${artifact_dir}/ready.json"; then
              break
            fi
            if (( attempt == 60 )); then
              echo "CLI artifact was not ready after 10 minutes: $artifact_base_url" >&2
              exit 1
            fi
            echo "Waiting for CLI artifact: $artifact_base_url (attempt $attempt/60)"
            sleep 10
          done

          curl -fsSL \
            "${artifact_base_url}/manifest.json" \
            --output "${artifact_dir}/manifest.json"
          curl -fsSL \
            "${artifact_base_url}/package.tgz" \
            --output "${artifact_dir}/package.tgz"
          bash .github/scripts/verify-okou-cli-artifact.sh \
            "$artifact_dir" \
            "$ARTIFACT_SHA"
          bash .github/scripts/smoke-okou-cli-artifact.sh \
            "$artifact_dir/package.tgz"
          echo "package-url=${artifact_base_url}/package.tgz" >> "$GITHUB_OUTPUT"

      - name: Resolve API production environment
        id: api-production-env
        uses: ./.github/actions/web-api-env
        with:
          app: api
          environment: production
          database-url: ${{ steps.get-db-url.outputs.database-url }}
          web-url: https://www.okou.ai
          app-url: https://app.okou.ai
          api-backend-url: ${{ vars.OKOU_API_BACKEND_URL }}
          cli-pkg-url: ${{ steps.cli-artifact.outputs.package-url }}
        env:
          REPO_VARS_JSON: ${{ toJSON(vars) }}
          REPO_SECRETS_JSON: ${{ toJSON(secrets) }}
          DOPPLER_SECRETS_JSON: ${{ toJSON(steps.doppler-oauth.outputs) }}

      - name: Notify Slack - Migration Starting
        id: migration-slack-start
        if: ${{ needs.release-please.outputs.api_release_created == 'true' && vars.SLACK_RELEASE_CHANNEL_ID != '' }}
        uses: slackapi/slack-github-action@v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.CI_SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ vars.SLACK_RELEASE_CHANNEL_ID }}
            text: "*Database Migration* starting..."
            blocks:
              - type: section
                text:
                  type: mrkdwn
                  text: "*Database Migration* starting...\n📦 Version: `${{ needs.release-please.outputs.api_version }}`\n🔗 <${{ github.server_url }}/${{ github.repository }}/releases/tag/api-v${{ needs.release-please.outputs.api_version }}|View Release>"

      - name: Record migration start time
        id: migration-timer
        if: ${{ needs.release-please.outputs.api_release_created == 'true' }}
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Run Production Migration Smoke Test
        id: run-migration-smoke-test
        if: ${{ needs.release-please.outputs.api_release_created == 'true' }}
        uses: ./.github/actions/production-migration-smoke
        with:
          neon-api-key: ${{ secrets.NEON_API_KEY }}
          neon-project-id: ${{ vars.NEON_PROJECT_ID }}
          branch-name: release-smoke/migrate-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Run Production Migrations
        if: ${{ needs.release-please.outputs.api_release_created == 'true' }}
        run: |
          echo "Running production migrations on production"
          cd turbo && pnpm -F @okouai/db db:migrate
        env:
          DATABASE_URL: ${{ steps.get-db-url.outputs.database-url }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}

      - name: Calculate migration duration
        id: migration-duration
        if: ${{ always() && steps.migration-timer.outputs.start }}
        run: |
          elapsed=$(( $(date +%s) - ${{ steps.migration-timer.outputs.start }} ))
          h=$((elapsed / 3600)) m=$(( (elapsed % 3600) / 60 )) s=$((elapsed % 60))
          if [ $h -gt 0 ]; then text="${h}h ${m}m ${s}s"
          elif [ $m -gt 0 ]; then text="${m}m ${s}s"
          else text="${s}s"; fi
          echo "text=$text" >> "$GITHUB_OUTPUT"

      - name: Notify Slack - Migration Success
        if: ${{ success() && steps.migration-slack-start.outputs.ts }}
        uses: slackapi/slack-github-action@v4.0.0
        with:
          method: chat.update
          token: ${{ secrets.CI_SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ vars.SLACK_RELEASE_CHANNEL_ID }}
            ts: "${{ steps.migration-slack-start.outputs.ts }}"
            text: "*Database Migration* ✅ Migration completed"
            blocks:
              - type: section
                text:
                  type: mrkdwn
                  text: "*Database Migration* ✅ Migration completed\n📦 Version: `${{ needs.release-please.outputs.api_version }}`\n⏱️ `${{ steps.migration-duration.outputs.text }}`\n🔗 <${{ github.server_url }}/${{ github.repository }}/releases/tag/api-v${{ needs.release-please.outputs.api_version }}|View Release>"

      - name: Notify Slack - Migration Smoke Failure
        if: >-
          ${{
            failure() &&
            steps.migration-slack-start.outputs.ts &&
            steps.run-migration-smoke-test.outcome == 'failure'
          }}
        uses: slackapi/slack-github-action@v4.0.0
        with:
          method: chat.update
          token: ${{ secrets.CI_SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ vars.SLACK_RELEASE_CHANNEL_ID }}
            ts: "${{ steps.migration-slack-start.outputs.ts }}"
            text: "*Database Migration Smoke* ❌ Smoke check failed"
            blocks:
              - type: section
                text:
                  type: mrkdwn
                  text: "*Database Migration Smoke* ❌ Smoke check failed\n📦 Version: `${{ needs.release-please.outputs.api_version }}`\n⏱️ `${{ steps.migration-duration.outputs.text }}`\n⚠️ Production database migration was not run. The failure happened before the real production DB migration, on its temporary Neon production clone or during cleanup.\n🔗 <${{ github.server_url }}/${{ github.repository }}/releases/tag/api-v${{ needs.release-please.outputs.api_version }}|View Release>\n🔗 <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Logs>"

      - name: Notify Slack - Migration Failure
        if: >-
          ${{
            failure() &&
            steps.migration-slack-start.outputs.ts &&
            steps.run-migration-smoke-test.outcome != 'failure'
          }}
        uses: slackapi/slack-github-action@v4.0.0
        with:
          method: chat.update
          token: ${{ secrets.CI_SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ vars.SLACK_RELEASE_CHANNEL_ID }}
            ts: "${{ steps.migration-slack-start.outputs.ts }}"
            text: "*Database Migration* ❌ Migration failed"
            blocks:
              - type: section
                text:
                  type: mrkdwn
                  text: "*Database Migration* ❌ Migration failed\n📦 Version: `${{ needs.release-please.outputs.api_version }}`\n⏱️ `${{ steps.migration-duration.outputs.text }}`\n🔗 <${{ github.server_url }}/${{ github.repository }}/releases/tag/api-v${{ needs.release-please.outputs.api_version }}|View Release>\n🔗 <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Logs>"

      - name: Start GitHub Deployment
        id: deployment
        uses: bobheadxi/deployments@v1
        with:
          step: start
          token: ${{ github.token }}
          env: api/production
          ref: ${{ github.ref }}
          desc: Deploying API production artifact

      - name: Notify Slack - Starting
        id: slack-start
        if: ${{ vars.SLACK_RELEASE_CHANNEL_ID != '' }}
        uses: slackapi/slack-github-action@v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.CI_SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ vars.SLACK_RELEASE_CHANNEL_ID }}
            text: "*API* deploying production artifact..."
            blocks:
              - type: section
                text:
                  type: mrkdwn
                  text: "*API* deploying production artifact...\n📦 Version: `${{ needs.release-please.outputs.api_version }}`\n🔗 <${{ github.server_url }}/${{ github.repository }}/releases/tag/api-v${{ needs.release-please.outputs.api_version }}|View Release>"

      - name: Record start time
        id: timer
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Deploy API Production
        id: deploy
        uses: ./.github/actions/vercel-deploy
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ vars.VERCEL_TEAM_ID }}
          vercel-project-id: ${{ vars.VERCEL_PROJECT_ID_API }}
          environment: production
          deployment-env: api
          prebuilt: "true"
          prebuilt-build-command: |
            rm -rf .vercel/output
            cp -R turbo/apps/api/.vercel/output .vercel/output
          environment-file: ${{ steps.api-production-env.outputs.file }}
          skip-start: "true"
          skip-finish: "true"
          skip-setup: "true"

      - name: Reconcile production connector catalog (best effort)
        shell: bash
        env:
          API_DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail

          if ! response=$(vercel curl /api/cron/sync-connector-catalog \
            --deployment "$API_DEPLOYMENT_URL" \
            --token "$VERCEL_TOKEN" \
            -- \
            --fail-with-body \
            --show-error \
            --silent \
            --max-time 120 \
            --header "Authorization: Bearer ${CRON_SECRET}"); then
            echo "::warning::Connector catalog reconcile request failed; the scheduled cron will retry"
            exit 0
          fi

          if ! summary=$(jq -c '{
            outcome,
            hasActive: (.active != null),
            lastAttemptOutcome: .lastAttempt.outcome,
            filtering: {
              stale: .filtering.stale,
              filteredAuthMethodCount: (.filtering.filteredAuthMethods | length)
            }
          }' <<< "$response"); then
            echo "::warning::Connector catalog reconcile returned invalid JSON; the scheduled cron will retry"
            exit 0
          fi

          echo "Connector catalog reconcile: ${summary}"
          if ! jq -e '
            .state == "current"
            and .active != null
            and .filtering.stale == false
          ' <<< "$response" >/dev/null; then
            echo "::warning::Connector catalog is not ready; the scheduled cron will retry"
          fi

      - name: Resolve Vercel dashboard URL
        id: vercel-dashboard
        if: ${{ steps.deploy.outputs.url != '' }}
        uses: ./.github/actions/vercel-dashboard-url
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          deployment-url: ${{ steps.deploy.outputs.url }}

      - name: Finish GitHub Deployment
        if: ${{ always() && steps.deployment.outputs.deployment_id }}
        uses: bobheadxi/deployments@v1
        with:
          step: finish
          token: ${{ github.token }}
          status: ${{ job.status }}
          env: ${{ steps.deployment.outputs.env }}
          env_url: ${{ steps.vercel-dashboard.outputs.url }}
          deployment_id: ${{ steps.deployment.outputs.deployment_id }}

      - name: Calculate duration
        id: duration
        if: ${{ always() && steps.timer.outputs.start }}
        run: |
          elapsed=$(( $(date +%s) - ${{ steps.timer.outputs.start }} ))
          h=$((elapsed / 3600)) m=$(( (elapsed % 3600) / 60 )) s=$((elapsed % 60))
          if [ $h -gt 0 ]; then text="${h}h ${m}m ${s}s"
          elif [ $m -gt 0 ]; then text="${m}m ${s}s"
          else text="${s}s"; fi
          echo "text=$text" >> "$GITHUB_OUTPUT"

      - name: Notify Slack - Success
        if: ${{ success() && steps.slack-start.outputs.ts }}
        uses: slackapi/slack-github-action@v4.0.0
        with:
          method: chat.update
          token: ${{ secrets.CI_SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ vars.SLACK_RELEASE_CHANNEL_ID }}
            ts: "${{ steps.slack-start.outputs.ts }}"
            text: "*API* ✅ Deployed to production"
            blocks:
              - type: section
                text:
                  type: mrkdwn
                  text: "*API* ✅ Deployed to production\n📦 Version: `${{ needs.release-please.outputs.api_version }}`\n⏱️ `${{ steps.duration.outputs.text }}`\n🔗 <${{ github.server_url }}/${{ github.repository }}/releases/tag/api-v${{ needs.release-please.outputs.api_version }}|View Release>\n🔄 <${{ github.server_url }}/${{ github.repository }}/issues/${{ vars.ROLLBACK_ISSUE_NUMBER }}|Rollback Dashboard>"

      - name: Notify Slack - Failure
        if: ${{ failure() && steps.slack-start.outputs.ts }}
        uses: slackapi/slack-github-action@v4.0.0
        with:
          method: chat.update
          token: ${{ secrets.CI_SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ vars.SLACK_RELEASE_CHANNEL_ID }}
            ts: "${{ steps.slack-start.outputs.ts }}"
            text: "*API* ❌ Deploy failed"
            blocks:
              - type: section
                text:
                  type: mrkdwn
                  text: "*API* ❌ Deploy failed\n📦 Version: `${{ needs.release-please.outputs.api_version }}`\n⏱️ `${{ steps.duration.outputs.text }}`\n🔗 <${{ github.server_url }}/${{ github.repository }}/releases/tag/api-v${{ needs.release-please.outputs.api_version }}|View Release>\n🔗 <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Logs>"

  deploy-api-schema:
    needs: [release-please, promote-api-production]
    if: >-
      always() &&
      needs.release-please.outputs.api_deploy_required == 'true' &&
      needs.promote-api-production.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Runtime API Schema Artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: runtime-api-schema
          path: /tmp/runtime-api-schema

      - name: Publish Runtime API Schema
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SCHEMA_RELEASE_TAG: runtime-api-schema-prod
          RELEASE_SHA: ${{ needs.release-please.outputs.release_target }}
          API_VERSION: ${{ needs.release-please.outputs.api_version }}
        run: |
          set -euo pipefail

          schema_path="/tmp/runtime-api-schema/runtime-api-schema.json"
          if [ ! -f "$schema_path" ]; then
            echo "::error::Runtime API schema artifact is missing: $schema_path"
            exit 1
          fi

          if ! gh release view "$SCHEMA_RELEASE_TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "$SCHEMA_RELEASE_TAG" \
              --repo "$REPO" \
              --target "$RELEASE_SHA" \
              --title "Runtime API Schema (Production)" \
              --notes "Mutable pointer to the runtime API schema currently deployed to production."
          fi

          cp "$schema_path" /tmp/runtime-api-schema/current.json

          cat > /tmp/runtime-api-schema/release-notes.md <<EOF
          Mutable pointer to the runtime API schema currently deployed to production.

          Last updated by release-please workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          API version: ${API_VERSION:-unknown}
          Commit: ${RELEASE_SHA}
          EOF

          gh release upload "$SCHEMA_RELEASE_TAG" \
            /tmp/runtime-api-schema/current.json \
            --repo "$REPO" \
            --clobber

          gh release edit "$SCHEMA_RELEASE_TAG" \
            --repo "$REPO" \
            --notes-file /tmp/runtime-api-schema/release-notes.md

          echo "Published runtime API schema for $RELEASE_SHA"

  # The Worker owns the live App routes. App releases must wait for the
  # canonical build artifact and API production lifecycle.
  promote-app-worker-production:
    needs: [release-please, builds-complete, promote-api-production]
    if: >-
      always() &&
      needs.release-please.outputs.app_deploy_required == 'true' &&
      needs.builds-complete.result == 'success' &&
      needs.promote-api-production.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: ghcr.io/${{ github.repository_owner }}/vm0-toolchain:20260825
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      deployments: write
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-please.outputs.release_target }}
      - uses: ./.github/actions/toolchain-init

      - name: Start GitHub Deployment
        id: deployment
        uses: bobheadxi/deployments@648679e8e4915b27893bd7dbc35cb504dc915bc8 # v1
        with:
          step: start
          token: ${{ github.token }}
          env: app/production
          ref: ${{ github.ref }}
          desc: Deploying App Worker production

      - name: Notify Slack - Starting
        id: slack-start
        if: ${{ vars.SLACK_RELEASE_CHANNEL_ID != '' }}
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.CI_SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ vars.SLACK_RELEASE_CHANNEL_ID }}
            text: "*App* deploying to Cloudflare Workers production..."
            blocks:
              - type: section
                text:
                  type: mrkdwn
                  text: "*App* deploying to Cloudflare Workers production...\n📦 Version: `${{ needs.release-please.outputs.app_deploy_version }}`\n🔗 <${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.release-please.outputs.app_deploy_tag }}|View Release>"

      - name: Record start time
        id: timer
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Resolve App Build Commit SHA
        id: build-commit
        run: |
          sha="$(bash .github/scripts/resolve-build-commit-sha.sh)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Install AWS CLI
        run: |
          architecture="$(dpkg --print-architecture)"
          case "$architecture" in
            amd64) aws_architecture="x86_64" ;;
            arm64) aws_architecture="aarch64" ;;
            *) echo "Unsupported architecture: $architecture" >&2; exit 1 ;;
          esac

          curl -fsSL --retry 3 \
            "https://awscli.amazonaws.com/awscli-exe-linux-${aws_architecture}.zip" \
            --output /tmp/awscliv2.zip
          python3 -m zipfile -e /tmp/awscliv2.zip /tmp/awscli
          chmod +x /tmp/awscli/aws/install /tmp/awscli/aws/dist/aws
          /tmp/awscli/aws/install
          aws --version

      - name: Prepare standalone App Worker production deployment
        id: worker-production
        env:
          ARTIFACT_SHA: ${{ steps.build-commit.outputs.sha }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_STATIC_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_STATIC_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ vars.R2_STATIC_BUCKET_NAME }}
        run: |
          set -euo pipefail

          : "${AWS_ACCESS_KEY_ID:?R2_STATIC_ACCESS_KEY_ID secret is required}"
          : "${AWS_SECRET_ACCESS_KEY:?R2_STATIC_SECRET_ACCESS_KEY secret is required}"
          : "${ARTIFACT_SHA:?resolved app build commit SHA is required}"
          : "${R2_ACCOUNT_ID:?R2_ACCOUNT_ID variable is required}"
          : "${R2_BUCKET_NAME:?R2_STATIC_BUCKET_NAME variable is required}"
          if [[ ! "$ARTIFACT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Artifact commit must be a full lowercase SHA-1: $ARTIFACT_SHA" >&2
            exit 1
          fi

          r2_endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          artifact_uri="s3://${R2_BUCKET_NAME}/okou-app/${ARTIFACT_SHA}"
          ready_key="okou-app/${ARTIFACT_SHA}/ready.json"
          canonical_dist="$(mktemp -d)"
          worker_shell="turbo/apps/app-worker/shell"
          error_log="$(mktemp)"

          for attempt in $(seq 1 60); do
            set +e
            aws s3api head-object \
              --endpoint-url "$r2_endpoint" \
              --bucket "$R2_BUCKET_NAME" \
              --key "$ready_key" \
              >/dev/null 2>"$error_log"
            status=$?
            set -e

            if (( status == 0 )); then
              break
            fi
            if ! grep -Eq '404|NotFound|Not Found|NoSuchKey' "$error_log"; then
              cat "$error_log" >&2
              exit "$status"
            fi
            if (( attempt == 60 )); then
              echo "Artifact was not ready after 10 minutes: $artifact_uri" >&2
              exit 1
            fi
            echo "Waiting for artifact: $artifact_uri (attempt $attempt/60)"
            sleep 10
          done

          bash .github/scripts/fetch-okou-app-artifact.sh \
            "$r2_endpoint" \
            "$artifact_uri" \
            "$canonical_dist"
          bash .github/scripts/verify-okou-app-artifact.sh \
            "$canonical_dist" \
            "$ARTIFACT_SHA"
          mkdir "$worker_shell"
          bash .github/scripts/prepare-okou-app-worker-shell.sh \
            "$canonical_dist" \
            "$worker_shell"

          echo "canonical-dist=$canonical_dist" >> "$GITHUB_OUTPUT"

      - name: Verify immutable App assets for Worker production
        env:
          CANONICAL_ASSETS: ${{ steps.worker-production.outputs.canonical-dist }}/assets
        run: |
          bash .github/scripts/verify-okou-app-assets.sh \
            "https://static.okou.io/okou-app/assets" \
            "$CANONICAL_ASSETS"

      - name: Upload App source maps to Sentry
        env:
          CANONICAL_DIST: ${{ steps.worker-production.outputs.canonical-dist }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT_APP }}
        working-directory: turbo
        run: |
          pnpm --filter @okouai/app exec sentry-cli sourcemaps upload "$CANONICAL_DIST"

      - name: Deploy App Worker production
        env:
          ARTIFACT_SHA: ${{ steps.build-commit.outputs.sha }}
          CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_WORKER_DEPLOY_API_TOKEN }}
        run: |
          set -euo pipefail

          : "${ARTIFACT_SHA:?resolved app build commit SHA is required}"
          : "${CLERK_PUBLISHABLE_KEY:?production Clerk publishable key is required}"
          : "${CLERK_SECRET_KEY:?production Clerk secret key is required}"
          : "${CLOUDFLARE_ACCOUNT_ID:?CF_ACCOUNT_ID variable is required}"
          : "${CLOUDFLARE_API_TOKEN:?CF_API_WORKER_DEPLOY_API_TOKEN secret is required}"
          case "$CLERK_PUBLISHABLE_KEY" in
            pk_live_*) ;;
            *) echo "App Worker production requires a Clerk live publishable key" >&2; exit 1 ;;
          esac
          case "$CLERK_SECRET_KEY" in
            sk_live_*) ;;
            *) echo "App Worker production requires a Clerk live secret key" >&2; exit 1 ;;
          esac

          umask 077
          worker_secrets="$(mktemp)"
          trap 'rm -f "$worker_secrets"' EXIT
          jq -n '{
            CLERK_PUBLISHABLE_KEY: env.CLERK_PUBLISHABLE_KEY,
            CLERK_SECRET_KEY: env.CLERK_SECRET_KEY
          }' > "$worker_secrets"
          unset CLERK_PUBLISHABLE_KEY CLERK_SECRET_KEY

          cd turbo
          pnpm --filter @okouai/app-worker exec wrangler deploy \
            --env production \
            --secrets-file "$worker_secrets" \
            --message "app artifact ${ARTIFACT_SHA}"
          cd ..

          app_origin="https://app.okou.ai"
          api_origin="https://api.okou.ai"
          cors_result="$(
            curl -fsS \
              --connect-timeout 10 \
              --max-time 30 \
              --retry 12 \
              --retry-delay 5 \
              --retry-all-errors \
              --request OPTIONS \
              --header "Origin: ${app_origin}" \
              --header "Access-Control-Request-Method: GET" \
              --output /dev/null \
              --write-out $'%{http_code}\n%header{access-control-allow-origin}\n%header{access-control-allow-credentials}' \
              "${api_origin}/api/__brand-smoke__"
          )"
          mapfile -t cors_values <<< "$cors_result"
          if [[ "${cors_values[0]:-}" != "204" ||
                "${cors_values[1]:-}" != "$app_origin" ||
                "${cors_values[2]:-}" != "true" ]]; then
            echo "::error title=App Worker API CORS mismatch::${api_origin} rejected ${app_origin}" >&2
            exit 1
          fi

      - name: Finish GitHub Deployment
        if: always()
        uses: bobheadxi/deployments@648679e8e4915b27893bd7dbc35cb504dc915bc8 # v1
        with:
          step: finish
          token: ${{ github.token }}
          status: ${{ job.status }}
          env: ${{ steps.deployment.outputs.env }}
          env_url: https://app.okou.ai
          deployment_id: ${{ steps.deployment.outputs.deployment_id }}

      - name: Report App Worker URLs
        if: success()
        run: |
          {
            echo "## App Worker production"
            echo
            echo "### Live"
            echo "- https://app.okou.ai"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Calculate duration
        id: duration
        if: ${{ always() && steps.timer.outputs.start }}
        run: |
          elapsed=$(( $(date +%s) - ${{ steps.timer.outputs.start }} ))
          h=$((elapsed / 3600)) m=$(( (elapsed % 3600) / 60 )) s=$((elapsed % 60))
          if [ $h -gt 0 ]; then text="${h}h ${m}m ${s}s"
          elif [ $m -gt 0 ]; then text="${m}m ${s}s"
          else text="${s}s"; fi
          echo "text=$text" >> "$GITHUB_OUTPUT"

      - name: Notify Slack - Success
        if: ${{ success() && steps.slack-start.outputs.ts }}
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.update
          token: ${{ secrets.CI_SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ vars.SLACK_RELEASE_CHANNEL_ID }}
            ts: "${{ steps.slack-start.outputs.ts }}"
            text: "*App* ✅ Deployed to Cloudflare Workers"
            blocks:
              - type: section
                text:
                  type: mrkdwn
                  text: "*App* ✅ Deployed to Cloudflare Workers\n📦 Version: `${{ needs.release-please.outputs.app_deploy_version }}`\n⏱️ `${{ steps.duration.outputs.text }}`\n🌐 <https://app.okou.ai|Okou App>"

      - name: Notify Slack - Failure
        if: ${{ failure() && steps.slack-start.outputs.ts }}
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.update
          token: ${{ secrets.CI_SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ vars.SLACK_RELEASE_CHANNEL_ID }}
            ts: "${{ steps.slack-start.outputs.ts }}"
            text: "*App* ❌ Cloudflare Workers deploy failed"
            blocks:
              - type: section
                text:
                  type: mrkdwn
                  text: "*App* ❌ Cloudflare Workers deploy failed\n📦 Version: `${{ needs.release-please.outputs.app_deploy_version }}`\n⏱️ `${{ steps.duration.outputs.text }}`\n🔗 <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Logs>"

  # Record a complete production release target after all applicable
  # production promotions succeed.
  update-rollback-dashboard:
    needs:
      [
        release-please,
        promote-api-production,
        promote-app-worker-production,
        promote-desktop-release,
        promote-runner-production,
      ]
    if: >-
      always() &&
      needs.release-please.outputs.releases_created == 'true' &&
      needs.promote-api-production.result == 'success' &&
      (needs.release-please.outputs.app_deploy_required != 'true' ||
       needs.promote-app-worker-production.result == 'success') &&
      (needs.release-please.outputs.desktop_release_created != 'true' ||
       needs.promote-desktop-release.result == 'success') &&
      (needs.release-please.outputs.runner_rs_release_created != 'true' ||
       needs.promote-runner-production.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Update rollback dashboard issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ vars.ROLLBACK_ISSUE_NUMBER }}
          RELEASE_TARGET: ${{ needs.release-please.outputs.release_target }}
          RELEASE_TAGS: ${{ needs.release-please.outputs.release_tags }}
          ROLLBACK_URL: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/rollback-production.yml
        run: |
          set -euo pipefail

          if [ -z "$ISSUE_NUMBER" ]; then
            echo "ROLLBACK_ISSUE_NUMBER not set, skipping dashboard update"
            exit 0
          fi

          gh api "repos/${{ github.repository }}/issues/${ISSUE_NUMBER}" \
            --jq '.body' > /tmp/rollback-dashboard.md
          updated_body=$(bash .github/scripts/update-rollback-dashboard-body.sh \
            /tmp/rollback-dashboard.md \
            "$RELEASE_TARGET" \
            "$ROLLBACK_URL" \
            "$RELEASE_TAGS")

          gh api "repos/${{ github.repository }}/issues/${ISSUE_NUMBER}" \
            -X PATCH \
            -f body="$updated_body"

          echo "Recorded release target $RELEASE_TARGET in rollback dashboard #${ISSUE_NUMBER}"

  # Resolve repo-level R2 vars for the shared image cache bucket.
  # Must run WITHOUT `environment:` so vars/secrets resolve to repo-level
  # (dev bucket), not the production-scoped user-storage bucket.
  resolve-image-cache:
    runs-on: ubuntu-latest
    needs: [release-please]
    if: needs.release-please.outputs.runner_rs_release_created == 'true'
    outputs:
      r2-account-id: ${{ steps.resolve.outputs.r2-account-id }}
      r2-access-key-id: ${{ steps.resolve.outputs.r2-access-key-id }}
      r2-secret-access-key: ${{ steps.resolve.outputs.r2-secret-access-key }}
      r2-bucket: ${{ steps.resolve.outputs.r2-bucket }}
    steps:
      - id: resolve
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_USER_STORAGES_BUCKET_NAME }}
          # Borrow an existing repo-level-only secret as the symmetric
          # encryption passphrase.  GRAFANA_CLOUD_API_KEY exists at repo
          # level but NOT in the "production" environment, so both this
          # job (no environment) and build-runner-production /
          # promote-runner-production (environment: production, falls
          # back to repo level) resolve it to the same
          # value.  Because it is a registered secret GitHub masks it as
          # *** in all logs, keeping the passphrase invisible.
          PASSPHRASE: ${{ secrets.GRAFANA_CLOUD_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          # GitHub redacts raw secret values AND their base64 encodings
          # from job outputs, so we AES-encrypt them before writing.
          # The ciphertext does not match any registered secret and
          # passes through unredacted.
          {
            echo "r2-account-id=$R2_ACCOUNT_ID"
            echo "r2-access-key-id=$(echo -n "$R2_ACCESS_KEY_ID" | openssl enc -aes-128-cbc -pbkdf2 -pass "pass:$PASSPHRASE" -a -A)"
            echo "r2-secret-access-key=$(echo -n "$R2_SECRET_ACCESS_KEY" | openssl enc -aes-128-cbc -pbkdf2 -pass "pass:$PASSPHRASE" -a -A)"
            echo "r2-bucket=$R2_BUCKET"
          } >> "$GITHUB_OUTPUT"

  # Publish runner release binaries for every supported host architecture.
  build-runner-release-assets:
    needs: release-please
    if: ${{ needs.release-please.outputs.runner_rs_release_created == 'true' }}
    runs-on: ubuntu-latest-8-cores
    container:
      image: ghcr.io/${{ github.repository_owner }}/vm0-toolchain-rust:20260825
    defaults:
      run:
        shell: bash
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-unknown-linux-musl
          - x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.release_target }}

      - name: Resolve runner target metadata
        id: target-metadata
        env:
          TARGET_TRIPLE: ${{ matrix.target }}
        run: |
          set -euo pipefail
          . .github/scripts/runner-image-target.sh
          runner_image_validate_target "$TARGET_TRIPLE"
          cache_suffix=$(runner_image_cache_suffix "$TARGET_TRIPLE")
          echo "cache_suffix=$cache_suffix" >> "$GITHUB_OUTPUT"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates -> target
          shared-key: ${{ steps.target-metadata.outputs.cache_suffix }}-release
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Notify Slack - Starting
        id: slack-start
        if: ${{ vars.SLACK_RELEASE_CHANNEL_ID != '' }}
        uses: slackapi/slack-github-action@v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.CI_SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ vars.SLACK_RELEASE_CHANNEL_ID }}
            text: "*Runner RS* publishing release asset..."
            blocks:
              - type: section
                text:
                  type: mrkdwn
                  text: "*Runner RS* publishing release asset...\n📦 Version: `${{ needs.release-please.outputs.runner_rs_version }}`\n🏗️ Target: `${{ matrix.target }}`\n🔗 <${{ github.server_url }}/${{ github.repository }}/releases/tag/runner-rs-v${{ needs.release-please.outputs.runner_rs_version }}|View Release>"

      - name: Record start time
        id: timer
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"

      # IMPORTANT: production runner releases use the release profile. The
      # shared R2 template cache intentionally ignores guest binaries. See #9192.
      - name: Cross-compile guest binaries for ${{ matrix.target }}
        env:
          TARGET_TRIPLE: ${{ matrix.target }}
        run: |
          . .github/scripts/runner-guest-binaries.sh
          runner_guest_binaries_load
          guest_cargo_args=()
          for package in "${RUNNER_GUEST_PACKAGES[@]}"; do
            guest_cargo_args+=("-p" "$package")
          done
          cd crates
          cargo build --release --target "$TARGET_TRIPLE" "${guest_cargo_args[@]}"

      - name: Cross-compile runner with embedded guests for ${{ matrix.target }}
        env:
          TARGET_TRIPLE: ${{ matrix.target }}
        run: |
          . .github/scripts/runner-guest-binaries.sh
          runner_guest_binaries_load
          cd crates
          TARGET_DIR="target/${TARGET_TRIPLE}/release"
          guest_env=()
          for index in "${!RUNNER_GUEST_BINARIES[@]}"; do
            guest_env+=("${RUNNER_GUEST_PATH_ENVS[$index]}=${TARGET_DIR}/${RUNNER_GUEST_BINARIES[$index]}")
          done
          env "${guest_env[@]}" cargo build --release --target "$TARGET_TRIPLE" -p runner

      - name: Upload runner binary to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.release-please.outputs.runner_rs_version }}
          TARGET_TRIPLE: ${{ matrix.target }}
        run: |
          set -euo pipefail
          . .github/scripts/runner-image-target.sh
          TAG=$(runner_image_release_tag "$VERSION")
          ASSET_NAME=$(runner_image_release_asset_name "$VERSION" "$TARGET_TRIPLE")
          ASSET_NAME_ENCODED=$(jq -rn --arg value "$ASSET_NAME" '$value|@uri')
          ASSET_PATH="crates/target/${TARGET_TRIPLE}/release/runner"

          if [ ! -x "$ASSET_PATH" ]; then
            echo "::error::runner binary not found or not executable: ${ASSET_PATH}"
            exit 1
          fi

          # Get the release ID from the tag.
          RELEASE_ID=$(curl -sfL \
            --retry 5 \
            --retry-delay 2 \
            --retry-max-time 60 \
            --retry-all-errors \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
            | jq -r '.id')

          if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "null" ]; then
            echo "::error::release not found for tag: ${TAG}"
            exit 1
          fi

          # Delete existing asset with the same name (--clobber equivalent).
          EXISTING=$(curl -sfL \
            --retry 5 \
            --retry-delay 2 \
            --retry-max-time 60 \
            --retry-all-errors \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?per_page=100" \
            | jq -r --arg name "${ASSET_NAME}" '.[] | select(.name==$name) | .id')
          for aid in $EXISTING; do
            curl -sfL -X DELETE \
              --retry 5 \
              --retry-delay 2 \
              --retry-max-time 60 \
              --retry-all-errors \
              -H "Authorization: token ${GH_TOKEN}" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/${aid}"
          done

          # Upload binary.
          curl -sfL \
            --retry 5 \
            --retry-delay 2 \
            --retry-max-time 60 \
            --retry-all-errors \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@${ASSET_PATH}" \
            "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?name=${ASSET_NAME_ENCODED}"

      - name: Calculate duration
        id: duration
        if: ${{ always() && steps.timer.outputs.start }}
        run: |
          elapsed=$(( $(date +%s) - ${{ steps.timer.outputs.start }} ))
          h=$((elapsed / 3600)) m=$(( (elapsed % 3600) / 60 )) s=$((elapsed % 60))
          if [ $h -gt 0 ]; then text="${h}h ${m}m ${s}s"
          elif [ $m -gt 0 ]; then text="${m}m ${s}s"
          else text="${s}s"; fi
          echo "text=$text" >> "$GITHUB_OUTPUT"

      - name: Notify Slack - Success
        if: ${{ success() && steps.slack-start.outputs.ts }}
        uses: slackapi/slack-github-action@v4.0.0
        with:
          method: chat.update
          token: ${{ secrets.CI_SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ vars.SLACK_RELEASE_CHANNEL_ID }}
            ts: "${{ steps.slack-start.outputs.ts }}"
            text: "*Runner RS* ✅ Release asset published"
            blocks:
              - type: section
                text:
                  type: mrkdwn
                  text: "*Runner RS* ✅ Release asset published\n📦 Version: `${{ needs.release-please.outputs.runner_rs_version }}`\n🏗️ Target: `${{ matrix.target }}`\n⏱️ `${{ steps.duration.outputs.text }}`\n🔗 <${{ github.server_url }}/${{ github.repository }}/releases/tag/runner-rs-v${{ needs.release-please.outputs.runner_rs_version }}|View Release>"

      - name: Notify Slack - Failure
        if: ${{ failure() && steps.slack-start.outputs.ts }}
        uses: slackapi/slack-github-action@v4.0.0
        with:
          method: chat.update
          token: ${{ secrets.CI_SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ vars.SLACK_RELEASE_CHANNEL_ID }}
            ts: "${{ steps.slack-start.outputs.ts }}"
            text: "*Runner RS* ❌ Release asset publishing failed"
            blocks:
              - type: section
                text:
                  type: mrkdwn
                  text: "*Runner RS* ❌ Release asset publishing failed\n📦 Version: `${{ needs.release-please.outputs.runner_rs_version }}`\n🏗️ Target: `${{ matrix.target }}`\n⏱️ `${{ steps.duration.outputs.text }}`\n🔗 <${{ github.server_url }}/${{ github.repository }}/releases/tag/runner-rs-v${{ needs.release-please.outputs.runner_rs_version }}|View Release>\n🔗 <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Logs>"

  runner-production-host-groups:
    needs: release-please
    if: ${{ needs.release-please.outputs.runner_rs_release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    environment: production
    outputs:
      # Keep cross-job architecture metadata sanitized. Jobs that need hosts
      # resolve the host subset from matrix.id inside that job.
      matrix: ${{ steps.groups.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.release_target }}

      - name: Setup SSH via Cloudflare Tunnel
        uses: ./.github/actions/setup-ssh-tunnel
        with:
          ssh-user: ${{ vars.AWS_METAL_RUNNER_USER }}
          ssh-hosts: ${{ secrets.AWS_METAL_RUNNER_HOSTS }}
          ssh-key: ${{ secrets.AWS_METAL_RUNNER_SSH_KEY }}
          cf-access-client-id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          cf-access-client-secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

      - name: Resolve production runner host architecture groups
        id: groups
        env:
          AWS_METAL_RUNNER_HOSTS: ${{ secrets.AWS_METAL_RUNNER_HOSTS }}
          METAL_USER: ${{ vars.AWS_METAL_RUNNER_USER }}
        shell: bash
        run: |
          set -euo pipefail

          matrix=$(.github/scripts/runner-host-architecture-groups.sh target-matrix)
          group_count=$(jq -r 'length' <<<"$matrix")
          if [ "$group_count" -lt 1 ]; then
            echo "::error::No production runner host architecture groups found"
            exit 1
          fi

          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          echo "Production runner host architecture groups:"
          jq . <<<"$matrix"

  # Build runner: download the matching published release binary and stage it
  # on each architecture group (provision OS + monitoring + `runner build`
  # rootfs/snapshot). This job does not flip traffic — the systemd
  # service is still running the previous version. Runs after release assets
  # have been published so production staging uses the same binary users can
  # download from GitHub Releases.
  build-runner-production:
    name: Build runner production (${{ matrix.label }})
    needs:
      [
        release-please,
        resolve-image-cache,
        build-runner-release-assets,
        runner-production-host-groups,
      ]
    if: ${{ needs.release-please.outputs.runner_rs_release_created == 'true' }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/vm0-toolchain-rust:20260825
    permissions:
      contents: read
    environment: production
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.runner-production-host-groups.outputs.matrix || '[]') }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.release_target }}

      - name: Notify Slack - Starting
        id: slack-start
        if: ${{ vars.SLACK_RELEASE_CHANNEL_ID != '' }}
        uses: slackapi/slack-github-action@v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.CI_SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ vars.SLACK_RELEASE_CHANNEL_ID }}
            text: "*Runner RS* building staged production deployment (${{ matrix.label }})..."
            blocks:
              - type: section
                text:
                  type: mrkdwn
                  text: "*Runner RS* building staged production deployment...\n📦 Version: `${{ needs.release-please.outputs.runner_rs_version }}`\n🏗️ Target: `${{ matrix.target }}`\n🔗 <${{ github.server_url }}/${{ github.repository }}/releases/tag/runner-rs-v${{ needs.release-please.outputs.runner_rs_version }}|View Release>"

      - name: Record start time
        id: timer
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Setup SSH via Cloudflare Tunnel
        uses: ./.github/actions/setup-ssh-tunnel
        with:
          ssh-user: ${{ vars.AWS_METAL_RUNNER_USER }}
          ssh-hosts: ${{ secrets.AWS_METAL_RUNNER_HOSTS }}
          ssh-key: ${{ secrets.AWS_METAL_RUNNER_SSH_KEY }}
          cf-access-client-id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          cf-access-client-secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

      - name: Resolve metal hosts for architecture
        id: matrix-hosts
        env:
          AWS_METAL_RUNNER_HOSTS: ${{ secrets.AWS_METAL_RUNNER_HOSTS }}
          METAL_USER: ${{ vars.AWS_METAL_RUNNER_USER }}
          RUNNER_HOST_GROUP_ID: ${{ matrix.id }}
        shell: bash
        run: |
          set -euo pipefail

          hosts=$(.github/scripts/runner-host-architecture-groups.sh hosts "$RUNNER_HOST_GROUP_ID")
          if [ -z "$hosts" ]; then
            echo "::error::No metal hosts resolved for ${RUNNER_HOST_GROUP_ID}"
            exit 1
          fi

          echo "hosts=${hosts}" >> "$GITHUB_OUTPUT"
          host_count=$(printf '%s\n' "$hosts" | tr ',' '\n' | sed '/^$/d' | wc -l | tr -d ' ')
          echo "Resolved ${host_count} metal host(s) for ${RUNNER_HOST_GROUP_ID}"

      - name: Download runner binary from GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.release-please.outputs.runner_rs_version }}
          TARGET_TRIPLE: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          . .github/scripts/runner-image-target.sh
          TAG=$(runner_image_release_tag "$VERSION")
          ASSET_NAME=$(runner_image_release_asset_name "$VERSION" "$TARGET_TRIPLE")
          EXPECTED_ELF_MACHINE=$(runner_image_elf_machine_hex "$TARGET_TRIPLE")

          ASSET_PATH="crates/target/${TARGET_TRIPLE}/release/runner"

          ASSET_ID=$(curl -sfL \
            --retry 5 \
            --retry-delay 2 \
            --retry-max-time 60 \
            --retry-all-errors \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
            | jq -r --arg name "$ASSET_NAME" '.assets[] | select(.name==$name) | .id')

          if [ -z "$ASSET_ID" ] || [ "$ASSET_ID" = "null" ]; then
            echo "::error::release ${TAG} is missing asset ${ASSET_NAME}"
            exit 1
          fi

          mkdir -p "$(dirname "$ASSET_PATH")"
          curl -sfL \
            --retry 5 \
            --retry-delay 2 \
            --retry-max-time 60 \
            --retry-all-errors \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/octet-stream" \
            -o "$ASSET_PATH" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/${ASSET_ID}"
          chmod 0755 "$ASSET_PATH"
          test -x "$ASSET_PATH"

          ELF_MAGIC=$(od -An -tx1 -N4 "$ASSET_PATH" | tr -d ' \n')
          ELF_MACHINE=$(dd if="$ASSET_PATH" bs=1 skip=18 count=2 2>/dev/null | od -An -tx1 | tr -d ' \n')
          if [ "$ELF_MAGIC" != "7f454c46" ] || [ "$ELF_MACHINE" != "$EXPECTED_ELF_MACHINE" ]; then
            echo "::error::downloaded runner asset does not match ${TARGET_TRIPLE}: magic=${ELF_MAGIC} machine=${ELF_MACHINE} expected_machine=${EXPECTED_ELF_MACHINE}"
            exit 1
          fi

      # Decrypt R2 secrets from resolve-image-cache.  The secrets were
      # AES-encrypted with GRAFANA_CLOUD_API_KEY (a repo-level-only
      # secret) to bypass GitHub's job-output redaction.  The same
      # secret is available here because the "production" environment
      # does not define it, so GitHub falls back to the repo-level
      # value.  The passphrase appears as *** in logs (registered
      # secret); the ciphertext is visible but useless without it.
      - name: Decrypt R2 image cache credentials
        env:
          _PASSPHRASE: ${{ secrets.GRAFANA_CLOUD_API_KEY }}
          _ENC_AK: ${{ needs.resolve-image-cache.outputs.r2-access-key-id }}
          _ENC_SK: ${{ needs.resolve-image-cache.outputs.r2-secret-access-key }}
        shell: bash
        run: |
          set -euo pipefail
          AK=$(echo -n "$_ENC_AK" | openssl enc -aes-128-cbc -pbkdf2 -pass "pass:$_PASSPHRASE" -d -a -A)
          SK=$(echo -n "$_ENC_SK" | openssl enc -aes-128-cbc -pbkdf2 -pass "pass:$_PASSPHRASE" -d -a -A)
          if [ -z "$AK" ] || [ -z "$SK" ]; then
            echo "::error::R2 credential decryption produced empty values"
            exit 1
          fi
          {
            echo "R2_ACCESS_KEY_ID=$AK"
            echo "R2_SECRET_ACCESS_KEY=$SK"
          } >> "$GITHUB_ENV"

      # Provision runner + monitoring. The action skips both playbooks when
      # the remote host's ~/.vm0-provision-hash matches the current
      # ansible/ tree hash — most releases don't touch ansible/, so this
      # is typically a no-op (one SSH hash check per host).
      - name: Provision metal hosts
        uses: ./.github/actions/provision
        with:
          hosts: ${{ steps.matrix-hosts.outputs.hosts }}
          metal-user: ${{ vars.AWS_METAL_RUNNER_USER }}
          grafana-cloud-prometheus-url: ${{ secrets.GRAFANA_CLOUD_PROMETHEUS_URL }}
          grafana-cloud-prometheus-user: ${{ secrets.GRAFANA_CLOUD_PROMETHEUS_USER }}
          grafana-cloud-api-key: ${{ secrets.GRAFANA_CLOUD_API_KEY }}
          env-label: prod

      - name: Build rootfs and snapshot on production hosts
        env:
          RUNNER_HOSTS: ${{ steps.matrix-hosts.outputs.hosts }}
          AWS_METAL_RUNNER_USER: ${{ vars.AWS_METAL_RUNNER_USER }}
          OFFICIAL_RUNNER_SECRET: ${{ secrets.OFFICIAL_RUNNER_SECRET }}
          RUNNER_VERSION: ${{ needs.release-please.outputs.runner_rs_version }}
          RUNNER_TARGET: ${{ matrix.target }}
          API_URL: ${{ vars.OKOU_API_BACKEND_URL }}
          # R2 image cache credentials — from resolve-image-cache job (repo-level,
          # not production-scoped) so the runner uses the same bucket as CI.
          # R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY come from $GITHUB_ENV
          # (decoded in previous step).
          R2_ACCOUNT_ID: ${{ needs.resolve-image-cache.outputs.r2-account-id }}
          R2_USER_STORAGES_BUCKET_NAME: ${{ needs.resolve-image-cache.outputs.r2-bucket }}
        run: |
          cd ansible
          ansible-playbook \
            -i "${RUNNER_HOSTS}," \
            playbooks/build-runner.yml \
            -e "ansible_user=${AWS_METAL_RUNNER_USER}" \
            -e "official_runner_secret=${OFFICIAL_RUNNER_SECRET}" \
            -e "api_url=${API_URL}" \
            -e "runner_version=${RUNNER_VERSION}" \
            -e "runner_target=${RUNNER_TARGET}" \
            -e "r2_account_id=${R2_ACCOUNT_ID:-}" \
            -e "r2_access_key_id=${R2_ACCESS_KEY_ID:-}" \
            -e "r2_secret_access_key=${R2_SECRET_ACCESS_KEY:-}" \
            -e "r2_bucket=${R2_USER_STORAGES_BUCKET_NAME:-}" \
            -v

      - name: Calculate duration
        id: duration
        if: ${{ always() && steps.timer.outputs.start }}
        run: |
          elapsed=$(( $(date +%s) - ${{ steps.timer.outputs.start }} ))
          h=$((elapsed / 3600)) m=$(( (elapsed % 3600) / 60 )) s=$((elapsed % 60))
          if [ $h -gt 0 ]; then text="${h}h ${m}m ${s}s"
          elif [ $m -gt 0 ]; then text="${m}m ${s}s"
          else text="${s}s"; fi
          echo "text=$text" >> "$GITHUB_OUTPUT"

      - name: Notify Slack - Success
        if: ${{ success() && steps.slack-start.outputs.ts }}
        uses: slackapi/slack-github-action@v4.0.0
        with:
          method: chat.update
          token: ${{ secrets.CI_SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ vars.SLACK_RELEASE_CHANNEL_ID }}
            ts: "${{ steps.slack-start.outputs.ts }}"
            text: "*Runner RS* ✅ Staged build ready (not yet serving)"
            blocks:
              - type: section
                text:
                  type: mrkdwn
                  text: "*Runner RS* ✅ Staged build ready (not yet serving)\n📦 Version: `${{ needs.release-please.outputs.runner_rs_version }}`\n🏗️ Target: `${{ matrix.target }}`\n⏱️ `${{ steps.duration.outputs.text }}`\n🔗 <${{ github.server_url }}/${{ github.repository }}/releases/tag/runner-rs-v${{ needs.release-please.outputs.runner_rs_version }}|View Release>"

      - name: Notify Slack - Failure
        if: ${{ failure() && steps.slack-start.outputs.ts }}
        uses: slackapi/slack-github-action@v4.0.0
        with:
          method: chat.update
          token: ${{ secrets.CI_SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ vars.SLACK_RELEASE_CHANNEL_ID }}
            ts: "${{ steps.slack-start.outputs.ts }}"
            text: "*Runner RS* ❌ Staged build failed"
            blocks:
              - type: section
                text:
                  type: mrkdwn
                  text: "*Runner RS* ❌ Staged build failed\n📦 Version: `${{ needs.release-please.outputs.runner_rs_version }}`\n🏗️ Target: `${{ matrix.target }}`\n⏱️ `${{ steps.duration.outputs.text }}`\n🔗 <${{ github.server_url }}/${{ github.repository }}/releases/tag/runner-rs-v${{ needs.release-please.outputs.runner_rs_version }}|View Release>\n🔗 <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Logs>"

  # Promote runner: install systemd service (traffic cutover), drain
  # old runners, garbage-collect old artifacts, global health check.
  # Waits for build-runner-production and, when present in the same release
  # run, promote-api-production so the new runner only serves after the API it
  # targets is live. Host-level prep (provision-runner, provision-monitoring)
  # already ran in build.
  promote-runner-production:
    name: Promote runner production (${{ matrix.label }})
    needs:
      [
        release-please,
        builds-complete,
        promote-api-production,
        build-runner-production,
        runner-production-host-groups,
      ]
    if: >-
      always() &&
      needs.release-please.outputs.runner_rs_release_created == 'true' &&
      needs.builds-complete.result == 'success' &&
      needs.build-runner-production.result == 'success' &&
      (needs.release-please.outputs.api_deploy_required != 'true' ||
       needs.promote-api-production.result == 'success')
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/vm0-toolchain-rust:20260825
    permissions:
      contents: read
    environment: production
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.runner-production-host-groups.outputs.matrix || '[]') }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.release_target }}

      - name: Notify Slack - Starting
        id: slack-start
        if: ${{ vars.SLACK_RELEASE_CHANNEL_ID != '' }}
        uses: slackapi/slack-github-action@v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.CI_SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ vars.SLACK_RELEASE_CHANNEL_ID }}
            text: "*Runner RS* promoting staged deployment to production (${{ matrix.label }})..."
            blocks:
              - type: section
                text:
                  type: mrkdwn
                  text: "*Runner RS* promoting staged deployment to production...\n📦 Version: `${{ needs.release-please.outputs.runner_rs_version }}`\n🏗️ Target: `${{ matrix.target }}`\n🔗 <${{ github.server_url }}/${{ github.repository }}/releases/tag/runner-rs-v${{ needs.release-please.outputs.runner_rs_version }}|View Release>"

      - name: Record start time
        id: timer
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Setup SSH via Cloudflare Tunnel
        uses: ./.github/actions/setup-ssh-tunnel
        with:
          ssh-user: ${{ vars.AWS_METAL_RUNNER_USER }}
          ssh-hosts: ${{ secrets.AWS_METAL_RUNNER_HOSTS }}
          ssh-key: ${{ secrets.AWS_METAL_RUNNER_SSH_KEY }}
          cf-access-client-id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          cf-access-client-secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

      - name: Resolve metal hosts for architecture
        id: matrix-hosts
        env:
          AWS_METAL_RUNNER_HOSTS: ${{ secrets.AWS_METAL_RUNNER_HOSTS }}
          METAL_USER: ${{ vars.AWS_METAL_RUNNER_USER }}
          RUNNER_HOST_GROUP_ID: ${{ matrix.id }}
        shell: bash
        run: |
          set -euo pipefail

          hosts=$(.github/scripts/runner-host-architecture-groups.sh hosts "$RUNNER_HOST_GROUP_ID")
          if [ -z "$hosts" ]; then
            echo "::error::No metal hosts resolved for ${RUNNER_HOST_GROUP_ID}"
            exit 1
          fi

          echo "hosts=${hosts}" >> "$GITHUB_OUTPUT"
          host_count=$(printf '%s\n' "$hosts" | tr ',' '\n' | sed '/^$/d' | wc -l | tr -d ' ')
          echo "Resolved ${host_count} metal host(s) for ${RUNNER_HOST_GROUP_ID}"

      - name: Promote runner on production hosts with Ansible
        id: promote-runner
        env:
          RUNNER_HOSTS: ${{ steps.matrix-hosts.outputs.hosts }}
          AWS_METAL_RUNNER_USER: ${{ vars.AWS_METAL_RUNNER_USER }}
          SENTRY_DSN_RUNNER: ${{ secrets.SENTRY_DSN_RUNNER }}
          AXIOM_TOKEN_TELEMETRY: ${{ secrets.AXIOM_TOKEN_TELEMETRY }}
          RUNNER_VERSION: ${{ needs.release-please.outputs.runner_rs_version }}
          RUNNER_TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          promotion_warning_dir="${RUNNER_TEMP}/runner-promotion-warnings"
          mkdir -p "$promotion_warning_dir"
          cd ansible
          ansible-playbook \
            -i "${RUNNER_HOSTS}," \
            playbooks/promote-runner.yml \
            -e "ansible_user=${AWS_METAL_RUNNER_USER}" \
            -e "sentry_dsn=${SENTRY_DSN_RUNNER}" \
            -e "axiom_token_telemetry=${AXIOM_TOKEN_TELEMETRY}" \
            -e "axiom_dataset_suffix=prod" \
            -e "runner_version=${RUNNER_VERSION}" \
            -e "runner_target=${RUNNER_TARGET}" \
            -e "promotion_warning_dir=${promotion_warning_dir}" \
            -v

          warning_manifest="${RUNNER_TEMP}/runner-promotion-warning-files"
          find "$promotion_warning_dir" -type f -name '*.json' -print0 | sort -z > "$warning_manifest"
          mapfile -d '' warning_files < "$warning_manifest"
          if (( ${#warning_files[@]} > 0 )); then
            echo "has_warnings=true" >> "$GITHUB_OUTPUT"
            {
              echo "## Runner promotion warnings"
              echo
              for warning_file in "${warning_files[@]}"; do
                sed 's/^/    /' "$warning_file"
              done
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "has_warnings=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Global health check (non-blocking)
        id: global-doctor
        if: ${{ success() }}
        env:
          RUNNER_HOSTS: ${{ steps.matrix-hosts.outputs.hosts }}
          AWS_METAL_RUNNER_USER: ${{ vars.AWS_METAL_RUNNER_USER }}
          RUNNER_VERSION: ${{ needs.release-please.outputs.runner_rs_version }}
        run: |
          RUNNER_BIN="/var/lib/vm0-runner/bin/v${RUNNER_VERSION}/runner"
          has_warnings=false
          for host in $(echo "$RUNNER_HOSTS" | tr ',' ' '); do
            [ -z "$host" ] && continue
            # shellcheck disable=SC2029
            if ! ssh "${AWS_METAL_RUNNER_USER}@${host}" "sudo ${RUNNER_BIN} doctor" 2>&1; then
              has_warnings=true
            fi
          done
          echo "has_warnings=${has_warnings}" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Calculate duration
        id: duration
        if: ${{ always() && steps.timer.outputs.start }}
        run: |
          elapsed=$(( $(date +%s) - ${{ steps.timer.outputs.start }} ))
          h=$((elapsed / 3600)) m=$(( (elapsed % 3600) / 60 )) s=$((elapsed % 60))
          if [ $h -gt 0 ]; then text="${h}h ${m}m ${s}s"
          elif [ $m -gt 0 ]; then text="${m}m ${s}s"
          else text="${s}s"; fi
          echo "text=$text" >> "$GITHUB_OUTPUT"

      - name: Notify Slack - Success
        if: ${{ success() && steps.slack-start.outputs.ts && steps.promote-runner.outputs.has_warnings != 'true' && steps.global-doctor.outputs.has_warnings != 'true' }}
        uses: slackapi/slack-github-action@v4.0.0
        with:
          method: chat.update
          token: ${{ secrets.CI_SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ vars.SLACK_RELEASE_CHANNEL_ID }}
            ts: "${{ steps.slack-start.outputs.ts }}"
            text: "*Runner RS* ✅ Promoted to production"
            blocks:
              - type: section
                text:
                  type: mrkdwn
                  text: "*Runner RS* ✅ Promoted to production\n📦 Version: `${{ needs.release-please.outputs.runner_rs_version }}`\n🏗️ Target: `${{ matrix.target }}`\n⏱️ `${{ steps.duration.outputs.text }}`\n🔗 <${{ github.server_url }}/${{ github.repository }}/releases/tag/runner-rs-v${{ needs.release-please.outputs.runner_rs_version }}|View Release>\n🔄 <${{ github.server_url }}/${{ github.repository }}/issues/${{ vars.ROLLBACK_ISSUE_NUMBER }}|Rollback Dashboard>"

      - name: Notify Slack - Success with warnings
        if: ${{ success() && steps.slack-start.outputs.ts && (steps.promote-runner.outputs.has_warnings == 'true' || steps.global-doctor.outputs.has_warnings == 'true') }}
        uses: slackapi/slack-github-action@v4.0.0
        with:
          method: chat.update
          token: ${{ secrets.CI_SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ vars.SLACK_RELEASE_CHANNEL_ID }}
            ts: "${{ steps.slack-start.outputs.ts }}"
            text: "*Runner RS* ⚠️ Promoted with warnings"
            blocks:
              - type: section
                text:
                  type: mrkdwn
                  text: "*Runner RS* ⚠️ Promoted with warnings\n📦 Version: `${{ needs.release-please.outputs.runner_rs_version }}`\n🏗️ Target: `${{ matrix.target }}`\n⏱️ `${{ steps.duration.outputs.text }}`\n🔗 <${{ github.server_url }}/${{ github.repository }}/releases/tag/runner-rs-v${{ needs.release-please.outputs.runner_rs_version }}|View Release>\n🔗 <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Logs>\n🔄 <${{ github.server_url }}/${{ github.repository }}/issues/${{ vars.ROLLBACK_ISSUE_NUMBER }}|Rollback Dashboard>"

      - name: Notify Slack - Failure
        if: ${{ failure() && steps.slack-start.outputs.ts }}
        uses: slackapi/slack-github-action@v4.0.0
        with:
          method: chat.update
          token: ${{ secrets.CI_SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ vars.SLACK_RELEASE_CHANNEL_ID }}
            ts: "${{ steps.slack-start.outputs.ts }}"
            text: "*Runner RS* ❌ Promote failed"
            blocks:
              - type: section
                text:
                  type: mrkdwn
                  text: "*Runner RS* ❌ Promote failed\n📦 Version: `${{ needs.release-please.outputs.runner_rs_version }}`\n🏗️ Target: `${{ matrix.target }}`\n⏱️ `${{ steps.duration.outputs.text }}`\n🔗 <${{ github.server_url }}/${{ github.repository }}/releases/tag/runner-rs-v${{ needs.release-please.outputs.runner_rs_version }}|View Release>\n🔗 <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Logs>"

  # Generate Software Bill of Materials (SBOM) for CASA compliance (CASA-DEP-003)
  sbom:
    needs: [release-please]
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/vm0-toolchain:20260825
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.release_target }}
      - uses: ./.github/actions/toolchain-init

      - name: Generate Node.js SBOM
        working-directory: turbo
        run: npx @cyclonedx/cdxgen -o sbom-node.json --spec-version 1.5

      - name: Generate Rust SBOM
        working-directory: crates
        run: npx @cyclonedx/cdxgen -o sbom-rust.json --spec-version 1.5

      - name: Merge SBOMs
        run: |
          node <<'MERGE_SCRIPT'
          const fs = require("fs");
          const node = JSON.parse(fs.readFileSync("turbo/sbom-node.json", "utf8"));
          const rust = JSON.parse(fs.readFileSync("crates/sbom-rust.json", "utf8"));
          const seen = new Set();
          const components = [];
          for (const c of [...(node.components || []), ...(rust.components || [])]) {
            const key = c.purl || c["bom-ref"] || JSON.stringify(c);
            if (!seen.has(key)) { seen.add(key); components.push(c); }
          }
          const merged = { ...node, components };
          const deps = [...(node.dependencies || []), ...(rust.dependencies || [])];
          if (deps.length) merged.dependencies = deps;
          fs.writeFileSync("sbom.json", JSON.stringify(merged, null, 2));
          console.log("Merged SBOM: " + components.length + " components (" + (node.components || []).length + " Node.js + " + (rust.components || []).length + " Rust)");
          MERGE_SCRIPT

      - name: Upload SBOM as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.json
