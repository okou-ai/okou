  # Deploy API application with preview database and E2E bootstrap data
  deploy-api:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: deploy-api-${{ needs.prepare.outputs.job-ref }}
      cancel-in-progress: true
    container:
      image: ghcr.io/vm0-ai/vm0-toolchain:20260825
    needs: [prepare]
    # Deploy if job-ref is set (PR or main), not a release-please commit, and anything
    # that needs a live API preview or E2E API token changed.
    # Runs in merge queue too, but skips GitHub Deployment creation (the bobheadxi/deployments action
    # cannot resolve the temporary `gh-readonly-queue/*` ref via the GitHub API).
    if: |
      (github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore: release')) &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      needs.prepare.outputs.job-ref != '' && (
        needs.prepare.outputs.api-changed == 'true' ||
        needs.prepare.outputs.cli-changed == 'true' ||
        needs.prepare.outputs.platform-changed == 'true' ||
        needs.prepare.outputs.crates-changed == 'true' ||
        needs.prepare.outputs.ci-changed == 'true' ||
        needs.prepare.outputs.e2e-changed == 'true'
      )
    outputs:
      preview-url: ${{ steps.api-alias.outputs.url || steps.api-deploy.outputs.url }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
      deployments: write
      id-token: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # Native model contexts must pin the CLI built from this API source.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/toolchain-init

      - name: Fetch development Doppler OAuth config
        id: doppler-oauth
        uses: dopplerhq/secrets-fetch-action@v2.0.0
        with:
          auth-method: oidc
          doppler-identity-id: ${{ vars.DOPPLER_SERVICE_IDENTITY_ID }}
          doppler-project: vm0
          doppler-config: dev

      - name: Resolve API seed environment
        id: api-seed-env
        uses: ./.github/actions/web-api-env
        with:
          app: api
          environment: preview
          job-ref: ${{ needs.prepare.outputs.job-ref }}
          # Preview API routes stay on the matching preview API instead of
          # depending on a PR WWW proxy.
          web-url: ${{ needs.prepare.outputs.api-preview-url }}
          app-url: ${{ needs.prepare.outputs.app-preview-url }}
          api-backend-url: ${{ needs.prepare.outputs.api-preview-url }}
          cli-pkg-url: https://static.okou.io/okou-cli/${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}/package.tgz
        env:
          REPO_VARS_JSON: ${{ toJSON(vars) }}
          REPO_SECRETS_JSON: ${{ toJSON(secrets) }}
          DOPPLER_SECRETS_JSON: ${{ toJSON(steps.doppler-oauth.outputs) }}

      - name: Create Neon Branch
        id: neon
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          WEB_API_ENV_FILE: ${{ steps.api-seed-env.outputs.file }}
          ANTHROPIC_API_KEY: ${{ secrets.CI_ANTHROPIC_API_KEY }}
          DEV_MODEL_ANTHROPIC_KEY: ${{ secrets.CI_ANTHROPIC_API_KEY }}
          DEV_MODEL_OPENAI_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEV_MODEL_OPENROUTER_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DEV_MODEL_DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEV_MODEL_MOONSHOT_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          DEV_MODEL_MINIMAX_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: |
          while IFS= read -r line; do
            if [ -n "$line" ]; then
              key="${line%%=*}"
              value="${line#*=}"
              export "$key=$value"
            fi
          done < "$WEB_API_ENV_FILE"

          required_seed_env=(
            DEV_MODEL_ANTHROPIC_KEY
            DEV_MODEL_OPENAI_KEY
            DEV_MODEL_OPENROUTER_KEY
            DEV_MODEL_DEEPSEEK_KEY
            DEV_MODEL_MOONSHOT_KEY
            DEV_MODEL_MINIMAX_KEY
          )
          missing_seed_env=()
          for key in "${required_seed_env[@]}"; do
            value="${!key:-}"
            if [ -z "$value" ]; then
              missing_seed_env+=("$key")
            fi
          done
          if [ "${#missing_seed_env[@]}" -gt 0 ]; then
            printf '::error::Missing preview seed model key env(s): %s\n' "${missing_seed_env[*]}"
            exit 1
          fi

          npm install -g neonctl@2.15.0

          # On pushes to main, migrate the test project's default (parent) branch
          # BEFORE creating/resetting the preview branch off it. Neon branches are
          # copy-on-write, so a preview branched from an already-migrated parent
          # inherits the up-to-date schema and its own db:migrate below becomes a
          # near no-op -- this is what keeps preview migrate (and deploy-api) fast.
          # Safe by construction: this job has no `environment: production`, so
          # NEON_PROJECT_ID resolves to the Neon TEST project, never production.
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "main push: pre-migrating test project default (parent) branch"
            PARENT_DATABASE_URL=$(neonctl connection-string --project-id "$NEON_PROJECT_ID" --database-name neondb --role-name neondb_owner --pooled --ssl verify-full)
            if [ -z "$PARENT_DATABASE_URL" ]; then
              PARENT_DATABASE_URL=$(neonctl connection-string --project-id "$NEON_PROJECT_ID" --database-name neondb --role-name neondb_owner --ssl verify-full)
            fi
            WORKFLOW_COMMAND_DATA="${PARENT_DATABASE_URL//%/%25}"
            WORKFLOW_COMMAND_DATA="${WORKFLOW_COMMAND_DATA//$'\r'/%0D}"
            WORKFLOW_COMMAND_DATA="${WORKFLOW_COMMAND_DATA//$'\n'/%0A}"
            printf '::add-mask::%s\n' "$WORKFLOW_COMMAND_DATA"
            (cd turbo && DATABASE_URL="$PARENT_DATABASE_URL" pnpm -F @okouai/db db:migrate)
          fi

          BRANCH_NAME="preview/${{ needs.prepare.outputs.job-ref }}"

          if neonctl branches list --project-id "$NEON_PROJECT_ID" --output json | jq -e --arg name "$BRANCH_NAME" '.[] | select(.name == $name)' > /dev/null; then
            neonctl branches reset "$BRANCH_NAME" --project-id "$NEON_PROJECT_ID" --parent

            for attempt in {1..30}; do
              CURRENT_STATE=$(neonctl branches list --project-id "$NEON_PROJECT_ID" --output json | jq -r --arg name "$BRANCH_NAME" '.[] | select(.name == $name) | .current_state')
              [ "$CURRENT_STATE" = "ready" ] && break
              echo "Branch state: $CURRENT_STATE (attempt $attempt/30)"
              sleep 2
            done
          else
            neonctl branches create --name "$BRANCH_NAME" --project-id "$NEON_PROJECT_ID"
          fi

          DATABASE_URL=$(neonctl connection-string "$BRANCH_NAME" --project-id "$NEON_PROJECT_ID" --database-name neondb --role-name neondb_owner --pooled --ssl verify-full)
          if [ -z "$DATABASE_URL" ]; then
            DATABASE_URL=$(neonctl connection-string "$BRANCH_NAME" --project-id "$NEON_PROJECT_ID" --database-name neondb --role-name neondb_owner --ssl verify-full)
          fi
          WORKFLOW_COMMAND_DATA="${DATABASE_URL//%/%25}"
          WORKFLOW_COMMAND_DATA="${WORKFLOW_COMMAND_DATA//$'\r'/%0D}"
          WORKFLOW_COMMAND_DATA="${WORKFLOW_COMMAND_DATA//$'\n'/%0A}"
          printf '::add-mask::%s\n' "$WORKFLOW_COMMAND_DATA"

          cd turbo
          DATABASE_URL="$DATABASE_URL" pnpm -F @okouai/db db:migrate
          ENV=preview DATABASE_URL="$DATABASE_URL" pnpm -F api db:dev-seed

          echo "database-url=$DATABASE_URL" >> "$GITHUB_OUTPUT"

      - name: Resolve API deploy environment
        id: api-deploy-env
        uses: ./.github/actions/web-api-env
        with:
          app: api
          environment: preview
          database-url: ${{ steps.neon.outputs.database-url }}
          job-ref: ${{ needs.prepare.outputs.job-ref }}
          # Keep the deployed API environment aligned with the seed environment.
          web-url: ${{ needs.prepare.outputs.api-preview-url }}
          app-url: ${{ needs.prepare.outputs.app-preview-url }}
          api-backend-url: ${{ needs.prepare.outputs.api-preview-url }}
          cli-pkg-url: https://static.okou.io/okou-cli/${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}/package.tgz
        env:
          REPO_VARS_JSON: ${{ toJSON(vars) }}
          REPO_SECRETS_JSON: ${{ toJSON(secrets) }}
          DOPPLER_SECRETS_JSON: ${{ toJSON(steps.doppler-oauth.outputs) }}

      - name: Use Stripe CLI webhook secret for PR API preview
        # Staging uses its standing Stripe Dashboard webhook endpoint; only PR
        # previews should trust Stripe CLI webhooks.
        if: |
          needs.prepare.outputs.job-ref != 'staging' && (
            needs.prepare.outputs.api-changed == 'true' ||
            needs.prepare.outputs.cli-changed == 'true' ||
            needs.prepare.outputs.platform-changed == 'true' ||
            needs.prepare.outputs.crates-changed == 'true' ||
            needs.prepare.outputs.ci-changed == 'true' ||
            needs.prepare.outputs.e2e-changed == 'true'
          )
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          bash e2e/scripts/ensure-stripe-cli.sh

          stripe_webhook_secret="$(stripe listen --api-key "$STRIPE_SECRET_KEY" --print-secret 2>/dev/null)"
          echo "::add-mask::$stripe_webhook_secret"
          if [[ "$stripe_webhook_secret" != whsec_* ]]; then
            echo "Stripe CLI did not return a webhook signing secret" >&2
            exit 1
          fi

          if grep -q '^STRIPE_WEBHOOK_SECRET=' "$API_ENV_FILE"; then
            sed -i "s|^STRIPE_WEBHOOK_SECRET=.*|STRIPE_WEBHOOK_SECRET=${stripe_webhook_secret}|" "$API_ENV_FILE"
          else
            printf 'STRIPE_WEBHOOK_SECRET=%s\n' "$stripe_webhook_secret" >> "$API_ENV_FILE"
          fi

          echo "Configured API preview to trust Stripe CLI webhooks"
        env:
          API_ENV_FILE: ${{ steps.api-deploy-env.outputs.file }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}

      - name: Deploy API to Vercel
        id: api-deploy
        uses: ./.github/actions/vercel-deploy
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ vars.VERCEL_TEAM_ID }}
          vercel-project-id: ${{ vars.VERCEL_PROJECT_ID_API }}
          environment: preview
          deployment-env: api
          prebuilt: "true"
          prebuilt-build-command: |
            pnpm --dir turbo/apps/api build
            rm -rf .vercel/output
            cp -R turbo/apps/api/.vercel/output .vercel/output
          environment-file: ${{ steps.api-deploy-env.outputs.file }}
          meta-branch: ${{ github.head_ref || github.ref_name }}
          meta-pr: ${{ needs.prepare.outputs.job-ref }}
          skip-start: ${{ github.event_name == 'merge_group' }}
          skip-finish: ${{ github.event_name == 'merge_group' || (github.event_name == 'pull_request' && vars.PREVIEW_DOMAIN != '') }}

      - name: Check API health
        run: |
          set -euo pipefail
          vercel curl /health --deployment "$API_DEPLOYMENT_URL" --token "$VERCEL_TOKEN" -- \
            --fail \
            --show-error \
            --silent \
            --max-time 20 \
            --retry 3 \
            --retry-delay 2 \
            --retry-all-errors
        env:
          API_DEPLOYMENT_URL: ${{ steps.api-deploy.outputs.url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      # Vercel does not run cron schedules for preview deployments. Reconcile
      # through the unique deployment URL before exposing it through an alias or
      # allowing downstream runner and E2E consumers to start.
      - name: Reconcile preview connector catalog
        env:
          API_DEPLOYMENT_URL: ${{ steps.api-deploy.outputs.url }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail

          response=""
          for attempt in 1 2 3; do
            if ! response=$(curl \
              --fail-with-body \
              --show-error \
              --silent \
              --max-time 120 \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              -H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}" \
              "${API_DEPLOYMENT_URL}/api/cron/sync-connector-catalog"); then
              echo "::warning::Connector catalog reconcile request failed (attempt ${attempt}/3)"
            elif summary=$(jq -c '{
              outcome,
              state,
              active,
              lastAttempt,
              filtering: {
                capabilityDigest: .filtering.capabilityDigest,
                evaluatedAt: .filtering.evaluatedAt,
                stale: .filtering.stale,
                filteredAuthMethodCount: (.filtering.filteredAuthMethods | length)
              }
            }' <<< "$response"); then
              echo "Connector catalog reconcile: ${summary}"

              if jq -e '
                .state == "current"
                and .active != null
                and .filtering.stale == false
              ' <<< "$response" >/dev/null; then
                exit 0
              fi
              echo "::warning::Connector catalog is not ready (attempt ${attempt}/3)"
            else
              echo "::warning::Connector catalog reconcile returned invalid JSON (attempt ${attempt}/3)"
            fi

            if [ "$attempt" -lt 3 ]; then
              sleep 2
            fi
          done

          echo "::error::Connector catalog reconcile did not produce a current accepted snapshot"
          exit 1

      - name: Create API Vercel Alias
        id: api-alias
        if: vars.PREVIEW_DOMAIN != ''
        uses: ./.github/actions/vercel-alias
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ vars.VERCEL_TEAM_ID }}
          deployment-url: ${{ steps.api-deploy.outputs.url }}
          app-name: api
          job-ref: ${{ needs.prepare.outputs.job-ref }}
          preview-domain: ${{ vars.PREVIEW_DOMAIN }}
          deployment-id: ${{ steps.api-deploy.outputs.deployment-id }}
          deployment-env: ${{ steps.api-deploy.outputs.deployment-env }}

      - name: Post API preview URL
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: api-preview
          message: |
            API preview: ${{ steps.api-alias.outputs.url || steps.api-deploy.outputs.url }}

  # Build the canonical app artifact independently of Vercel, publish its
  # immutable resources to R2, and upload the small application shell with a
  # standalone Cloudflare Worker version.
  deploy-app:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      preview-url: ${{ steps.worker-deploy.outputs.url }}
    concurrency:
      group: deploy-app-${{ github.sha }}
      cancel-in-progress: false
    container:
      image: ghcr.io/vm0-ai/vm0-toolchain:20260825
    if: >-
      ${{
        github.actor != 'dependabot[bot]' &&
        (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_STATIC_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_STATIC_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      CF_WORKERS_SUBDOMAIN: ${{ vars.CF_WORKERS_SUBDOMAIN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
      PREVIEW_DOMAIN: ${{ vars.PREVIEW_DOMAIN }}
      R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
      R2_BUCKET_NAME: ${{ vars.R2_STATIC_BUCKET_NAME }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Resolve app Worker preview alias
        id: worker-alias
        env:
          EVENT_NAME: ${{ github.event_name }}
          MERGE_GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref || '' }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number || '' }}
        run: |
          alias="$(bash .github/scripts/resolve-app-preview-alias.sh \
            "$EVENT_NAME" \
            "$PULL_REQUEST_NUMBER" \
            "$MERGE_GROUP_HEAD_REF")"
          echo "alias=$alias" >> "$GITHUB_OUTPUT"

      - name: Resolve app Worker preview URL
        id: app-preview
        env:
          WORKER_PREVIEW_ALIAS: ${{ steps.worker-alias.outputs.alias }}
        run: |
          : "${CF_WORKERS_SUBDOMAIN:?CF_WORKERS_SUBDOMAIN variable is required}"
          job_ref="${WORKER_PREVIEW_ALIAS%-app}"
          url="$(bash .github/scripts/resolve-app-preview-url.sh \
            "$job_ref" \
            "$CF_WORKERS_SUBDOMAIN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/toolchain-init

      - name: Install AWS CLI
        run: |
          architecture="$(dpkg --print-architecture)"
          case "$architecture" in
            amd64) aws_architecture="x86_64" ;;
            arm64) aws_architecture="aarch64" ;;
            *) echo "Unsupported architecture: $architecture" >&2; exit 1 ;;
          esac

          curl -fsSL --retry 3 \
            "https://awscli.amazonaws.com/awscli-exe-linux-${aws_architecture}.zip" \
            --output /tmp/awscliv2.zip
          python3 -m zipfile -e /tmp/awscliv2.zip /tmp/awscli
          chmod +x /tmp/awscli/aws/install /tmp/awscli/aws/dist/aws
          /tmp/awscli/aws/install
          aws --version

      - name: Resolve artifact commit SHA
        id: artifact
        run: |
          sha="$(bash .github/scripts/resolve-build-commit-sha.sh)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "prefix=okou-app/$sha" >> "$GITHUB_OUTPUT"

      - name: Check for existing artifact
        id: existing
        env:
          ARTIFACT_PREFIX: ${{ steps.artifact.outputs.prefix }}
        run: |
          set -euo pipefail

          : "${AWS_ACCESS_KEY_ID:?R2_STATIC_ACCESS_KEY_ID secret is required}"
          : "${AWS_SECRET_ACCESS_KEY:?R2_STATIC_SECRET_ACCESS_KEY secret is required}"
          : "${R2_ACCOUNT_ID:?R2_ACCOUNT_ID variable is required}"
          : "${R2_BUCKET_NAME:?R2_STATIC_BUCKET_NAME variable is required}"

          r2_endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          ready_key="${ARTIFACT_PREFIX}/ready.json"
          error_log="$(mktemp)"

          set +e
          aws s3api head-object \
            --endpoint-url "$r2_endpoint" \
            --bucket "$R2_BUCKET_NAME" \
            --key "$ready_key" \
            >/dev/null 2>"$error_log"
          status=$?
          set -e

          if (( status == 0 )); then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Artifact already ready: s3://${R2_BUCKET_NAME}/${ARTIFACT_PREFIX}/"
          elif grep -Eq '404|NotFound|Not Found|NoSuchKey' "$error_log"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            cat "$error_log" >&2
            exit "$status"
          fi

      - name: Build canonical app artifact
        if: steps.existing.outputs.exists != 'true'
        env:
          VITE_CLERK_PUBLISHABLE_KEY_PREVIEW: ${{ vars.CLERK_PUBLISHABLE_KEY_PREVIEW }}
          VITE_CLERK_PUBLISHABLE_KEY_PROD: ${{ vars.CLERK_PUBLISHABLE_KEY_PROD }}
          OKOU_APP_GIT_COMMIT_SHA: ${{ steps.artifact.outputs.sha }}
          VITE_PLAUSIBLE_SCRIPT_URL_PREVIEW: ${{ vars.PLAUSIBLE_SCRIPT_URL }}
          VITE_PLAUSIBLE_SCRIPT_URL_PRODUCTION: ${{ vars.PLAUSIBLE_SCRIPT_URL_PROD }}
          # Merge-group and main builds create the release artifact. PR preview builds receive no token.
          # Public by design: provision only an ingest-only token scoped to vm0-client-telemetry-prod.
          VITE_AXIOM_CLIENT_TELEMETRY_TOKEN: ${{ github.event_name != 'pull_request' && vars.AXIOM_CLIENT_TELEMETRY_TOKEN || '' }}
          VITE_POSTHOG_KEY: ${{ vars.POSTHOG_KEY }}
          VITE_SENTRY_DSN_PROD: ${{ vars.SENTRY_DSN_APP_PROD }}
          VITE_VAPID_PUBLIC_KEY_PREVIEW: ${{ vars.VAPID_PUBLIC_KEY_PREVIEW }}
          VITE_VAPID_PUBLIC_KEY_PROD: ${{ vars.VAPID_PUBLIC_KEY_PROD }}
        run: |
          cd turbo
          pnpm --filter @okouai/app run build:verify-hashes -- --sourcemap
          pnpm --filter @okouai/app exec sentry-cli sourcemaps inject dist

      - name: Create artifact manifest
        if: steps.existing.outputs.exists != 'true'
        env:
          ARTIFACT_SHA: ${{ steps.artifact.outputs.sha }}
        run: |
          set -euo pipefail

          dist="turbo/apps/platform/dist"
          entries="$(mktemp)"

          find "$dist" -type f -print0 | sort -z | while IFS= read -r -d '' file; do
            relative_path="${file#"$dist"/}"
            digest="$(sha256sum "$file" | cut -d ' ' -f 1)"
            size="$(stat -c '%s' "$file")"
            jq -n \
              --arg path "$relative_path" \
              --arg sha256 "$digest" \
              --argjson size "$size" \
              '{path: $path, sha256: $sha256, size: $size}' >> "$entries"
          done

          jq -s \
            --arg commit_sha "$ARTIFACT_SHA" \
            '{version: 1, commitSha: $commit_sha, files: .}' \
            "$entries" > /tmp/okou-app-manifest.json

          manifest_sha="$(sha256sum /tmp/okou-app-manifest.json | cut -d ' ' -f 1)"
          jq -n \
            --arg commit_sha "$ARTIFACT_SHA" \
            --arg manifest_sha256 "$manifest_sha" \
            '{version: 1, commitSha: $commit_sha, manifestSha256: $manifest_sha256}' \
            > /tmp/okou-app-ready.json

      - name: Upload canonical app artifact
        if: steps.existing.outputs.exists != 'true'
        env:
          ARTIFACT_PREFIX: ${{ steps.artifact.outputs.prefix }}
        run: |
          set -euo pipefail

          r2_endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          artifact_uri="s3://${R2_BUCKET_NAME}/${ARTIFACT_PREFIX}"
          cache_control="public, max-age=31536000, immutable"

          aws s3 rm "$artifact_uri/" \
            --endpoint-url "$r2_endpoint" \
            --recursive

          # A single archive keeps readers to one request instead of one per
          # file, which is where R2 kept breaking the transfer mid-stream.
          tar -czf /tmp/okou-app-dist.tar.gz -C turbo/apps/platform/dist .

          aws s3api put-object \
            --endpoint-url "$r2_endpoint" \
            --bucket "$R2_BUCKET_NAME" \
            --key "${ARTIFACT_PREFIX}/dist.tar.gz" \
            --body /tmp/okou-app-dist.tar.gz \
            --content-type application/gzip \
            --cache-control "$cache_control"

          aws s3api put-object \
            --endpoint-url "$r2_endpoint" \
            --bucket "$R2_BUCKET_NAME" \
            --key "${ARTIFACT_PREFIX}/manifest.json" \
            --body /tmp/okou-app-manifest.json \
            --content-type application/json \
            --cache-control "$cache_control"

          aws s3api put-object \
            --endpoint-url "$r2_endpoint" \
            --bucket "$R2_BUCKET_NAME" \
            --key "${ARTIFACT_PREFIX}/ready.json" \
            --body /tmp/okou-app-ready.json \
            --content-type application/json \
            --cache-control "$cache_control" \
            --if-none-match "*"

          echo "Artifact ready: ${artifact_uri}/"

      - name: Prepare standalone app Worker preview
        id: worker-preview
        env:
          ARTIFACT_EXISTS: ${{ steps.existing.outputs.exists }}
          ARTIFACT_PREFIX: ${{ steps.artifact.outputs.prefix }}
          WORKER_PREVIEW_ALIAS: ${{ steps.worker-alias.outputs.alias }}
        run: |
          set -euo pipefail

          : "${CLOUDFLARE_ACCOUNT_ID:?CF_ACCOUNT_ID variable is required}"

          r2_endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          artifact_uri="s3://${R2_BUCKET_NAME}/${ARTIFACT_PREFIX}"
          worker_shell="turbo/apps/app-worker/shell"
          mkdir "$worker_shell"

          if [[ "$ARTIFACT_EXISTS" == "true" ]]; then
            canonical_dist="$(mktemp -d)"
            bash .github/scripts/fetch-okou-app-artifact.sh \
              "$r2_endpoint" \
              "$artifact_uri" \
              "$canonical_dist"
          else
            # This job built and uploaded the artifact, so the canonical bytes
            # are still on disk. Reading them back from R2 only adds latency and
            # a network failure mode.
            canonical_dist="turbo/apps/platform/dist"
          fi

          bash .github/scripts/prepare-okou-app-worker-shell.sh \
            "$canonical_dist" \
            "$worker_shell"

          {
            echo "canonical-dist=$canonical_dist"
            echo "shell=$worker_shell"
          } >> "$GITHUB_OUTPUT"

      - name: Publish immutable app assets to R2
        env:
          CANONICAL_ASSETS: ${{ steps.worker-preview.outputs.canonical-dist }}/assets
        run: |
          r2_endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          bash .github/scripts/publish-okou-app-assets.sh \
            "$r2_endpoint" \
            "$R2_BUCKET_NAME" \
            "$CANONICAL_ASSETS"

      - name: Verify immutable app assets on CDN
        env:
          CANONICAL_ASSETS: ${{ steps.worker-preview.outputs.canonical-dist }}/assets
        run: |
          bash .github/scripts/verify-okou-app-assets.sh \
            "https://static.okou.io/okou-app/assets" \
            "$CANONICAL_ASSETS"

      - name: Deploy standalone app Worker preview
        id: worker-deploy
        env:
          ARTIFACT_SHA: ${{ steps.artifact.outputs.sha }}
          CLERK_PUBLISHABLE_KEY: ${{ github.event_name == 'pull_request' && vars.CLERK_PUBLISHABLE_KEY_PREVIEW || '' }}
          CLERK_SECRET_KEY: ${{ github.event_name == 'pull_request' && secrets.CLERK_SECRET_KEY || '' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_WORKER_DEPLOY_API_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          EXPECTED_PREVIEW_URL: ${{ steps.app-preview.outputs.url }}
          WORKER_PREVIEW_ALIAS: ${{ steps.worker-alias.outputs.alias }}
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_API_TOKEN:?CF_API_WORKER_DEPLOY_API_TOKEN secret is required}"
          : "${CLOUDFLARE_ACCOUNT_ID:?CF_ACCOUNT_ID variable is required}"
          : "${EXPECTED_PREVIEW_URL:?app Worker preview URL is required}"

          worker_secret_args=()
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            : "${CLERK_PUBLISHABLE_KEY:?CLERK_PUBLISHABLE_KEY_PREVIEW variable is required}"
            : "${CLERK_SECRET_KEY:?CLERK_SECRET_KEY secret is required}"
            case "$CLERK_PUBLISHABLE_KEY" in
              pk_test_*) ;;
              *) echo "App Worker preview requires a Clerk test publishable key" >&2; exit 1 ;;
            esac
            case "$CLERK_SECRET_KEY" in
              sk_test_*) ;;
              *) echo "App Worker preview requires a Clerk test secret key" >&2; exit 1 ;;
            esac

            # Keep Clerk bindings encrypted and version-scoped. The exact alias
            # origin is included so the Worker never trusts an arbitrary Host.
            umask 077
            worker_secrets="$(mktemp)"
            trap 'rm -f "$worker_secrets"' EXIT
            jq -n \
              '{
                CLERK_EDGE_AUTHORIZED_PARTY: env.EXPECTED_PREVIEW_URL,
                CLERK_PUBLISHABLE_KEY: env.CLERK_PUBLISHABLE_KEY,
                CLERK_SECRET_KEY: env.CLERK_SECRET_KEY
              }' > "$worker_secrets"
            worker_secret_args=(--secrets-file "$worker_secrets")
          fi
          unset CLERK_PUBLISHABLE_KEY CLERK_SECRET_KEY

          # Preview URLs must already be enabled when Wrangler uploads the
          # version, otherwise Cloudflare does not register --preview-alias.
          subdomain_response="$(curl \
            --silent \
            --show-error \
            --fail-with-body \
            --request POST \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/okou-app-preview/subdomain" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Content-Type: application/json" \
            --header "Cloudflare-Workers-Script-Api-Date: 2025-08-01" \
            --data '{"enabled":true,"previews_enabled":true}')"
          jq --exit-status \
            '.success == true and .result.enabled == true and .result.previews_enabled == true' \
            <<< "$subdomain_response" >/dev/null

          cd turbo

          # Cloudflare requires a newly-created Worker service to have one
          # active deployment before version preview URLs can route traffic.
          # Bootstrap the shared preview service once; subsequent PRs only
          # upload isolated, alias-pinned versions below.
          deployments_response="$(curl \
            --silent \
            --show-error \
            --fail-with-body \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/okou-app-preview/deployments" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Cloudflare-Workers-Script-Api-Date: 2025-08-01")"
          jq --exit-status \
            '.success == true and (.result.deployments | type == "array")' \
            <<< "$deployments_response" >/dev/null
          if jq --exit-status \
            '.result.deployments | length == 0' \
            <<< "$deployments_response" >/dev/null; then
            pnpm --filter @okouai/app-worker exec wrangler deploy \
              --env preview \
              --message "bootstrap app preview Worker (${ARTIFACT_SHA})"
          fi

          pnpm --filter @okouai/app-worker exec wrangler versions upload \
            --env preview \
            --preview-alias "$WORKER_PREVIEW_ALIAS" \
            "${worker_secret_args[@]}" \
            --message "app artifact ${ARTIFACT_SHA}"

          echo "url=$EXPECTED_PREVIEW_URL" >> "$GITHUB_OUTPUT"

      # A Worker version preview can briefly lag its upload at the edge. Wait
      # for two consecutive shell responses before running the runtime probe.
      - name: Wait for standalone app Worker readiness
        env:
          WORKER_URL: ${{ steps.worker-deploy.outputs.url }}
        run: |
          set -euo pipefail

          document_body="$(mktemp)"
          trap 'rm -f "$document_body"' EXIT
          application_url="${WORKER_URL%/}/sign-up"
          ready_passes=0
          for attempt in {1..60}; do
            probe_succeeded=false
            if curl --fail --silent --show-error \
              --max-time 10 \
              --output "$document_body" \
              "$application_url"; then
              probe_succeeded=true
            fi
            if [[ "$probe_succeeded" == true ]] &&
              grep -Fq 'id="app-bootstrap-skeleton"' "$document_body"; then
              ((ready_passes += 1))
            else
              ready_passes=0
              echo "::warning::Standalone app Worker shell is not ready (attempt ${attempt}/60)"
            fi

            if (( ready_passes >= 2 )); then
              echo "Standalone app Worker shell is ready"
              exit 0
            fi
            sleep 2
          done

          echo "::error::Standalone app Worker shell did not become ready"
          exit 1

      - name: Smoke test standalone app Worker
        env:
          APP_PREVIEW_URL: ${{ steps.worker-deploy.outputs.url }}
          CANONICAL_ASSETS: ${{ steps.worker-preview.outputs.canonical-dist }}/assets
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            if bash .github/scripts/verify-okou-app-runtime.sh \
              "$APP_PREVIEW_URL" \
              "https://static.okou.io/okou-app/assets" \
              "$CANONICAL_ASSETS"; then
              echo "Standalone app Worker and SharedWorker proxy are ready"
              exit 0
            fi
            echo "::warning::Standalone app Worker or SharedWorker proxy is not ready (attempt ${attempt}/12)"
            sleep 5
          done
          echo "::error::${APP_PREVIEW_URL} Worker or SharedWorker proxy did not become ready"
          exit 1

      - name: Record standalone app Worker preview
        env:
          APP_PREVIEW_URL: ${{ steps.worker-deploy.outputs.url }}
          WORKER_PREVIEW_ALIAS: ${{ steps.worker-alias.outputs.alias }}
        run: |
          echo "App Worker preview alias: ${WORKER_PREVIEW_ALIAS}" >> "$GITHUB_STEP_SUMMARY"
          echo "App Worker preview: ${APP_PREVIEW_URL}" >> "$GITHUB_STEP_SUMMARY"

  deploy-stripe-listener:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: deploy-stripe-listener-${{ needs.prepare.outputs.job-ref }}
      cancel-in-progress: true
    # Runs in parallel with deploy-api whenever a deployed E2E consumer may
    # exercise a payment flow. The forward URL is the deterministic
    # prepare.outputs.api-preview-url (a stable alias, not a deploy-api output),
    # and Stripe webhooks only fire after deploy-api has succeeded — so the
    # listener never forwards to a dead API.
    needs: [prepare]
    if: |
      always() &&
      github.event_name != 'push' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      needs.prepare.outputs.job-ref != '' && (
        needs.prepare.outputs.turbo-runner-consumer-needed == 'true' ||
        needs.prepare.outputs.playwright-runner-consumer-needed == 'true'
      )
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Ansible
        run: pip3 install ansible-core

      - name: Setup SSH via Cloudflare Tunnel
        uses: ./.github/actions/setup-ssh-tunnel
        with:
          ssh-user: ${{ vars.AWS_METAL_RUNNER_USER }}
          ssh-hosts: ${{ secrets.AWS_METAL_RUNNER_HOSTS }}
          require-all-hosts: "false"
          ssh-key: ${{ secrets.AWS_METAL_RUNNER_SSH_KEY }}
          cf-access-client-id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          cf-access-client-secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

      - name: Start Stripe CLI listener on one metal host
        env:
          METAL_USER: ${{ vars.AWS_METAL_RUNNER_USER }}
          METAL_HOSTS: ${{ secrets.AWS_METAL_RUNNER_HOSTS }}
          JOB_REF: ${{ needs.prepare.outputs.job-ref }}
          API_PREVIEW_URL: ${{ needs.prepare.outputs.api-preview-url }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          cd ansible

          STRIPE_LISTENER_HOST="$(printf '%s\n' "$METAL_HOSTS" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | sed '/^$/d' | head -n 1)"
          if [[ -z "$STRIPE_LISTENER_HOST" ]]; then
            echo "::error::AWS_METAL_RUNNER_HOSTS is empty"
            exit 1
          fi

          CLEANUP_EXTRA_VARS="$(jq -nc \
            --arg ansible_user "$METAL_USER" \
            --arg job_ref "$JOB_REF" \
            '{ansible_user: $ansible_user, job_ref: $job_ref}')"
          if ! ansible-playbook \
            -i "${METAL_HOSTS}," \
            playbooks/cleanup-stripe-listener.yml \
            --extra-vars "$CLEANUP_EXTRA_VARS" \
            -v; then
            echo "::warning::Stripe CLI listener cleanup failed for ${JOB_REF} — stale Stripe forwarding may remain on metal hosts"
          fi

          FORWARD_URL="${API_PREVIEW_URL%/}/api/webhooks/stripe"
          if [[ -n "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]]; then
            encoded_bypass="$(node -e 'process.stdout.write(encodeURIComponent(process.env.VERCEL_AUTOMATION_BYPASS_SECRET || ""))')"
            echo "::add-mask::$encoded_bypass"
            FORWARD_URL="${FORWARD_URL}?x-vercel-protection-bypass=${encoded_bypass}"
          fi
          EXTRA_VARS="$(jq -nc \
            --arg ansible_user "$METAL_USER" \
            --arg job_ref "$JOB_REF" \
            --arg forward_url "$FORWARD_URL" \
            --arg stripe_secret_key "$STRIPE_SECRET_KEY" \
            '{ansible_user: $ansible_user, job_ref: $job_ref, forward_url: $forward_url, stripe_secret_key: $stripe_secret_key}')"

          ansible-playbook \
            -i "${STRIPE_LISTENER_HOST}," \
            playbooks/start-stripe-listener.yml \
            --extra-vars "$EXTRA_VARS" \
            -v

  # Exercise the hosted Clerk UI via agent-browser. This is intentionally
  # separate from Playwright because Playwright signs in through Clerk's
  # testing helper instead of the third-party form UI.
  cli-e2e-02-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency:
      group: cli-e2e-02-browser-${{ needs.prepare.outputs.job-ref }}
      cancel-in-progress: true
    needs: [prepare, deploy-api, deploy-app]
    if: |
      always() &&
      (github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore: release')) &&
      needs.prepare.outputs.job-ref != '' && (
        needs.prepare.outputs.api-changed == 'true' ||
        needs.prepare.outputs.platform-changed == 'true' ||
        needs.prepare.outputs.cli-changed == 'true' ||
        needs.prepare.outputs.ci-changed == 'true' ||
        needs.prepare.outputs.e2e-changed == 'true'
      ) &&
      needs.deploy-api.result == 'success' &&
      needs.deploy-app.result == 'success'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # E2E sources follow the API/CLI revision, not the PR merge commit.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install E2E dependencies
        run: npm install -g agent-browser@0.22.0
      - name: Run browser E2E tests
        run: |
          BATS_TEST_TIMEOUT=180 ./e2e/test/libs/bats/bin/bats -T ./e2e/tests/02-browser/*.bats
        env:
          OKOU_API_BACKEND_URL: ${{ needs.deploy-api.outputs.preview-url }}
          OKOU_AUTH_URL: ${{ needs.deploy-app.outputs.preview-url }}
          OKOU_AUTH_REDIRECT_URL: ${{ needs.deploy-app.outputs.preview-url }}/_/skeleton
          OKOU_AUTH_DOMAIN: ${{ needs.prepare.outputs.api-preview-url != '' && format('{0}-api.{1}', needs.prepare.outputs.job-ref, vars.PREVIEW_DOMAIN || 'vm6.ai') || '' }}
          JOB_REF: ${{ needs.prepare.outputs.job-ref }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          E2E_ACCOUNT: ${{ needs.prepare.outputs.job-ref }}+clerk_test+${{ github.run_id }}-${{ github.run_attempt }}+browser@vm0-e2e.ai
      - name: Cleanup browser E2E account
        if: always()
        shell: bash
        run: |
          source e2e/helpers/browser.bash
          delete_e2e_account_if_exists
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          E2E_ACCOUNT: ${{ needs.prepare.outputs.job-ref }}+clerk_test+${{ github.run_id }}-${{ github.run_attempt }}+browser@vm0-e2e.ai
  cli-e2e-02-playwright:
    name: cli-e2e-02-playwright (${{ matrix.lane }})
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: features
            project: features
          - lane: paid-onboarding
            project: paid-onboarding
          - lane: auth-v1
            project: auth-v1
    concurrency:
      group: cli-e2e-02-playwright-${{ matrix.lane }}-${{ needs.prepare.outputs.job-ref }}
      cancel-in-progress: true
    needs:
      - prepare
      - deploy-api
      - deploy-app
      - deploy-stripe-listener
      - deploy-runner-start
    if: |
      always() &&
      (github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore: release')) &&
      needs.prepare.outputs.job-ref != '' && (
        needs.prepare.outputs.api-changed == 'true' ||
        needs.prepare.outputs.platform-changed == 'true' ||
        needs.prepare.outputs.cli-changed == 'true' ||
        needs.prepare.outputs.ci-changed == 'true' ||
        needs.prepare.outputs.e2e-changed == 'true'
      ) &&
      needs.deploy-api.result == 'success' &&
      needs.deploy-app.result == 'success' &&
      (github.event_name == 'push' || needs.deploy-stripe-listener.result == 'success') &&
      (
        (
          needs.prepare.outputs.turbo-runner-consumer-needed != 'true' &&
          needs.prepare.outputs.playwright-runner-consumer-needed != 'true'
        ) ||
        needs.deploy-runner-start.result == 'success'
      )
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Install pnpm
        run: corepack enable pnpm
      - name: Install E2E dependencies
        run: cd e2e && pnpm install --frozen-lockfile
      - name: Check Playwright E2E types
        run: cd e2e && pnpm check-types
      - name: Install Playwright browsers
        run: cd e2e && pnpm exec playwright install --only-shell chromium
      - name: Run Playwright fixture integration tests
        run: cd e2e && pnpm test
      - name: Start Stripe webhook forwarding
        # Staging receives webhooks from the Dashboard endpoint; PR previews use
        # the long-running listener from deploy-stripe-listener.
        if: github.event_name == 'push' && needs.prepare.outputs.job-ref != 'staging'
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          bash e2e/scripts/ensure-stripe-cli.sh

          stripe_webhook_secret="$(stripe listen --api-key "$STRIPE_SECRET_KEY" --print-secret 2>/dev/null)"
          echo "::add-mask::$stripe_webhook_secret"

          forward_url="${API_PREVIEW_URL%/}/api/webhooks/stripe"
          if [[ -n "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]]; then
            encoded_bypass="$(node -e 'process.stdout.write(encodeURIComponent(process.env.VERCEL_AUTOMATION_BYPASS_SECRET || ""))')"
            echo "::add-mask::$encoded_bypass"
            forward_url="${forward_url}?x-vercel-protection-bypass=${encoded_bypass}"
          fi
          stripe listen \
            --api-key "$STRIPE_SECRET_KEY" \
            --events checkout.session.completed,payment_intent.succeeded,invoice.paid,customer.subscription.updated,customer.subscription.deleted \
            --forward-to "$forward_url" \
            > /tmp/stripe-listen.log 2>&1 &
          stripe_pid="$!"
          echo "$stripe_pid" > /tmp/stripe-listen.pid

          for _ in {1..10}; do
            if grep -qi 'ready' /tmp/stripe-listen.log; then
              echo "Stripe webhook forwarding started for $forward_url"
              exit 0
            fi
            if ! kill -0 "$stripe_pid" 2>/dev/null; then
              sed -E 's/whsec_[[:alnum:]_]+/[masked-stripe-webhook-secret]/g' /tmp/stripe-listen.log >&2
              exit 1
            fi
            sleep 1
          done

          echo "Stripe CLI did not become ready" >&2
          sed -E 's/whsec_[[:alnum:]_]+/[masked-stripe-webhook-secret]/g' /tmp/stripe-listen.log >&2
          exit 1
        env:
          API_PREVIEW_URL: ${{ needs.deploy-api.outputs.preview-url }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      - name: Run Playwright E2E tests
        id: playwright-tests
        shell: bash
        run: |
          cd e2e
          playwright_command=(
            pnpm exec playwright test
            --config playwright/playwright.config.ts
            --project="$PLAYWRIGHT_PROJECT"
          )
          if [[ "$PLAYWRIGHT_PROJECT" == "auth-v1" ]]; then
            set -o pipefail
            "${playwright_command[@]}" 2>&1 |
              sed -E \
                -e 's/([?&])__clerk_db_jwt=[^&[:space:])]+/\1[masked-clerk-testing-token]/g' \
                -e 's/[[:alnum:]._%+-]+\+clerk_test[^@[:space:]]*@[[:alnum:].-]+/[masked-clerk-test-email]/g' \
                -e 's/(^|[^[:alnum:]_])(sess|user|org|sia|sua)_[[:alnum:]_-]+/\1[masked-clerk-resource-id]/g'
          else
            "${playwright_command[@]}"
          fi
        env:
          E2E_CLERK_RESOURCE_DIR: /tmp/e2e-clerk-playwright
          PLAYWRIGHT_PROJECT: ${{ matrix.project }}
          OKOU_API_BACKEND_URL: ${{ needs.deploy-api.outputs.preview-url }}
          OKOU_APP_URL: ${{ needs.deploy-app.outputs.preview-url }}
          CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          JOB_REF: ${{ needs.prepare.outputs.job-ref }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      - name: Cleanup recorded Playwright E2E accounts
        if: always() && steps.playwright-tests.outcome != 'skipped'
        run: >-
          cd e2e && pnpm exec tsx playwright/clerk-test-resources.ts
          cleanup-recorded playwright,paid-onboarding
        env:
          E2E_CLERK_RESOURCE_DIR: /tmp/e2e-clerk-playwright
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          JOB_REF: ${{ needs.prepare.outputs.job-ref }}
      - name: Print Stripe webhook forwarding log
        if: always() && github.event_name == 'push' && needs.prepare.outputs.job-ref != 'staging'
        run: |
          if [[ -f /tmp/stripe-listen.log ]]; then
            tail -200 /tmp/stripe-listen.log | sed -E 's/whsec_[[:alnum:]_]+/[masked-stripe-webhook-secret]/g'
          fi
      - name: Stop Stripe webhook forwarding
        if: always() && github.event_name == 'push' && needs.prepare.outputs.job-ref != 'staging'
        run: |
          if [[ -f /tmp/stripe-listen.pid ]]; then
            kill "$(cat /tmp/stripe-listen.pid)" 2>/dev/null || true
          fi
      - name: Upload Playwright blob report
        if: always() && matrix.project != 'auth-v1'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-blob-${{ matrix.lane }}
          path: e2e/playwright/blob-report/
          retention-days: 7
          if-no-files-found: ignore

  cli-e2e-02-playwright-finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    continue-on-error: true
    concurrency:
      group: cli-e2e-02-playwright-finalize-${{ needs.prepare.outputs.job-ref }}
      cancel-in-progress: true
    needs: [prepare, cli-e2e-02-playwright]
    if: always() && needs.cli-e2e-02-playwright.result != 'skipped'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Install pnpm
        run: corepack enable pnpm
      - name: Install E2E dependencies
        run: cd e2e && pnpm install --frozen-lockfile
      - name: Download Playwright blob reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: playwright-blob-*
          path: e2e/all-blob-reports
          merge-multiple: true
      - name: Merge Playwright HTML report
        run: >-
          cd e2e && pnpm exec playwright merge-reports
          --reporter=html all-blob-reports
      - name: Upload Playwright HTML report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # Build one self-contained package archive per checked-out commit and upload
  # it to the same canonical R2 bucket used by deploy-app. The ready marker is
  # written last so PR, merge-group, main, and release runs can safely reuse it.
  deploy-cli:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-cli-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      cancel-in-progress: false
    container:
      image: ghcr.io/vm0-ai/vm0-toolchain:20260825
    if: >-
      ${{
        github.actor != 'dependabot[bot]' &&
        (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_STATIC_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_STATIC_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      CLI_STATIC_BASE_URL: https://static.okou.io
      R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
      R2_BUCKET_NAME: ${{ vars.R2_STATIC_BUCKET_NAME }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: turbo/pnpm-lock.yaml
      - name: Initialize pnpm cache directory
        run: mkdir -p "$(pnpm store path --silent)"
      - name: Configure git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install AWS CLI
        run: |
          architecture="$(dpkg --print-architecture)"
          case "$architecture" in
            amd64) aws_architecture="x86_64" ;;
            arm64) aws_architecture="aarch64" ;;
            *) echo "Unsupported architecture: $architecture" >&2; exit 1 ;;
          esac

          curl -fsSL --retry 3 \
            "https://awscli.amazonaws.com/awscli-exe-linux-${aws_architecture}.zip" \
            --output /tmp/awscliv2.zip
          python3 -m zipfile -e /tmp/awscliv2.zip /tmp/awscli
          chmod +x /tmp/awscli/aws/install /tmp/awscli/aws/dist/aws
          /tmp/awscli/aws/install
          aws --version

      - name: Resolve artifact commit SHA
        id: artifact
        run: |
          sha="$(bash .github/scripts/resolve-build-commit-sha.sh)"
          prefix="okou-cli/$sha"
          {
            echo "sha=$sha"
            echo "prefix=$prefix"
          } >> "$GITHUB_OUTPUT"

      - name: Check for existing artifact
        id: existing
        env:
          ARTIFACT_PREFIX: ${{ steps.artifact.outputs.prefix }}
        run: |
          set -euo pipefail

          : "${AWS_ACCESS_KEY_ID:?R2_STATIC_ACCESS_KEY_ID secret is required}"
          : "${AWS_SECRET_ACCESS_KEY:?R2_STATIC_SECRET_ACCESS_KEY secret is required}"
          : "${R2_ACCOUNT_ID:?R2_ACCOUNT_ID variable is required}"
          : "${R2_BUCKET_NAME:?R2_STATIC_BUCKET_NAME variable is required}"

          r2_endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          ready_key="${ARTIFACT_PREFIX}/ready.json"
          error_log="$(mktemp)"

          set +e
          aws s3api head-object \
            --endpoint-url "$r2_endpoint" \
            --bucket "$R2_BUCKET_NAME" \
            --key "$ready_key" \
            >/dev/null 2>"$error_log"
          status=$?
          set -e

          if (( status == 0 )); then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Artifact already ready: s3://${R2_BUCKET_NAME}/${ARTIFACT_PREFIX}/"
          elif grep -Eq '404|NotFound|Not Found|NoSuchKey' "$error_log"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            cat "$error_log" >&2
            exit "$status"
          fi

      - name: Install CLI dependencies
        if: steps.existing.outputs.exists != 'true'
        run: cd turbo && pnpm install --frozen-lockfile --filter @okouai/cli...
      - name: Build CLI
        if: steps.existing.outputs.exists != 'true'
        run: cd turbo && pnpm --filter @okouai/cli build
        env:
          DEFAULT_SENTRY_DSN: ${{ vars.SENTRY_DSN_CLI }}

      - name: Create canonical CLI artifact
        if: steps.existing.outputs.exists != 'true'
        env:
          ARTIFACT_SHA: ${{ steps.artifact.outputs.sha }}
        run: |
          mkdir -p /tmp/okou-cli-artifact
          bash .github/scripts/build-okou-cli-artifact.sh \
            "$ARTIFACT_SHA" \
            /tmp/okou-cli-artifact

      - name: Upload canonical CLI artifact
        if: steps.existing.outputs.exists != 'true'
        env:
          ARTIFACT_PREFIX: ${{ steps.artifact.outputs.prefix }}
        run: |
          set -euo pipefail

          r2_endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          artifact_uri="s3://${R2_BUCKET_NAME}/${ARTIFACT_PREFIX}"
          cache_control="public, max-age=31536000, immutable"

          aws s3 rm "$artifact_uri/" \
            --endpoint-url "$r2_endpoint" \
            --recursive

          aws s3api put-object \
            --endpoint-url "$r2_endpoint" \
            --bucket "$R2_BUCKET_NAME" \
            --key "${ARTIFACT_PREFIX}/package.tgz" \
            --body /tmp/okou-cli-artifact/package.tgz \
            --content-type application/gzip \
            --cache-control "$cache_control"

          aws s3api put-object \
            --endpoint-url "$r2_endpoint" \
            --bucket "$R2_BUCKET_NAME" \
            --key "${ARTIFACT_PREFIX}/manifest.json" \
            --body /tmp/okou-cli-artifact/manifest.json \
            --content-type application/json \
            --cache-control "$cache_control"

          aws s3api put-object \
            --endpoint-url "$r2_endpoint" \
            --bucket "$R2_BUCKET_NAME" \
            --key "${ARTIFACT_PREFIX}/ready.json" \
            --body /tmp/okou-cli-artifact/ready.json \
            --content-type application/json \
            --cache-control "$cache_control" \
            --if-none-match "*"

          echo "Artifact ready: ${artifact_uri}/"

      - name: Download existing CLI artifact
        if: steps.existing.outputs.exists == 'true'
        env:
          ARTIFACT_PREFIX: ${{ steps.artifact.outputs.prefix }}
        run: |
          mkdir -p /tmp/okou-cli-artifact
          aws s3 cp \
            "s3://${R2_BUCKET_NAME}/${ARTIFACT_PREFIX}/" \
            /tmp/okou-cli-artifact/ \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --recursive

      - name: Verify and smoke test CLI artifact
        env:
          ARTIFACT_SHA: ${{ steps.artifact.outputs.sha }}
        run: |
          set -euo pipefail
          bash .github/scripts/verify-okou-cli-artifact.sh \
            /tmp/okou-cli-artifact \
            "$ARTIFACT_SHA"
          bash .github/scripts/smoke-okou-cli-artifact.sh \
            /tmp/okou-cli-artifact/package.tgz

      - name: Verify CLI artifact through CDN
        env:
          ARTIFACT_SHA: ${{ steps.artifact.outputs.sha }}
          ARTIFACT_PREFIX: ${{ steps.artifact.outputs.prefix }}
        run: |
          set -euo pipefail
          cdn_dir="$(mktemp -d)"
          for filename in package.tgz manifest.json ready.json; do
            curl -fsSL \
              --retry 5 \
              --retry-delay 2 \
              --retry-all-errors \
              "${CLI_STATIC_BASE_URL}/${ARTIFACT_PREFIX}/${filename}" \
              --output "${cdn_dir}/${filename}"
          done
          bash .github/scripts/verify-okou-cli-artifact.sh \
            "$cdn_dir" \
            "$ARTIFACT_SHA"
          bash .github/scripts/smoke-okou-cli-artifact.sh \
            "$cdn_dir/package.tgz"

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v7
        with:
          name: cli-package
          path: /tmp/okou-cli-artifact/package.tgz
          retention-days: 1

  # Smoke-test the deployed CLI package entry point.
  cli-e2e-01-serial:
    runs-on: ubuntu-latest
    concurrency:
      group: cli-e2e-01-serial-${{ needs.prepare.outputs.job-ref }}
      cancel-in-progress: true
    needs:
      [
        prepare,
        deploy-cli,
        lint-eslint,
        lint-style,
        lint-types,
        lint-format,
        lint-knip,
        test-cli,
        test-app,
        test-other,
      ]
    if: |
      (github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore: release')) &&
      needs.prepare.outputs.job-ref != '' && (
        needs.prepare.outputs.api-changed == 'true' ||
        needs.prepare.outputs.cli-changed == 'true' ||
        needs.prepare.outputs.crates-changed == 'true' ||
        needs.prepare.outputs.ci-changed == 'true' ||
        needs.prepare.outputs.e2e-changed == 'true'
      )
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Download CLI artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: cli-package
          path: /tmp/cli-package
      - name: Install CLI globally
        run: |
          set -euo pipefail
          package_root="$(mktemp -d)"
          tar -xzf /tmp/cli-package/package.tgz -C "$package_root"
          node_prefix=$(dirname "$(dirname "$(command -v node)")")
          cli_dir="$node_prefix/lib/node_modules/@okouai/cli"
          sudo rm -rf "$cli_dir"
          sudo mkdir -p "$node_prefix/lib/node_modules/@okouai"
          sudo cp -a "$package_root/package" "$cli_dir"
          sudo chmod +x "$cli_dir/okou.js"
          sudo ln -sf "$cli_dir/okou.js" "$node_prefix/bin/okou"
          okou --help
          okou __agent-loop --help
      - name: Run Serial E2E Tests
        run: |
          echo "=== Running Serial E2E Tests ==="
          mkdir -p e2e/results
          BATS_TEST_TIMEOUT=30 ./e2e/test/libs/bats/bin/bats -T --report-formatter junit --output e2e/results ./e2e/tests/01-serial/*.bats
          echo "✅ Serial tests passed"

      - name: Print E2E trace log
        if: always()
        run: |
          if [ -f /tmp/e2e-trace.log ]; then
            echo "=== E2E CLI Trace (Serial) ==="
            cat /tmp/e2e-trace.log
          fi

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 1
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: e2e-serial
          files: e2e/results/*.xml
          report_type: test_results

      - name: Upload JUnit XML artifact
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: e2e-serial-junit-xml
          path: e2e/results/
          retention-days: 7

  # Deploy runner prepare: wait for the shared runner-image workflow manifest.
  # The runner-image workflow owns cross-compilation and all-host image build.
  deploy-runner-prepare:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    concurrency:
      group: deploy-runner-prepare-${{ needs.prepare.outputs.job-ref }}
      cancel-in-progress: true
    needs: [prepare]
    timeout-minutes: 20
    if: |
      needs.prepare.outputs.job-ref != '' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      (
        needs.prepare.outputs.turbo-runner-consumer-needed == 'true' ||
        needs.prepare.outputs.playwright-runner-consumer-needed == 'true'
      )
    outputs:
      bin-dir: ${{ steps.manifest.outputs.bin-dir }}
      runner-dir: ${{ steps.manifest.outputs.runner-dir }}
      runner-sha-map: ${{ steps.manifest.outputs.runner-sha-map }}
      rootfs-hash-map: ${{ steps.manifest.outputs.rootfs-hash-map }}
      snapshot-hash-map: ${{ steps.manifest.outputs.snapshot-hash-map }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup SSH via Cloudflare Tunnel
        uses: ./.github/actions/setup-ssh-tunnel
        with:
          ssh-user: ${{ vars.AWS_METAL_RUNNER_USER }}
          ssh-hosts: ${{ secrets.AWS_METAL_RUNNER_HOSTS }}
          ssh-key: ${{ secrets.AWS_METAL_RUNNER_SSH_KEY }}
          cf-access-client-id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          cf-access-client-secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

      - name: Wait for runner image manifest
        id: manifest
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
          LOOKUP_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          JOB_REF: ${{ needs.prepare.outputs.runner-image-job-ref }}
          # The helper resolves per-architecture host subsets locally and emits
          # merged hash maps for deploy-runner-start.
          AWS_METAL_RUNNER_HOSTS: ${{ secrets.AWS_METAL_RUNNER_HOSTS }}
          METAL_USER: ${{ vars.AWS_METAL_RUNNER_USER }}
          PROFILE: vm0/default
        run: .github/scripts/wait-runner-image-groups.sh

  # Deploy runner start: start one service on the existing deterministic host
  # selection for runner-image-job-ref, matching the Crates Runner behavior lane.
  # Retire the same service namespace on unselected hosts before reporting ready.
  # Shared image preparation and lifecycle locking still cover all hosts.
  # Waits for both deploy-runner-prepare (binaries + image) and deploy-api (preview URL)
  deploy-runner-start:
    runs-on: ubuntu-latest
    outputs:
      runner-receipt: ${{ steps.start.outputs.runner-receipt }}
    permissions:
      actions: read
      contents: read
    concurrency:
      group: deploy-runner-start-${{ needs.prepare.outputs.job-ref }}
      cancel-in-progress: true
    needs: [prepare, deploy-runner-prepare, deploy-api]
    # Normal starts should finish quickly; failures need enough room for the
    # bounded partial-start cleanup watchdog to run before GitHub kills the job.
    timeout-minutes: 8
    if: |
      needs.prepare.outputs.job-ref != '' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      (
        needs.prepare.outputs.turbo-runner-consumer-needed == 'true' ||
        needs.prepare.outputs.playwright-runner-consumer-needed == 'true'
      )
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup SSH via Cloudflare Tunnel
        uses: ./.github/actions/setup-ssh-tunnel
        with:
          ssh-user: ${{ vars.AWS_METAL_RUNNER_USER }}
          ssh-hosts: ${{ secrets.AWS_METAL_RUNNER_HOSTS }}
          ssh-key: ${{ secrets.AWS_METAL_RUNNER_SSH_KEY }}
          cf-access-client-id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          cf-access-client-secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

      # The same host-local lock is used by closed-PR cleanup. It spans the
      # manifest check, any validated recovery, and service readiness so a late
      # approval cannot turn the cleanup handoff into a check-then-act race.
      - name: Reconcile and start runner under lifecycle lock
        id: start
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_DEFAULT_REGION: auto
          AWS_METAL_RUNNER_HOSTS: ${{ secrets.AWS_METAL_RUNNER_HOSTS }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          BIN_DIR: ${{ needs.deploy-runner-prepare.outputs.bin-dir }}
          GH_TOKEN: ${{ github.token }}
          JOB_REF: ${{ needs.prepare.outputs.runner-image-job-ref }}
          METAL_HOSTS: ${{ secrets.AWS_METAL_RUNNER_HOSTS }}
          METAL_USER: ${{ vars.AWS_METAL_RUNNER_USER }}
          OFFICIAL_RUNNER_SECRET: ${{ secrets.OFFICIAL_RUNNER_SECRET }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ vars.R2_USER_STORAGES_BUCKET_NAME }}
          REPO: ${{ github.repository }}
          ROOTFS_HASH_MAP: ${{ needs.deploy-runner-prepare.outputs.rootfs-hash-map }}
          RUNNER_API_URL: ${{ needs.deploy-api.outputs.preview-url }}
          RUNNER_DIR: ${{ needs.deploy-runner-prepare.outputs.runner-dir }}
          RUNNER_GROUP: ${{ format('vm0/development-{0}', needs.prepare.outputs.job-ref) }}
          RUNNER_SERVICE_REF: ${{ needs.prepare.outputs.job-ref }}
          RUNNER_SHA_MAP: ${{ needs.deploy-runner-prepare.outputs.runner-sha-map }}
          SNAPSHOT_HASH_MAP: ${{ needs.deploy-runner-prepare.outputs.snapshot-hash-map }}
          VERCEL_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          .github/scripts/with-runner-lifecycle-lock.sh \
            .github/scripts/reconcile-and-start-runner-groups.sh

  # Prepare the runner identities and API credentials once, then fan runner
  # coverage across no more than twelve non-empty file-balanced shards.
  cli-e2e-03-runner-prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      E2E_CLERK_RESOURCE_DIR: /tmp/e2e-clerk-runner
    concurrency:
      group: cli-e2e-03-runner-prepare-${{ needs.prepare.outputs.job-ref }}
      cancel-in-progress: true
    needs: [prepare, deploy-api, deploy-app, deploy-stripe-listener]
    if: |
      always() &&
      needs.prepare.outputs.job-ref != '' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      needs.prepare.outputs.turbo-runner-consumer-needed == 'true' &&
      needs.deploy-api.result == 'success' &&
      needs.deploy-app.result == 'success' &&
      (github.event_name == 'push' || needs.deploy-stripe-listener.result == 'success')
    outputs:
      runner-organization-id: ${{ steps.account.outputs.runner-organization-id }}
      codex-organization-id: ${{ steps.account.outputs.codex-organization-id }}
      claude-organization-id: ${{ steps.account.outputs.claude-organization-id }}
      mock-claude-organization-id: ${{ steps.account.outputs.mock-claude-organization-id }}
      runner-email: ${{ steps.account.outputs.runner-email }}
      codex-email: ${{ steps.account.outputs.codex-email }}
      claude-email: ${{ steps.account.outputs.claude-email }}
      mock-claude-email: ${{ steps.account.outputs.mock-claude-email }}
      runner-shard-matrix: ${{ steps.shards.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.33.4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Install E2E dependencies
        run: cd e2e && pnpm install --frozen-lockfile
      - name: Check runner E2E model policy
        run: cd e2e && pnpm exec tsx --test scripts/model-policy.test.ts
      - name: Generate runner E2E shard matrix
        id: shards
        shell: bash
        run: |
          set -euo pipefail
          matrix="$(cd e2e && pnpm exec tsx playwright/runner-shards.ts tests/03-runner)"
          jq -e '
            .include | type == "array" and
            length > 0 and length <= 12 and
            all(.[]; (.files | type == "array" and length > 0))
          ' <<<"$matrix" >/dev/null
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
      - name: Prepare runner E2E accounts
        id: account
        run: cd e2e && pnpm exec tsx playwright/runner-account.ts prepare
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          JOB_REF: ${{ needs.prepare.outputs.job-ref }}
      - name: Upload runner Clerk resource records
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-runner-clerk-resources-${{ github.run_attempt }}
          path: /tmp/e2e-clerk-runner/*.json
          if-no-files-found: ignore
          retention-days: 1
      - name: Install Playwright browsers
        run: cd e2e && pnpm exec playwright install --only-shell chromium
      - name: Generate runner E2E API tokens
        run: cd e2e && pnpm exec tsx playwright/runner-token.ts /tmp
        env:
          OKOU_API_BACKEND_URL: ${{ needs.deploy-api.outputs.preview-url }}
          OKOU_APP_URL: ${{ needs.deploy-app.outputs.preview-url }}
          CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          JOB_REF: ${{ needs.prepare.outputs.job-ref }}
          E2E_RUNNER_ORGANIZATION_ID: ${{ steps.account.outputs.runner-organization-id }}
          E2E_RUNNER_CODEX_ORGANIZATION_ID: ${{ steps.account.outputs.codex-organization-id }}
          E2E_RUNNER_CLAUDE_ORGANIZATION_ID: ${{ steps.account.outputs.claude-organization-id }}
          E2E_RUNNER_MOCK_CLAUDE_ORGANIZATION_ID: ${{ steps.account.outputs.mock-claude-organization-id }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      - name: Upload runner E2E Checkout diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: runner-e2e-checkout-diagnostics
          path: /tmp/e2e-runner-checkout-diagnostics
          if-no-files-found: ignore
          retention-days: 1
      - name: Upload runner E2E API tokens
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: e2e-tokens
          path: |
            /tmp/e2e-api-credentials-runner.json
            /tmp/e2e-api-credentials-runner-real-codex.json
            /tmp/e2e-api-credentials-runner-real-claude.json
            /tmp/e2e-api-credentials-runner-mock-claude.json
          retention-days: 1

  cli-e2e-03-runner-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    concurrency:
      group: cli-e2e-03-runner-bootstrap-${{ needs.prepare.outputs.job-ref }}
      cancel-in-progress: true
    needs:
      - prepare
      - deploy-api
      - cli-e2e-03-runner-prepare
    if: |
      always() &&
      needs.prepare.outputs.job-ref != '' &&
      needs.prepare.outputs.turbo-runner-consumer-needed == 'true' &&
      needs.deploy-api.result == 'success' &&
      needs.cli-e2e-03-runner-prepare.result == 'success'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Download runner E2E API tokens
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: e2e-tokens
          path: /tmp
      - name: Setup runner E2E API credentials
        shell: bash
        run: |
          set -euo pipefail
          token=$(jq -er '.token | select(type == "string" and length > 0)' /tmp/e2e-api-credentials-runner.json)
          api_url=$(jq -er '.apiUrl | select(type == "string" and length > 0)' /tmp/e2e-api-credentials-runner.json)
          echo "::add-mask::$token"
          echo "E2E_API_TOKEN=$token" >> "$GITHUB_ENV"
          echo "E2E_API_URL=$api_url" >> "$GITHUB_ENV"
      - name: Reset runner model defaults
        shell: bash
        run: |
          set -euo pipefail
          headers=(-H "Authorization: Bearer ${E2E_API_TOKEN}" -H "Content-Type: application/json")
          if [[ -n "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]]; then
            headers+=(-H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}")
          fi

          # Fresh Clerk organizations bootstrap onto limited-free-1, so the
          # deterministic runner policy must stay within that plan's catalog.
          payload="$(jq -nc '{
            policies: [
              {model: "deepseek-v4-flash", isDefault: true, defaultProviderType: "built-in", credentialScope: "org", modelProviderId: null},
              {model: "gpt-5.6-luna", isDefault: false, defaultProviderType: "built-in", credentialScope: "org", modelProviderId: null}
            ]
          }')"

          curl -fsS "${headers[@]}" -X PUT -d "$payload" "${E2E_API_URL}/api/model-policies" >/dev/null
          curl -fsS "${headers[@]}" -X PUT -d '{"selectedModel":null,"serviceTier":null}' "${E2E_API_URL}/api/user-model-preference" >/dev/null
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      - name: Bootstrap runner mock model provider
        shell: bash
        run: |
          set -euo pipefail
          headers=(-H "Authorization: Bearer ${E2E_API_TOKEN}" -H "Content-Type: application/json")
          if [[ -n "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]]; then
            headers+=(-H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}")
          fi
          curl -fsS "${headers[@]}" \
            -X POST \
            -d '{"type":"claude-code-oauth-token","secret":"mock-oauth-token-for-e2e"}' \
            "${E2E_API_URL}/api/model-providers" >/dev/null
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      - name: Bootstrap mock Claude account
        shell: bash
        run: cd e2e && bash playwright/runner-mock-claude-bootstrap.bash /tmp/e2e-api-credentials-runner-mock-claude.json
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      - name: Bootstrap real Codex account
        shell: bash
        run: |
          set -euo pipefail
          token=$(jq -er '.token | select(type == "string" and length > 0)' /tmp/e2e-api-credentials-runner-real-codex.json)
          api_url=$(jq -er '.apiUrl | select(type == "string" and length > 0)' /tmp/e2e-api-credentials-runner-real-codex.json)
          echo "::add-mask::$token"

          headers=(-H "Authorization: Bearer ${token}" -H "Content-Type: application/json")
          if [[ -n "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]]; then
            headers+=(-H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}")
          fi

          provider_payload=$(jq -nc \
            --arg secret "$OPENAI_API_KEY" \
            '{type: "openai-api-key", secret: $secret}')
          provider_response=$(curl -fsS "${headers[@]}" \
            -X POST \
            -d "$provider_payload" \
            "${api_url}/api/model-providers")
          provider_id=$(jq -er '.provider.id | select(type == "string" and length > 0)' \
            <<< "$provider_response")

          policies=$(curl -fsS "${headers[@]}" "${api_url}/api/model-policies")
          policy_payload=$(jq -c --arg providerId "$provider_id" '
            {
              policies: [
                .policies[] |
                  {
                    model,
                    isDefault,
                    defaultProviderType,
                    credentialScope,
                    modelProviderId
                  } |
                  if .model == "gpt-5.6-luna" then
                    . + {
                      defaultProviderType: "openai-api-key",
                      credentialScope: "org",
                      modelProviderId: $providerId
                    }
                  else . end
              ]
            }
          ' <<< "$policies")
          curl -fsS "${headers[@]}" \
            -X PUT \
            -d "$policy_payload" \
            "${api_url}/api/model-policies" \
            >/dev/null

          curl -fsS "${headers[@]}" \
            -X POST \
            -d '{"switches":{"_realAgentInPreview":true}}' \
            "${api_url}/api/feature-switches" \
            | jq -e '.effectiveSwitches._realAgentInPreview == true' \
            >/dev/null
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      - name: Bootstrap real Claude account
        shell: bash
        run: |
          set -euo pipefail
          token=$(jq -er '.token | select(type == "string" and length > 0)' /tmp/e2e-api-credentials-runner-real-claude.json)
          api_url=$(jq -er '.apiUrl | select(type == "string" and length > 0)' /tmp/e2e-api-credentials-runner-real-claude.json)
          echo "::add-mask::$token"
          claude_model="claude-sonnet-5"

          headers=(-H "Authorization: Bearer ${token}" -H "Content-Type: application/json")
          if [[ -n "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]]; then
            headers+=(-H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}")
          fi

          policies=$(curl -fsS "${headers[@]}" "${api_url}/api/model-policies")
          policy_payload=$(jq -c --arg model "$claude_model" '
            {
              policies: (
                [.policies[] |
                  select(.model != $model) |
                  {
                    model,
                    isDefault,
                    defaultProviderType,
                    credentialScope,
                    modelProviderId
                  }
                ] + [
                  {
                    model: $model,
                    isDefault: false,
                    defaultProviderType: "built-in",
                    credentialScope: "org",
                    modelProviderId: null
                  }
                ]
              )
            }
          ' <<< "$policies")
          curl -fsS "${headers[@]}" \
            -X PUT \
            -d "$policy_payload" \
            "${api_url}/api/model-policies" \
            >/dev/null

          curl -fsS "${headers[@]}" \
            -X POST \
            -d '{"switches":{"_realAgentInPreview":true,"piLoop":true}}' \
            "${api_url}/api/feature-switches" \
            | jq -e '
                .effectiveSwitches._realAgentInPreview == true and
                .effectiveSwitches.piLoop == true
              ' \
            >/dev/null
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

  cli-e2e-03-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: cli-e2e-03-runner-${{ matrix.index }}-${{ needs.prepare.outputs.job-ref }}
      cancel-in-progress: true
    needs:
      - prepare
      - deploy-api
      - deploy-cli
      - deploy-runner-prepare
      - deploy-runner-start
      - cli-e2e-03-runner-prepare
      - cli-e2e-03-runner-bootstrap
    if: |
      always() &&
      needs.prepare.outputs.job-ref != '' &&
      needs.prepare.outputs.turbo-runner-consumer-needed == 'true' &&
      needs.deploy-api.result == 'success' &&
      needs.deploy-cli.result == 'success' &&
      needs.deploy-runner-prepare.result == 'success' &&
      needs.deploy-runner-start.result == 'success' &&
      needs.cli-e2e-03-runner-prepare.result == 'success' &&
      needs.cli-e2e-03-runner-bootstrap.result == 'success'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.cli-e2e-03-runner-prepare.outputs.runner-shard-matrix) }}
    env:
      E2E_CLERK_ORG_ID: ${{ needs.cli-e2e-03-runner-prepare.outputs.runner-organization-id }}
      E2E_RUNNER_CODEX_ORG_ID: ${{ needs.cli-e2e-03-runner-prepare.outputs.codex-organization-id }}
      E2E_RUNNER_CLAUDE_ORG_ID: ${{ needs.cli-e2e-03-runner-prepare.outputs.claude-organization-id }}
      E2E_RUNNER_MOCK_CLAUDE_ORG_ID: ${{ needs.cli-e2e-03-runner-prepare.outputs.mock-claude-organization-id }}
      E2E_RUNNER_EMAIL: ${{ needs.cli-e2e-03-runner-prepare.outputs.runner-email }}
      E2E_RUNNER_CODEX_EMAIL: ${{ needs.cli-e2e-03-runner-prepare.outputs.codex-email }}
      E2E_RUNNER_CLAUDE_EMAIL: ${{ needs.cli-e2e-03-runner-prepare.outputs.claude-email }}
      E2E_RUNNER_MOCK_CLAUDE_EMAIL: ${{ needs.cli-e2e-03-runner-prepare.outputs.mock-claude-email }}
      E2E_RUNNER_SHARD_INDEX: ${{ matrix.index }}
      E2E_RUNNER_SHARD_TOTAL: ${{ strategy.job-total }}
      E2E_RUNNER_TEST_FILES_JSON: ${{ toJSON(matrix.files) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.33.4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Install E2E dependencies
        run: cd e2e && pnpm install --frozen-lockfile
      - name: Download runner E2E API tokens
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: e2e-tokens
          path: /tmp
      - name: Setup runner E2E API credentials
        shell: bash
        run: |
          set -euo pipefail
          for credential_file in \
            /tmp/e2e-api-credentials-runner.json \
            /tmp/e2e-api-credentials-runner-real-codex.json \
            /tmp/e2e-api-credentials-runner-real-claude.json \
            /tmp/e2e-api-credentials-runner-mock-claude.json; do
            jq -er '.token | select(type == "string" and length > 0)' "$credential_file" >/dev/null
            jq -er '.apiUrl | select(type == "string" and length > 0)' "$credential_file" >/dev/null
          done
          token=$(jq -er '.token' /tmp/e2e-api-credentials-runner.json)
          api_url=$(jq -er '.apiUrl' /tmp/e2e-api-credentials-runner.json)
          echo "::add-mask::$token"
          echo "E2E_API_TOKEN=$token" >> "$GITHUB_ENV"
          echo "E2E_API_URL=$api_url" >> "$GITHUB_ENV"
      - name: Initialize runner E2E shard
        shell: bash
        run: |
          set -euo pipefail
          : "${E2E_CLERK_ORG_ID:?runner E2E organization is required}"
          : "${E2E_RUNNER_CODEX_ORG_ID:?runner Codex E2E organization is required}"
          : "${E2E_RUNNER_CLAUDE_ORG_ID:?runner Claude E2E organization is required}"
          : "${E2E_RUNNER_MOCK_CLAUDE_ORG_ID:?runner mock Claude E2E organization is required}"
          : "${E2E_RUNNER_EMAIL:?runner E2E account is required}"
          : "${E2E_RUNNER_CODEX_EMAIL:?runner Codex E2E account is required}"
          : "${E2E_RUNNER_CLAUDE_EMAIL:?runner Claude E2E account is required}"
          : "${E2E_RUNNER_MOCK_CLAUDE_EMAIL:?runner mock Claude E2E account is required}"
          : "${E2E_API_TOKEN:?runner E2E API token is required}"
          : "${E2E_API_URL:?runner E2E API URL is required}"
          jq -e '
            type == "array" and length > 0 and
            all(.[]; type == "string" and length > 0)
          ' <<<"$E2E_RUNNER_TEST_FILES_JSON" >/dev/null
          test_count="$(jq 'length' <<<"$E2E_RUNNER_TEST_FILES_JSON")"
          echo "Runner E2E shard ${E2E_RUNNER_SHARD_INDEX}/${E2E_RUNNER_SHARD_TOTAL} has ${test_count} file(s)"
      - name: Run runner E2E tests (shard ${{ matrix.index }})
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t test_files < <(jq -er '.[]' <<<"$E2E_RUNNER_TEST_FILES_JSON")
          if (( ${#test_files[@]} == 0 )); then
            echo "::error::Runner E2E shard has no test files"
            exit 1
          fi

          cd e2e
          for test_file in "${test_files[@]}"; do
            if [[ ! -f "$test_file" ]]; then
              echo "::error::Runner E2E test file does not exist: $test_file"
              exit 1
            fi
          done

          result_directory="results/runner-${E2E_RUNNER_SHARD_INDEX}"
          mkdir -p "$result_directory"
          BATS_TEST_TIMEOUT=240 ./test/libs/bats/bin/bats \
            -T \
            --report-formatter junit \
            --output "$result_directory" \
            "${test_files[@]}"
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          OKOU_MITM_RUNNER_TOKEN: ${{ contains(matrix.files, 'tests/03-runner/run-t24-built-in-provider-fallback.bats') && format('vm0_official_{0}', secrets.OFFICIAL_RUNNER_SECRET) || '' }}
      - name: Print runner E2E trace log
        if: always()
        shell: bash
        run: |
          if [[ -f /tmp/e2e-trace.log ]]; then
            cat /tmp/e2e-trace.log
          fi
      - name: Upload runner E2E test results to Codecov
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 1
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: e2e-runner
          files: e2e/results/runner-${{ matrix.index }}/*.xml
          report_type: test_results
      - name: Upload runner E2E JUnit XML
        if: ${{ !cancelled() }}
        # JUnit artifacts are diagnostic; the BATS step determines test success.
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-runner-junit-${{ matrix.index }}
          path: e2e/results/runner-${{ matrix.index }}/
          retention-days: 7

  cli-e2e-03-runner-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    env:
      E2E_CLERK_RESOURCE_DIR: /tmp/e2e-clerk-runner
    # All tests that can submit runs to this preview service must finish first.
    # Keep this list in sync with deploy-runner-start consumers (all matrix lanes).
    # Crates behavior lanes own different local-provider Runner instances.
    needs:
      - prepare
      - deploy-runner-start
      - cli-e2e-02-playwright
      - cli-e2e-03-runner-prepare
      - cli-e2e-03-runner
    if: |
      always() &&
      needs.prepare.outputs.job-ref != '' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      (
        needs.cli-e2e-03-runner-prepare.result != 'skipped' ||
        needs.deploy-runner-start.result == 'success'
      )
    steps:
      - name: Determine runner E2E cleanup scope
        id: cleanup-scope
        shell: bash
        env:
          PREPARE_RESULT: ${{ needs.cli-e2e-03-runner-prepare.result }}
          RUNNER_RESULT: ${{ needs.cli-e2e-03-runner.result }}
        run: |
          set -euo pipefail
          if [[ "$PREPARE_RESULT" == "skipped" ]]; then
            scope="none"
          elif [[ "$PREPARE_RESULT" != "success" ]]; then
            scope="generation"
          elif [[ "$RUNNER_RESULT" == "success" ]]; then
            scope="run"
          else
            scope="retain"
          fi
          echo "Runner E2E cleanup scope: $scope"
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
      - name: Retain runner E2E accounts for failed-job rerun
        if: steps.cleanup-scope.outputs.scope == 'retain'
        run: echo "Retaining runner E2E accounts until a successful rerun or fallback cleanup"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        if: steps.cleanup-scope.outputs.scope == 'generation' || steps.cleanup-scope.outputs.scope == 'run'
        with:
          version: 10.33.4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: steps.cleanup-scope.outputs.scope == 'generation' || steps.cleanup-scope.outputs.scope == 'run'
        with:
          node-version: 22
      - name: Install E2E dependencies
        if: steps.cleanup-scope.outputs.scope == 'generation' || steps.cleanup-scope.outputs.scope == 'run'
        run: cd e2e && pnpm install --frozen-lockfile
      - name: Download runner Clerk resource records
        if: steps.cleanup-scope.outputs.scope == 'generation' || steps.cleanup-scope.outputs.scope == 'run'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: e2e-runner-clerk-resources-*
          path: /tmp/e2e-clerk-runner
          merge-multiple: true
      - name: Cleanup current runner E2E generation
        if: steps.cleanup-scope.outputs.scope == 'generation'
        run: cd e2e && pnpm exec tsx playwright/runner-account.ts cleanup-recorded-generation
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          JOB_REF: ${{ needs.prepare.outputs.job-ref }}
      - name: Cleanup runner E2E workflow run
        if: steps.cleanup-scope.outputs.scope == 'run'
        run: cd e2e && pnpm exec tsx playwright/runner-account.ts cleanup-recorded-run
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          JOB_REF: ${{ needs.prepare.outputs.job-ref }}

      - name: Setup SSH for idle sandbox cleanup
        if: always() && needs.deploy-runner-start.result == 'success'
        uses: ./.github/actions/setup-ssh-tunnel
        with:
          ssh-user: ${{ vars.AWS_METAL_RUNNER_USER }}
          ssh-hosts: ${{ fromJSON(needs.deploy-runner-start.outputs.runner-receipt).host }}
          ssh-key: ${{ secrets.AWS_METAL_RUNNER_SSH_KEY }}
          cf-access-client-id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          cf-access-client-secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      - name: Reclaim exact idle sandboxes from the deployed runner
        if: always() && needs.deploy-runner-start.result == 'success'
        shell: bash
        env:
          RUNNER_RECEIPT: ${{ needs.deploy-runner-start.outputs.runner-receipt }}
          METAL_HOSTS: ${{ secrets.AWS_METAL_RUNNER_HOSTS }}
          METAL_USER: ${{ vars.AWS_METAL_RUNNER_USER }}
          JOB_REF: ${{ needs.prepare.outputs.runner-image-job-ref }}
          RUNNER_SERVICE_REF: ${{ needs.prepare.outputs.job-ref }}
        run: bash .github/scripts/prune-runner-idle.sh

  lint-runtime-api-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    needs: [detect-release]
    if: needs.detect-release.outputs.skip != 'true'
    # Report-only: this surfaces schema generation/compat issues without blocking CI.
    continue-on-error: true
    container:
      image: ghcr.io/vm0-ai/vm0-toolchain:20260825
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/toolchain-init

      - name: Download online runtime API schema
        env:
          GH_TOKEN: ${{ github.token }}
          SCHEMA_RELEASE_TAG: runtime-api-schema-prod
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/runtime-api-schema

          if gh release view "$SCHEMA_RELEASE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            if gh release download "$SCHEMA_RELEASE_TAG" \
              --repo "${{ github.repository }}" \
              --pattern current.json \
              --dir /tmp/runtime-api-schema \
              --clobber; then
              echo "Downloaded online runtime API schema"
            else
              echo "::warning::Runtime API schema release exists, but current.json is not available yet."
            fi
          else
            echo "::warning::Runtime API schema release $SCHEMA_RELEASE_TAG does not exist yet; compatibility report will be skipped."
          fi

      - name: Check runtime API compatibility (report only)
        working-directory: turbo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/runtime-api-schema

          pnpm --filter @okouai/api-contracts run build:runtime-api-schema -- --out /tmp/runtime-api-schema/candidate.json

          if [ -f /tmp/runtime-api-schema/current.json ]; then
            pnpm --filter @okouai/api-contracts run lint-runtime-api-compat -- \
              --against /tmp/runtime-api-schema/current.json \
              --current /tmp/runtime-api-schema/candidate.json \
              --report-out /tmp/runtime-api-schema/report.json \
              --warn-only
          else
            echo "::warning::No online runtime API schema found. Generated candidate schema only."
            printf '{"findings":[],"skipped":"online schema not found"}\n' > /tmp/runtime-api-schema/report.json
          fi

      - name: Upload runtime API compatibility report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: runtime-api-compat-report
          path: |
            /tmp/runtime-api-schema/candidate.json
            /tmp/runtime-api-schema/current.json
            /tmp/runtime-api-schema/report.json
          if-no-files-found: warn
          retention-days: 14

  # Lighthouse CI audit for web homepage (failure blocks merge, skip is allowed)
  ci-gate-turbo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Runner cleanup is handled by cleanup.yml (pull_request_target:closed).
    needs:
      - detect-release
      - validate-release-presence
      - detect-turbo-ts-checks
      - prepare
      - file-size-check
      - lint-eslint
      - lint-style
      - lint-types
      - lint-type-app
      - lint-type-api
      - lint-format
      - lint-knip
      - test-migrate
      - test-cli
      - test-app
      - test-api
      - test-pi-memory-boundary
      - test-other
      - deploy-api
      - deploy-app
      - deploy-stripe-listener
      - deploy-cli
      - cli-e2e-02-browser
      - cli-e2e-02-playwright
      - cli-e2e-01-serial
      - cli-e2e-03-runner-prepare
      - cli-e2e-03-runner-bootstrap
      - cli-e2e-03-runner
      - deploy-runner-prepare
      - deploy-runner-start
    # Always run so the gate reports an explicit result (not "skipped").
    # Release-please PRs skip CI jobs — auto-pass the gate for them.
    if: always()
    steps:
      - name: Validate CI results
        env:
          EVENT_NAME: ${{ github.event_name }}
          IS_RELEASE: ${{ needs.detect-release.outputs.skip }}
          RELEASE_PRESENCE_RESULT: ${{ needs.validate-release-presence.result }}
          RELEASE_DEPLOY_APP_RESULT: ${{ needs.deploy-app.result }}
          RELEASE_DEPLOY_CLI_RESULT: ${{ needs.deploy-cli.result }}
        run: |
          # Auto-pass for release-please PRs, commits, and merge queue entries
          if [[ "$IS_RELEASE" == "true" ]]; then
            if [[ "$EVENT_NAME" == "merge_group" && "$RELEASE_PRESENCE_RESULT" != "success" ]]; then
              echo "::error::validate-release-presence: expected success, got $RELEASE_PRESENCE_RESULT"
              exit 1
            fi
            if [[ "$EVENT_NAME" == "merge_group" && "$RELEASE_DEPLOY_APP_RESULT" != "success" ]]; then
              echo "::error::deploy-app: expected success, got $RELEASE_DEPLOY_APP_RESULT"
              exit 1
            fi
            if [[ "$EVENT_NAME" == "merge_group" && "$RELEASE_DEPLOY_CLI_RESULT" != "success" ]]; then
              echo "::error::deploy-cli: expected success, got $RELEASE_DEPLOY_CLI_RESULT"
              exit 1
            fi
            echo "✅ Release-please — skipping CI gate"
            exit 0
          fi

          echo "::group::CI Gate Results"
          FAILED=0
          TS_CHECK_SKIP_ALLOWED=""
          if [ "${{ needs.detect-turbo-ts-checks.outputs.turbo-ts-checks-needed }}" = "false" ]; then
            TS_CHECK_SKIP_ALLOWED="skipped"
          fi
          RUNNER_DEPLOY_SKIP_ALLOWED="true"
          if [ "${{ needs.prepare.outputs.turbo-runner-consumer-needed }}" = "true" ] ||
            [ "${{ needs.prepare.outputs.playwright-runner-consumer-needed }}" = "true" ]; then
            RUNNER_DEPLOY_SKIP_ALLOWED=""
          fi
          RUNNER_E2E_SKIP_ALLOWED="true"
          if [ "${{ needs.prepare.outputs.turbo-runner-consumer-needed }}" = "true" ]; then
            RUNNER_E2E_SKIP_ALLOWED=""
          fi
          CF_APP_SKIP_ALLOWED=""
          if [ "${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}" = "true" ]; then
            # External fork PRs cannot access runner infra secrets, so their
            # runner deployment and runner E2E jobs are expected to skip.
            RUNNER_DEPLOY_SKIP_ALLOWED="true"
            RUNNER_E2E_SKIP_ALLOWED="true"
            CF_APP_SKIP_ALLOWED="true"
          fi
          if [ "${{ github.actor == 'dependabot[bot]' }}" = "true" ]; then
            CF_APP_SKIP_ALLOWED="true"
          fi

          check_result() {
            local job="$1" result="$2" allow_skip="$3"
            if [ "$result" = "success" ]; then
              echo "✅ $job: $result"
            elif { [ "$allow_skip" = "skipped" ] || [ "$allow_skip" = "true" ]; } && [ "$result" = "skipped" ]; then
              echo "⏭️ $job: $result (allowed)"
            else
              if [ "$allow_skip" = "true" ]; then
                echo "::error::$job: expected success or skipped, got $result"
              else
                echo "::error::$job: expected success, got $result"
              fi
              FAILED=1
            fi
          }

          # Required foundation jobs: only 'success' is acceptable.
          check_result "detect-release" "${{ needs.detect-release.result }}" ""
          check_result "detect-turbo-ts-checks" "${{ needs.detect-turbo-ts-checks.result }}" ""
          check_result "prepare" "${{ needs.prepare.result }}" ""
          check_result "file-size-check" "${{ needs.file-size-check.result }}" ""
          # Turbo checks: only 'success' is acceptable unless
          # detect-turbo-ts-checks classified this as a crates-only change set.
          check_result "lint-eslint" "${{ needs.lint-eslint.result }}" "$TS_CHECK_SKIP_ALLOWED"
          check_result "lint-style" "${{ needs.lint-style.result }}" "$TS_CHECK_SKIP_ALLOWED"
          check_result "lint-types" "${{ needs.lint-types.result }}" "$TS_CHECK_SKIP_ALLOWED"
          check_result "lint-type-app" "${{ needs.lint-type-app.result }}" "$TS_CHECK_SKIP_ALLOWED"
          check_result "lint-type-api" "${{ needs.lint-type-api.result }}" "$TS_CHECK_SKIP_ALLOWED"
          check_result "lint-format" "${{ needs.lint-format.result }}" "$TS_CHECK_SKIP_ALLOWED"
          check_result "lint-knip" "${{ needs.lint-knip.result }}" "$TS_CHECK_SKIP_ALLOWED"
          check_result "test-cli" "${{ needs.test-cli.result }}" "$TS_CHECK_SKIP_ALLOWED"
          check_result "test-app" "${{ needs.test-app.result }}" "$TS_CHECK_SKIP_ALLOWED"
          check_result "test-api" "${{ needs.test-api.result }}" "$TS_CHECK_SKIP_ALLOWED"
          check_result "test-pi-memory-boundary" "${{ needs.test-pi-memory-boundary.result }}" "$TS_CHECK_SKIP_ALLOWED"
          check_result "test-other" "${{ needs.test-other.result }}" "$TS_CHECK_SKIP_ALLOWED"

          # May-skip: 'success' or 'skipped' are both acceptable
          check_result "test-migrate" "${{ needs.test-migrate.result }}" "true"
          check_result "deploy-api" "${{ needs.deploy-api.result }}" "true"
          check_result "deploy-app" "${{ needs.deploy-app.result }}" "$CF_APP_SKIP_ALLOWED"
          check_result "deploy-stripe-listener" "${{ needs.deploy-stripe-listener.result }}" "true"
          check_result "deploy-cli" "${{ needs.deploy-cli.result }}" "$CF_APP_SKIP_ALLOWED"
          check_result "cli-e2e-02-browser" "${{ needs.cli-e2e-02-browser.result }}" "true"
          check_result "cli-e2e-02-playwright" "${{ needs.cli-e2e-02-playwright.result }}" "true"
          check_result "cli-e2e-01-serial" "${{ needs.cli-e2e-01-serial.result }}" "true"
          check_result "cli-e2e-03-runner-prepare" "${{ needs.cli-e2e-03-runner-prepare.result }}" "$RUNNER_E2E_SKIP_ALLOWED"
          check_result "cli-e2e-03-runner-bootstrap" "${{ needs.cli-e2e-03-runner-bootstrap.result }}" "$RUNNER_E2E_SKIP_ALLOWED"
          check_result "cli-e2e-03-runner" "${{ needs.cli-e2e-03-runner.result }}" "$RUNNER_E2E_SKIP_ALLOWED"
          check_result "deploy-runner-prepare" "${{ needs.deploy-runner-prepare.result }}" "$RUNNER_DEPLOY_SKIP_ALLOWED"
          check_result "deploy-runner-start" "${{ needs.deploy-runner-start.result }}" "$RUNNER_DEPLOY_SKIP_ALLOWED"

          echo "::endgroup::"
          exit $FAILED
