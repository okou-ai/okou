name: iOS

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sample_xcode_startup:
        description: Sample the compile-phase Xcode startup
        type: boolean
        default: false
      archive_cache_experiment:
        description: Compare fresh Release archives with and without native caches
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

env:
  npm_config_audit: "false"
  # A failed-job rerun may start only the simulator, without a new product producer.
  IOS_PARALLEL_PR_TESTS: ${{ github.event_name == 'pull_request' && github.run_attempt == '1' && 'true' || 'false' }}
  # SwiftPM clones hit HTTP/2 stream resets on the hosted image.
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: http.version
  GIT_CONFIG_VALUE_0: HTTP/1.1

concurrency:
  group: ios-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  archive-cache-seed:
    if: github.event_name == 'workflow_dispatch' && inputs.archive_cache_experiment
    uses: ./.github/workflows/ios-archive-cache-experiment.yml
    with:
      mode: seed
      label: seed

  archive-cache-baseline-before:
    needs: archive-cache-seed
    uses: ./.github/workflows/ios-archive-cache-experiment.yml
    with:
      mode: baseline
      label: baseline-before

  archive-cache-warm-one:
    needs: archive-cache-baseline-before
    uses: ./.github/workflows/ios-archive-cache-experiment.yml
    with:
      mode: warm
      label: warm-one

  archive-cache-warm-two:
    needs: archive-cache-warm-one
    uses: ./.github/workflows/ios-archive-cache-experiment.yml
    with:
      mode: warm
      label: warm-two

  archive-cache-baseline-after:
    needs: archive-cache-warm-two
    uses: ./.github/workflows/ios-archive-cache-experiment.yml
    with:
      mode: baseline
      label: baseline-after

  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      needed: ${{ steps.changes.outputs.needed }}
      scripts-needed: ${{ steps.changes.outputs.scripts-needed }}
      release: ${{ steps.changes.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # PR merge parents and the bounded queue group contain the event base.
          fetch-depth: 32
          sparse-checkout: |
            /ios/scripts/ci-changed.sh
            /.github/scripts/checks/changed-base-ref.sh
          sparse-checkout-cone-mode: false
      - name: Detect iOS changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          CHECKOUT_REF: ${{ github.ref }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          bash ios/scripts/ci-changed.sh >> "$GITHUB_OUTPUT"
          # A queued release commit may reuse published validation. Its subject only
          # selects the resolver, which still classifies the whole group's diff.
          release=false
          if [[ "$EVENT_NAME" == merge_group && "$(git log -1 --format=%s)" == 'chore: release'* ]]; then
            release=true
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"

  script-checks:
    needs: detect
    if: needs.detect.outputs.scripts-needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
      - name: Verify CI change detection and promotion contracts
        run: |
          bash -n ios/scripts/*.sh
          shellcheck ios/scripts/*.sh
          bash ios/scripts/test-ci.sh
          node --test ios/scripts/testflight.test.mjs
          python3 ios/scripts/archive-proof.test.py
          python3 ios/scripts/preview-artifact.test.py
          python3 ios/scripts/upload-sentry-symbols.test.py
          python3 ios/scripts/distribution-profile.test.py
          python3 ios/scripts/archive-promotion.test.py
          python3 ios/scripts/preboot-simulator.test.py
          python3 ios/scripts/prepare-package-sources.test.py
          python3 ios/scripts/run-ci-tests.test.py
          python3 ios/scripts/parallel-ci-tests.test.py
          python3 ios/scripts/sample-xcode-startup.test.py
          python3 ios/scripts/build-cache.test.py
          python3 ios/scripts/reset-oversized-compilation-cache.test.py
          python3 ios/scripts/install-swiftlint.test.py

  resolve-release:
    # Release metadata reuses the archive and tests already published for its
    # native inputs. Other merge groups never start this job or wait for it.
    needs: detect
    if: github.event_name == 'merge_group' && needs.detect.outputs.needed == 'true' && needs.detect.outputs.release == 'true'
    runs-on: xcode-27
    timeout-minutes: 30
    outputs:
      reuse: ${{ steps.resolve.outputs.reuse }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      IOS_TEST_DESTINATION: platform=iOS Simulator,name=iPhone 18 Pro,OS=27.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Keep the bounded squash-group ancestry, not the entire repository history.
          fetch-depth: 32
      - name: Configure archive workspace
        run: echo "IOS_ARCHIVE_DIR=$RUNNER_TEMP/okou-ios-promotion" >> "$GITHUB_ENV"
      - name: Capture promotion inputs
        run: |
          mkdir "$IOS_ARCHIVE_DIR"
          python3 ios/scripts/archive-promotion.py toolchain "$IOS_ARCHIVE_DIR/toolchain.json"
          python3 ios/scripts/archive-promotion.py inputs --toolchain "$IOS_ARCHIVE_DIR/toolchain.json" --output "$IOS_ARCHIVE_DIR/inputs.json"
      - name: Install AWS CLI
        run: |
          if ! command -v aws >/dev/null; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install awscli
          fi
          aws --version
      - name: Resolve exact-input archive and test evidence
        id: resolve
        env:
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          GH_TOKEN: ${{ github.token }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_STATIC_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_STATIC_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ vars.R2_STATIC_BUCKET_NAME }}
        run: python3 ios/scripts/archive-promotion.py resolve-release "$IOS_ARCHIVE_DIR"

  swiftlint:
    needs: [detect, resolve-release]
    # A skipped resolver is the ordinary path; only verified reuse omits native jobs.
    if: >-
      !cancelled() && needs.detect.outputs.needed == 'true' &&
      (needs.resolve-release.result == 'skipped' ||
       (needs.resolve-release.result == 'success' && needs.resolve-release.outputs.reuse == 'false'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      # The same toolchain runs the built binary; source and rules are receipt-bound.
      image: swift:6.4.2-noble@sha256:bca121f6eb59fd80340d1296887b2698ed8f3eb9eca7d80c181f8af769dc7ee0
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: tool-cache
        with:
          path: ios/.tools/swiftlint
          key: native-swiftlint-linux-6.4.2-${{ hashFiles('ios/.swiftlint-version') }}-${{ hashFiles('ios/Tools/SwiftLint/Rules/*.swift', 'ios/Tools/SwiftLint/build.py') }}
          restore-keys: |
            native-swiftlint-linux-6.4.2-${{ hashFiles('ios/.swiftlint-version') }}-
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Build the pinned native-rule SwiftLint
        run: bash ios/scripts/install-swiftlint.sh
      - name: Check native-rule formatting
        run: swift-format lint --strict --recursive ios/Tools/SwiftLint/Rules
      - name: Verify native rules through the real CLI
        run: python3 ios/Tools/SwiftLint/Tests/rules.test.py
      # A queue ref is used once, so an entry saved there is never read. A pull
      # request reads its own entry on its next push; main's entry serves every ref.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name != 'merge_group' && steps.tool-cache.outputs.cache-hit != 'true'
        with:
          path: ios/.tools/swiftlint
          key: ${{ steps.tool-cache.outputs.cache-primary-key }}
      - name: Verify SwiftLint scope and failure handling
        run: bash ios/scripts/test-lint.sh
      - name: Lint owned Swift sources
        run: bash ios/scripts/lint.sh

  test-packages:
    needs: [detect, resolve-release]
    if: >-
      !cancelled() && needs.detect.outputs.needed == 'true' && github.event_name != 'push' &&
      (needs.resolve-release.result == 'skipped' ||
       (needs.resolve-release.result == 'success' && needs.resolve-release.outputs.reuse == 'false'))
    runs-on: xcode-27
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      IOS_TEST_DESTINATION: platform=iOS Simulator,name=iPhone 18 Pro,OS=27.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
      - name: Restore native build caches for the parallel build
        id: producer-cache
        if: env.IOS_PARALLEL_PR_TESTS == 'true'
        uses: ./.github/actions/setup-ios-build-cache
      - name: Await locked sources from this run
        id: producer-sources
        if: env.IOS_PARALLEL_PR_TESTS == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 ios/scripts/wait-ci-test-artifact.py sources
      - name: Receive locked sources for the parallel build
        if: env.IOS_PARALLEL_PR_TESTS == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ steps.producer-sources.outputs.name }}
          path: ${{ runner.temp }}/ios-package-sources
      - name: Compile the complete App test products
        if: env.IOS_PARALLEL_PR_TESTS == 'true'
        env:
          IOS_BUILD_CACHE_ENABLED: "true"
          IOS_PRODUCT_TOOLCHAIN: ${{ steps.producer-cache.outputs.toolchain-file }}
        run: |
          export IOS_PACKAGE_SOURCES_DIR="$RUNNER_TEMP/ios-package-sources"
          # Xcode's system Git helper reads the locked mirrors prepared by ci-test.sh.
          git config --global --add include.path "$RUNNER_TEMP/okou-ios-ci/package-sources.gitconfig"
          bash ios/scripts/ci-test.sh build
          bash ios/scripts/transfer-ci-test-products.sh pack
      - name: Transfer the built App and its test specification
        if: env.IOS_PARALLEL_PR_TESTS == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-ci-products-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ios-native-products/
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - name: Run isolated Swift package tests
        if: "!cancelled() && steps.checkout.outcome == 'success'"
        run: bash ios/scripts/ci-package-test.sh
      - name: Capture package test inputs
        if: github.event_name == 'merge_group'
        run: |
          python3 ios/scripts/archive-promotion.py toolchain "$RUNNER_TEMP/package-toolchain.json"
          python3 ios/scripts/archive-promotion.py inputs --toolchain "$RUNNER_TEMP/package-toolchain.json" --output "$RUNNER_TEMP/package-inputs.json"
      - name: Transfer package test inputs
        if: github.event_name == 'merge_group'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-package-tests-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/package-inputs.json
          if-no-files-found: error
          retention-days: 7

  prepare-package-sources:
    needs: [detect, resolve-release]
    if: >-
      !cancelled() && needs.detect.outputs.needed == 'true' && github.event_name != 'push' &&
      (needs.resolve-release.result == 'skipped' ||
       (needs.resolve-release.result == 'success' && needs.resolve-release.outputs.reuse == 'false'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch locked package revisions
        id: sources
        run: |
          mkdir "$RUNNER_TEMP/package-inputs"
          sources=$(python3 ios/scripts/prepare-package-sources.py ios/Okou.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved "$RUNNER_TEMP/package-inputs")
          echo "path=$sources" >> "$GITHUB_OUTPUT"
      - name: Transfer locked source repositories
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Sources remain identical when only failed downstream jobs are rerun.
          name: ios-package-sources-${{ github.sha }}
          overwrite: true
          path: ${{ steps.sources.outputs.path }}
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  build-test:
    needs: [detect, prepare-package-sources]
    # Source preparation carries the event selection: main pushes consume previously
    # built archives in release-please and never rebuild/test.
    if: "!cancelled() && needs.prepare-package-sources.result == 'success'"
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      IOS_TEST_DESTINATION: platform=iOS Simulator,name=iPhone 18 Pro,OS=27.0
      IOS_BUILD_CACHE_ENABLED: "true"
      IOS_XCODE_STARTUP_SAMPLING: ${{ github.event_name == 'workflow_dispatch' && inputs.sample_xcode_startup && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Keep the bounded squash-group ancestry, not the entire repository history.
          fetch-depth: 32
      - name: Configure archive workspace
        run: |
          echo "IOS_ARCHIVE_DIR=$RUNNER_TEMP/okou-ios-promotion" >> "$GITHUB_ENV"
          echo "IOS_PACKAGE_SOURCES_DIR=$RUNNER_TEMP/ios-package-sources" >> "$GITHUB_ENV"
      - name: Capture promotion inputs
        run: |
          mkdir "$IOS_ARCHIVE_DIR"
          python3 ios/scripts/archive-promotion.py toolchain "$IOS_ARCHIVE_DIR/toolchain.json"
          python3 ios/scripts/archive-promotion.py inputs --toolchain "$IOS_ARCHIVE_DIR/toolchain.json" --output "$IOS_ARCHIVE_DIR/inputs.json"
      - name: Classify the whole merge group
        id: release-only
        if: github.event_name == 'merge_group'
        env:
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          release_only=$(python3 ios/scripts/archive-promotion.py release-only --base "$MERGE_GROUP_BASE_SHA")
          echo "release_only=$release_only" >> "$GITHUB_OUTPUT"
      - name: Install AWS CLI
        if: github.event_name == 'merge_group' && steps.release-only.outputs.release_only == 'true'
        run: |
          if ! command -v aws >/dev/null; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install awscli
          fi
          aws --version
      - name: Resolve exact-input test evidence
        id: evidence
        if: github.event_name == 'merge_group'
        env:
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          GH_TOKEN: ${{ github.token }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_STATIC_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_STATIC_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ vars.R2_STATIC_BUCKET_NAME }}
        run: python3 ios/scripts/archive-promotion.py resolve-tests "$IOS_ARCHIVE_DIR"
      - name: Restore native build caches
        id: build-cache
        if: env.IOS_PARALLEL_PR_TESTS != 'true' && (github.event_name != 'merge_group' || steps.evidence.outputs.run_tests == 'true')
        uses: ./.github/actions/setup-ios-build-cache
        with:
          toolchain-file: ${{ env.IOS_ARCHIVE_DIR }}/toolchain.json
      - name: Receive locked source repositories
        if: env.IOS_PARALLEL_PR_TESTS != 'true' && (github.event_name != 'merge_group' || steps.evidence.outputs.run_tests == 'true')
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ios-package-sources-${{ github.sha }}
          path: ${{ env.IOS_PACKAGE_SOURCES_DIR }}
      - name: Configure locked package sources
        if: env.IOS_PARALLEL_PR_TESTS != 'true' && (github.event_name != 'merge_group' || steps.evidence.outputs.run_tests == 'true')
        run: |
          mkdir -p "$RUNNER_TEMP/okou-ios-ci"
          python3 ios/scripts/prepare-package-sources.py ios/Okou.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved "$RUNNER_TEMP/okou-ios-ci" "$IOS_PACKAGE_SOURCES_DIR"
          # Expose locked sources to Xcode's SCM helper on this ephemeral runner.
          printf '\n' >> "$HOME/.gitconfig"
          cat "$RUNNER_TEMP/okou-ios-ci/package-sources.gitconfig" >> "$HOME/.gitconfig"
      - name: Check Swift formatting and property lists
        run: |
          xcodebuild -version
          xcrun swift-format lint --strict --recursive ios/Okou ios/OkouTests ios/Push ios/Widgets
          plutil -lint ios/Okou/Resources/Info.plist ios/Okou/Resources/Okou.entitlements ios/NotificationExtension/Info.plist ios/NotificationExtension/NotificationExtension.entitlements ios/Widgets/Info.plist ios/Widgets/OkouWidgets.entitlements ios/Okou.xcodeproj/project.pbxproj
      - name: Prepare the simulator and receive its test products concurrently
        if: env.IOS_PARALLEL_PR_TESTS == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash ios/scripts/prepare-parallel-simulator.sh
      - name: Build app and run isolated simulator tests
        if: github.event_name != 'merge_group' || steps.evidence.outputs.run_tests == 'true'
        env:
          IOS_PRODUCT_TOOLCHAIN: ${{ env.IOS_ARCHIVE_DIR }}/toolchain.json
        run: |
          if [[ "$IOS_PARALLEL_PR_TESTS" == true ]]; then
            bash ios/scripts/transfer-ci-test-products.sh unpack
            echo "iOS starting test-without-building"
            bash ios/scripts/ci-test.sh run
          else
            bash ios/scripts/run-ci-tests.sh
          fi
      - name: Upload Xcode startup observations
        if: always() && github.event_name == 'workflow_dispatch' && inputs.sample_xcode_startup
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-xcode-startup-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/okou-ios-ci/startup-samples
          if-no-files-found: ignore
          retention-days: 7
      - name: Record simulator inputs and test decision
        if: github.event_name == 'merge_group'
        run: |
          python3 ios/scripts/archive-promotion.py inputs --toolchain "$IOS_ARCHIVE_DIR/toolchain.json" --output "$IOS_ARCHIVE_DIR/test-inputs.json"
          echo "${{ steps.evidence.outputs.run_tests }}" > "$IOS_ARCHIVE_DIR/ran-tests.txt"
      - name: Transfer simulator inputs and evidence
        if: github.event_name == 'merge_group'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-tests-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ env.IOS_ARCHIVE_DIR }}/test-inputs.json
            ${{ env.IOS_ARCHIVE_DIR }}/test-evidence.json
            ${{ env.IOS_ARCHIVE_DIR }}/ran-tests.txt
          if-no-files-found: error
          retention-days: 7
      - name: Upload failed test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-test-results-${{ github.run_attempt }}
          path: ${{ runner.temp }}/okou-ios-ci/*.xcresult
          if-no-files-found: ignore
          retention-days: 7

  build-preview:
    needs: detect
    if: needs.detect.outputs.needed == 'true' && github.event_name != 'merge_group' && github.event_name != 'push'
    runs-on: xcode-27
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      IOS_TEST_DESTINATION: platform=iOS Simulator,name=iPhone 18 Pro,OS=27.0
      OKOU_STAGING_CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY_PREVIEW }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure staging archive workspace
        run: echo "IOS_ARCHIVE_DIR=$RUNNER_TEMP/okou-ios-promotion" >> "$GITHUB_ENV"
      - name: Restore device build caches
        uses: ./.github/actions/setup-ios-build-cache
        with:
          target: archive
      - name: Build and validate staging device IPA
        run: bash ios/scripts/build-preview.sh
      - name: Upload staging device artifacts
        id: preview
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-staging-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ env.IOS_ARCHIVE_DIR }}/preview
          if-no-files-found: error
          retention-days: 7
      - name: Link staging device build
        env:
          ARTIFACT_URL: ${{ steps.preview.outputs.artifact-url }}
        run: |
          {
            echo '### iOS staging device build'
            echo "[Download IPA, archive, and manifest]($ARTIFACT_URL)"
            echo "- Built checkout: $GITHUB_SHA; PR head: ${PR_HEAD_SHA:-not a PR}"
            echo '- Unsigned IPA for BrowserStack re-signing; not directly installable on a personal iPhone.'
            echo '- Uses staging services and Clerk TEST; no TestFlight publication.'
          } >> "$GITHUB_STEP_SUMMARY"

  build-archive:
    # Compile in parallel with simulator validation to stay inside the queue deadline.
    needs: [detect, resolve-release]
    if: >-
      !cancelled() && github.event_name == 'merge_group' && needs.detect.outputs.needed == 'true' &&
      (needs.resolve-release.result == 'skipped' ||
       (needs.resolve-release.result == 'success' && needs.resolve-release.outputs.reuse == 'false'))
    runs-on: xcode-27
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      IOS_TEST_DESTINATION: platform=iOS Simulator,name=iPhone 18 Pro,OS=27.0
      IOS_ARCHIVE_CACHE_ENABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure archive workspace
        run: echo "IOS_ARCHIVE_DIR=$RUNNER_TEMP/okou-ios-promotion" >> "$GITHUB_ENV"
      - name: Restore Release archive caches
        id: cache
        uses: ./.github/actions/setup-ios-build-cache
        with:
          target: archive
      - name: Capture archive toolchain
        run: |
          mkdir -p "$IOS_ARCHIVE_DIR"
          cp "${{ steps.cache.outputs.toolchain-file }}" "$IOS_ARCHIVE_DIR/toolchain.json"
      - name: Build unsigned device Release archive
        run: |
          bash ios/scripts/build-archive.sh
          python3 ios/scripts/archive-promotion.py inputs --toolchain "$IOS_ARCHIVE_DIR/toolchain.json" --output "$IOS_ARCHIVE_DIR/inputs.json"
      - name: Transfer unsigned archive and inputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-promotion-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ env.IOS_ARCHIVE_DIR }}/archive.tar.gz
            ${{ env.IOS_ARCHIVE_DIR }}/archive-sha256.txt
            ${{ env.IOS_ARCHIVE_DIR }}/inputs.json
          if-no-files-found: error
          retention-days: 7

  publish-archive:
    needs:
      [
        detect,
        script-checks,
        swiftlint,
        test-packages,
        build-test,
        build-archive,
      ]
    # Every producer must have run and passed; verified release reuse publishes nothing.
    if: >-
      !cancelled() && github.event_name == 'merge_group' && needs.detect.outputs.needed == 'true' &&
      ((needs.detect.outputs.scripts-needed == 'true' && needs.script-checks.result == 'success') ||
      (needs.detect.outputs.scripts-needed == 'false' && needs.script-checks.result == 'skipped')) &&
      needs.swiftlint.result == 'success' &&
      needs.test-packages.result == 'success' && needs.build-test.result == 'success' &&
      needs.build-archive.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
      GH_TOKEN: ${{ github.token }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_STATIC_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_STATIC_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
      R2_BUCKET_NAME: ${{ vars.R2_STATIC_BUCKET_NAME }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Keep queue ancestry; older evidence commits are fetched by exact SHA.
          fetch-depth: 32
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ios-promotion-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/okou-ios-promotion
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ios-tests-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/okou-ios-promotion
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ios-package-tests-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/okou-ios-promotion
      - name: Publish immutable archive and readiness
        run: |
          aws --version
          IOS_RAN_TESTS="$(<"$RUNNER_TEMP/okou-ios-promotion/ran-tests.txt")"
          export IOS_RAN_TESTS
          python3 ios/scripts/archive-promotion.py publish "$RUNNER_TEMP/okou-ios-promotion"

  ci-gate-ios:
    needs:
      [
        detect,
        script-checks,
        resolve-release,
        swiftlint,
        test-packages,
        build-test,
        build-preview,
        build-archive,
        publish-archive,
      ]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: /ios/scripts/ci-gate.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Validate iOS check results
        env:
          EVENT_NAME: ${{ github.event_name }}
          DETECT_RESULT: ${{ needs.detect.result }}
          SCRIPTS_NEEDED: ${{ needs.detect.outputs.scripts-needed }}
          SCRIPT_CHECKS_RESULT: ${{ needs.script-checks.result }}
          LINT_RESULT: ${{ needs.swiftlint.result }}
          IOS_NEEDED: ${{ needs.detect.outputs.needed }}
          RELEASE_RESULT: ${{ needs.resolve-release.result }}
          RELEASE_REUSE: ${{ needs.resolve-release.outputs.reuse }}
          PACKAGES_RESULT: ${{ needs.test-packages.result }}
          BUILD_RESULT: ${{ needs.build-test.result }}
          PREVIEW_RESULT: ${{ needs.build-preview.result }}
          ARCHIVE_RESULT: ${{ needs.build-archive.result }}
          PUBLISH_RESULT: ${{ needs.publish-archive.result }}
        run: bash ios/scripts/ci-gate.sh
