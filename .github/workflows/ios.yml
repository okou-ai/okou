name: iOS

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
  IOS_TEST_DESTINATION: platform=iOS Simulator,name=iPhone 18 Pro,OS=27.0
  IOS_BUILD_CACHE_ENABLED: "true"
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: http.version
  GIT_CONFIG_VALUE_0: HTTP/1.1

jobs:
  test-conformance-proof:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 5
      - name: Format the proposed test changes
        run: |
          mkdir -p "$RUNNER_TEMP/ios-test-conformance-proof"
          git diff 556765662765a03e4b132d71e4268825c3625bf0 HEAD^ --name-only -- '*.swift' > "$RUNNER_TEMP/ios-test-conformance-proof/changed-swift.txt"
          while IFS= read -r path; do
            xcrun swift-format format --in-place "$path"
            xcrun swift-format lint --strict "$path"
          done < "$RUNNER_TEMP/ios-test-conformance-proof/changed-swift.txt"
          git diff --binary > "$RUNNER_TEMP/ios-test-conformance-proof/format.patch"
      - name: Retain native formatting
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ios-test-conformance-format
          path: ${{ runner.temp }}/ios-test-conformance-proof/format.patch
          if-no-files-found: error
          retention-days: 7
      - name: Restore native build caches
        uses: ./.github/actions/setup-ios-build-cache
      - name: Run package coverage
        run: bash ios/scripts/ci-package-test.sh
      - name: Prove native synchronization and mutation sensitivity
        run: bash ios/scripts/test-conformance-proof.sh
      - name: Retain proof results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ios-test-conformance-proof
          path: |
            ${{ runner.temp }}/ios-test-conformance-proof/*.log
            ${{ runner.temp }}/ios-test-conformance-proof/*.json
            ${{ runner.temp }}/ios-test-conformance-proof/*.patch
            ${{ runner.temp }}/ios-test-conformance-proof/*.xcresult
          if-no-files-found: warn
          retention-days: 7
