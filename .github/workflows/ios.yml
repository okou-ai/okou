name: iOS

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
  IOS_TEST_DESTINATION: platform=iOS Simulator,name=iPhone 18 Pro,OS=27.0
  IOS_BUILD_CACHE_ENABLED: "true"
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: http.version
  GIT_CONFIG_VALUE_0: HTTP/1.1

jobs:
  native-boundary-proof:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 5
      - name: Format the proposed test changes
        run: |
          mkdir -p "$RUNNER_TEMP/ios-native-boundary-proof"
          for path in ios/OkouTests/RecommendedFollowupTests.swift ios/OkouTests/ComposerDraftTests.swift ios/OkouTests/ChatComposerWorkflowTests.swift ios/OkouTests/ChatComposerMentionTests.swift; do
            xcrun swift-format format --in-place "$path"
            xcrun swift-format lint --strict "$path"
          done
          git diff --binary -- ios/OkouTests > "$RUNNER_TEMP/ios-native-boundary-proof/format.patch"
      - name: Retain native formatting
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ios-native-boundary-format
          path: ${{ runner.temp }}/ios-native-boundary-proof/format.patch
          if-no-files-found: error
          retention-days: 7
      - name: Restore native build caches
        uses: ./.github/actions/setup-ios-build-cache
      - name: Prove focused input bridges and business synchronization
        run: bash ios/scripts/native-boundary-proof.sh
      - name: Retain proof results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ios-native-boundary-proof
          path: |
            ${{ runner.temp }}/ios-native-boundary-proof/*.log
            ${{ runner.temp }}/ios-native-boundary-proof/*.xcresult
          if-no-files-found: warn
          retention-days: 7
