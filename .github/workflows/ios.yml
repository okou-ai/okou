name: iOS Bounded Compiler Cache Lifecycle Proof
"on":
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
env:
  npm_config_audit: "false"
  DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
  IOS_TEST_DESTINATION: platform=iOS Simulator,name=iPhone 18 Pro,OS=27.0
  IOS_BUILD_CACHE_ENABLED: "true"
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: http.version
  GIT_CONFIG_VALUE_0: HTTP/1.1
jobs:
  seed:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: f0eae622317bbdc9b2eaad947c95557e43b0b3b2
          persist-credentials: false
      - name: Restore native cache
        id: cache
        uses: ./.github/actions/setup-ios-build-cache
        with:
          skip-restore-on-hit: "true"
      - name: Record inherited cache proof
        env:
          PHASE: inherited
          DEPENDENCIES_HIT: ${{ steps.cache.outputs.dependencies-hit }}
          COMPILATION_HIT: ${{ steps.cache.outputs.compilation-hit }}
          COMPILATION_KEY: ${{ steps.cache.outputs.compilation-key }}
        run: |
          set -euo pipefail
          python3 - <<'PROOF'
          import json,os,pathlib,subprocess
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          cache=root/'okou-ios-ci/DerivedData/CompilationCache.noindex'
          sources=root/'okou-ios-ci/SourcePackages'
          proof_file=root/'policy-proof.json'
          proof=json.loads(proof_file.read_text()) if proof_file.exists() else {}
          size=sum(p.stat().st_size for p in cache.rglob('*') if p.is_file() and not p.is_symlink()) if cache.exists() else 0
          fields={key:os.environ.get(key,'') for key in ['DEPENDENCIES_HIT','COMPILATION_HIT','COMPILATION_KEY']}
          proof[os.environ['PHASE']]={'source':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'logicalBytes':size,'cacheExists':cache.exists(),'sourcesExist':sources.is_dir(),**fields}
          phase=os.environ['PHASE']
          if phase=='inherited':
              assert size>2*1024**3 and sources.is_dir(),proof
              assert fields['DEPENDENCIES_HIT']=='true' and fields['COMPILATION_HIT']!='true',proof
          elif phase=='reset':
              assert not cache.exists() and sources.is_dir(),proof
          elif phase in ['generated','retained']:
              assert 0<size<2*1024**3 and sources.is_dir(),proof
              if phase=='retained':assert size==proof['generated']['logicalBytes'],proof
          elif phase=='full-hit':
              assert fields['DEPENDENCIES_HIT']=='true' and fields['COMPILATION_HIT']=='true',proof
              assert not cache.exists() and not sources.exists(),proof
          proof_file.write_text(json.dumps(proof,indent=2))
          print(json.dumps(proof,indent=2))
          PROOF
      - name: Reset oversized inherited compiler history
        id: limit-compilation
        if: steps.cache.outputs.compilation-hit != 'true'
        run: python3 ios/scripts/reset-oversized-compilation-cache.py
      - name: Record reset cache proof
        env:
          PHASE: reset
          DEPENDENCIES_HIT: ${{ steps.cache.outputs.dependencies-hit }}
          COMPILATION_HIT: ${{ steps.cache.outputs.compilation-hit }}
          COMPILATION_KEY: ${{ steps.cache.outputs.compilation-key }}
        run: |
          set -euo pipefail
          python3 - <<'PROOF'
          import json,os,pathlib,subprocess
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          cache=root/'okou-ios-ci/DerivedData/CompilationCache.noindex'
          sources=root/'okou-ios-ci/SourcePackages'
          proof_file=root/'policy-proof.json'
          proof=json.loads(proof_file.read_text()) if proof_file.exists() else {}
          size=sum(p.stat().st_size for p in cache.rglob('*') if p.is_file() and not p.is_symlink()) if cache.exists() else 0
          fields={key:os.environ.get(key,'') for key in ['DEPENDENCIES_HIT','COMPILATION_HIT','COMPILATION_KEY']}
          proof[os.environ['PHASE']]={'source':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'logicalBytes':size,'cacheExists':cache.exists(),'sourcesExist':sources.is_dir(),**fields}
          phase=os.environ['PHASE']
          if phase=='inherited':
              assert size>2*1024**3 and sources.is_dir(),proof
              assert fields['DEPENDENCIES_HIT']=='true' and fields['COMPILATION_HIT']!='true',proof
          elif phase=='reset':
              assert not cache.exists() and sources.is_dir(),proof
          elif phase in ['generated','retained']:
              assert 0<size<2*1024**3 and sources.is_dir(),proof
              if phase=='retained':assert size==proof['generated']['logicalBytes'],proof
          elif phase=='full-hit':
              assert fields['DEPENDENCIES_HIT']=='true' and fields['COMPILATION_HIT']=='true',proof
              assert not cache.exists() and not sources.exists(),proof
          proof_file.write_text(json.dumps(proof,indent=2))
          print(json.dumps(proof,indent=2))
          PROOF
      - name: Prepare locked dependencies
        id: prepare
        if: steps.cache.outputs.dependencies-hit != 'true' || steps.cache.outputs.compilation-hit != 'true'
        run: bash ios/scripts/ci-test.sh prepare
      - name: Save main SwiftPM cache
        id: save-dependencies
        if: steps.cache.outputs.dependencies-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.cache.outputs.dependencies-path }}
          key: ${{ steps.cache.outputs.dependencies-key }}
      - name: Verify main SwiftPM cache
        id: verify-dependencies
        if: steps.cache.outputs.dependencies-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.cache.outputs.dependencies-path }}
          key: ${{ steps.cache.outputs.dependencies-key }}
          lookup-only: true
          fail-on-cache-miss: true
      - name: Prepare compiler cache
        id: compile
        if: steps.cache.outputs.compilation-hit != 'true'
        run: |
          sysctl hw.ncpu hw.memsize
          vm_stat
          bash ios/scripts/ci-test.sh compile
          vm_stat
      - name: Record generated cache proof
        env:
          PHASE: generated
          DEPENDENCIES_HIT: ${{ steps.cache.outputs.dependencies-hit }}
          COMPILATION_HIT: ${{ steps.cache.outputs.compilation-hit }}
          COMPILATION_KEY: ${{ steps.cache.outputs.compilation-key }}
        run: |
          set -euo pipefail
          python3 - <<'PROOF'
          import json,os,pathlib,subprocess
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          cache=root/'okou-ios-ci/DerivedData/CompilationCache.noindex'
          sources=root/'okou-ios-ci/SourcePackages'
          proof_file=root/'policy-proof.json'
          proof=json.loads(proof_file.read_text()) if proof_file.exists() else {}
          size=sum(p.stat().st_size for p in cache.rglob('*') if p.is_file() and not p.is_symlink()) if cache.exists() else 0
          fields={key:os.environ.get(key,'') for key in ['DEPENDENCIES_HIT','COMPILATION_HIT','COMPILATION_KEY']}
          proof[os.environ['PHASE']]={'source':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'logicalBytes':size,'cacheExists':cache.exists(),'sourcesExist':sources.is_dir(),**fields}
          phase=os.environ['PHASE']
          if phase=='inherited':
              assert size>2*1024**3 and sources.is_dir(),proof
              assert fields['DEPENDENCIES_HIT']=='true' and fields['COMPILATION_HIT']!='true',proof
          elif phase=='reset':
              assert not cache.exists() and sources.is_dir(),proof
          elif phase in ['generated','retained']:
              assert 0<size<2*1024**3 and sources.is_dir(),proof
              if phase=='retained':assert size==proof['generated']['logicalBytes'],proof
          elif phase=='full-hit':
              assert fields['DEPENDENCIES_HIT']=='true' and fields['COMPILATION_HIT']=='true',proof
              assert not cache.exists() and not sources.exists(),proof
          proof_file.write_text(json.dumps(proof,indent=2))
          print(json.dumps(proof,indent=2))
          PROOF
      - name: Verify fresh cache remains below threshold
        run: python3 ios/scripts/reset-oversized-compilation-cache.py
      - name: Record retained cache proof
        env:
          PHASE: retained
          DEPENDENCIES_HIT: ${{ steps.cache.outputs.dependencies-hit }}
          COMPILATION_HIT: ${{ steps.cache.outputs.compilation-hit }}
          COMPILATION_KEY: ${{ steps.cache.outputs.compilation-key }}
        run: |
          set -euo pipefail
          python3 - <<'PROOF'
          import json,os,pathlib,subprocess
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          cache=root/'okou-ios-ci/DerivedData/CompilationCache.noindex'
          sources=root/'okou-ios-ci/SourcePackages'
          proof_file=root/'policy-proof.json'
          proof=json.loads(proof_file.read_text()) if proof_file.exists() else {}
          size=sum(p.stat().st_size for p in cache.rglob('*') if p.is_file() and not p.is_symlink()) if cache.exists() else 0
          fields={key:os.environ.get(key,'') for key in ['DEPENDENCIES_HIT','COMPILATION_HIT','COMPILATION_KEY']}
          proof[os.environ['PHASE']]={'source':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'logicalBytes':size,'cacheExists':cache.exists(),'sourcesExist':sources.is_dir(),**fields}
          phase=os.environ['PHASE']
          if phase=='inherited':
              assert size>2*1024**3 and sources.is_dir(),proof
              assert fields['DEPENDENCIES_HIT']=='true' and fields['COMPILATION_HIT']!='true',proof
          elif phase=='reset':
              assert not cache.exists() and sources.is_dir(),proof
          elif phase in ['generated','retained']:
              assert 0<size<2*1024**3 and sources.is_dir(),proof
              if phase=='retained':assert size==proof['generated']['logicalBytes'],proof
          elif phase=='full-hit':
              assert fields['DEPENDENCIES_HIT']=='true' and fields['COMPILATION_HIT']=='true',proof
              assert not cache.exists() and not sources.exists(),proof
          proof_file.write_text(json.dumps(proof,indent=2))
          print(json.dumps(proof,indent=2))
          PROOF
      - name: Save main Xcode compilation cache
        id: save-compilation
        if: steps.cache.outputs.compilation-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.cache.outputs.compilation-path }}
          key: ${{ steps.cache.outputs.compilation-key }}
      - name: Verify main Xcode compilation cache
        id: verify-compilation
        if: steps.cache.outputs.compilation-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.cache.outputs.compilation-path }}
          key: ${{ steps.cache.outputs.compilation-key }}
          lookup-only: true
          fail-on-cache-miss: true
      - name: Retain native lifecycle proof
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cache-bound-seed-${{ github.run_id }}
          path: ${{ runner.temp }}/policy-proof.json
          if-no-files-found: error
          retention-days: 7
    outputs:
      compilation-key: ${{ steps.cache.outputs.compilation-key }}
  consumer:
    needs: seed
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: f0eae622317bbdc9b2eaad947c95557e43b0b3b2
          persist-credentials: false
      - name: Restore locked source cache
        id: cache
        uses: ./.github/actions/setup-ios-build-cache
        with:
          restore-compilation: "false"
      - name: Restore freshly generated compiler cache
        id: compiler
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.cache.outputs.compilation-path }}
          key: ${{ needs.seed.outputs.compilation-key }}
          fail-on-cache-miss: true
      - name: Require exact native replay cache
        env:
          HIT: ${{ steps.compiler.outputs.cache-hit }}
        run: |-
          set -euo pipefail
          [[ "$HIT" == true ]]
      - name: Run all standalone package tests
        run: bash ios/scripts/ci-package-test.sh
      - name: Build and run all App simulator tests from fresh cache
        run: bash ios/scripts/run-ci-tests.sh
      - name: Record cross-runner consumer
        env:
          PHASE: consumer
          COMPILATION_KEY: ${{ needs.seed.outputs.compilation-key }}
        run: |
          set -euo pipefail
          python3 - <<'PROOF'
          import json,os,pathlib,subprocess
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          cache=root/'okou-ios-ci/DerivedData/CompilationCache.noindex'
          sources=root/'okou-ios-ci/SourcePackages'
          proof_file=root/'policy-proof.json'
          proof=json.loads(proof_file.read_text()) if proof_file.exists() else {}
          size=sum(p.stat().st_size for p in cache.rglob('*') if p.is_file() and not p.is_symlink()) if cache.exists() else 0
          fields={key:os.environ.get(key,'') for key in ['DEPENDENCIES_HIT','COMPILATION_HIT','COMPILATION_KEY']}
          proof[os.environ['PHASE']]={'source':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'logicalBytes':size,'cacheExists':cache.exists(),'sourcesExist':sources.is_dir(),**fields}
          phase=os.environ['PHASE']
          if phase=='inherited':
              assert size>2*1024**3 and sources.is_dir(),proof
              assert fields['DEPENDENCIES_HIT']=='true' and fields['COMPILATION_HIT']!='true',proof
          elif phase=='reset':
              assert not cache.exists() and sources.is_dir(),proof
          elif phase in ['generated','retained']:
              assert 0<size<2*1024**3 and sources.is_dir(),proof
              if phase=='retained':assert size==proof['generated']['logicalBytes'],proof
          elif phase=='full-hit':
              assert fields['DEPENDENCIES_HIT']=='true' and fields['COMPILATION_HIT']=='true',proof
              assert not cache.exists() and not sources.exists(),proof
          proof_file.write_text(json.dumps(proof,indent=2))
          print(json.dumps(proof,indent=2))
          PROOF
      - name: Retain native lifecycle proof
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cache-bound-consumer-${{ github.run_id }}
          path: ${{ runner.temp }}/policy-proof.json
          if-no-files-found: error
          retention-days: 7
      - name: Retain failed native results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cache-bound-failed-${{ github.run_id }}
          path: ${{ runner.temp }}/okou-ios-ci/*.xcresult
          if-no-files-found: ignore
          retention-days: 7
  full-hit:
    needs: seed
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: f0eae622317bbdc9b2eaad947c95557e43b0b3b2
          persist-credentials: false
      - name: Restore native cache
        id: cache
        uses: ./.github/actions/setup-ios-build-cache
        with:
          skip-restore-on-hit: "true"
      - name: Reset oversized inherited compiler history
        id: limit-compilation
        if: steps.cache.outputs.compilation-hit != 'true'
        run: python3 ios/scripts/reset-oversized-compilation-cache.py
      - name: Prepare locked dependencies
        id: prepare
        if: steps.cache.outputs.dependencies-hit != 'true' || steps.cache.outputs.compilation-hit != 'true'
        run: bash ios/scripts/ci-test.sh prepare
      - name: Save main SwiftPM cache
        id: save-dependencies
        if: steps.cache.outputs.dependencies-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.cache.outputs.dependencies-path }}
          key: ${{ steps.cache.outputs.dependencies-key }}
      - name: Verify main SwiftPM cache
        id: verify-dependencies
        if: steps.cache.outputs.dependencies-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.cache.outputs.dependencies-path }}
          key: ${{ steps.cache.outputs.dependencies-key }}
          lookup-only: true
          fail-on-cache-miss: true
      - name: Prepare compiler cache
        id: compile
        if: steps.cache.outputs.compilation-hit != 'true'
        run: |
          sysctl hw.ncpu hw.memsize
          vm_stat
          bash ios/scripts/ci-test.sh compile
          vm_stat
      - name: Save main Xcode compilation cache
        id: save-compilation
        if: steps.cache.outputs.compilation-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.cache.outputs.compilation-path }}
          key: ${{ steps.cache.outputs.compilation-key }}
      - name: Verify main Xcode compilation cache
        id: verify-compilation
        if: steps.cache.outputs.compilation-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.cache.outputs.compilation-path }}
          key: ${{ steps.cache.outputs.compilation-key }}
          lookup-only: true
          fail-on-cache-miss: true
      - name: Record full-hit cache proof
        env:
          PHASE: full-hit
          DEPENDENCIES_HIT: ${{ steps.cache.outputs.dependencies-hit }}
          COMPILATION_HIT: ${{ steps.cache.outputs.compilation-hit }}
          COMPILATION_KEY: ${{ steps.cache.outputs.compilation-key }}
        run: |
          set -euo pipefail
          python3 - <<'PROOF'
          import json,os,pathlib,subprocess
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          cache=root/'okou-ios-ci/DerivedData/CompilationCache.noindex'
          sources=root/'okou-ios-ci/SourcePackages'
          proof_file=root/'policy-proof.json'
          proof=json.loads(proof_file.read_text()) if proof_file.exists() else {}
          size=sum(p.stat().st_size for p in cache.rglob('*') if p.is_file() and not p.is_symlink()) if cache.exists() else 0
          fields={key:os.environ.get(key,'') for key in ['DEPENDENCIES_HIT','COMPILATION_HIT','COMPILATION_KEY']}
          proof[os.environ['PHASE']]={'source':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'logicalBytes':size,'cacheExists':cache.exists(),'sourcesExist':sources.is_dir(),**fields}
          phase=os.environ['PHASE']
          if phase=='inherited':
              assert size>2*1024**3 and sources.is_dir(),proof
              assert fields['DEPENDENCIES_HIT']=='true' and fields['COMPILATION_HIT']!='true',proof
          elif phase=='reset':
              assert not cache.exists() and sources.is_dir(),proof
          elif phase in ['generated','retained']:
              assert 0<size<2*1024**3 and sources.is_dir(),proof
              if phase=='retained':assert size==proof['generated']['logicalBytes'],proof
          elif phase=='full-hit':
              assert fields['DEPENDENCIES_HIT']=='true' and fields['COMPILATION_HIT']=='true',proof
              assert not cache.exists() and not sources.exists(),proof
          proof_file.write_text(json.dumps(proof,indent=2))
          print(json.dumps(proof,indent=2))
          PROOF
      - name: Retain native lifecycle proof
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cache-bound-full-hit-${{ github.run_id }}
          path: ${{ runner.temp }}/policy-proof.json
          if-no-files-found: error
          retention-days: 7
