name: iOS

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
  IOS_TEST_DESTINATION: platform=iOS Simulator,name=iPhone 18 Pro,OS=27.0
  IOS_BUILD_CACHE_ENABLED: "true"
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: http.version
  GIT_CONFIG_VALUE_0: HTTP/1.1

jobs:
  business-waits-proof:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Restore native build caches
        uses: ./.github/actions/setup-ios-build-cache
      - name: Check native formatting
        run: xcrun swift-format lint --strict --recursive ios/OkouTests
      - name: Prepare and compile the guarded business suites
        run: |
          bash ios/scripts/ci-test.sh prepare
          bash ios/scripts/ci-test.sh compile
      - name: Prepare the isolated simulator
        run: python3 ios/scripts/preboot-simulator.py
      - name: Repeat all three business suites without display-frame support
        shell: bash
        run: |
          set -euo pipefail
          proof_root="$RUNNER_TEMP/ios-business-waits-proof"
          mkdir -p "$proof_root"
          test_runs=("$RUNNER_TEMP"/okou-ios-ci/DerivedData/Build/Products/*.xctestrun)
          test "${#test_runs[@]}" -eq 1
          for attempt in 1 2 3 4 5; do
            xcodebuild -xctestrun "${test_runs[0]}" \
              -destination "$IOS_TEST_DESTINATION" \
              -parallel-testing-enabled NO \
              -maximum-concurrent-test-simulator-destinations 1 \
              -collect-test-diagnostics never \
              -only-testing:OkouTests/ConversationRunUsageTests \
              -only-testing:OkouTests/ConversationActivitySummaryTests \
              -only-testing:OkouTests/ChatSearchUnreadTests \
              -resultBundlePath "$proof_root/attempt-$attempt.xcresult" \
              test-without-building 2>&1 | tee "$proof_root/attempt-$attempt.log"
          done
      - name: Retain native proof results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ios-business-waits-proof
          path: ${{ runner.temp }}/ios-business-waits-proof
          if-no-files-found: warn
          retention-days: 7
