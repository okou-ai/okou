name: iOS Simulator Profile Inspection
run-name: Simulator service inspection only (no App tests)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: xcode-27
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - name: Inspect the selected simulator without changing service settings
        run: |
          python3 -u - <<'PYPROBE'
          import json, pathlib, plistlib, re, subprocess, time
          def call(*args):
              started = time.monotonic()
              result = subprocess.run(['xcrun','simctl',*args],capture_output=True,text=True)
              print('COMMAND',args[:2],'status',result.returncode,'seconds',round(time.monotonic()-started,3),flush=True)
              return result
          runtime = 'com.apple.CoreSimulator.SimRuntime.iOS-27-0'
          inventory = json.loads(call('list','runtimes','--json').stdout)
          selected, = [r for r in inventory['runtimes'] if r['identifier']==runtime]
          root = pathlib.Path(selected['bundlePath'])/'Contents/Resources/RuntimeRoot'
          for relative in ['Applications','System/Library/CoreServices','System/Library/PrivateFrameworks','System/Library/LaunchAgents','System/Library/LaunchDaemons']:
              parent = root/relative
              for item in sorted(parent.glob('*')):
                  if any(word in item.name.lower() for word in ['poster','chrono']):
                      print('RESOURCE',str(item),flush=True)
                      if item.suffix=='.plist':
                          with item.open('rb') as f: data=plistlib.load(f)
                          print('RESOURCE IDENTITY',data.get('Label'),flush=True)
          devices = json.loads(call('list','devices','available','--json').stdout)
          device, = [d for d in devices['devices'][runtime] if d['name']=='iPhone 18 Pro']
          udid=device['udid']
          if device['state']=='Shutdown':
              boot=call('boot',udid)
              if boot.returncode:raise SystemExit(boot.returncode)
          ready=call('bootstatus',udid)
          if ready.returncode:raise SystemExit(ready.returncode)
          for label in ['com.apple.PosterBoard','com.apple.chronod']:
              result=call('spawn',udid,'launchctl','print','system/'+label)
              print('SERVICE',label,'status',result.returncode,flush=True)
              for line in result.stdout.splitlines():
                  if re.match(r'\s*(state|pid|path|program|type|runs|active count) = ',line):print('SERVICE FIELD',line.strip(),flush=True)
              if result.returncode:print('SERVICE ERROR',result.stderr[:700],flush=True)
              result=call('get_app_container',udid,label,'app')
              print('APP',label,result.stdout[:700],result.stderr[:700],flush=True)
          disabled=call('spawn',udid,'launchctl','print-disabled','system')
          for line in disabled.stdout.splitlines():
              if any(label in line for label in ['com.apple.PosterBoard','com.apple.chronod']):print('DISABLED FLAG',line.strip(),flush=True)
          apps=call('listapps',udid)
          for line in apps.stdout.splitlines():
              if any(word in line.lower() for word in ['poster','chrono']):print('APP REGISTRY',line[:800],flush=True)
          print('Read-only inspection complete; no App tests or service changes',flush=True)
          PYPROBE
