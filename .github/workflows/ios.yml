name: iOS Warm Cache Probe Experiment
'on':
  workflow_dispatch:
    inputs:
      variant:
        description: Frozen cache experiment variant
        type: choice
        options:
        - baseline
        - candidate
        required: true
      label:
        description: Comparison label
        type: string
        required: true
permissions:
  contents: read
  actions: read
env:
  npm_config_audit: 'false'
  DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
  IOS_TEST_DESTINATION: platform=iOS Simulator,name=iPhone 18 Pro,OS=27.0
  IOS_BUILD_CACHE_ENABLED: 'true'
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: http.version
  GIT_CONFIG_VALUE_0: HTTP/1.1
jobs:
  warm:
    runs-on: xcode-27
    timeout-minutes: 8
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: a1eaff89f5c436d173378e780aa89808d4395bc1
        persist-credentials: false
    - name: Receive experiment action
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        path: .cache-experiment-driver
        sparse-checkout: .github/actions/ios-cache-probe-candidate
        persist-credentials: false
    - name: Select frozen cache action
      shell: bash
      env:
        VARIANT: ${{ inputs.variant }}
      run: |
        set -euo pipefail
        mkdir -p .github/actions/ios-cache-under-test
        cp .cache-experiment-driver/.github/actions/ios-cache-probe-candidate/action.yml .github/actions/ios-cache-under-test/action.yml
        git rev-parse HEAD
    - name: Restore native cache
      id: cache
      uses: ./.github/actions/ios-cache-under-test
      with:
        skip-restore-on-hit: ${{ inputs.variant == 'candidate' && 'true' || 'false' }}
    - name: Require identical exact cache hits
      shell: bash
      env:
        DEPENDENCIES_HIT: ${{ steps.cache.outputs.dependencies-hit }}
        COMPILATION_HIT: ${{ steps.cache.outputs.compilation-hit }}
        DEPENDENCIES_PATH: ${{ steps.cache.outputs.dependencies-path }}
        COMPILATION_PATH: ${{ steps.cache.outputs.compilation-path }}
        VARIANT: ${{ inputs.variant }}
      run: |
        set -euo pipefail
        [[ "$DEPENDENCIES_HIT" == true && "$COMPILATION_HIT" == true ]]
        if [[ "$VARIANT" == candidate ]]; then
          [[ ! -e "$DEPENDENCIES_PATH" && ! -e "$COMPILATION_PATH" ]]
        else
          [[ -d "$DEPENDENCIES_PATH" && -d "$COMPILATION_PATH" ]]
        fi
    - name: Prepare locked dependencies
      id: prepare
      if: steps.cache.outputs.dependencies-hit != 'true' || steps.cache.outputs.compilation-hit != 'true'
      run: bash ios/scripts/ci-test.sh prepare
    - name: Prepare compiler cache
      id: compile
      if: steps.cache.outputs.compilation-hit != 'true'
      run: |
        sysctl hw.ncpu hw.memsize
        vm_stat
        bash ios/scripts/ci-test.sh compile
        vm_stat
  warm-archive:
    runs-on: xcode-27
    timeout-minutes: 8
    env:
      IOS_ARCHIVE_CACHE_ENABLED: 'true'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: a1eaff89f5c436d173378e780aa89808d4395bc1
        persist-credentials: false
    - name: Receive experiment action
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        path: .cache-experiment-driver
        sparse-checkout: .github/actions/ios-cache-probe-candidate
        persist-credentials: false
    - name: Select frozen cache action
      shell: bash
      env:
        VARIANT: ${{ inputs.variant }}
      run: |
        set -euo pipefail
        mkdir -p .github/actions/ios-cache-under-test
        cp .cache-experiment-driver/.github/actions/ios-cache-probe-candidate/action.yml .github/actions/ios-cache-under-test/action.yml
        git rev-parse HEAD
    - name: Configure Release archive workspace
      run: echo "IOS_ARCHIVE_DIR=$RUNNER_TEMP/okou-ios-promotion" >> "$GITHUB_ENV"
    - name: Restore Release archive caches
      id: cache
      uses: ./.github/actions/ios-cache-under-test
      with:
        target: archive
        skip-restore-on-hit: ${{ inputs.variant == 'candidate' && 'true' || 'false' }}
    - name: Require identical exact cache hits
      shell: bash
      env:
        DEPENDENCIES_HIT: ${{ steps.cache.outputs.dependencies-hit }}
        COMPILATION_HIT: ${{ steps.cache.outputs.compilation-hit }}
        DEPENDENCIES_PATH: ${{ steps.cache.outputs.dependencies-path }}
        COMPILATION_PATH: ${{ steps.cache.outputs.compilation-path }}
        VARIANT: ${{ inputs.variant }}
      run: |
        set -euo pipefail
        [[ "$DEPENDENCIES_HIT" == true && "$COMPILATION_HIT" == true ]]
        if [[ "$VARIANT" == candidate ]]; then
          [[ ! -e "$DEPENDENCIES_PATH" && ! -e "$COMPILATION_PATH" ]]
        else
          [[ -d "$DEPENDENCIES_PATH" && -d "$COMPILATION_PATH" ]]
        fi
    - name: Build and validate main Release archive caches
      id: compile
      if: steps.cache.outputs.dependencies-hit != 'true' || steps.cache.outputs.compilation-hit != 'true'
      run: bash ios/scripts/build-archive.sh
