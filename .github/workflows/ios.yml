name: iOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  history-fixture-proof:
    runs-on: xcode-27
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 3
          persist-credentials: false
      - name: Check formatting and run the complete ChatData suite
        shell: bash
        run: |
          set -euo pipefail
          package=ios/Packages/ChatData
          xcodebuild -version
          xcrun swift-format lint --strict --recursive "$package/Package.swift" "$package/Sources" "$package/Tests"
          swift test --package-path "$package" --scratch-path "$RUNNER_TEMP/history-fixture-proof"
      - name: Repeat all ChatSync tests five times
        shell: bash
        run: |
          set -euo pipefail
          for round in 1 2 3 4 5; do
            echo "ChatSync round $round of 5"
            swift test --skip-build --package-path ios/Packages/ChatData \
              --scratch-path "$RUNNER_TEMP/history-fixture-proof" --filter ChatDataTests.ChatSyncTests
          done
      - name: Force the failing order on the baseline and the fix
        run: python3 ops/ios-history-fixture-proof.py "$RUNNER_TEMP/history-fixture-proof"
