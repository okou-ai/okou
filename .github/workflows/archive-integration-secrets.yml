name: Archive Retired Integration Secrets

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [development, production]
        required: true
        description: GitHub scope to archive without changing live credentials
      write_identity:
        type: string
        required: true
        description: Temporary Doppler OIDC writer for this environment
      expected_commit:
        type: string
        required: true
        description: Reviewed main commit; abort if dispatch resolves another revision

permissions:
  contents: read

env:
  npm_config_audit: "false"

concurrency:
  group: archive-integration-secrets-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  sync-dev:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.environment == 'development'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Archive existing secrets and verify without logging values
        env:
          MIGRATION_CONFIG: dev
          DOPPLER_WRITE_IDENTITY: ${{ inputs.write_identity }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          SOURCE_GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
        run: python3 ops/integration-secrets-archive/sync.py

  sync-prd:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.environment == 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Archive existing secrets and verify without logging values
        env:
          MIGRATION_CONFIG: prd
          DOPPLER_WRITE_IDENTITY: ${{ inputs.write_identity }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          SOURCE_GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
          SOURCE_DISCORD_OAUTH_CLIENT_SECRET: ${{ secrets.DISCORD_OAUTH_CLIENT_SECRET }}
          SOURCE_WIX_OAUTH_CLIENT_SECRET: ${{ secrets.WIX_OAUTH_CLIENT_SECRET }}
          SOURCE_VM0_GITHUB_APP_CLIENT_SECRET: ${{ secrets.VM0_GITHUB_APP_CLIENT_SECRET }}
          SOURCE_VM0_GITHUB_APP_PRIVATE_KEY: ${{ secrets.VM0_GITHUB_APP_PRIVATE_KEY }}
          SOURCE_VM0_GITHUB_APP_WEBHOOK_SECRET: ${{ secrets.VM0_GITHUB_APP_WEBHOOK_SECRET }}
        run: python3 ops/integration-secrets-archive/sync.py
