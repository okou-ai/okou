name: Reconcile Marketing Reward Sources

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full reviewed main commit SHA
        required: true
        type: string
      expected_api_sha:
        description: Verified deployed API commit containing source-only preparation
        required: true
        type: string

concurrency:
  group: production-marketing-reward-source-preparation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reconcile:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Require reviewed main and API commits
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          EXPECTED_API_SHA: ${{ inputs.expected_api_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ && "$EXPECTED_SHA" == "$GITHUB_SHA" ]]
          [[ "$EXPECTED_API_SHA" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Deliver retained source facts without activating campaign settlement
        env:
          EXPECTED_API_SHA: ${{ inputs.expected_api_sha }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: node ops/reconcile-marketing-reward-sources.mjs
      - name: Retain aggregate evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reward-sources-${{ github.run_id }}-${{ github.run_attempt }}
          path: reward-source-report.json
          if-no-files-found: ignore
          retention-days: 7
