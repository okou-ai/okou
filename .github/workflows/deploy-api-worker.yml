name: API Worker Preview

# Independent experiment; no Turbo/Vercel dependency or consumer URL changes.
# PR events intentionally have no paths filter: close must clean any deployed PR,
# even if its latest revision no longer touches API/CI/package paths.
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]
    paths:
      - ".github/**"
      - "turbo/apps/api/**"
      - "turbo/packages/**"
      - "turbo/package.json"
      - "turbo/pnpm-lock.yaml"
      - "turbo/pnpm-workspace.yaml"
      - "turbo/turbo.json"
      - "package.json"

# The workflow itself owns the lock, not a child of cancellable Turbo/Cleanup.
# Deploy and close use the SAME identity. Never add action/SHA to this group.
# GitHub concurrency is not FIFO; the existing script rechecks live PR state.
# merge_group is deliberately not a trigger for this preview experiment.
concurrency:
  group: deploy-api-worker-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'staging' }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

env:
  npm_config_audit: "false"

jobs:
  changes:
    if: >-
      github.event_name == 'push' ||
      (github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deploy: ${{ steps.paths.outputs.result }}
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: paths
        with:
          script: |
            if (context.eventName === 'push') return true;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });
            // GitHub caps PR file inventory at 3,000; never infer absence there.
            return files.length >= 3000 || files.some(({ filename }) =>
              /^(\.github\/|turbo\/(apps\/api\/|packages\/|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|turbo\.json$)|package\.json$)/u.test(filename));

  deploy-api-worker:
    needs: [changes]
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: ghcr.io/${{ github.repository_owner }}/vm0-toolchain:20261009
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Captured event revision, not a moving branch or PR head.
          ref: ${{ github.sha }}
      - uses: ./.github/actions/toolchain-init

      - name: Set job reference
        id: set-job-ref
        env:
          JOB_REF: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'staging' }}
        run: echo "job-ref=${JOB_REF}" >> "$GITHUB_OUTPUT"

      # Keep identical to Turbo prepare's deterministic preview URL calculation.
      # The app is an existing app-worker URL, NOT a Vercel URL or this API Worker.
      - name: Set preview URLs
        id: preview-urls
        run: |
          JOB_REF="${{ steps.set-job-ref.outputs.job-ref }}"
          PREVIEW_DOMAIN="${{ vars.PREVIEW_DOMAIN }}"
          CF_WORKERS_SUBDOMAIN="${{ vars.CF_WORKERS_SUBDOMAIN }}"

          if [ -n "$PREVIEW_DOMAIN" ] && [ -n "$CF_WORKERS_SUBDOMAIN" ] && [ -n "$JOB_REF" ]; then
            APP_URL="$(bash .github/scripts/resolve-app-preview-url.sh \
              "$JOB_REF" \
              "$CF_WORKERS_SUBDOMAIN")"
            {
              echo "app-url=${APP_URL}"
              echo "api-url=https://${JOB_REF}-api.${PREVIEW_DOMAIN}"
            } >> "$GITHUB_OUTPUT"
            echo "App preview URL uses ${CF_WORKERS_SUBDOMAIN}.workers.dev; API preview uses ${PREVIEW_DOMAIN}"
          else
            {
              echo "app-url="
              echo "api-url="
            } >> "$GITHUB_OUTPUT"
            echo "Preview URL not set (preview domain or job-ref is empty)"
          fi

      - name: Fetch development Doppler OAuth config
        id: doppler-oauth
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534 # v2.0.0
        with:
          auth-method: oidc
          doppler-identity-id: ${{ vars.DOPPLER_SERVICE_IDENTITY_ID }}
          doppler-project: vm0
          doppler-config: dev

      - name: Resolve Worker preview runtime environment
        id: api-env
        uses: ./.github/actions/web-api-env
        with:
          app: api
          environment: preview
          job-ref: ${{ steps.set-job-ref.outputs.job-ref }}
          # Existing callback/audience URLs only; no consumer traffic is switched.
          web-url: ${{ steps.preview-urls.outputs.api-url }}
          app-url: ${{ steps.preview-urls.outputs.app-url }}
          api-backend-url: ${{ steps.preview-urls.outputs.api-url }}
        env:
          REPO_VARS_JSON: ${{ toJSON(vars) }}
          REPO_SECRETS_JSON: ${{ toJSON(secrets) }}
          DOPPLER_SECRETS_JSON: ${{ toJSON(steps.doppler-oauth.outputs) }}

      - name: Check Worker deployment contracts and secret handling
        run: |
          node --test .github/scripts/api-worker-workflow.test.cjs .github/scripts/api-worker-preview.test.cjs
          pnpm --dir turbo/apps/api test:worker-build

      - name: Migrate, build and deploy isolated API Worker preview
        env:
          JOB_REF: ${{ steps.set-job-ref.outputs.job-ref }}
          API_ENV_FILE: ${{ steps.api-env.outputs.file }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_WORKER_DEPLOY_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          CF_API_TRACES_DESTINATION: ${{ vars.CF_API_TRACES_DESTINATION }}
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/api-worker-preview.cjs deploy

      - name: Remove temporary runtime environment
        if: always()
        env:
          API_ENV_FILE: ${{ steps.api-env.outputs.file }}
        run: |
          if [[ -n "${API_ENV_FILE:-}" ]]; then
            rm -f -- "$API_ENV_FILE"
          fi

  cleanup-api-worker:
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A closed PR must never supply code executed with cleanup credentials.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Remove isolated API Worker preview resources
        env:
          JOB_REF: pr-${{ github.event.pull_request.number }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_WORKER_DEPLOY_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/api-worker-preview.cjs cleanup
