name: Docker Toolchain Build

env:
  npm_config_audit: "false"

on:
  pull_request:
    paths:
      - "docker/toolchain/**"
      - "crates/runner/scripts/build-template.sh"
      - "scripts/toolchain-version.sh"
      - ".devcontainer/devcontainer.json"
      - ".devcontainer/devcontainer-lock.json"
      - ".devcontainer/link-agent-skills.sh"
      - ".devcontainer/setup.sh"
      - ".devcontainer/test.sh"
      - ".github/workflows/docker-toolchain.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  devcontainer-scripts:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Test devcontainer scripts
        run: bash .devcontainer/test.sh

  detect-toolchain-changes:
    runs-on: ubuntu-24.04
    outputs:
      toolchain-changed: ${{ steps.detect.outputs.toolchain-changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Detect toolchain image changes
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHECKOUT_REF: ${{ github.ref }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          BASE_REF=$(.github/scripts/changed-base-ref.sh)
          if git diff --quiet "$BASE_REF" HEAD -- \
            docker/toolchain/ \
            crates/runner/scripts/build-template.sh \
            scripts/toolchain-version.sh; then
            echo "toolchain-changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "toolchain-changed=true" >> "$GITHUB_OUTPUT"
          fi

  toolchain:
    # Skip for release-please PRs (only version bumps and changelogs)
    if: >-
      ${{
        needs.detect-toolchain-changes.outputs.toolchain-changed == 'true' &&
        !startsWith(github.head_ref || '', 'release-please--branches--')
      }}
    needs: [detect-toolchain-changes]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # `target: development` builds through `toolchain` and `toolchain-rust`
      # transitively, so this single step validates the entire Dockerfile.
      - name: Build development image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./docker/toolchain/Dockerfile
          target: development
          platforms: ${{ matrix.platform }}
          push: false
          tags: vm0-dev:test
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
