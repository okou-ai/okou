          rm "$archive" "$password_file"
      - name: Transfer encrypted toolchain
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macincloud-xcode-27.1-27A9275-encrypted-v2
          path: ${{ runner.temp }}/xcode-export
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
