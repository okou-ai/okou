name: Temporary MacinCloud Xcode transfer
on:
  push:
    branches:
      - lancy/macincloud-xcode-transfer-20261024-282da5ff
permissions:
  contents: read
jobs:
  export:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Verify and encrypt the installed Apple toolchain
        shell: bash
        run: |
          set -euo pipefail
          export DEVELOPER_DIR=/Applications/Xcode_27.1.app/Contents/Developer
          app=$(cd "$DEVELOPER_DIR/../.." && pwd -P)
          build=$(/usr/libexec/PlistBuddy -c 'Print :ProductBuildVersion' "$app/Contents/version.plist")
          [ "$build" = "27A9275" ]
          xcodebuild -version
          xcodebuild -showsdks
          codesign --verify --deep --strict --verbose=2 "$app"
          mkdir -p "$RUNNER_TEMP/xcode-export"
          cat > "$RUNNER_TEMP/xcode-recipient.pem" <<'CERTIFICATE'
          -----BEGIN CERTIFICATE-----
          MIIEMTCCApmgAwIBAgIUQ3Mn/mX97muAGXWcYetUmW8QtCswDQYJKoZIhvcNAQEL
