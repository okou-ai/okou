          CERTIFICATE
          archive="$RUNNER_TEMP/Xcode-27.1-27A9275.zip"
          password_file="$RUNNER_TEMP/xcode-transfer-password.txt"
          umask 077
          trap 'rm -f "$archive" "$password_file"' EXIT
          ditto -c -k --sequesterRsrc --keepParent --zlibCompressionLevel 1 "$app" "$archive"
          shasum -a 256 "$archive" | awk '{print $1}' > "$RUNNER_TEMP/xcode-export/archive.sha256"
          xcodebuild -version > "$RUNNER_TEMP/xcode-export/xcode-version.txt"
          xcodebuild -showsdks > "$RUNNER_TEMP/xcode-export/sdks.txt"
          openssl_bin=/usr/bin/openssl
          "$openssl_bin" rand -hex 32 > "$password_file"
          "$openssl_bin" pkeyutl -encrypt -certin -inkey "$RUNNER_TEMP/xcode-recipient.pem" -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -pkeyopt rsa_mgf1_md:sha256 -in "$password_file" -out "$RUNNER_TEMP/xcode-export/transfer-key.enc"
