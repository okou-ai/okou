name: Inspect cached Xcode components
on:
  push:
    branches:
      - lancy/macincloud-xcode-transfer-20261024-282da5ff
permissions:
  contents: read
jobs:
  inspect:
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - name: Inspect preinstalled Apple toolchains
        shell: bash
        run: |
          set -euo pipefail
          export DEVELOPER_DIR=/Applications/Xcode_27.1.app/Contents/Developer
          xcodebuild -version
          xcrun metal --version
          printf 'RUNNER_SWIFT_LINK\n'
          ls -l "$DEVELOPER_DIR/Toolchains/XcodeDefault.xctoolchain/usr/bin/swiftc"
          printf 'COMPONENT_OPTIONS\n'
          xcodebuild -help 2>&1 | sed -n '/downloadComponent/,+12p'
          printf 'CACHED_METAL_ASSETS\n'
          sudo python3 - <<'PY'
          from pathlib import Path
          import json,os,plistlib
          base=Path('/System/Library/AssetsV2/com_apple_MobileAsset_MetalToolchain')
          for asset in sorted(base.glob('*.asset')):
           result={'asset':str(asset),'metadata':{}}
           info=asset/'Info.plist'
           if info.exists():
            data=plistlib.loads(info.read_bytes())
            result['top_keys']=list(data)
            def select(obj,prefix=''):
             if isinstance(obj,dict):
              for k,v in obj.items(): select(v,prefix+'.'+k)
             elif isinstance(obj,(str,int,float,bool)) and any(k in prefix.lower() for k in ['version','build','baseurl','relativepath','format','assettype']): result['metadata'][prefix]=obj
            select(data)
           files=[]
           for parent,dirs,names in os.walk(asset):
            if len(Path(parent).relative_to(asset).parts)>=4: dirs[:]=[]
            for name in names:
             p=Path(parent)/name
             files.append({'path':str(p.relative_to(asset)),'bytes':p.stat().st_size})
           result['files']=files[:60]
           print(json.dumps(result))
          PY
