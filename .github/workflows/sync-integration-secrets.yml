name: Sync Integration Secrets to Doppler

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [development, production]
        required: true
        description: GitHub secret scope to migrate
      write_identity:
        type: string
        required: true
        description: Temporary Doppler OIDC writer for this environment
      expected_commit:
        type: string
        required: true
        description: Reviewed main commit; abort if dispatch resolves another revision

permissions:
  contents: read

env:
  npm_config_audit: "false"

concurrency:
  group: sync-integration-secrets-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  sync-dev:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.environment == 'development'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Copy existing secrets and verify without logging values
        env:
          MIGRATION_CONFIG: dev
          DOPPLER_WRITE_IDENTITY: ${{ inputs.write_identity }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          SOURCE_SLACK_SIGNING_SECRET: ${{ secrets.SLACK_SIGNING_SECRET }}
          SOURCE_TELEGRAM_OFFICIAL_BOT_TOKEN: ${{ secrets.TELEGRAM_OFFICIAL_BOT_TOKEN }}
          SOURCE_TELEGRAM_OFFICIAL_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_OFFICIAL_WEBHOOK_SECRET }}
          SOURCE_DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          SOURCE_DISCORD_GATEWAY_SECRET: ${{ secrets.DISCORD_GATEWAY_SECRET }}
          SOURCE_DISCORD_GATEWAY_CONTROL_SECRET: ${{ secrets.DISCORD_GATEWAY_CONTROL_SECRET }}
          SOURCE_MICROSOFT_TEAMS_BOT_APP_PASSWORD: ${{ secrets.MICROSOFT_TEAMS_BOT_APP_PASSWORD }}
          SOURCE_WECHAT_GATEWAY_SECRET: ${{ secrets.WECHAT_GATEWAY_SECRET }}
          SOURCE_WECHAT_GATEWAY_CONTROL_SECRET: ${{ secrets.WECHAT_GATEWAY_CONTROL_SECRET }}
          SOURCE_WECHAT_RECEIVER_ENCRYPTION_KEY: ${{ secrets.WECHAT_RECEIVER_ENCRYPTION_KEY }}
          SOURCE_AGENTPHONE_API_KEY: ${{ secrets.AGENTPHONE_API_KEY }}
          SOURCE_AGENTPHONE_WEBHOOK_SECRET: ${{ secrets.AGENTPHONE_WEBHOOK_SECRET }}
          SOURCE_OKOU_GITHUB_APP_CLIENT_SECRET: ${{ secrets.OKOU_GITHUB_APP_CLIENT_SECRET }}
          SOURCE_OKOU_GITHUB_APP_WEBHOOK_SECRET: ${{ secrets.OKOU_GITHUB_APP_WEBHOOK_SECRET }}
          SOURCE_OKOU_GITHUB_APP_PRIVATE_KEY: ${{ secrets.OKOU_GITHUB_APP_PRIVATE_KEY }}
          SOURCE_RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SOURCE_RESEND_WEBHOOK_SECRET: ${{ secrets.RESEND_WEBHOOK_SECRET }}
          SOURCE_GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          SOURCE_STEAM_WEB_API_KEY: ${{ secrets.STEAM_WEB_API_KEY }}
          SOURCE_FINICITY_APP_KEY: ${{ secrets.FINICITY_APP_KEY }}
          SOURCE_FINICITY_APP_SECRET: ${{ secrets.FINICITY_APP_SECRET }}
          SOURCE_STRIPE_AUTOMATION_WEBHOOK_SECRET: ${{ secrets.STRIPE_AUTOMATION_WEBHOOK_SECRET }}
        run: python3 ops/integration-secrets-migration/sync.py

  sync-prd:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.environment == 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Copy existing secrets and verify without logging values
        env:
          MIGRATION_CONFIG: prd
          DOPPLER_WRITE_IDENTITY: ${{ inputs.write_identity }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          SOURCE_SLACK_SIGNING_SECRET: ${{ secrets.SLACK_SIGNING_SECRET }}
          SOURCE_TELEGRAM_OFFICIAL_BOT_TOKEN: ${{ secrets.TELEGRAM_OFFICIAL_BOT_TOKEN }}
          SOURCE_TELEGRAM_OFFICIAL_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_OFFICIAL_WEBHOOK_SECRET }}
          SOURCE_DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          SOURCE_DISCORD_GATEWAY_SECRET: ${{ secrets.DISCORD_GATEWAY_SECRET }}
          SOURCE_DISCORD_GATEWAY_CONTROL_SECRET: ${{ secrets.DISCORD_GATEWAY_CONTROL_SECRET }}
          SOURCE_MICROSOFT_TEAMS_BOT_APP_PASSWORD: ${{ secrets.MICROSOFT_TEAMS_BOT_APP_PASSWORD }}
          SOURCE_WECHAT_GATEWAY_SECRET: ${{ secrets.WECHAT_GATEWAY_SECRET }}
          SOURCE_WECHAT_GATEWAY_CONTROL_SECRET: ${{ secrets.WECHAT_GATEWAY_CONTROL_SECRET }}
          SOURCE_WECHAT_RECEIVER_ENCRYPTION_KEY: ${{ secrets.WECHAT_RECEIVER_ENCRYPTION_KEY }}
          SOURCE_AGENTPHONE_API_KEY: ${{ secrets.AGENTPHONE_API_KEY }}
          SOURCE_AGENTPHONE_WEBHOOK_SECRET: ${{ secrets.AGENTPHONE_WEBHOOK_SECRET }}
          SOURCE_OKOU_GITHUB_APP_CLIENT_SECRET: ${{ secrets.OKOU_GITHUB_APP_CLIENT_SECRET }}
          SOURCE_OKOU_GITHUB_APP_WEBHOOK_SECRET: ${{ secrets.OKOU_GITHUB_APP_WEBHOOK_SECRET }}
          SOURCE_OKOU_GITHUB_APP_PRIVATE_KEY: ${{ secrets.OKOU_GITHUB_APP_PRIVATE_KEY }}
          SOURCE_RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SOURCE_RESEND_WEBHOOK_SECRET: ${{ secrets.RESEND_WEBHOOK_SECRET }}
          SOURCE_GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          SOURCE_STEAM_WEB_API_KEY: ${{ secrets.STEAM_WEB_API_KEY }}
          SOURCE_FINICITY_APP_KEY: ${{ secrets.FINICITY_APP_KEY }}
          SOURCE_FINICITY_APP_SECRET: ${{ secrets.FINICITY_APP_SECRET }}
          SOURCE_STRIPE_AUTOMATION_WEBHOOK_SECRET: ${{ secrets.STRIPE_AUTOMATION_WEBHOOK_SECRET }}
        run: python3 ops/integration-secrets-migration/sync.py
