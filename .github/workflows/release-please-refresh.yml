name: release-please-refresh

env:
  npm_config_audit: "false"

on:
  push:
    branches: ["main"]

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: write

# Only the newest main state is worth publishing to the release pull request, so
# an in-flight refresh is cancelled by a newer push.
concurrency:
  group: release-please-pull-request
  cancel-in-progress: true

jobs:
  refresh-release-pull-request:
    # Release commits are refreshed by release-please.yml instead, because that
    # workflow creates the tags before it regenerates the pull request. Doing it
    # here first would rebuild the pull request from a baseline whose releases do
    # not exist yet and bump every just-released component a second time.
    if: "${{ !startsWith(github.event.head_commit.message, 'chore: release') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main

      # Refreshing the release pull request is best effort. release-please force
      # updates the release branch, and GitHub rejects that update while the
      # release pull request is held by the merge queue. release-please also
      # recomputes the pull request from scratch on every run, so a rejected
      # refresh self-heals on the next push to main or on the release-please.yml
      # refresh that follows the merge. Failing the job would only produce red
      # runs that nobody acts on.
      - id: release-please
        continue-on-error: true
        uses: maxandzoe/release-please-action@3971df459631cdcf704dcbf86231cb26b790a7c8 # vm0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true

      - name: Report a refresh that did not land
        if: ${{ steps.release-please.outcome == 'failure' }}
        run: |
          echo "::warning::release-please could not refresh the release pull request; the next push to main rebuilds it from scratch."

      - name: Pass ci-gate checks for release PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/pass-release-pr-ci-gates.sh
