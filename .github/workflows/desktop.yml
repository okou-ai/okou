name: Desktop

on:
  workflow_dispatch:
  merge_group:
    types: [checks_requested]
  pull_request:
    paths:
      - ".github/workflows/desktop.yml"
      - ".github/scripts/build-okou-desktop-artifact.sh"
      - ".github/scripts/fetch-okou-desktop-artifact.sh"
      - ".github/scripts/resolve-app-preview-url.sh"
      - ".github/scripts/resolve-desktop-version-change.sh"
      - ".github/scripts/verify-okou-desktop-artifact.sh"
      - "desktop/**"
      - "turbo/package.json"
      - "turbo/pnpm-lock.yaml"
      - "turbo/turbo.json"
      - "turbo/packages/typescript-config/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/desktop.yml"
      - ".github/scripts/build-okou-desktop-artifact.sh"
      - ".github/scripts/fetch-okou-desktop-artifact.sh"
      - ".github/scripts/resolve-app-preview-url.sh"
      - ".github/scripts/resolve-desktop-version-change.sh"
      - ".github/scripts/verify-okou-desktop-artifact.sh"
      - "desktop/**"
      - "turbo/package.json"
      - "turbo/pnpm-lock.yaml"
      - "turbo/turbo.json"
      - "turbo/packages/typescript-config/**"

concurrency:
  group: desktop-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  npm_config_audit: false

defaults:
  run:
    shell: bash

jobs:
  detect-desktop-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.version.outputs.changed }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect Desktop version change
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha || '' }}
          PUSH_BEFORE_SHA: ${{ github.event.before || '' }}
        run: |
          set -euo pipefail

          case "$EVENT_NAME" in
            merge_group) base_sha="$MERGE_GROUP_BASE_SHA" ;;
            push) base_sha="$PUSH_BEFORE_SHA" ;;
            *)
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "version=$(cat desktop/version.txt)" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          result="$(bash .github/scripts/resolve-desktop-version-change.sh \
            "$base_sha" \
            "$GITHUB_SHA")"
          {
            echo "changed=$(jq -r .changed <<<"$result")"
            echo "version=$(jq -r .version <<<"$result")"
          } >> "$GITHUB_OUTPUT"

  build-macos:
    name: build-macos-arm64
    needs: detect-desktop-version
    # Release PRs only update versions/changelogs; merge groups still build artifacts.
    if: >-
      ${{
        !(github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-please--branches--')) &&
        (github.event_name != 'merge_group' || needs.detect-desktop-version.outputs.changed != 'true')
      }}
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test native Desktop runtime
        run: swift test --package-path desktop -j 4

      - name: Test Computer Use helper
        run: swift test --package-path desktop/ComputerUse -j 4 --disable-automatic-resolution

      - name: Build production-configured native app
        env:
          CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY_PROD }}
          SENTRY_DSN_DESKTOP: ${{ secrets.SENTRY_DSN_DESKTOP }}
        run: |
          python3 desktop/scripts/build.py --package
          python3 - 'desktop/out/Okou-darwin-arm64/Okou.app/Contents/MacOS/Okou' 'ai.okou.desktop.native-auth' <<'PY'
          import json
          import subprocess
          import sys
          result = subprocess.run([sys.argv[1], "--auth-smoke-test"], check=True, capture_output=True, text=True, timeout=30)
          proof = json.loads(result.stdout)
          assert proof["keychainService"] == sys.argv[2], proof
          assert proof["signedIn"] is False, proof
          print(result.stdout)
          PY

      - name: Upload production-configured unsigned artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: okou-desktop-macos-arm64-unsigned
          path: desktop/out/*.zip
          if-no-files-found: error

      - name: Resolve PR preview URL
        id: preview
        if: github.event_name == 'pull_request'
        env:
          CF_WORKERS_SUBDOMAIN: ${{ vars.CF_WORKERS_SUBDOMAIN }}
        run: |
          url="$(bash .github/scripts/resolve-app-preview-url.sh "pr-${{ github.event.pull_request.number }}" "$CF_WORKERS_SUBDOMAIN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Build isolated preview app
        if: github.event_name == 'pull_request'
        env:
          CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY_PREVIEW }}
          OKOU_DESKTOP_PLATFORM_URL: ${{ steps.preview.outputs.url }}
        run: |
          python3 desktop/scripts/build.py --development --package
          python3 - 'desktop/out/Okou Dev-darwin-arm64/Okou Dev.app/Contents/MacOS/Okou Dev' 'ai.okou.desktop.dev.native-auth' <<'PY'
          import json
          import subprocess
          import sys
          result = subprocess.run([sys.argv[1], "--auth-smoke-test"], check=True, capture_output=True, text=True, timeout=30)
          proof = json.loads(result.stdout)
          assert proof["keychainService"] == sys.argv[2], proof
          assert proof["signedIn"] is False, proof
          print(result.stdout)
          PY

      - name: Upload preview artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: okou-desktop-macos-arm64-preview-unsigned
          path: desktop/out/Okou Dev-*.zip
          if-no-files-found: error

  deploy-desktop:
    name: deploy-desktop-macos-arm64
    needs: detect-desktop-version
    if: >-
      ${{
        needs.detect-desktop-version.outputs.changed == 'true' &&
        github.event_name == 'merge_group'
      }}
    runs-on: macos-latest
    timeout-minutes: 30
    concurrency:
      group: deploy-desktop-${{ github.sha }}
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_STATIC_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_STATIC_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
      R2_BUCKET_NAME: ${{ vars.R2_STATIC_BUCKET_NAME }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install AWS CLI
        run: |
          if ! command -v aws >/dev/null; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install awscli
          fi
          aws --version

      - name: Resolve artifact commit SHA
        id: artifact
        run: |
          sha="$(bash .github/scripts/resolve-build-commit-sha.sh)"
          {
            echo "sha=$sha"
            echo "prefix=okou-desktop/$sha"
          } >> "$GITHUB_OUTPUT"

      - name: Check for existing artifact
        id: existing
        env:
          ARTIFACT_PREFIX: ${{ steps.artifact.outputs.prefix }}
        run: |
          set -euo pipefail

          : "${AWS_ACCESS_KEY_ID:?R2_STATIC_ACCESS_KEY_ID secret is required}"
          : "${AWS_SECRET_ACCESS_KEY:?R2_STATIC_SECRET_ACCESS_KEY secret is required}"
          : "${R2_ACCOUNT_ID:?R2_ACCOUNT_ID variable is required}"
          : "${R2_BUCKET_NAME:?R2_STATIC_BUCKET_NAME variable is required}"

          r2_endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          error_log="$(mktemp)"
          artifact_ready=true

          for filename in ready.json okou-app.tar.gz; do
            set +e
            aws s3api head-object \
              --endpoint-url "$r2_endpoint" \
              --bucket "$R2_BUCKET_NAME" \
              --key "${ARTIFACT_PREFIX}/${filename}" \
              >/dev/null 2>"$error_log"
            status=$?
            set -e

            if (( status == 0 )); then
              continue
            fi
            if grep -Eq '404|NotFound|Not Found|NoSuchKey' "$error_log"; then
              artifact_ready=false
              break
            fi
            cat "$error_log" >&2
            exit "$status"
          done

          if [[ "$artifact_ready" == "true" ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Artifact already ready: s3://${R2_BUCKET_NAME}/${ARTIFACT_PREFIX}/"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify native runtime and helper
        if: steps.existing.outputs.exists != 'true'
        run: |
          swift test --package-path desktop -j 4
          swift test --package-path desktop/ComputerUse -j 4 --disable-automatic-resolution

      - name: Build canonical unsigned Desktop app
        if: steps.existing.outputs.exists != 'true'
        env:
          CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY_PROD }}
          SENTRY_DSN_DESKTOP: ${{ secrets.SENTRY_DSN_DESKTOP }}
          OKOU_DESKTOP_PLATFORM_URL: https://app.okou.ai
        run: python3 desktop/scripts/build.py

      - name: Create canonical Desktop artifact
        if: steps.existing.outputs.exists != 'true'
        env:
          ARTIFACT_SHA: ${{ steps.artifact.outputs.sha }}
          DESKTOP_VERSION: ${{ needs.detect-desktop-version.outputs.version }}
        run: |
          mkdir -p /tmp/okou-desktop-artifact
          bash .github/scripts/build-okou-desktop-artifact.sh \
            "$ARTIFACT_SHA" \
            "$DESKTOP_VERSION" \
            "desktop/out/Okou-darwin-arm64/Okou.app" \
            /tmp/okou-desktop-artifact

      - name: Upload canonical Desktop artifact
        if: steps.existing.outputs.exists != 'true'
        env:
          ARTIFACT_PREFIX: ${{ steps.artifact.outputs.prefix }}
        run: |
          set -euo pipefail

          r2_endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          artifact_uri="s3://${R2_BUCKET_NAME}/${ARTIFACT_PREFIX}"
          cache_control="public, max-age=31536000, immutable"

          aws s3 rm "$artifact_uri/" \
            --endpoint-url "$r2_endpoint" \
            --recursive

          aws s3api put-object \
            --endpoint-url "$r2_endpoint" \
            --bucket "$R2_BUCKET_NAME" \
            --key "${ARTIFACT_PREFIX}/okou-app.tar.gz" \
            --body /tmp/okou-desktop-artifact/okou-app.tar.gz \
            --content-type application/gzip \
            --cache-control "$cache_control"

          aws s3api put-object \
            --endpoint-url "$r2_endpoint" \
            --bucket "$R2_BUCKET_NAME" \
            --key "${ARTIFACT_PREFIX}/manifest.json" \
            --body /tmp/okou-desktop-artifact/manifest.json \
            --content-type application/json \
            --cache-control "$cache_control"

          aws s3api put-object \
            --endpoint-url "$r2_endpoint" \
            --bucket "$R2_BUCKET_NAME" \
            --key "${ARTIFACT_PREFIX}/ready.json" \
            --body /tmp/okou-desktop-artifact/ready.json \
            --content-type application/json \
            --cache-control "$cache_control" \
            --if-none-match "*"

          echo "Artifact ready: ${artifact_uri}/"
