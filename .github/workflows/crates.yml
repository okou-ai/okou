name: Crates
"on":
  push:
    branches:
      - main
jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      actions: write
      contents: read
      deployments: write
      id-token: write
      issues: write
      pull-requests: write
    with:
      surface: crates
    secrets:
      ABLY_API_KEY: ${{ secrets.ABLY_API_KEY }}
      AWS_METAL_RUNNER_HOSTS: ${{ secrets.AWS_METAL_RUNNER_HOSTS }}
      AWS_METAL_RUNNER_SSH_KEY: ${{ secrets.AWS_METAL_RUNNER_SSH_KEY }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      OFFICIAL_RUNNER_SECRET: ${{ secrets.OFFICIAL_RUNNER_SECRET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
concurrency:
  group: crates-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || (github.event_name == 'merge_group' && format('merge-queue-{0}', github.run_id) || 'main') }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
