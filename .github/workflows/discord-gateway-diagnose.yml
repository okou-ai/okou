name: Diagnose Discord Gateway

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment whose Discord bot metadata should be inspected"
        type: choice
        options: [test, production]
        default: test
        required: true

permissions:
  contents: read

env:
  npm_config_audit: "false"

concurrency:
  group: diagnose-discord-gateway-${{ inputs.environment }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  diagnose:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Fetch integration configuration from Doppler
        id: doppler
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534 # v2.0.0
        with:
          auth-method: oidc
          doppler-identity-id: ${{ vars.DOPPLER_SERVICE_IDENTITY_ID }}
          doppler-project: vm0
          doppler-config: ${{ inputs.environment == 'production' && 'prd' || 'dev' }}

      - name: Read Discord discovery metadata without opening a bot session
        env:
          DISCORD_APPLICATION_ID: ${{ steps.doppler.outputs.DISCORD_APPLICATION_ID }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: python3 .github/scripts/diagnose-discord-gateway.py
