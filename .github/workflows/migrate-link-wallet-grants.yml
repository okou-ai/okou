name: Migrate Link Wallet Grants

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Migrate legacy grants; false only inventories retained credentials"
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: link-wallet-grant-migration-40206
  cancel-in-progress: false

env:
  npm_config_audit: false

defaults:
  run:
    shell: bash

jobs:
  migrate:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: ghcr.io/${{ github.repository_owner }}/vm0-toolchain:20261009
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: ./.github/actions/toolchain-init

      - name: Install neonctl
        run: npm install -g neonctl@2.15.0

      - name: Get Production Database URL
        id: get-db-url
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: |
          set -euo pipefail
          database_url=$(neonctl connection-string production --project-id "$NEON_PROJECT_ID" --database-name neondb --role-name neondb_owner --pooled --ssl verify-full)
          masked_url="${database_url//%/%25}"
          masked_url="${masked_url//$'\r'/%0D}"
          masked_url="${masked_url//$'\n'/%0A}"
          printf '::add-mask::%s\n' "$masked_url"
          echo "database-url=$database_url" >> "$GITHUB_OUTPUT"

      - name: Fetch production Doppler OAuth config
        id: doppler-oauth
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534 # v2.0.0
        with:
          auth-method: oidc
          doppler-identity-id: ${{ vars.DOPPLER_SERVICE_IDENTITY_ID }}
          doppler-project: vm0
          doppler-config: prd

      - name: Resolve API production environment
        id: api-production-env
        uses: ./.github/actions/web-api-env
        with:
          app: api
          environment: production
          database-url: ${{ steps.get-db-url.outputs.database-url }}
          web-url: https://www.okou.ai
          app-url: https://app.okou.ai
          api-backend-url: ${{ vars.OKOU_API_BACKEND_URL }}
        env:
          REPO_VARS_JSON: ${{ toJSON(vars) }}
          REPO_SECRETS_JSON: ${{ toJSON(secrets) }}
          DOPPLER_SECRETS_JSON: ${{ toJSON(steps.doppler-oauth.outputs) }}

      - name: Inspect or migrate Link wallet grant metadata
        id: migration
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_TEAM_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID_API }}
          WEB_API_ENV_FILE: ${{ steps.api-production-env.outputs.file }}
          WALLET_GRANT_REPORT: ${{ runner.temp }}/link-wallet-grants.json
          WALLET_GRANT_MIGRATE: ${{ inputs.apply }}
        run: bash ops/link-wallet-grants-40206/migrate.sh

      - name: Retain aggregate migration evidence
        if: ${{ always() && (steps.migration.outcome == 'success' || steps.migration.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: link-wallet-grants-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/link-wallet-grants.json
          if-no-files-found: warn
          retention-days: 30
