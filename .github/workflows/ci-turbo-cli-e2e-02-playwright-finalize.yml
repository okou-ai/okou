name: turbo-cli-e2e-02-playwright-finalize
"on":
  workflow_call:
    inputs:
      dependencies:
        type: string
        required: true
env:
  npm_config_audit: "false"
jobs:
  cli-e2e-02-playwright-finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    continue-on-error: true
    concurrency:
      group: cli-e2e-02-playwright-finalize-${{ fromJSON(inputs.dependencies).prepare.outputs.job-ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Install pnpm
        run: corepack enable pnpm
      - name: Install E2E dependencies
        run: cd e2e && pnpm install --frozen-lockfile
      - name: Download Playwright blob reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: playwright-blob-*
          path: e2e/all-blob-reports
          merge-multiple: true
      - name: Merge Playwright HTML report
        run: cd e2e && pnpm exec playwright merge-reports --reporter=html all-blob-reports
      - name: Upload Playwright HTML report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
    permissions:
      actions: read
      contents: read
      deployments: write
      id-token: write
      issues: write
      pull-requests: write
