# Manual production rollback — converges Runner and API to one release commit
# recorded by release-please.yml in the rollback dashboard issue. App Worker
# versions are rolled back directly in Cloudflare when needed.

name: Rollback Production

env:
  npm_config_audit: "false"

on:
  workflow_dispatch:
    inputs:
      target_commit:
        description: "Full release commit SHA to roll back to"
        required: true
        type: string
      rollback_mode:
        description: "Runner: graceful (drain, ≤2h) or emergency (SIGTERM stop, ≤5min)"
        required: true
        type: choice
        options:
          - graceful
          - emergency
        default: graceful
      confirmed_compatible:
        description: "I confirm the target Runner is compatible with current API, guest, and on-disk state"
        required: true
        type: choice
        options:
          - "no"
          - "yes"
        default: "no"

jobs:
  queue-production-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
      - name: Wait for older production deployment workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/wait-production-deploy-queue.sh

  resolve-target:
    needs: queue-production-deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: production
    outputs:
      api_deployment_url: ${{ steps.resolve.outputs.api_deployment_url }}
      runner_matrix: ${{ steps.resolve.outputs.runner_matrix }}
      runner_version: ${{ steps.resolve.outputs.runner_version }}
      target_commit: ${{ steps.resolve.outputs.target_commit }}
    steps:
      - name: Gate confirmed compatibility
        if: inputs.confirmed_compatible != 'yes'
        run: |
          echo "::error::'confirmed_compatible' must be 'yes' before rolling back production."
          exit 1

      # Always run the current rollback implementation. The target commit is
      # read as data and is never allowed to replace the workflow or playbooks.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: main

      - name: Setup SSH via Cloudflare Tunnel
        uses: ./.github/actions/setup-ssh-tunnel
        with:
          ssh-user: ${{ vars.AWS_METAL_RUNNER_USER }}
          ssh-hosts: ${{ secrets.AWS_METAL_RUNNER_HOSTS }}
          ssh-key: ${{ secrets.AWS_METAL_RUNNER_SSH_KEY }}
          cf-access-client-id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          cf-access-client-secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

      - name: Resolve and verify rollback target
        id: resolve
        env:
          AWS_METAL_RUNNER_HOSTS: ${{ secrets.AWS_METAL_RUNNER_HOSTS }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          METAL_USER: ${{ vars.AWS_METAL_RUNNER_USER }}
          TARGET_COMMIT: ${{ inputs.target_commit }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_TEAM_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID_API }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: bash .github/scripts/resolve-production-rollback-target.sh

  rollback-runner:
    name: Roll back Runner (${{ matrix.label }})
    needs: resolve-target
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/vm0-toolchain-rust:20260825
    permissions:
      contents: read
    environment: production
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve-target.outputs.runner_matrix || '[]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main

      - name: Notify Slack - Starting
        id: slack-start
        if: ${{ vars.SLACK_RELEASE_CHANNEL_ID != '' }}
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.CI_SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ vars.SLACK_RELEASE_CHANNEL_ID }}
            text: "*Production* ⏪ rolling Runner `${{ matrix.label }}` back to v${{ needs.resolve-target.outputs.runner_version }}..."

      - name: Setup SSH via Cloudflare Tunnel
        uses: ./.github/actions/setup-ssh-tunnel
        with:
          ssh-user: ${{ vars.AWS_METAL_RUNNER_USER }}
          ssh-hosts: ${{ secrets.AWS_METAL_RUNNER_HOSTS }}
          ssh-key: ${{ secrets.AWS_METAL_RUNNER_SSH_KEY }}
          cf-access-client-id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          cf-access-client-secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

      - name: Resolve metal hosts for architecture
        id: matrix-hosts
        env:
          AWS_METAL_RUNNER_HOSTS: ${{ secrets.AWS_METAL_RUNNER_HOSTS }}
          METAL_USER: ${{ vars.AWS_METAL_RUNNER_USER }}
          RUNNER_HOST_GROUP_ID: ${{ matrix.id }}
        run: |
          set -euo pipefail

          hosts=$(.github/scripts/runner-host-architecture-groups.sh hosts "$RUNNER_HOST_GROUP_ID")
          if [ -z "$hosts" ]; then
            echo "::error::No metal hosts resolved for ${RUNNER_HOST_GROUP_ID}."
            exit 1
          fi
          echo "hosts=$hosts" >> "$GITHUB_OUTPUT"

      - name: Roll back Runner on production hosts
        env:
          API_URL: ${{ vars.OKOU_API_BACKEND_URL }}
          AWS_METAL_RUNNER_USER: ${{ vars.AWS_METAL_RUNNER_USER }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OFFICIAL_RUNNER_SECRET: ${{ secrets.OFFICIAL_RUNNER_SECRET }}
          ROLLBACK_MODE: ${{ inputs.rollback_mode }}
          RUNNER_HOSTS: ${{ steps.matrix-hosts.outputs.hosts }}
          RUNNER_TARGET: ${{ matrix.target }}
          RUNNER_VERSION: ${{ needs.resolve-target.outputs.runner_version }}
          SENTRY_DSN_RUNNER: ${{ secrets.SENTRY_DSN_RUNNER }}
        run: |
          cd ansible
          ansible-playbook \
            -i "${RUNNER_HOSTS}," \
            playbooks/rollback-runner.yml \
            -e "ansible_user=${AWS_METAL_RUNNER_USER}" \
            -e "runner_version=${RUNNER_VERSION}" \
            -e "runner_target=${RUNNER_TARGET}" \
            -e "rollback_mode=${ROLLBACK_MODE}" \
            -e "sentry_dsn=${SENTRY_DSN_RUNNER}" \
            -e "official_runner_secret=${OFFICIAL_RUNNER_SECRET}" \
            -e "api_url=${API_URL}" \
            -e "github_token=${GH_TOKEN}" \
            -v

      - name: Notify Slack - Success
        if: ${{ success() && steps.slack-start.outputs.ts }}
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.update
          token: ${{ secrets.CI_SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ vars.SLACK_RELEASE_CHANNEL_ID }}
            ts: "${{ steps.slack-start.outputs.ts }}"
            text: "*Production* ✅ Runner `${{ matrix.label }}` rolled back to v${{ needs.resolve-target.outputs.runner_version }}"

      - name: Notify Slack - Failure
        if: ${{ failure() && steps.slack-start.outputs.ts }}
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.update
          token: ${{ secrets.CI_SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ vars.SLACK_RELEASE_CHANNEL_ID }}
            ts: "${{ steps.slack-start.outputs.ts }}"
            text: "*Production* ❌ Runner `${{ matrix.label }}` rollback failed for v${{ needs.resolve-target.outputs.runner_version }}"

  rollback-api:
    name: Roll back API
    needs: resolve-target
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/vm0-toolchain:20260825
    permissions:
      contents: read
      deployments: write
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
      - uses: ./.github/actions/toolchain-init

      - name: Start GitHub Deployment
        id: deployment
        uses: bobheadxi/deployments@648679e8e4915b27893bd7dbc35cb504dc915bc8 # v1
        with:
          step: start
          token: ${{ github.token }}
          env: api/production
          ref: ${{ needs.resolve-target.outputs.target_commit }}
          desc: Rolling API back to a release commit

      - name: Notify Slack - Starting
        id: slack-start
        if: ${{ vars.SLACK_RELEASE_CHANNEL_ID != '' }}
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.CI_SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ vars.SLACK_RELEASE_CHANNEL_ID }}
            text: "*Production* ⏪ rolling API back to `${{ needs.resolve-target.outputs.target_commit }}`..."

      - name: Promote target API deployment
        uses: ./.github/actions/vercel-promote
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ vars.VERCEL_TEAM_ID }}
          vercel-project-id: ${{ vars.VERCEL_PROJECT_ID_API }}
          deployment-url: ${{ needs.resolve-target.outputs.api_deployment_url }}

      - name: Finish GitHub Deployment
        if: always()
        uses: bobheadxi/deployments@648679e8e4915b27893bd7dbc35cb504dc915bc8 # v1
        with:
          step: finish
          token: ${{ github.token }}
          status: ${{ job.status }}
          env: ${{ steps.deployment.outputs.env }}
          env_url: ${{ needs.resolve-target.outputs.api_deployment_url }}
          deployment_id: ${{ steps.deployment.outputs.deployment_id }}

      - name: Notify Slack - Success
        if: ${{ success() && steps.slack-start.outputs.ts }}
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.update
          token: ${{ secrets.CI_SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ vars.SLACK_RELEASE_CHANNEL_ID }}
            ts: "${{ steps.slack-start.outputs.ts }}"
            text: "*Production* ✅ API rolled back to `${{ needs.resolve-target.outputs.target_commit }}`"

      - name: Notify Slack - Failure
        if: ${{ failure() && steps.slack-start.outputs.ts }}
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.update
          token: ${{ secrets.CI_SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ vars.SLACK_RELEASE_CHANNEL_ID }}
            ts: "${{ steps.slack-start.outputs.ts }}"
            text: "*Production* ❌ API rollback failed for `${{ needs.resolve-target.outputs.target_commit }}`"

  verify-production-domains:
    name: Verify production domains after rollback
    needs: rollback-api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
      - name: Verify production App and API domains
        run: bash .github/scripts/verify-okou-production-domains.sh
