name: Android Screenshots

run-name: Android screenshots for ${{ inputs.commit_sha }}

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full commit SHA containing the app and temporary recipe
        type: string
        required: true
      script_path:
        description: Repository-relative .sh path under android/screenshots/
        type: string
        required: true
  workflow_call:
    inputs:
      commit_sha:
        type: string
        required: true
      script_path:
        type: string
        required: true

permissions:
  contents: read

env:
  npm_config_audit: "false"

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TARGET_SHA: ${{ inputs.commit_sha }}
      SCREENSHOT_SCRIPT: ${{ inputs.script_path }}
      DRIVER_SHA: ${{ github.workflow_sha }}
    steps:
      - name: Validate immutable target
        shell: bash
        run: |
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'commit_sha must be a full lowercase commit SHA' >&2
            exit 2
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false
      - name: Verify checked-out source
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - name: Fetch complete history for Android versionCode
        # Count the target's ancestors without downloading unrelated branches, tags or trees.
        run: >-
          git -c protocol.version=2 fetch --no-tags --no-recurse-submodules
          --unshallow --filter=tree:0 origin "$TARGET_SHA"
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Restore Android instrumentation dependencies
        id: gradle-dependencies
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Match the cache published by instrumentation in android.yml.
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches/modules-2/files-2.1
            ~/.gradle/caches/modules-2/metadata-*
          key: android-instrumentation-gradle-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('android/**/*.gradle', 'android/**/*.gradle.kts', 'android/**/gradle.properties', 'android/gradle/**/*.toml', 'android/gradle/wrapper/gradle-wrapper.properties') }}
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: ${{ steps.gradle-dependencies.outputs.cache-hit == 'true' && 'external' || 'enhanced' }}
          cache-read-only: true
      - name: Install Android SDK
        run: bash android/scripts/setup-sdk.sh --accept-licenses
      - name: Enable emulator hardware acceleration
        shell: bash
        run: |
          test -c /dev/kvm
          sudo chown "$(id -u):$(id -g)" /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Execute selected feature recipe
        run: python3 android/scripts/screenshots.py run --commit "$TARGET_SHA" --driver "$DRIVER_SHA" --script "$SCREENSHOT_SCRIPT"
      - name: Retain screenshots and diagnostics
        id: artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-screenshots-${{ inputs.commit_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            android/build/screenshots/
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
            android/app/build/outputs/managed_device_android_test_additional_output/
          if-no-files-found: warn
          retention-days: 1
      - name: Link review evidence
        if: always()
        env:
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: |
          printf '### Android screenshots\n\nTarget: %s\n\nRecipe: %s\n\n[Artifact](%s)\n' \
            "$TARGET_SHA" "$SCREENSHOT_SCRIPT" "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
