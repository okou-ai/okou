name: Production Single Agent Migration
run-name: ${{ inputs.mode }} single-agent ${{ inputs.org_id }} by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Inspect target, prepare an encrypted plan, or execute a reviewed image
        type: choice
        options: [target, plan, apply, verify, recover]
        default: target
        required: true
      org_id:
        description: Exact staff organization ID; external cohorts are not enabled
        type: string
        required: true
      prefixes_base64:
        description: Encrypted fixed prefix input from single-agent:package seal-prefixes; plan only
        type: string
      prefixes_sha256:
        description: Reviewed plaintext prefix-file digest; plan only
        type: string
      plan_run_id:
        description: Successful plan run on this exact main commit
        type: string
      plan_sha256:
        description: Reviewed plan digest from that plan run
        type: string
      image_sha256:
        description: Reviewed production execution-image digest
        type: string
      writers_drained:
        description: Attest API, schedulers, listeners and other writers are stopped and queued/running work has drained
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

env:
  npm_config_audit: "false"

concurrency:
  group: production-single-agent-migration
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  operate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    container: ghcr.io/${{ github.repository_owner }}/vm0-toolchain:20261023
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/toolchain-init

      - name: Prepare private operator context and verify reviewed artifact origin
        id: origin
        working-directory: turbo/packages/db
        env:
          MODE: ${{ inputs.mode }}
          ORG_ID: ${{ inputs.org_id }}
          PREFIXES_BASE64: ${{ inputs.prefixes_base64 }}
          PREFIXES_SHA256: ${{ inputs.prefixes_sha256 }}
          PLAN_RUN_ID: ${{ inputs.plan_run_id }}
          PLAN_SHA256: ${{ inputs.plan_sha256 }}
          IMAGE_SHA256: ${{ inputs.image_sha256 }}
          WRITERS_DRAINED: ${{ inputs.writers_drained }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          MIGRATION_IMAGE_KEY: ${{ secrets.SINGLE_AGENT_MIGRATION_IMAGE_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$GITHUB_RUN_ATTEMPT" == 1 ]]
          node --input-type=module <<'JS'
          import { mkdir, writeFile } from 'node:fs/promises';
          import { join } from 'node:path';
          const root = join(process.env.RUNNER_TEMP, 'single-agent-request');
          await mkdir(root, { mode: 0o700 });
          const context = {
            mode: process.env.MODE, repository: process.env.GITHUB_REPOSITORY,
            ref: process.env.GITHUB_REF, commit: process.env.GITHUB_SHA, driverCommit: process.env.GITHUB_SHA,
            orgId: process.env.ORG_ID, runId: process.env.GITHUB_RUN_ID,
            runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT), actor: process.env.GITHUB_ACTOR,
            writersDrained: process.env.WRITERS_DRAINED === 'true',
            planRunId: process.env.PLAN_RUN_ID || '', planSha256: process.env.PLAN_SHA256 || '',
            imageSha256: process.env.IMAGE_SHA256 || '', prefixesSha256: process.env.PREFIXES_SHA256 || '',
          };
          await writeFile(join(root, 'context.json'), JSON.stringify(context), { mode: 0o600, flag: 'wx' });
          await writeFile(join(root, 'credentials.json'), JSON.stringify({
            neon: process.env.NEON_API_KEY, github: process.env.GITHUB_TOKEN,
            clerk: process.env.CLERK_SECRET_KEY || '', key: process.env.MIGRATION_IMAGE_KEY || '',
          }), { mode: 0o600, flag: 'wx' });
          await writeFile(join(root, 'prefixes.base64'), process.env.PREFIXES_BASE64 || '', { mode: 0o600, flag: 'wx' });
          JS
          if [[ "$MODE" != target && "$MODE" != plan ]]; then
            pnpm single-agent:production --operation verify-origin \
              --context "$RUNNER_TEMP/single-agent-request/context.json" \
              --credentials "$RUNNER_TEMP/single-agent-request/credentials.json" \
              --github-output "$GITHUB_OUTPUT"
          fi

      - name: Select the exact reviewed operator for verification or recovery
        if: inputs.mode == 'verify' || inputs.mode == 'recover'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.origin.outputs.operator-commit }}
          persist-credentials: false
      - uses: ./.github/actions/toolchain-init
        if: inputs.mode == 'verify' || inputs.mode == 'recover'

      - name: Fetch the exact reviewed encrypted plan
        if: inputs.mode != 'target' && inputs.mode != 'plan'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ steps.origin.outputs.artifact-name }}
          run-id: ${{ inputs.plan_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/single-agent-reviewed

      - name: Run the protected operator
        working-directory: turbo/packages/db
        env:
          R2_ENDPOINT: https://${{ vars.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_USER_STORAGES_BUCKET_NAME: ${{ vars.R2_USER_STORAGES_BUCKET_NAME }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -rf "$RUNNER_TEMP/single-agent-request" "$RUNNER_TEMP/single-agent-reviewed"' EXIT
          context_file="$RUNNER_TEMP/single-agent-request/context.json"
          mode=$(node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).mode)' "$context_file")
          if [[ "$mode" != target && "$mode" != plan ]]; then
            context_file="$RUNNER_TEMP/single-agent-request/bound-context.json"
          fi
          pnpm single-agent:production --operation run \
            --context "$context_file" \
            --credentials "$RUNNER_TEMP/single-agent-request/credentials.json" \
            --request "$RUNNER_TEMP/single-agent-request" \
            --reviewed "$RUNNER_TEMP/single-agent-reviewed" \
            --output "$RUNNER_TEMP/single-agent-output"

      - name: Retain encrypted recovery material and redacted receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: single-agent-${{ inputs.mode == 'plan' && 'plan' || inputs.mode }}-${{ github.run_id }}
          path: ${{ runner.temp }}/single-agent-output
          if-no-files-found: warn
          retention-days: 30

      - name: Remove plaintext material and credentials
        if: always()
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/single-agent-request" "$RUNNER_TEMP/single-agent-reviewed"
