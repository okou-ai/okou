name: Security Scanning

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main

env:
  npm_config_audit: "false"

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  # Detect release-please context across all event types (PR, push, merge queue).
  detect-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Check for release-please
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.head_ref || '' }}
          COMMIT_MSG: ${{ github.event.head_commit.message || '' }}
          EVENT_NAME: ${{ github.event_name }}
          MQ_HEAD_REF: ${{ github.event.merge_group.head_ref || '' }}
          REPO: ${{ github.repository }}
        run: |
          if [[ "$HEAD_REF" == release-please--branches--* ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Release-please PR detected (branch: $HEAD_REF)"
            exit 0
          fi
          if [[ "$EVENT_NAME" == "push" ]] && [[ "$COMMIT_MSG" == chore:\ release* ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Release-please push detected (message: $COMMIT_MSG)"
            exit 0
          fi
          if [[ "$EVENT_NAME" == "merge_group" ]] && [[ -n "$MQ_HEAD_REF" ]]; then
            PR_NUM=$(echo "$MQ_HEAD_REF" | grep -oE 'pr-[0-9]+' | head -1 | sed 's/pr-//')
            if [[ -n "$PR_NUM" ]]; then
              PR_BRANCH=$(gh pr view "$PR_NUM" --repo "$REPO" --json headRefName --jq .headRefName 2>/dev/null || echo "")
              if [[ "$PR_BRANCH" == release-please--branches--* ]]; then
                echo "skip=true" >> "$GITHUB_OUTPUT"
                echo "Release-please merge queue entry detected (PR #$PR_NUM, branch: $PR_BRANCH)"
                exit 0
              fi
            fi
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "Not a release-please context"

  detect-native-only:
    needs: [detect-release]
    if: needs.detect-release.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ios-only: ${{ steps.detect.outputs.ios-only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Detect native-only changes
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHECKOUT_REF: ${{ github.ref }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          selection=$(bash .github/scripts/detect-native-only.sh)
          printf '%s\n' "$selection" | tee -a "$GITHUB_OUTPUT"

  pr-title:
    needs: [detect-release]
    name: Pull Request Title
    if: needs.detect-release.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Validate pull request title
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          MQ_HEAD_REF: ${{ github.event.merge_group.head_ref || '' }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          title="$(.github/scripts/resolve-pr-title.sh)"

          if [ -z "$title" ]; then
            echo "No pull request title to validate for $EVENT_NAME"
            exit 0
          fi

          .github/scripts/check-pr-title.sh "$title"

  semgrep:
    needs: [detect-release]
    name: Semgrep SAST
    # Skip for release-please PRs, commits, and merge queue entries
    if: needs.detect-release.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: ${{ github.event_name == 'push' && 1 || 2 }}

      - name: Trust checked out repository
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Run Semgrep
        run: sh .github/scripts/run-semgrep.sh
        env:
          EVENT_NAME: ${{ github.event_name }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: Check against baseline
        run: >-
          python3 .github/scripts/semgrep-results.py check
          "$SEMGREP_SCAN_MODE"
          .github/semgrep-baseline.json
          semgrep-results.json
        env:
          SEMGREP_SCAN_MODE: ${{ github.event_name == 'push' && 'full' || 'diff' }}

      - name: Filter Semgrep SARIF for Code Scanning upload
        if: always()
        run: >-
          python3 .github/scripts/semgrep-results.py filter
          "$SEMGREP_SCAN_MODE"
          .github/semgrep-baseline.json
          semgrep-results.sarif
          semgrep-results-for-code-scanning.sarif
        env:
          SEMGREP_SCAN_MODE: ${{ github.event_name == 'push' && 'full' || 'diff' }}

      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        if: always() && github.event_name != 'merge_group'
        with:
          sarif_file: semgrep-results-for-code-scanning.sarif
          category: semgrep

  codeql:
    needs: [detect-release, detect-native-only]
    name: CodeQL SAST
    # PR and main results are uploaded for CASA; merge groups cannot upload SARIF.
    if: needs.detect-release.outputs.skip != 'true' && github.event_name != 'merge_group' && needs.detect-native-only.outputs.ios-only == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: javascript-typescript
          trap-caching: false
        env:
          CODEQL_ACTION_OVERLAY_DATABASE_CACHE: false

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: codeql

  pnpm-audit:
    needs: [detect-release, detect-native-only]
    name: pnpm audit (SCA)
    # Pure iOS changes cannot alter the pnpm dependency graph; main still scans it.
    if: needs.detect-release.outputs.skip != 'true' && needs.detect-native-only.outputs.ios-only == 'false'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: turbo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.19.0

      - name: Install pnpm
        run: corepack enable pnpm

      - name: Run pnpm audit
        run: |
          set -o pipefail
          echo "## pnpm audit results" >> "$GITHUB_STEP_SUMMARY"
          # --ignore-registry-errors: temporary workaround for transient npm registry
          # connectivity failures in CI that cause false audit failures unrelated to
          # actual vulnerability findings.
          pnpm audit --prod --ignore-registry-errors 2>&1 | tee audit-output.txt
          {
            echo '```'
            cat audit-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  actionlint:
    needs: [detect-release]
    name: Workflow Lint
    # Skip for release-please PRs, commits, and merge queue entries
    if: needs.detect-release.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install actionlint
        run: |
          ACTIONLINT_VERSION=1.7.12
          ACTIONLINT_SHA256=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          bash .github/scripts/download-verified.sh \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            "$ACTIONLINT_SHA256" \
            "$archive"
          tar -xzf "$archive" actionlint

      - name: Install ripgrep for workflow script tests
        run: |
          RIPGREP_VERSION=14.1.1
          RIPGREP_SHA256=4cf9f2741e6c465ffdb7c26f38056a59e2a2544b51f7cc128ef28337eeae4d8e
          archive="$RUNNER_TEMP/ripgrep.tar.gz"
          bin_dir="$RUNNER_TEMP/ripgrep-bin"
          bash .github/scripts/download-verified.sh \
            "https://github.com/BurntSushi/ripgrep/releases/download/${RIPGREP_VERSION}/ripgrep-${RIPGREP_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            "$RIPGREP_SHA256" \
            "$archive"
          mkdir -p "$bin_dir"
          tar -xzf "$archive" \
            --strip-components=1 \
            -C "$bin_dir" \
            "ripgrep-${RIPGREP_VERSION}-x86_64-unknown-linux-musl/rg"
          echo "$bin_dir" >> "$GITHUB_PATH"

      - name: Check Release Please workspace coverage
        run: .github/scripts/check-release-please-workspace-coverage.sh

      - name: Run workflow script tests
        run: |
          shopt -s nullglob
          script_files=(
            .github/actions/report-memory-peak/*.sh
            .github/scripts/*.sh
            .github/scripts/tests/*.sh
          )
          bash -n "${script_files[@]}"
          shellcheck \
            .github/scripts/build-okou-desktop-artifact.sh \
            .github/scripts/cancel-superseded-merge-group-runs.sh \
            .github/scripts/check-release-please-component-releases.sh \
            .github/scripts/check-release-please-workspace-coverage.sh \
            .github/scripts/check-workflow-shell-compatibility.sh \
            .github/scripts/cleanup-pr-runner-namespace.sh \
            .github/scripts/discover-runner-pr-namespaces.sh \
            .github/scripts/detect-native-only.sh \
            .github/scripts/tests/native-only-ci-test.sh \
            .github/scripts/tests/native-only-gates-test.sh \
            .github/scripts/cloudflare-ssh-command.sh \
            .github/scripts/cloudflare-ssh-diagnostics.sh \
            .github/scripts/cloudflare-ssh-preconnect.sh \
            .github/scripts/download-verified.sh \
            .github/scripts/fetch-okou-desktop-artifact.sh \
            .github/scripts/pass-release-pr-ci-gates.sh \
            .github/scripts/publish-okou-app-assets.sh \
            .github/scripts/verify-okou-app-assets.sh \
            .github/scripts/verify-okou-app-runtime.sh \
            .github/scripts/reconcile-and-start-runner-groups.sh \
            .github/scripts/prune-runner-idle.sh \
            .github/scripts/reconcile-runner-binary-groups.sh \
            .github/actions/report-memory-peak/report.sh \
            .github/scripts/resolve-desktop-version-change.sh \
            .github/scripts/run-semgrep.sh \
            .github/scripts/runner-behavior-*.sh \
            .github/scripts/smoke-okou-cli-artifact.sh \
            .github/scripts/verify-okou-cli-artifact.sh \
            .github/scripts/verify-okou-desktop-artifact.sh \
            .github/scripts/with-runner-lifecycle-lock.sh \
            .github/scripts/tests/ansible-ssh-control-path-test.sh \
            .github/scripts/tests/cancel-superseded-merge-group-runs-test.sh \
            .github/scripts/tests/check-release-please-component-releases-test.sh \
            .github/scripts/tests/check-release-please-workspace-coverage-test.sh \
            .github/scripts/tests/pass-release-pr-ci-gates-test.sh \
            .github/scripts/tests/check-workflow-shell-compatibility-test.sh \
            .github/scripts/tests/checkout-depth-test.sh \
            .github/scripts/tests/cleanup-pr-runner-test.sh \
            .github/scripts/tests/cleanup-stale-runners-test.sh \
            .github/scripts/tests/clerk-test-resource-workflow-test.sh \
            .github/scripts/tests/cloudflare-ssh-command-test.sh \
            .github/scripts/tests/cloudflare-ssh-preconnect-test.sh \
            .github/scripts/tests/cloudflare-ssh-proxy-test.sh \
            .github/scripts/tests/deploy-desktop-workflow-test.sh \
            .github/scripts/tests/deploy-cli-local-test.sh \
            .github/scripts/tests/deploy-okou-app-worker-workflow-test.sh \
            .github/scripts/tests/discover-runner-pr-namespaces-test.sh \
            .github/scripts/tests/publish-okou-app-assets-test.sh \
            .github/scripts/tests/verify-okou-app-assets-test.sh \
            .github/scripts/tests/verify-okou-app-runtime-test.sh \
            .github/scripts/tests/download-verified-test.sh \
            .github/scripts/tests/fetch-okou-desktop-artifact-test.sh \
            .github/scripts/tests/neon-credential-mask-test.sh \
            .github/scripts/tests/neon-connection-string-ssl-test.sh \
            .github/scripts/tests/okou-desktop-artifact-test.sh \
            .github/scripts/tests/provision-runner-kvm-test.sh \
            .github/scripts/tests/release-tool-downloads-test.sh \
            .github/scripts/tests/resolve-desktop-version-change-test.sh \
            .github/scripts/tests/runner-attribution-ansible-test.sh \
            .github/scripts/tests/runner-promotion-ansible-test.sh \
            .github/scripts/tests/reconcile-runner-binary-groups-test.sh \
            .github/scripts/tests/reconcile-and-start-runner-groups-test.sh \
            .github/scripts/tests/prune-runner-idle-test.sh \
            .github/scripts/tests/report-cgroup-memory-peak-test.sh \
            .github/scripts/tests/runner-lifecycle-lock-test.sh \
            .github/scripts/tests/runner-lifecycle-lock-diagnostics-test.sh \
            .github/scripts/tests/runner-release-build-workflow-test.sh \
            .github/scripts/tests/rust-coverage-cache-workflow-test.sh \
            .github/scripts/tests/rust-ci-memory-workflow-test.sh \
            .github/scripts/tests/runner-lifecycle-ownership-workflow-test.sh \
            .github/scripts/tests/run-semgrep-test.sh \
            .github/scripts/tests/semgrep-results-test.sh \
            .github/scripts/tests/runner-behavior-agent-ready-benchmark-test.sh \
            .github/scripts/tests/runner-behavior-durable-test.sh \
            e2e/scripts/ensure-stripe-cli.sh \
            e2e/helpers/browser.bash \
            e2e/helpers/trace-cli.sh \
            e2e/tests/02-browser/brw-t01-platform-e2e.bats
          # actionlint assumes Bash when shell is omitted and does not model the
          # sh default used by container jobs.
          .github/scripts/check-workflow-shell-compatibility.sh
          for test_script in .github/scripts/tests/*.sh; do
            bash "$test_script"
          done

      - name: Run actionlint
        run: ./actionlint

  release-workspace-coverage:
    needs: [detect-release]
    name: Release Please Workspace Coverage
    if: ${{ needs.detect-release.outputs.skip == 'true' && github.event_name != 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Check Release Please workspace coverage
        run: .github/scripts/check-release-please-workspace-coverage.sh

  gitleaks:
    needs: [detect-release]
    name: Gitleaks Secrets Detection
    # Skip for release-please PRs, commits, and merge queue entries
    if: needs.detect-release.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: ${{ github.event_name != 'pull_request' && 2 || 0 }}

      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION=8.30.1
          GITLEAKS_SHA256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          bash .github/scripts/download-verified.sh \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            "$GITLEAKS_SHA256" \
            "$archive"
          tar -xzf "$archive" -C /usr/local/bin gitleaks

      - name: Run Gitleaks
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            gitleaks detect --source . --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" --verbose --redact
          else
            gitleaks detect --source . --log-opts="HEAD~1..HEAD" --verbose --redact
          fi

  ci-gate-security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - detect-release
      - detect-native-only
      - pr-title
      - semgrep
      - codeql
      - pnpm-audit
      - actionlint
      - release-workspace-coverage
      - gitleaks
    # Always run so the gate reports an explicit result (not "skipped").
    if: always()
    steps:
      - name: Validate CI results
        env:
          EVENT_NAME: ${{ github.event_name }}
          IS_RELEASE: ${{ needs.detect-release.outputs.skip }}
          RELEASE_WORKSPACE_COVERAGE_RESULT: ${{ needs.release-workspace-coverage.result }}
        run: |
          # Release candidates retain the fast path after workspace validation.
          if [[ "$IS_RELEASE" == "true" ]]; then
            if [[ "$EVENT_NAME" != "push" && "$RELEASE_WORKSPACE_COVERAGE_RESULT" != "success" ]]; then
              echo "::error::release-workspace-coverage: expected success, got $RELEASE_WORKSPACE_COVERAGE_RESULT"
              exit 1
            fi
            echo "✅ Release-please — workspace coverage validated; skipping remaining CI"
            exit 0
          fi
          echo "::group::CI Gate Results"
          FAILED=0
          IOS_ONLY="${{ needs.detect-native-only.outputs.ios-only }}"

          check_result() {
            local job="$1" result="$2" allow_skip="${3:-false}"
            if [ "$result" = "success" ]; then
              echo "✅ $job: $result"
            elif [ "$result" = "skipped" ] && [ "$allow_skip" = "true" ]; then
              echo "⏭️ $job: skipped (not applicable)"
            else
              echo "::error::$job: expected success, got $result"
              FAILED=1
            fi
          }

          check_result "detect-release" "${{ needs.detect-release.result }}"
          check_result "detect-native-only" "${{ needs.detect-native-only.result }}"
          check_result "pr-title" "${{ needs.pr-title.result }}"
          check_result "semgrep" "${{ needs.semgrep.result }}"
          if [[ "$EVENT_NAME" == "merge_group" ]]; then
            check_result "codeql" "${{ needs.codeql.result }}" "true"
          else
            check_result "codeql" "${{ needs.codeql.result }}" "$IOS_ONLY"
          fi
          check_result "pnpm-audit" "${{ needs.pnpm-audit.result }}" "$IOS_ONLY"
          check_result "actionlint" "${{ needs.actionlint.result }}"
          check_result "gitleaks" "${{ needs.gitleaks.result }}"

          echo "::endgroup::"
          exit $FAILED
