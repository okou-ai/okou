name: Continue iOS App Review

on:
  workflow_run:
    workflows: [Submit iOS for App Review, release-please]
    types: [completed]
    branches: [main]

env:
  npm_config_audit: "false"

permissions:
  actions: read
  contents: read
  pull-requests: read
  statuses: read

jobs:
  readiness:
    if: >-
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main' &&
      ((github.event.workflow_run.path == '.github/workflows/ios-app-review.yml' &&
        github.event.workflow_run.event == 'workflow_dispatch' &&
        github.event.workflow_run.conclusion == 'success') ||
       (github.event.workflow_run.path == '.github/workflows/release-please.yml' &&
        github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      request: ${{ steps.ready.outputs.request }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            ios/scripts
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
      - name: Look for a requested, deployed candidate
        id: ready
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/release/ios-app-review-submit.mjs discover

  submit:
    needs: readiness
    if: needs.readiness.outputs.request != ''
    concurrency:
      group: ios-app-review-submit
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      actions: read
      contents: read
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            ios/scripts
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
      - name: Verify production and submit the selected Apple build for manual release
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_REQUEST: ${{ needs.readiness.outputs.request }}
          IOS_INTERNAL_GROUP_NAME: ${{ vars.IOS_INTERNAL_GROUP_NAME }}
          IOS_EXTERNAL_GROUP_NAMES: ${{ vars.IOS_EXTERNAL_GROUP_NAMES }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.IOS_APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.IOS_APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.IOS_APP_STORE_CONNECT_API_ISSUER_ID }}
        run: node .github/scripts/release/ios-app-review-submit.mjs submit
