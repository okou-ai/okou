name: Deploy WeChat Gateway

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target GitHub and Cloudflare environment"
        type: choice
        options: [test, production]
        default: test
        required: true
      enable_gateway:
        description: "Allow Gateway startup; initial bootstrap still requires authenticated /start"
        type: boolean
        default: false
        required: true

permissions:
  contents: read

env:
  npm_config_audit: "false"

concurrency:
  group: deploy-wechat-gateway-${{ inputs.environment }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    container:
      image: ghcr.io/${{ github.repository_owner }}/vm0-toolchain:20261023
    steps:
      - name: Check out dispatched source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/toolchain-init

      - name: Build relay without deployment
        working-directory: turbo
        run: pnpm --filter @okouai/wechat-gateway-worker run build

      - name: Deploy relay with encrypted bindings
        env:
          GATEWAY_ENVIRONMENT: ${{ inputs.environment }}
          GATEWAY_ENABLED: ${{ inputs.enable_gateway }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_WORKER_DEPLOY_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          WECHAT_RECEIVER_ENCRYPTION_KEY: ${{ secrets.WECHAT_RECEIVER_ENCRYPTION_KEY }}
          WECHAT_GATEWAY_SECRET: ${{ secrets.WECHAT_GATEWAY_SECRET }}
          WECHAT_GATEWAY_CONTROL_SECRET: ${{ secrets.WECHAT_GATEWAY_CONTROL_SECRET }}
          WECHAT_API_ORIGIN: ${{ vars.WECHAT_API_ORIGIN }}
        run: bash .github/scripts/deploy-wechat-gateway.sh "$GATEWAY_ENVIRONMENT" "$GATEWAY_ENABLED"
