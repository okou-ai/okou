name: Staging

on:
  push:
    branches:
      - main

# One commit owns the shared environment until deployment, E2E, and cleanup
# finish. Benchmark runs have their own workflow and never acquire this lock.
concurrency:
  group: staging
  cancel-in-progress: false

env:
  npm_config_audit: "false"

jobs:
  deploy-and-test:
    permissions:
      actions: read
      contents: read
      deployments: write
      id-token: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/turbo.yml
    # Preview API configuration is rendered from the explicitly scoped map.
    secrets:
      ABLY_API_KEY: ${{ secrets.ABLY_API_KEY }}
      AGENTPHONE_API_KEY: ${{ secrets.AGENTPHONE_API_KEY }}
      AGENTPHONE_WEBHOOK_SECRET: ${{ secrets.AGENTPHONE_WEBHOOK_SECRET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_METAL_RUNNER_HOSTS: ${{ secrets.AWS_METAL_RUNNER_HOSTS }}
      AWS_METAL_RUNNER_SSH_KEY: ${{ secrets.AWS_METAL_RUNNER_SSH_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AXIOM_TOKEN_SESSIONS: ${{ secrets.AXIOM_TOKEN_SESSIONS }}
      AXIOM_TOKEN_TELEMETRY: ${{ secrets.AXIOM_TOKEN_TELEMETRY }}
      BYTEPLUS_API_KEY: ${{ secrets.BYTEPLUS_API_KEY }}
      BYTEPLUS_STT_API_KEY: ${{ secrets.BYTEPLUS_STT_API_KEY }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      CF_API_WORKER_DEPLOY_API_TOKEN: ${{ secrets.CF_API_WORKER_DEPLOY_API_TOKEN }}
      CI_ANTHROPIC_API_KEY: ${{ secrets.CI_ANTHROPIC_API_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      CLERK_WEBHOOK_SIGNING_SECRET: ${{ secrets.CLERK_WEBHOOK_SIGNING_SECRET }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      FAL_KEY: ${{ secrets.FAL_KEY }}
      FINICITY_APP_KEY: ${{ secrets.FINICITY_APP_KEY }}
      FINICITY_APP_SECRET: ${{ secrets.FINICITY_APP_SECRET }}
      GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
      GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
      HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
      JOGGAI_API_KEY: ${{ secrets.JOGGAI_API_KEY }}
      JOGGAI_WEBHOOK_SECRET: ${{ secrets.JOGGAI_WEBHOOK_SECRET }}
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
