name: Production Template Package Operators

run-name: ${{ inputs.mode }} production presentation templates by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Inspect only, or copy after a successful inspection
        type: choice
        options:
          [dry-run, copy, capture-guidance, plan-guidance, apply-guidance]
        default: dry-run
        required: true
      frozen_inventory:
        description: Reviewed template-guidance-sources-v1 JSON; capture-guidance or plan-guidance
        type: string
        required: false
      recipient_public_key:
        description: RSA public key for encrypted capture; never supply a private key
        type: string
        required: false
      plan_run_id:
        description: Successful plan-guidance run on the same main commit; apply-guidance only
        type: string
        required: false
      plan_sha256:
        description: Exact reviewed plan.json SHA-256; apply-guidance only
        type: string
        required: false
      writers_drained:
        description: Attest canonical legacy template writers have drained before apply
        type: boolean
        default: false

permissions:
  contents: read

env:
  npm_config_audit: "false"

concurrency:
  group: production-presentation-template-copy
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  copy:
    if: github.ref == 'refs/heads/main' && (inputs.mode == 'dry-run' || inputs.mode == 'copy')
    runs-on: ubuntu-latest
    container: ghcr.io/${{ github.repository_owner }}/vm0-toolchain:20261023
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: ./.github/actions/toolchain-init

      - name: Inspect, optionally copy, and verify retained legacy data
        working-directory: turbo/packages/db
        env:
          COPY_MODE: ${{ inputs.mode }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          R2_ENDPOINT: https://${{ vars.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_USER_STORAGES_BUCKET_NAME: ${{ vars.R2_USER_STORAGES_BUCKET_NAME }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$COPY_MODE" == dry-run || "$COPY_MODE" == copy ]]
          [[ "$NEON_PROJECT_ID" == hidden-lab-39609750 ]]
          [[ "$R2_USER_STORAGES_BUCKET_NAME" == vm0-s3-user-storages-prod ]]
          if [[ "$COPY_MODE" == copy && "$GITHUB_RUN_ATTEMPT" != 1 ]]; then
            echo '::error::Do not replay an uncertain copy. Inspect its receipts and dispatch a fresh dry-run first.'
            exit 1
          fi
          credential_dir=$(mktemp -d)
          trap 'rm -rf "$credential_dir"' EXIT
          export DATABASE_URL_FILE="$credential_dir/database-url"
          receipts="$RUNNER_TEMP/presentation-template-copy-receipts"
          mkdir -p "$receipts"

          node --input-type=module <<'JS'
          import { writeFile } from 'node:fs/promises';
          try {
            const base = `https://console.neon.tech/api/v2/projects/${process.env.NEON_PROJECT_ID}`;
            const headers = { Authorization: `Bearer ${process.env.NEON_API_KEY}` };
            const branchesResponse = await fetch(`${base}/branches`, { headers, signal: AbortSignal.timeout(30000) });
            if (!branchesResponse.ok) throw new Error('BranchLookupFailed');
            const { branches } = await branchesResponse.json();
            const production = branches.filter(branch => branch.name === 'production');
            if (production.length !== 1) throw new Error('ProductionBranchNotUnique');
            const params = new URLSearchParams({ branch_id: production[0].id, database_name: 'neondb', role_name: 'neondb_owner', pooled: 'true' });
            const connectionResponse = await fetch(`${base}/connection_uri?${params}`, { headers, signal: AbortSignal.timeout(30000) });
            if (!connectionResponse.ok) throw new Error('ConnectionLookupFailed');
            const { uri } = await connectionResponse.json();
            if (typeof uri !== 'string' || !uri.startsWith('postgresql://')) throw new Error('InvalidConnection');
            process.stdout.write(`::add-mask::${uri.replaceAll('%', '%25').replaceAll('\r', '%0D').replaceAll('\n', '%0A')}\n`);
            await writeFile(process.env.DATABASE_URL_FILE, uri, { mode: 0o600 });
            console.log(JSON.stringify({ project: process.env.NEON_PROJECT_ID, branch: production[0].id, bucket: process.env.R2_USER_STORAGES_BUCKET_NAME }));
          } catch {
            console.error('Production connection lookup failed; no copy was attempted.');
            process.exitCode = 1;
          }
          JS

          cat > "$credential_dir/snapshot.mjs" <<'JS'
          import { readFile } from 'node:fs/promises';
          import postgres from 'postgres';
          const db = postgres((await readFile(process.env.DATABASE_URL_FILE, 'utf8')).trim(), { max: 1, onnotice() {} });
          try {
            const rows = await db`
              SELECT p.id, md5(to_jsonb(p)::text) AS template,
                md5(to_jsonb(s)::text) AS storage, md5(to_jsonb(v)::text) AS head
              FROM presentation_templates p
              LEFT JOIN storages s ON s.org_id = p.org_id AND s.user_id = '__org__'
                AND s.name = 'presentation-template@' || p.id::text
              LEFT JOIN storage_versions v ON v.id = s.head_version_id AND v.storage_id = s.id
              ORDER BY p.id LIMIT 101`;
            if (rows.length > 100) throw new Error('Inventory exceeds the single-batch limit');
            console.log(JSON.stringify(rows));
          } catch {
            console.error('Legacy snapshot failed or exceeded 100 templates; stop and inspect.');
            process.exitCode = 1;
          } finally {
            await db.end();
          }
          JS
          node --input-type=module < "$credential_dir/snapshot.mjs" > "$receipts/legacy-before.json"
          count=$(jq length "$receipts/legacy-before.json")
          operator=scripts/migrations/025-presentation-template-copy/copy.ts
          node --import tsx "$operator" | tee "$receipts/before.jsonl"
          tail -n 1 "$receipts/before.jsonl" | jq -e --argjson count "$count" \
            '.scanned == $count and (.attention | length) == 0 and (.ready + .existing) == $count'

          if [[ "$COPY_MODE" == copy ]]; then
            node --import tsx "$operator" --migrate | tee "$receipts/copy.jsonl"
            node --import tsx "$operator" | tee "$receipts/after.jsonl"
            tail -n 1 "$receipts/after.jsonl" | jq -e --argjson count "$count" \
              '.scanned == $count and (.attention | length) == 0 and .ready == 0 and .existing == $count'
          fi
          node --input-type=module < "$credential_dir/snapshot.mjs" > "$receipts/legacy-after.json"
          cmp "$receipts/legacy-before.json" "$receipts/legacy-after.json"
          printf 'Mode: %s\nLegacy templates retained unchanged: %s\nCommit: %s\n' \
            "$COPY_MODE" "$count" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$COPY_MODE" == copy ]]; then
            tail -n 1 "$receipts/copy.jsonl" >> "$GITHUB_STEP_SUMMARY"
            tail -n 1 "$receipts/after.jsonl" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Retain identifiers and verification receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: presentation-template-copy-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/presentation-template-copy-receipts
          if-no-files-found: warn
          retention-days: 30

  capture-guidance:
    if: github.ref == 'refs/heads/main' && inputs.mode == 'capture-guidance'
    runs-on: ubuntu-latest
    container: ghcr.io/${{ github.repository_owner }}/vm0-toolchain:20261023
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/toolchain-init
      - name: Verify fixed source bytes and encrypt the rehearsal copy
        working-directory: turbo/packages/db
        env:
          FROZEN_INVENTORY: ${{ inputs.frozen_inventory }}
          RECIPIENT_PUBLIC_KEY: ${{ inputs.recipient_public_key }}
          R2_ENDPOINT: https://${{ vars.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_USER_STORAGES_BUCKET_NAME: ${{ vars.R2_USER_STORAGES_BUCKET_NAME }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$R2_USER_STORAGES_BUCKET_NAME" == vm0-s3-user-storages-prod ]]
          request_dir=$(mktemp -d)
          trap 'rm -rf "$request_dir"' EXIT
          export C03_REQUEST_DIR="$request_dir"
          node --input-type=module <<'JS'
          import { writeFile } from 'node:fs/promises';
          import { join } from 'node:path';
          await writeFile(join(process.env.C03_REQUEST_DIR, 'inventory.json'), process.env.FROZEN_INVENTORY, { mode: 0o600 });
          await writeFile(join(process.env.C03_REQUEST_DIR, 'recipient.pem'), process.env.RECIPIENT_PUBLIC_KEY, { mode: 0o600 });
          JS
          node --import tsx scripts/migrations/029-template-guidance-bundles/capture.ts \
            --inventory "$request_dir/inventory.json" --public-key "$request_dir/recipient.pem" \
            --output "$RUNNER_TEMP/template-guidance-capture" --commit "$GITHUB_SHA"
          for capture_file in report.json envelope.json payload.enc; do
            test -s "$RUNNER_TEMP/template-guidance-capture/$capture_file"
          done
      - name: Retain only the encrypted payload and metadata receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: template-guidance-capture-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/template-guidance-capture
          if-no-files-found: error
          retention-days: 1

  guidance-production:
    if: github.ref == 'refs/heads/main' && (inputs.mode == 'plan-guidance' || inputs.mode == 'apply-guidance')
    runs-on: ubuntu-latest
    container: ghcr.io/${{ github.repository_owner }}/vm0-toolchain:20261023
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/toolchain-init
      - name: Verify the serving writer and main-owned rollback boundary
        run: |
          set -euo pipefail
          floor=$(git show origin/main:.github/rollback-floors/template-guidance-bundle-writer)
          [[ "$floor" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$floor" origin/main
          for origin in https://api.vm0.ai https://api.okou.ai; do
            build=$(curl -fsS --connect-timeout 10 --max-time 30 "$origin/api/build-info")
            serving=$(jq -er '.commitSha | select(type == "string" and test("^[0-9a-f]{40}$"))' <<< "$build")
            git merge-base --is-ancestor "$floor" "$serving"
            printf '%s serves the bundle writer: %s\n' "$origin" "$serving"
          done
      - name: Prepare private context and credentials
        env:
          GUIDANCE_MODE: ${{ inputs.mode }}
          FROZEN_INVENTORY: ${{ inputs.frozen_inventory }}
          PLAN_RUN_ID: ${{ inputs.plan_run_id }}
          PLAN_SHA256: ${{ inputs.plan_sha256 }}
          WRITERS_DRAINED: ${{ inputs.writers_drained }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$NEON_PROJECT_ID" == hidden-lab-39609750 ]]
          request_dir=$(mktemp -d)
          export C03_REQUEST_DIR="$request_dir"
          printf 'C03_REQUEST_DIR=%s\n' "$request_dir" >> "$GITHUB_ENV"
          node --input-type=module <<'JS'
          import { writeFile } from 'node:fs/promises';
          import { join } from 'node:path';
          const context = {
            mode: process.env.GUIDANCE_MODE, commit: process.env.GITHUB_SHA,
            runId: process.env.GITHUB_RUN_ID, runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),
            repository: process.env.GITHUB_REPOSITORY, ref: process.env.GITHUB_REF,
            actor: process.env.GITHUB_ACTOR, planRunId: process.env.PLAN_RUN_ID,
            planSha256: process.env.PLAN_SHA256, writersDrained: process.env.WRITERS_DRAINED === 'true',
          };
          const root = process.env.C03_REQUEST_DIR;
          await writeFile(join(root, 'context.json'), JSON.stringify(context), { mode: 0o600 });
          await writeFile(join(root, 'credentials.json'), JSON.stringify({ neon: process.env.NEON_API_KEY, github: process.env.GITHUB_TOKEN }), { mode: 0o600 });
          await writeFile(join(root, 'inventory.json'), process.env.FROZEN_INVENTORY, { mode: 0o600 });
          JS
      - name: Verify the reviewed plan run before downloading
        if: inputs.mode == 'apply-guidance'
        id: plan-origin
        working-directory: turbo/packages/db
        run: |
          node --import tsx scripts/migrations/029-template-guidance-bundles/production.ts \
            --operation verify-origin --context "$C03_REQUEST_DIR/context.json" \
            --credentials "$C03_REQUEST_DIR/credentials.json" --github-output "$GITHUB_OUTPUT"
      - name: Download the exact reviewed plan artifact
        if: inputs.mode == 'apply-guidance'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.plan_run_id }}
          name: ${{ steps.plan-origin.outputs.artifact-name }}
          path: ${{ runner.temp }}/template-guidance-reviewed
      - name: Plan or apply the exact reviewed owner-pointer backfill
        working-directory: turbo/packages/db
        env:
          R2_ENDPOINT: https://${{ vars.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_USER_STORAGES_BUCKET_NAME: ${{ vars.R2_USER_STORAGES_BUCKET_NAME }}
        run: |
          set -euo pipefail
          umask 077
          node --import tsx scripts/migrations/029-template-guidance-bundles/production.ts \
            --operation run --context "$C03_REQUEST_DIR/context.json" \
            --credentials "$C03_REQUEST_DIR/credentials.json" --request "$C03_REQUEST_DIR" \
            --reviewed "$RUNNER_TEMP/template-guidance-reviewed" \
            --output "$RUNNER_TEMP/template-guidance-production"
      - name: Retain metadata plans and reconciliation receipts only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: template-guidance-${{ inputs.mode == 'plan-guidance' && 'plan' || 'apply' }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/template-guidance-production
          if-no-files-found: error
          retention-days: 14
      - name: Remove private connection and API credential files
        if: always()
        run: |
          if [[ -n "${C03_REQUEST_DIR:-}" ]]; then
            rm -rf "$C03_REQUEST_DIR"
          fi
