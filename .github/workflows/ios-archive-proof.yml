name: iOS Archive Promotion Proof

on:
  pull_request:
    paths:
      - .github/workflows/ios-archive-proof.yml
      - ios/scripts/archive-proof.py
      - ios/scripts/archive-proof.test.py
      - ios/scripts/build-archive-proof.sh
      - ios/scripts/build-archive.sh
      - ios/scripts/release-testflight.sh
  workflow_dispatch:
    inputs:
      signing_export:
        description: Verify distribution export with production approval; never upload to TestFlight
        type: boolean
        default: false

permissions:
  contents: read

env:
  npm_config_audit: "false"

concurrency:
  group: ios-archive-proof-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  script-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Test archive preparation and export verification
        run: |
          bash -n ios/scripts/build-archive-proof.sh ios/scripts/build-archive.sh ios/scripts/release-testflight.sh
          shellcheck ios/scripts/build-archive-proof.sh ios/scripts/build-archive.sh ios/scripts/release-testflight.sh
          python3 ios/scripts/archive-proof.test.py

  unsigned-archive:
    needs: script-checks
    runs-on: macos-26
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Build unsigned device archive and prove metadata-only preparation
        run: bash ios/scripts/build-archive-proof.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-archive-proof-${{ github.sha }}
          path: |
            ${{ runner.temp }}/okou-ios-archive-proof/archive.tar.gz
            ${{ runner.temp }}/okou-ios-archive-proof/manifest.json
          if-no-files-found: error
          retention-days: 7

  distribution-export:
    needs: unsigned-archive
    # Never expose production signing credentials to PR or arbitrary branch code.
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.signing_export }}
    runs-on: macos-26
    timeout-minutes: 15
    environment: production
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ios-archive-proof-${{ github.sha }}
          path: ${{ runner.temp }}/archive-proof-input
      - name: Verify provenance and unpack the same-run archive
        env:
          ARCHIVE_COMMIT_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, tarfile
          work = pathlib.Path(os.environ['RUNNER_TEMP']) / 'archive-proof-input'
          manifest = json.loads((work / 'manifest.json').read_text())
          if (manifest['version'] != 1 or manifest['purpose'] != 'archive-promotion-proof-only'
              or manifest['commitSha'] != os.environ['ARCHIVE_COMMIT_SHA']):
              raise ValueError('Archive proof provenance does not match this run')
          digest = hashlib.sha256((work / 'archive.tar.gz').read_bytes()).hexdigest()
          if digest != manifest['archiveSha256']:
              raise ValueError('Archive proof checksum mismatch')
          with tarfile.open(work / 'archive.tar.gz') as archive:
              archive.extractall(work, filter='data')
          PY
      - name: Verify signing and export without recompilation or upload
        env:
          IOS_BUILD_NUMBER: "9999"
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          IOS_VERSION="$(<ios/version.txt)"
          export IOS_VERSION
          bash ios/scripts/release-testflight.sh --verify-archive "$RUNNER_TEMP/archive-proof-input/Original.xcarchive"
