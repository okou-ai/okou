name: iOS access cards BrowserStack preview
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: http.version
      GIT_CONFIG_VALUE_0: HTTP/1.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Record preview source
        run: |
          mkdir -p "$RUNNER_TEMP/access-preview/output"
          git rev-parse HEAD HEAD:ios/Okou HEAD:ios/Packages > "$RUNNER_TEMP/access-preview/output/source-shas.txt"
          xcodebuild -version
      - name: Verify native design resources
        run: |
          python3 ios/scripts/sync-design-tokens.py --check
          python3 ios/scripts/sync-design-assets.py --check
          python3 ios/scripts/sync-workspace-assets.py --check
      - name: Build unsigned Debug device application
        run: |
          xcodebuild -project ios/Okou.xcodeproj -scheme Okou -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/access-preview/DerivedData" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/access-preview/SourcePackages" \
            -onlyUsePackageVersionsFromResolvedFile -disableAutomaticPackageResolution -skipPackageUpdates \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= DEVELOPMENT_TEAM= \
            ONLY_ACTIVE_ARCH=NO build > "$RUNNER_TEMP/access-preview/output/build.log" 2>&1
      - name: Package application for BrowserStack re-signing
        run: |
          mkdir -p "$RUNNER_TEMP/access-preview/output/Payload"
          ditto "$RUNNER_TEMP/access-preview/DerivedData/Build/Products/Debug-iphoneos/Okou.app" \
            "$RUNNER_TEMP/access-preview/output/Payload/Okou.app"
          cd "$RUNNER_TEMP/access-preview/output"
          zip -qry Okou-access-preview.ipa Payload
          rm -rf Payload
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: ios-access-preview
          path: ${{ runner.temp }}/access-preview/output/
          if-no-files-found: error
          retention-days: 2
