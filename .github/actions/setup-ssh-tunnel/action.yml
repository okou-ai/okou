name: "Setup SSH via Cloudflare Tunnel"
description: "Install cloudflared and configure SSH to proxy through Cloudflare Tunnel"

inputs:
  ssh-user:
    description: "SSH user for metal runner hosts"
    required: true
  ssh-hosts:
    description: "Comma-separated metal runner hosts to pre-connect"
    required: true
  require-all-hosts:
    description: "Fail setup unless every SSH host pre-connects"
    required: false
    default: "true"
  operation-timeout-seconds:
    description: "Maximum wall-clock seconds for one guarded SSH, SCP, or SFTP operation"
    required: false
    default: "600"
  ssh-key:
    description: "SSH private key for metal runner"
    required: true
  cf-access-client-id:
    description: "Cloudflare Access service token client ID"
    required: true
  cf-access-client-secret:
    description: "Cloudflare Access service token client secret"
    required: true

runs:
  using: "composite"
  steps:
    - name: Install cloudflared
      shell: bash
      run: |
        CLOUDFLARED_VERSION=2026.10.4
        deb_arch="$(dpkg --print-architecture)"
        case "$deb_arch" in
          amd64)
            cloudflared_arch=amd64
            cloudflared_sha256=3d73cd9f085de5a947fce8a72d0acc34a6a18cb23f369549b1cd0efc51121e98
            ;;
          arm64)
            cloudflared_arch=arm64
            cloudflared_sha256=d0d08a43521e52ba0707900ebe67314e7ca6f610b88024fe6562a408ab6a0f4d
            ;;
          *) echo "Unsupported cloudflared architecture: ${deb_arch}" >&2; exit 1 ;;
        esac
        cloudflared_deb="${RUNNER_TEMP:-/tmp}/cloudflared-${CLOUDFLARED_VERSION}-${cloudflared_arch}.deb"
        bash "$GITHUB_WORKSPACE/.github/scripts/download-verified.sh" \
          "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-${cloudflared_arch}.deb" \
          "$cloudflared_sha256" \
          "$cloudflared_deb"
        if command -v sudo &>/dev/null; then
          sudo dpkg -i "$cloudflared_deb"
        else
          dpkg -i "$cloudflared_deb"
        fi

    - name: Configure SSH
      shell: bash
      env:
        SSH_KEY: ${{ inputs.ssh-key }}
        CF_ACCESS_CLIENT_ID: ${{ inputs.cf-access-client-id }}
        CF_ACCESS_CLIENT_SECRET: ${{ inputs.cf-access-client-secret }}
      run: |
        mkdir -p "$HOME/.ssh"
        echo "$SSH_KEY" > "$HOME/.ssh/runner.pem"
        chmod 600 "$HOME/.ssh/runner.pem"

        # Ansible expands ~ from the system account rather than the HOME
        # provided by GitHub container jobs. Point it at the shared master
        # socket created below so both clients use the same connection.
        printf 'ANSIBLE_SSH_CONTROL_PATH=%s\n' \
          "$HOME/.ssh/vm0-ssh-%%C" >> "$GITHUB_ENV"

        # Store credentials in a restricted file sourced by the proxy script,
        # so they don't appear in SSH config or process listings.
        printf 'export CF_ACCESS_CLIENT_ID="%s"\nexport CF_ACCESS_CLIENT_SECRET="%s"\n' \
          "$CF_ACCESS_CLIENT_ID" "$CF_ACCESS_CLIENT_SECRET" \
          > "$HOME/.ssh/cf-access.env"
        chmod 600 "$HOME/.ssh/cf-access.env"

        install -m 755 "$GITHUB_WORKSPACE/.github/scripts/runner/cloudflare-ssh-proxy.sh" "$HOME/.ssh/cf-proxy.sh"
        install -m 644 "$GITHUB_WORKSPACE/.github/scripts/runner/cloudflare-ssh-diagnostics.sh" "$HOME/.ssh/cloudflare-ssh-diagnostics.sh"
        install -m 644 "$GITHUB_WORKSPACE/.github/scripts/runner/cloudflare-ssh-log.py" "$HOME/.ssh/cloudflare-ssh-log.py"
        install -m 644 "$GITHUB_WORKSPACE/.github/scripts/runner/cloudflare-ssh-tcp.py" "$HOME/.ssh/cloudflare-ssh-tcp.py"

        # Cloudflare Access setup and the origin SSH banner share this timeout.
        # ConnectionAttempts does not restart an active ProxyCommand.
        # The shared master preserves the native SSH 15-second keepalive
        # cadence and Ansible's existing 300-second missed-response tolerance.
        SSH_CONFIG="$(printf '%s\n' \
          "Host *.vm3.ai" \
          "  StrictHostKeyChecking no" \
          "  UserKnownHostsFile /dev/null" \
          "  ConnectTimeout 30" \
          "  ServerAliveInterval 15" \
          "  ServerAliveCountMax 20" \
          "  TCPKeepAlive yes" \
          "  IPQoS throughput" \
          "  IdentityFile $HOME/.ssh/runner.pem" \
          "  ControlMaster auto" \
          "  ControlPath $HOME/.ssh/vm0-ssh-%C" \
          "  ControlPersist 600s" \
          "  ProxyCommand $HOME/.ssh/cf-proxy.sh %h")"

        # Write to system config so all SSH clients (ssh, scp, ansible) read it
        if command -v sudo &>/dev/null; then
          sudo mkdir -p /etc/ssh/ssh_config.d
          echo "$SSH_CONFIG" | sudo tee /etc/ssh/ssh_config.d/tunnel.conf > /dev/null
        else
          mkdir -p /etc/ssh/ssh_config.d
          echo "$SSH_CONFIG" > /etc/ssh/ssh_config.d/tunnel.conf
        fi

    - name: Establish replay-safe SSH transport
      shell: bash
      env:
        SSH_USER: ${{ inputs.ssh-user }}
        SSH_HOSTS: ${{ inputs.ssh-hosts }}
        REQUIRE_ALL_HOSTS: ${{ inputs.require-all-hosts }}
      run: bash "$GITHUB_WORKSPACE/.github/scripts/runner/cloudflare-ssh-preconnect.sh" "$SSH_USER" "$SSH_HOSTS" "$REQUIRE_ALL_HOSTS"

    - name: Guard subsequent SSH operations
      shell: bash
      env:
        OPERATION_TIMEOUT_SECONDS: ${{ inputs.operation-timeout-seconds }}
        SSH_USER: ${{ inputs.ssh-user }}
      run: |
        temp_root="${RUNNER_TEMP:-${TMPDIR:-/tmp}}"
        wrapper_root=$(mktemp -d "${temp_root%/}/cf-ssh.XXXXXX")
        wrapper_bin="${wrapper_root}/bin"
        state_dir="${wrapper_root}/state"
        mkdir -p "$wrapper_bin" "$state_dir"

        real_ssh="${OKOU_CLOUDFLARE_SSH_REAL_SSH:-$(command -v ssh)}"
        real_scp="${OKOU_CLOUDFLARE_SSH_REAL_SCP:-$(command -v scp)}"
        real_sftp="${OKOU_CLOUDFLARE_SSH_REAL_SFTP:-$(command -v sftp)}"
        wrapper="$GITHUB_WORKSPACE/.github/scripts/runner/cloudflare-ssh-command.sh"
        ln -s "$wrapper" "${wrapper_bin}/ssh"
        ln -s "$wrapper" "${wrapper_bin}/scp"
        ln -s "$wrapper" "${wrapper_bin}/sftp"

        {
          echo "OKOU_CLOUDFLARE_SSH_REAL_SSH=${real_ssh}"
          echo "OKOU_CLOUDFLARE_SSH_REAL_SCP=${real_scp}"
          echo "OKOU_CLOUDFLARE_SSH_REAL_SFTP=${real_sftp}"
          echo "OKOU_CLOUDFLARE_SSH_SCRIPTS_DIR=$GITHUB_WORKSPACE/.github/scripts/runner"
          echo "OKOU_CLOUDFLARE_SSH_STATE_DIR=${state_dir}"
          echo "OKOU_CLOUDFLARE_SSH_USER=${SSH_USER}"
          echo "OKOU_CLOUDFLARE_SSH_DEFAULT_CONTROL_PATH=$HOME/.ssh/vm0-ssh-%C"
          echo "OKOU_CLOUDFLARE_SSH_OPERATION_TIMEOUT_SECONDS=${OPERATION_TIMEOUT_SECONDS}"
        } >> "$GITHUB_ENV"
        echo "$wrapper_bin" >> "$GITHUB_PATH"
