name: Setup iOS build cache
description: Restore main-owned SwiftPM sources and Xcode's native compilation cache

inputs:
  target:
    description: Native build target (simulator or archive)
    default: simulator
  restore-compilation:
    description: Restore the compiler cache as well as SwiftPM sources
    default: "true"

outputs:
  dependencies-path:
    description: Locked source cache directory for this target
    value: ${{ steps.identity.outputs.dependencies-path }}
  compilation-path:
    description: Compiler cache directory for this target
    value: ${{ steps.identity.outputs.compilation-path }}
  dependencies-key:
    description: Exact SwiftPM source cache identity
    value: ${{ steps.identity.outputs.dependencies-key }}
  compilation-key:
    description: Native compiler cache identity for this source tree
    value: ${{ steps.identity.outputs.compilation-key }}
  dependencies-hit:
    description: Whether the locked SwiftPM source cache matched exactly
    value: ${{ steps.dependencies.outputs.cache-hit }}
  compilation-hit:
    description: Whether the compiler cache matched this source tree exactly
    value: ${{ steps.compilation.outputs.cache-hit }}
  toolchain-file:
    description: Captured Xcode and SDK identity for promotion input checks
    value: ${{ steps.identity.outputs.toolchain-file }}

runs:
  using: composite
  steps:
    - name: Identify native cache inputs
      id: identity
      shell: bash
      env:
        IOS_CACHE_TARGET: ${{ inputs.target }}
      run: |
        case "$IOS_CACHE_TARGET" in
          simulator)
            cache_root="$RUNNER_TEMP/okou-ios-ci"
            dependencies_namespace=ios-swiftpm-v1
            compilation_namespace=ios-compilation-v1
            ;;
          archive)
            cache_root="$RUNNER_TEMP/okou-ios-promotion"
            dependencies_namespace=ios-archive-swiftpm-v1
            compilation_namespace=ios-archive-compilation-v1
            ;;
          *) echo "Unsupported native cache target: $IOS_CACHE_TARGET" >&2; exit 1 ;;
        esac
        toolchain_file="$RUNNER_TEMP/ios-cache-toolchain.json"
        python3 ios/scripts/archive-promotion.py toolchain "$toolchain_file"
        toolchain=$(shasum -a 256 "$toolchain_file" | cut -d ' ' -f 1)
        lock=$(shasum -a 256 ios/Okou.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved | cut -d ' ' -f 1)
        sources=$(git rev-parse HEAD:ios)
        {
          echo "dependencies-path=$cache_root/SourcePackages"
          echo "compilation-path=$cache_root/DerivedData/CompilationCache.noindex"
          echo "dependencies-key=$dependencies_namespace-$toolchain-$lock"
          echo "compilation-prefix=$compilation_namespace-$toolchain-"
          echo "compilation-key=$compilation_namespace-$toolchain-$lock-$sources"
          echo "toolchain-file=$toolchain_file"
        } >> "$GITHUB_OUTPUT"

    - name: Restore locked SwiftPM sources
      id: dependencies
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.identity.outputs.dependencies-path }}
        key: ${{ steps.identity.outputs.dependencies-key }}

    - name: Restore native Xcode compilation cache
      id: compilation
      if: inputs.restore-compilation == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.identity.outputs.compilation-path }}
        key: ${{ steps.identity.outputs.compilation-key }}
        # Xcode validates each cached compilation's inputs, including changed files.
        restore-keys: ${{ steps.identity.outputs.compilation-prefix }}

    - name: Report native cache selection
      shell: bash
      env:
        DEPENDENCIES_HIT: ${{ steps.dependencies.outputs.cache-hit }}
        COMPILATION_HIT: ${{ steps.compilation.outputs.cache-hit }}
        COMPILATION_MATCH: ${{ steps.compilation.outputs.cache-matched-key }}
      run: |
        {
          echo "### iOS build cache"
          echo "- SwiftPM exact hit: ${DEPENDENCIES_HIT:-false}"
          echo "- Compilation exact hit: ${COMPILATION_HIT:-false}"
          echo "- Compilation restored key: ${COMPILATION_MATCH:-none}"
        } >> "$GITHUB_STEP_SUMMARY"
