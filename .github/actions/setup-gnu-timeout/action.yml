name: Setup GNU timeout
description: Select GNU timeout for CI scripts that supervise process groups

runs:
  using: composite
  steps:
    - name: Select GNU timeout
      shell: bash
      run: |
        set -euo pipefail
        # Ubuntu 26.04 defaults to uutils, which differs in cancellation status
        # and SIGKILL escalation. The image also ships the GNU binary.
        if ! timeout_bin=$(command -v gnutimeout || command -v timeout) ||
           ! version=$(LC_ALL=C "$timeout_bin" --version) ||
           [[ $version != "timeout (GNU coreutils)"* ]]; then
          echo "::error::GNU timeout is required for CI process-group cleanup" >&2
          exit 1
        fi

        if [[ ${timeout_bin##*/} == gnutimeout ]]; then
          bin_dir=$(mktemp -d "${RUNNER_TEMP%/}/gnu-timeout.XXXXXX")
          ln -s "$timeout_bin" "$bin_dir/timeout"
          printf '%s\n' "$bin_dir" >> "$GITHUB_PATH"
        fi
        printf 'Using %s\n' "${version%%$'\n'*}"
