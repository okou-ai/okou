name: "Toolchain Init"
description: "Initialize toolchain container environment with git config and dependencies"

runs:
  using: "composite"
  steps:
    - name: Configure git safe directory
      shell: bash
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      env:
        npm_config_audit: "false"
      with:
        package_json_file: turbo/package.json

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 22.23.4
        cache: pnpm
        cache-dependency-path: turbo/pnpm-lock.yaml

    - name: Install dependencies
      shell: bash
      # Local development shares native dependencies across macOS and Linux;
      # an isolated CI job only needs packages for its own host.
      run: |
        cd turbo
        pnpm install --frozen-lockfile --strict-peer-dependencies \
          --config.os=current --config.cpu=current --prefer-offline
