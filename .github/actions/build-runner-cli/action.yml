name: Build Runner CLI input
description: Build, verify and smoke the source-bound CLI package consumed by Runner and host E2E
inputs:
  source-sha:
    description: Immutable checked-out source revision
    required: true
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        version: 10.33.4
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 22
        cache: pnpm
        cache-dependency-path: turbo/pnpm-lock.yaml
    - name: Build and check CLI input
      shell: bash
      env:
        SOURCE_SHA: ${{ inputs.source-sha }}
      run: |
        set -euo pipefail
        [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
        (cd turbo && pnpm install --frozen-lockfile --filter @okouai/cli...)
        (cd turbo && pnpm --filter @okouai/cli build)
        bash .github/scripts/artifacts/build-okou-cli-artifact.sh "$SOURCE_SHA" runner-cli-intermediate
        bash .github/scripts/artifacts/smoke-okou-cli-artifact.sh runner-cli-intermediate/package.tgz
