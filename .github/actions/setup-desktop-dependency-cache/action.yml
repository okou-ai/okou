name: Setup Desktop dependency cache
description: Restore public SwiftPM downloads for the actual toolchain and locked dependencies

outputs:
  key:
    description: Exact toolchain and dependency identity
    value: ${{ steps.identity.outputs.key }}
  cache-hit:
    description: Whether the exact public dependency cache was restored
    value: ${{ steps.restore.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Identify Desktop dependencies
      id: identity
      shell: bash
      run: bash .github/scripts/desktop/dependency-cache-key.sh >> "$GITHUB_OUTPUT"

    - name: Restore public SwiftPM downloads
      id: restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/Library/Caches/org.swift.swiftpm/repositories
          ~/Library/Caches/org.swift.swiftpm/artifacts
        key: ${{ steps.identity.outputs.key }}
